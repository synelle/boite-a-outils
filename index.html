<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boîte à outils</title>
<script>try { const t = localStorage.getItem('toolbox_theme_v1'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1216; --ink: #e6e8eb; --ink-2: #c7cbd1; --muted: #8b9099; --faint: #5c626b;
    --card: #171b21; --line: #262b33; --line-hover: #37414f; --input-line: #2c313a;
    --btn: #1f2733; --btn-hover: #2a3444;
    --accent: #6fe3ab; --accent-bg: #16412f; --accent-line: #1f6b4c;
    --pos: #3ecf8e; --neg: #ef5a6f; --warn: #ffb454;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f4f5f7; --ink: #1c2430; --ink-2: #2b3440; --muted: #5d6878; --faint: #8a919b;
      --card: #ffffff; --line: #dde1e7; --line-hover: #b9c0ca; --input-line: #cfd5dc;
      --btn: #eef0f3; --btn-hover: #e2e6eb;
      --accent: #127a4b; --accent-bg: #dcf5e8; --accent-line: #8fd3b0;
      --pos: #16834f; --neg: #c0293f; --warn: #a85f00;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f5f7; --ink: #1c2430; --ink-2: #2b3440; --muted: #5d6878; --faint: #8a919b;
    --card: #ffffff; --line: #dde1e7; --line-hover: #b9c0ca; --input-line: #cfd5dc;
    --btn: #eef0f3; --btn-hover: #e2e6eb;
    --accent: #127a4b; --accent-bg: #dcf5e8; --accent-line: #8fd3b0;
    --pos: #16834f; --neg: #c0293f; --warn: #a85f00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
    max-width: 980px;
    margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .filter-btn {
    cursor: pointer;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    transition: background .15s, color .15s, border-color .15s;
  }
  .filter-btn:hover { border-color: var(--line-hover); color: var(--ink-2); }
  .filter-btn.active { background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent); }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: var(--line-hover); transform: translateY(-1px); }
  .card .icon { font-size: 24px; margin-bottom: 8px; }
  .card .titre { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .card .desc { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .card .cat { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--accent); background: var(--accent-bg); border-radius: 4px; padding: 2px 6px; }
  .empty { color: var(--faint); font-style: italic; padding: 20px 0; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--ink-2); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    cursor: pointer;
    background: var(--btn);
    border: 1px solid var(--line-hover);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    transition: background .15s;
  }
  button:hover { background: var(--btn-hover); }
  #themeBtn { white-space: nowrap; }
  #ownerRepo { background: var(--bg); border: 1px solid var(--input-line); color: var(--ink); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; width: 200px; }
  .status { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .status.pos { color: var(--pos); }
  .status.neg { color: var(--neg); }
  ul.unref { margin-top: 8px; padding-left: 18px; font-size: 13px; }
  ul.unref li { color: var(--warn); margin-bottom: 4px; font-family: monospace; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Boîte à outils</h1>
    <div class="sub">Simulateurs, jeux et mini-outils — vanilla JS, hébergés via GitHub Pages</div>
  </div>
  <button id="themeBtn"></button>
</header>

<div class="filters" id="filtersContainer"></div>
<div class="cards" id="cardsContainer"></div>
<div class="empty" id="cardsEmpty" style="display:none">Aucun outil référencé pour l'instant.</div>

<div class="panel">
  <h2>Configuration</h2>
  <div class="row">
    <input type="text" id="ownerRepo" placeholder="owner/repo">
    <button id="detectBtn">Détecter</button>
    <button id="clearCacheBtn">Vider le cache</button>
  </div>
  <div class="status" id="detectStatus"></div>
</div>

<script>
const METADATA_URL = 'metadata.json';
const OUTILS_DIR = 'outils';
const CACHE_KEY = 'toolbox_detect_cache_v1';
const REPO_KEY = 'toolbox_owner_repo_v1';
const THEME_KEY = 'toolbox_theme_v1';

let metadata = {};
let activeCategory = 'Toutes';

function currentTheme() {
  return document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
}

function renderThemeBtn() {
  document.getElementById('themeBtn').textContent = currentTheme() === 'light' ? '🌙 Mode sombre' : '☀️ Mode clair';
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const next = currentTheme() === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* stockage indisponible */ }
  renderThemeBtn();
});
matchMedia('(prefers-color-scheme: light)').addEventListener('change', renderThemeBtn);
renderThemeBtn();

async function loadMetadata() {
  try {
    const res = await fetch(METADATA_URL, { cache: 'no-cache' });
    metadata = await res.json();
  } catch (e) {
    metadata = {};
  }
  renderFilters();
  renderCards();
}

function renderFilters() {
  const container = document.getElementById('filtersContainer');
  const categories = ['Toutes', ...new Set(Object.values(metadata).map(m => m.categorie || 'Autre'))];
  container.innerHTML = categories.map(cat => `
    <button class="filter-btn${cat === activeCategory ? ' active' : ''}" data-cat="${cat}">${cat}</button>
  `).join('');
  container.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      renderFilters();
      renderCards();
    });
  });
}

function renderCards() {
  const container = document.getElementById('cardsContainer');
  const entries = Object.entries(metadata).filter(([file, meta]) =>
    activeCategory === 'Toutes' || (meta.categorie || 'Autre') === activeCategory
  );
  document.getElementById('cardsEmpty').style.display = entries.length ? 'none' : 'block';
  container.innerHTML = entries.map(([file, meta]) => `
    <a class="card" href="${OUTILS_DIR}/${file.split('/').map(encodeURIComponent).join('/')}">
      <div class="icon">${meta.icone || '🔧'}</div>
      <div class="titre">${meta.titre || file}</div>
      <div class="desc">${meta.description || ''}</div>
      ${meta.categorie ? `<div class="cat">${meta.categorie}</div>` : ''}
    </a>
  `).join('');
}

function setDetectStatus(msg, cls) {
  const el = document.getElementById('detectStatus');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function guessOwnerRepo() {
  const saved = localStorage.getItem(REPO_KEY);
  if (saved) return saved;
  const parts = location.hostname.split('.');
  if (location.hostname.endsWith('github.io') && parts.length >= 3) {
    const owner = parts[0];
    const pathParts = location.pathname.split('/').filter(Boolean);
    const repo = pathParts[0] || `${owner}.github.io`;
    return `${owner}/${repo}`;
  }
  return '';
}

async function detectFiles() {
  const ownerRepoInput = document.getElementById('ownerRepo').value.trim();
  if (!ownerRepoInput || !ownerRepoInput.includes('/')) {
    setDetectStatus("Renseigne le repo au format owner/repo.", 'neg');
    return;
  }
  localStorage.setItem(REPO_KEY, ownerRepoInput);
  const subRefs = await loadSubPageRefs();

  const cacheRaw = localStorage.getItem(CACHE_KEY);
  if (cacheRaw) {
    try {
      const cache = JSON.parse(cacheRaw);
      if (cache.ownerRepo === ownerRepoInput && Date.now() - cache.timestamp < 1000 * 60 * 60) {
        showDetectionResult(cache.files, true, subRefs);
        return;
      }
    } catch (e) { /* ignore corrupt cache */ }
  }

  setDetectStatus('Interrogation de l\'API GitHub…');
  try {
    const res = await fetch(`https://api.github.com/repos/${ownerRepoInput}/contents/${OUTILS_DIR}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const files = data
      .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.html'))
      .map(item => item.name);

    localStorage.setItem(CACHE_KEY, JSON.stringify({ ownerRepo: ownerRepoInput, files, timestamp: Date.now() }));
    showDetectionResult(files, false, subRefs);
  } catch (e) {
    setDetectStatus(`Erreur lors de la détection : ${e.message}`, 'neg');
  }
}

// Fichiers de outils/ référencés par le metadata.json d'une sous-page (clés "Dossier/index.html")
async function loadSubPageRefs() {
  const refs = new Set();
  const dirs = Object.keys(metadata).filter(f => f.endsWith('/index.html')).map(f => f.slice(0, -'/index.html'.length));
  await Promise.all(dirs.map(async dir => {
    try {
      const res = await fetch(`${OUTILS_DIR}/${dir}/metadata.json`, { cache: 'no-cache' });
      const sub = await res.json();
      Object.keys(sub).forEach(file => {
        const parts = dir.split('/');
        file.split('/').forEach(p => { if (p === '..') parts.pop(); else if (p && p !== '.') parts.push(p); });
        refs.add(parts.join('/'));
      });
    } catch (e) { /* sous-page sans metadata.json */ }
  }));
  return refs;
}

function showDetectionResult(files, fromCache, subRefs) {
  const known = new Set([...Object.keys(metadata), ...subRefs]);
  const unref = files.filter(f => !known.has(f));
  const el = document.getElementById('detectStatus');
  const prefix = fromCache ? '(depuis le cache) ' : '';
  if (unref.length === 0) {
    el.innerHTML = `${prefix}Tous les fichiers .html de "${OUTILS_DIR}/" sont référencés dans metadata.json.`;
    el.className = 'status pos';
  } else {
    el.innerHTML = `${prefix}Fichiers non référencés dans metadata.json :<ul class="unref">${
      unref.map(f => `<li>${f}</li>`).join('')
    }</ul>`;
    el.className = 'status neg';
  }
}

document.getElementById('detectBtn').addEventListener('click', detectFiles);
document.getElementById('clearCacheBtn').addEventListener('click', () => {
  localStorage.removeItem(CACHE_KEY);
  setDetectStatus('Cache vidé.');
});

document.getElementById('ownerRepo').value = guessOwnerRepo();

loadMetadata();
</script>
</body>
</html>
