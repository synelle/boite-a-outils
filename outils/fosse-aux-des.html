<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fosse aux Dés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120f18;
    --bg-deep: #0b0912;
    --panel: #1b1725;
    --panel-2: #241f31;
    --line: #382f47;
    --ink: #ece6f5;
    --ink-dim: #a89bc4;
    --gold: #c9a24b;
    --gold-bright: #e8c476;
    --crit: #46c98f;
    --fumble: #e0574a;
    color-scheme: dark;
    font-family: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse at 50% -10%, #241a35 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--ink);
    overflow: hidden;
  }

  body {
    position: relative;
  }

  /* ---------- 3D roll stage ---------- */
  #dice-box {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  #dice-box canvas { width: 100%; height: 100%; display: block; }

  /* ---------- backdrop hero (visible before/behind roll) ---------- */
  .stage-hero {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    pointer-events: none;
  }
  .stage-hero .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.6em;
  }
  .stage-hero h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 3rem);
    margin: 0 0 0.3em;
    color: var(--ink);
    text-wrap: balance;
  }
  .stage-hero p {
    max-width: 40ch;
    color: var(--ink-dim);
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0;
  }
  .stage-hero.faded { opacity: 0.35; transition: opacity .4s ease; }

  /* ---------- result readout, floats above stage ---------- */
  #result-card {
    position: fixed;
    left: 0;
    right: 0;
    width: fit-content;
    margin-inline: auto;
    bottom: 8%;
    transform: translateY(16px);
    z-index: 20;
    transition: opacity .35s ease, transform .35s ease, right .3s ease;
    background: rgba(27, 23, 37, 0.88);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 28px;
    text-align: center;
    min-width: 220px;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  #result-card.show {
    opacity: 1;
    transform: translateY(0);
  }
  body.tray-open #result-card { right: 320px; }
  #result-title {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin-bottom: 4px;
  }
  #result-total {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    line-height: 1;
    color: var(--gold-bright);
    font-variant-numeric: tabular-nums;
  }
  #result-total.crit { color: var(--crit); }
  #result-total.fumble { color: var(--fumble); }
  #result-detail {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- floating action button ---------- */
  #dice-switch {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 40;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform .25s ease, box-shadow .25s ease, right .3s ease, bottom .3s ease;
  }
  #dice-switch:hover { transform: translateY(-2px) rotate(8deg); box-shadow: 0 14px 36px rgba(0,0,0,0.55); }
  #dice-switch svg { width: 30px; height: 30px; }
  #dice-switch .d20-fill { fill: var(--panel-2); stroke: var(--gold); stroke-width: 1.4; stroke-linejoin: round; }
  #dice-switch .d20-num { fill: var(--gold-bright); font-family: 'Cinzel', serif; font-size: 9px; font-weight: 700; }

  body.tray-open #dice-switch { right: 328px; }

  /* ---------- slide-out tray ---------- */
  #dice-tray {
    position: fixed;
    top: 0;
    right: -320px;
    width: 320px;
    height: 100%;
    z-index: 39;
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -20px 0 50px rgba(0,0,0,0.4);
    transition: right .3s ease;
    display: flex;
    flex-direction: column;
    padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    overflow-y: auto;
  }
  body.tray-open #dice-tray { right: 0; }

  #dice-tray h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    margin: 0 0 4px;
    color: var(--gold-bright);
  }
  #dice-tray .sub {
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin: 0 0 16px;
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .die-btn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 4px;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .die-btn:hover { border-color: var(--gold); transform: translateY(-1px); }
  .die-btn:active { transform: translateY(0); }
  .die-btn.wide { grid-column: span 2; }

  form#formula-form {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  #formula-input {
    flex: 1;
    min-width: 0;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
  }
  #formula-input:focus { outline: none; border-color: var(--gold); }
  #formula-input::placeholder { color: var(--ink-dim); }

  .btn-solid {
    background: var(--gold);
    color: #201808;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background .15s ease;
    white-space: nowrap;
  }
  .btn-solid:hover { background: var(--gold-bright); }
  .btn-solid:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-solid.wide { width: 100%; padding: 12px 16px; margin-bottom: 14px; font-family: 'Cinzel', serif; letter-spacing: 0.02em; }

  #formula-hint {
    font-size: 0.72rem;
    color: var(--ink-dim);
    margin: 0 0 18px;
  }
  #formula-hint.error { color: var(--fumble); }

  .shake-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    cursor: pointer;
  }
  .shake-toggle-title { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink); }
  .shake-toggle-sub { display: block; font-size: 0.7rem; color: var(--ink-dim); margin-top: 2px; }
  .switch-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch-track {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: background .15s ease, border-color .15s ease;
  }
  .switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink-dim);
    transition: transform .15s ease, background .15s ease;
  }
  .switch-input:checked + .switch-track { background: var(--gold); border-color: var(--gold); }
  .switch-input:checked + .switch-track .switch-thumb { transform: translateX(18px); background: #201808; }
  .switch-input:focus-visible + .switch-track { outline: 2px solid var(--gold); outline-offset: 2px; }
  .switch-input:disabled + .switch-track { opacity: 0.4; }

  .tray-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .btn-ghost {
    flex: 1;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink-dim);
    padding: 9px 8px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--ink); }

  #history-heading {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 4px 0 8px;
  }
  #history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #history-list li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.82rem;
  }
  #history-list .h-formula { color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #history-list .h-total { font-family: 'Cinzel', serif; font-weight: 700; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
  #history-empty { font-size: 0.8rem; color: var(--ink-dim); font-style: italic; }

  #status-pill {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 16px;
    z-index: 40;
    background: rgba(27,23,37,0.85);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.72rem;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity .4s ease;
  }
  #status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
  }
  #status-pill.ready .dot { background: var(--crit); }
  #status-pill.hide { opacity: 0; pointer-events: none; }

  @media (max-width: 480px) {
    #dice-tray { width: 100%; right: -100%; }
    body.tray-open #dice-switch { right: 20px; bottom: calc(100% - 76px); }
    body.tray-open #dice-box { right: 0; visibility: hidden; }
    body.tray-open #result-card { right: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

  <div class="stage-hero" id="hero">
    <div class="eyebrow">Table de jeu</div>
    <h1>La Fosse aux D&eacute;s</h1>
    <p>Touchez l&rsquo;ic&ocirc;ne en bas &agrave; droite pour ouvrir le plateau et lancer vos d&eacute;s.</p>
  </div>

  <div id="dice-box"></div>

  <div id="result-card">
    <div id="result-title">&mdash;</div>
    <div id="result-total">&ndash;</div>
    <div id="result-detail"></div>
  </div>

  <div id="status-pill"><span class="dot"></span><span id="status-text">Chargement des d&eacute;s&hellip;</span></div>

  <div id="dice-switch" role="button" aria-label="Ouvrir le plateau de d&eacute;s" tabindex="0">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon class="d20-fill" points="50,4 90,27 90,73 50,96 10,73 10,27"></polygon>
      <polygon class="d20-fill" points="50,4 90,27 50,50 10,27"></polygon>
      <polygon class="d20-fill" points="50,96 90,73 50,50 10,73"></polygon>
      <line x1="50" y1="4" x2="50" y2="50" stroke="var(--gold)" stroke-width="1" opacity="0.6"></line>
      <line x1="10" y1="27" x2="50" y2="50" stroke="var(--gold)" stroke-width="1" opacity="0.6"></line>
      <line x1="90" y1="27" x2="50" y2="50" stroke="var(--gold)" stroke-width="1" opacity="0.6"></line>
      <line x1="10" y1="73" x2="50" y2="50" stroke="var(--gold)" stroke-width="1" opacity="0.6"></line>
      <line x1="90" y1="73" x2="50" y2="50" stroke="var(--gold)" stroke-width="1" opacity="0.6"></line>
      <text class="d20-num" x="50" y="34" text-anchor="middle">20</text>
    </svg>
  </div>

  <aside id="dice-tray" aria-hidden="true">
    <h2>Lancer de d&eacute;s</h2>
    <p class="sub">Choisissez un d&eacute; ou entrez une formule.</p>

    <div class="quick-grid">
      <button class="die-btn" data-notation="1d4">d4</button>
      <button class="die-btn" data-notation="1d6">d6</button>
      <button class="die-btn" data-notation="1d8">d8</button>
      <button class="die-btn" data-notation="1d10">d10</button>
      <button class="die-btn" data-notation="1d12">d12</button>
      <button class="die-btn" data-notation="1d20">d20</button>
      <button class="die-btn wide" data-notation="1d100">d100</button>
    </div>

    <button class="btn-solid wide" id="btn-shake-reroll" type="button" disabled>Secouer le plateau</button>

    <form id="formula-form">
      <input id="formula-input" type="text" placeholder="ex : 2d6+3" autocomplete="off" inputmode="text">
      <button class="btn-solid" type="submit">Lancer</button>
    </form>
    <p id="formula-hint">Formule simple : NdX+M (ex. 4d6, 1d20-1)</p>

    <label class="shake-toggle" for="shake-motion-toggle">
      <span class="shake-toggle-text">
        <span class="shake-toggle-title">Secouer le t&eacute;l&eacute;phone</span>
        <span class="shake-toggle-sub" id="shake-status">Relance les d&eacute;s pr&eacute;sents</span>
      </span>
      <input type="checkbox" id="shake-motion-toggle" class="switch-input">
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
    </label>

    <div class="tray-row">
      <button class="btn-ghost" id="btn-clear-stage">Effacer le plateau</button>
      <button class="btn-ghost" id="btn-clear-history">Vider l&rsquo;historique</button>
    </div>

    <div id="history-heading">Historique</div>
    <ul id="history-list"></ul>
    <p id="history-empty">Aucun lancer pour l&rsquo;instant.</p>
  </aside>

<script type="module">
  const DICE_BOX_VERSION = '1.1.4';
  const CDN_BASE = `https://cdn.jsdelivr.net/npm/@3d-dice/dice-box@${DICE_BOX_VERSION}`;

  const $ = (sel) => document.querySelector(sel);
  const hero = $('#hero');
  const statusPill = $('#status-pill');
  const statusText = $('#status-text');
  const resultCard = $('#result-card');
  const resultTitle = $('#result-title');
  const resultTotal = $('#result-total');
  const resultDetail = $('#result-detail');
  const diceSwitch = $('#dice-switch');
  const historyList = $('#history-list');
  const historyEmpty = $('#history-empty');
  const formulaForm = $('#formula-form');
  const formulaInput = $('#formula-input');
  const formulaHint = $('#formula-hint');
  const btnShakeReroll = $('#btn-shake-reroll');
  const shakeToggle = $('#shake-motion-toggle');
  const shakeStatus = $('#shake-status');

  const NOTATION_RE = /^(\d{1,2})d(4|6|8|10|12|20|100)([+-]\d{1,3})?$/i;

  let diceBox = null;
  let ready = false;
  let simpleMode = false;
  let history = [];
  let lastNotation = null;

  try {
    history = JSON.parse(localStorage.getItem('fosse-aux-des-history') || '[]');
  } catch (e) { history = []; }

  function saveHistory() {
    try { localStorage.setItem('fosse-aux-des-history', JSON.stringify(history.slice(0, 20))); }
    catch (e) { /* storage unavailable, ignore */ }
  }

  function renderHistory() {
    historyList.innerHTML = '';
    historyEmpty.style.display = history.length ? 'none' : 'block';
    for (const entry of history.slice(0, 20)) {
      const li = document.createElement('li');
      li.innerHTML = `<span class="h-formula">${entry.notation}</span><span class="h-total">${entry.total}</span>`;
      historyList.appendChild(li);
    }
  }
  renderHistory();

  function setStatus(text, isReady) {
    statusText.textContent = text;
    statusPill.classList.toggle('ready', !!isReady);
  }

  function openTray() {
    document.body.classList.add('tray-open');
    $('#dice-tray').setAttribute('aria-hidden', 'false');
  }
  function closeTray() {
    document.body.classList.remove('tray-open');
    $('#dice-tray').setAttribute('aria-hidden', 'true');
  }
  diceSwitch.addEventListener('click', () => {
    document.body.classList.contains('tray-open') ? closeTray() : openTray();
  });
  diceSwitch.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); diceSwitch.click(); }
  });

  function showResult(notation, total, breakdown) {
    resultTitle.textContent = notation;
    resultTotal.textContent = total;
    resultTotal.classList.remove('crit', 'fumble');
    const single20 = /^1d20$/i.test(notation.trim());
    if (single20 && total === 20) resultTotal.classList.add('crit');
    if (single20 && total === 1) resultTotal.classList.add('fumble');
    resultDetail.textContent = breakdown;
    resultCard.classList.add('show');
    hero.classList.add('faded');

    history.unshift({ notation, total, t: Date.now() });
    history = history.slice(0, 20);
    saveHistory();
    renderHistory();

    lastNotation = notation;
    btnShakeReroll.disabled = false;
  }

  function fallbackRoll(notation) {
    const m = notation.match(NOTATION_RE);
    if (!m) return null;
    const qty = parseInt(m[1], 10);
    const sides = parseInt(m[2], 10);
    const mod = m[3] ? parseInt(m[3], 10) : 0;
    const rolls = [];
    let sum = mod;
    for (let i = 0; i < qty; i++) {
      const v = 1 + Math.floor(Math.random() * sides);
      rolls.push(v);
      sum += v;
    }
    return { total: sum, breakdown: rolls.join(' + ') + (mod ? ` (${mod > 0 ? '+' : ''}${mod})` : '') };
  }

  let isRolling = false;

  async function rollDice(rawNotation) {
    const notation = rawNotation.trim().replace(/\s+/g, '');
    if (!NOTATION_RE.test(notation)) {
      formulaHint.textContent = 'Formule invalide. Essayez par ex. 2d6+3';
      formulaHint.classList.add('error');
      return;
    }
    formulaHint.classList.remove('error');
    formulaHint.textContent = 'Formule simple : NdX+M (ex. 4d6, 1d20-1)';

    if (isRolling) return;

    if (simpleMode || !ready) {
      const res = fallbackRoll(notation);
      if (res) showResult(notation, res.total, res.breakdown);
      return;
    }

    isRolling = true;
    setDiceButtonsDisabled(true);
    try {
      const results = await diceBox.roll(notation);
      const total = results.reduce((acc, g) => acc + g.value, 0);
      const rollsFlat = results.flatMap(g => g.rolls ? g.rolls.map(r => r.value) : []);
      const mod = results.reduce((acc, g) => acc + (g.modifier || 0), 0);
      const breakdown = rollsFlat.join(' + ') + (mod ? ` (${mod > 0 ? '+' : ''}${mod})` : '');
      showResult(notation, total, breakdown);
    } catch (err) {
      console.error('dice-box roll failed for this throw, using a plain roll instead', err);
      const res = fallbackRoll(notation);
      if (res) showResult(notation, res.total, res.breakdown);
    } finally {
      isRolling = false;
      setDiceButtonsDisabled(false);
    }
  }

  function setDiceButtonsDisabled(disabled) {
    document.querySelectorAll('.die-btn').forEach(b => b.disabled = disabled);
    formulaForm.querySelector('button[type="submit"]').disabled = disabled;
    btnShakeReroll.disabled = disabled || !lastNotation;
  }

  document.querySelectorAll('.die-btn').forEach(btn => {
    btn.addEventListener('click', () => rollDice(btn.dataset.notation));
  });

  formulaForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (formulaInput.value.trim()) rollDice(formulaInput.value);
  });

  btnShakeReroll.addEventListener('click', () => {
    if (lastNotation) rollDice(lastNotation);
  });

  // ---------- shake-to-reroll (DeviceMotion) ----------
  const SHAKE_DELTA_THRESHOLD = 16; // m/s^2, summed across axes between readings
  const SHAKE_COOLDOWN_MS = 1200;
  let lastAccel = null;
  let lastShakeAt = 0;
  let motionListening = false;

  function handleMotion(e) {
    const a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || a.x === null || a.x === undefined) return;
    if (lastAccel) {
      const delta = Math.abs(a.x - lastAccel.x) + Math.abs(a.y - lastAccel.y) + Math.abs(a.z - lastAccel.z);
      const now = Date.now();
      if (delta > SHAKE_DELTA_THRESHOLD && now - lastShakeAt > SHAKE_COOLDOWN_MS) {
        lastShakeAt = now;
        if (lastNotation && !isRolling) rollDice(lastNotation);
      }
    }
    lastAccel = { x: a.x, y: a.y, z: a.z };
  }

  function startMotionListening() {
    if (motionListening) return;
    window.addEventListener('devicemotion', handleMotion);
    motionListening = true;
  }
  function stopMotionListening() {
    window.removeEventListener('devicemotion', handleMotion);
    motionListening = false;
    lastAccel = null;
  }

  const motionSupported = typeof window.DeviceMotionEvent !== 'undefined';
  if (!motionSupported) {
    shakeToggle.disabled = true;
    shakeStatus.textContent = 'Non disponible sur cet appareil';
  }

  shakeToggle.addEventListener('change', async () => {
    if (!shakeToggle.checked) {
      stopMotionListening();
      shakeStatus.textContent = 'Relance les dés présents';
      return;
    }
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission !== 'granted') {
          shakeToggle.checked = false;
          shakeStatus.textContent = 'Permission refusée par le navigateur';
          return;
        }
      } catch (err) {
        console.error('DeviceMotion permission request failed', err);
        shakeToggle.checked = false;
        shakeStatus.textContent = 'Permission refusée par le navigateur';
        return;
      }
    }
    startMotionListening();
    shakeStatus.textContent = 'Secouez le téléphone pour relancer';
  });

  $('#btn-clear-stage').addEventListener('click', () => {
    resultCard.classList.remove('show');
    hero.classList.remove('faded');
    if (diceBox && !simpleMode) { try { diceBox.clear(); } catch (e) {} }
  });

  $('#btn-clear-history').addEventListener('click', () => {
    history = [];
    saveHistory();
    renderHistory();
  });

  async function boot() {
    try {
      const { default: DiceBox } = await import(`${CDN_BASE}/dist/dice-box.es.min.js`);
      diceBox = new DiceBox({
        container: '#dice-box',
        origin: '',
        assetPath: `${CDN_BASE}/dist/assets/`,
        theme: 'default',
        themeColor: '#c9a24b',
        scale: 6,
        gravity: 1,
        offscreen: true,
      });
      await diceBox.init();
      ready = true;
      setStatus('Dés prêts', true);
      setTimeout(() => statusPill.classList.add('hide'), 1500);
    } catch (err) {
      console.error('dice-box init failed, using simple mode', err);
      simpleMode = true;
      setStatus('Mode simple (sans 3D)', true);
      setTimeout(() => statusPill.classList.add('hide'), 2500);
    }
  }
  boot();
</script>

</body>
</html>
