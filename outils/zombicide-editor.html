<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombicide — Éditeur de carte</title>
<style>
:root{
  --zs:76px;
  --bg:#141210; --panel:#221f1c; --line:#3a332c; --ink:#e8e0d2; --dim:#a2968a;
  --gold:#c9a227; --street:#2a2724; --room:#33291f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;
  display:flex;overflow:hidden}
button{font:inherit;color:var(--ink);background:#2e2925;border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;cursor:pointer}
button:hover:not(:disabled){background:#3c352e;border-color:var(--gold)}
button.on{background:#4a3a1c;border-color:var(--gold)}
button.prim{background:#4a3a1c;border-color:var(--gold)}
button.danger{background:#4a1f1f;border-color:#8e2b2b}
input,select,textarea{font:inherit;background:#1a1714;color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:4px 6px}
h1,h2,h3{margin:0;font-weight:600}

#pane{flex:1;min-width:0;position:relative;display:flex}
#wrap{flex:1;overflow:auto;padding:26px;display:flex}
/* `margin:auto` centre sur les deux axes sans rogner les bords en cas de débordement */
#wrap .stage{margin:auto}
#viewTabs{position:absolute;left:10px;top:10px;z-index:21;display:flex;gap:4px}
#viewTabs button{padding:4px 12px;font-size:12px}
#viewTabs button.on{background:#4a3a1c;border-color:var(--gold);font-weight:600}
#zoomBar{position:absolute;right:10px;top:10px;z-index:20;display:flex;gap:4px;
  align-items:center;background:#1a1714dd;border:1px solid var(--line);
  border-radius:6px;padding:3px 6px}
#zoomBar button{padding:2px 8px;font-size:13px;line-height:1.1}
#zLbl{font-size:11px;color:var(--dim);min-width:42px;text-align:center;
  font-variant-numeric:tabular-nums}
#grid{display:grid;position:relative;background:#0d0b0a;border:3px solid #4a4038;border-radius:4px}
.c{position:relative;width:var(--zs);height:var(--zs);background:var(--street);cursor:pointer}
.c.room{background:var(--room)}
.c:hover{filter:brightness(1.35)}
.c .lbl{position:absolute;left:3px;top:2px;color:#6d6157;pointer-events:none;
  font-size:clamp(6px,calc(var(--zs)*.12),10px)}
/* classe portée par <body> : survit à tous les redessins de la grille */
body.zsmall .c .lbl{display:none}
.c .rl{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;
  color:#00000055;pointer-events:none;font-size:clamp(12px,calc(var(--zs)*.34),30px)}
.c .tk{position:absolute;right:2px;top:2px;display:flex;flex-direction:column;gap:2px;
  pointer-events:none;z-index:3}
.tok{width:calc(var(--zs)*.26);height:calc(var(--zs)*.26);border-radius:50%;
  display:grid;place-items:center;border:1px solid #0008;font-weight:700;
  font-size:clamp(7px,calc(var(--zs)*.13),12px)}
.tok.exit{background:#2f6b4a;color:#fff}
.tok.start{background:#c9c9c9;color:#222}
/* Objectif : jeton CARRÉ, comme dans la boîte. */
.tok.obj{background:var(--oc);color:#fff;border-radius:3px}
.tok.obj.hidden{border:2px dashed #fff8}
.spw{position:absolute;background:var(--sc);border:1px solid #0009;z-index:3;
  pointer-events:none}
/* Avec une image, le pion d'Invasion devient un jeton CARRÉ posé au milieu du
   bord choisi, au lieu d'un bandeau étiré sur toute la longueur. */
/* Le jeton garde le RATIO de son image : on fixe la hauteur, la largeur en
   découle (--ratio = largeur/hauteur, relevé au préchargement).
   Il s'oriente ensuite selon le bord, dans le sens horaire :
   haut 0°, droite 90°, bas 180°, gauche 270°. Le jeton est centré sur le bord
   et tourne autour de ce centre, ce qui garde le même point d'ancrage quel que
   soit l'angle. */
.spw.img{background-color:transparent;border:none;
  background-size:contain;background-repeat:no-repeat;background-position:center}
.spw.img.n,.spw.img.s,.spw.img.w,.spw.img.e{
  height:calc(var(--zs)*.26);
  width:calc(var(--zs)*.26*var(--ratio,1));
  right:auto;bottom:auto}
.spw.img.n{left:50%;top:calc(var(--zs)*.13);
  transform:translate(-50%,-50%) rotate(0deg)}
.spw.img.e{left:calc(100% - var(--zs)*.13);top:50%;
  transform:translate(-50%,-50%) rotate(90deg)}
.spw.img.s{left:50%;top:calc(100% - var(--zs)*.13);
  transform:translate(-50%,-50%) rotate(180deg)}
.spw.img.w{left:calc(var(--zs)*.13);top:50%;
  transform:translate(-50%,-50%) rotate(270deg)}
.spw.n{left:18%;top:2px;width:64%;height:calc(var(--zs)*.17)}
.spw.s{left:18%;bottom:2px;width:64%;height:calc(var(--zs)*.17)}
.spw.w{top:18%;left:2px;height:64%;width:calc(var(--zs)*.17)}
.spw.e{top:18%;right:2px;height:64%;width:calc(var(--zs)*.17)}
/* Zombies de départ : une pastille par type, dessinée comme une pile */
/* objets posés : pastille dorée en bas à droite */
.itk{position:absolute;right:4px;bottom:4px;z-index:4;pointer-events:none;
  width:calc(var(--zs)*.26);height:calc(var(--zs)*.26);border-radius:50%;
  background:#c9a227;color:#241c06;border:1px solid #0009;display:grid;place-items:center;
  font-weight:700;font-size:clamp(8px,calc(var(--zs)*.13),12px)}
/* Grille carrée (2×2, 3×3…) plutôt qu'une ligne qui s'étire. */
/* Marqueur de Zone : 60 % de la case, centré, sous les autres jetons. */
.zmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:60%;height:60%;z-index:1;pointer-events:none;
  background-size:contain;background-repeat:no-repeat;background-position:center}
.zmark.vide{border:1px dashed #ffffff4d;border-radius:6px;display:grid;
  place-items:center;font-size:9px;color:#ffffff8a;text-align:center;line-height:1.1}
.spw.exitk{display:grid;place-items:center;color:#fff;font-weight:700;
  font-size:clamp(7px,calc(var(--zs)*.12),13px)}
.spw.exitk.img{color:transparent}
.zpile{position:absolute;left:4px;bottom:4px;display:grid;
  grid-template-columns:repeat(var(--gc,2),1fr);gap:5px;z-index:4;pointer-events:none}
.zp{position:relative;width:calc(var(--zs)*.30);height:calc(var(--zs)*.30);border-radius:50%;
  background:var(--zc);border:2px solid #0009;display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:clamp(8px,calc(var(--zs)*.14),13px);text-shadow:0 1px 2px #0009}
.zp.pile2{box-shadow:3px -3px 0 -2px var(--zc), 3px -3px 0 0 #000a}
.zp.pile3{box-shadow:3px -3px 0 -2px var(--zc), 3px -3px 0 0 #000a,
          6px -6px 0 -3px var(--zc), 6px -6px 0 -1px #000a}
/* Élément habillé d'un PNG : l'image porte le décor, on efface fond et bordure.
   Les badges posés par-dessus (effectif, compte d'objets) restent lisibles. */
.tok.img,.itk.img{background-color:transparent;border:none;
  background-size:cover;background-position:center}
.itk.img{color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
.zp.img{background:none;border:none;color:transparent;
  background-size:cover;background-position:center}
.zp.img.pile2,.zp.img.pile3{box-shadow:none;filter:drop-shadow(3px -3px 0 #0006)}
.zp .nb{position:absolute;bottom:-5px;right:-6px;background:#1a1714;color:#f0e2b8;
  border:1px solid #000a;border-radius:8px;min-width:15px;height:15px;padding:0 3px;
  font-size:10px;display:grid;place-items:center;line-height:1}

/* Arêtes cliquables, actives en mode Portes. Une arête du plateau ne porte
   qu'UNE zone cliquable, sinon les cases voisines se recouvrent et la moitié
   des clics tombe à côté. */
.eh{position:absolute;z-index:8;display:none;border-radius:3px;cursor:pointer}
body.doormode .eh{display:block;background:#c9a2271f;outline:1px dashed #c9a22755}
body.doormode .eh:hover{background:#c9a22777;outline:1px solid var(--gold)}
body.doormode .eh.has{background:#b5462d66;outline:1px solid #b5462d}
body.doormode .eh.has:hover{background:#e0604066}
/* le filtre de survol des cases créerait un contexte d'empilement qui masquerait
   les arêtes débordant sur la case voisine */
body.doormode .c:hover{filter:none}
.eh.n{left:10%;top:-9px;width:80%;height:18px}
.eh.w{top:10%;left:-9px;height:80%;width:18px}
/* Est/Sud n'apparaissent que sur le bord du plateau : on les rentre dans la
   case, sinon elles déborderaient de la grille (et passeraient sous le panneau). */
.eh.e{top:10%;right:0;height:80%;width:16px}
.eh.s{left:10%;bottom:0;width:80%;height:16px}
/* Sur le pourtour du plateau, la zone cliquable est rentrée à l'intérieur de la
   case : débordante, elle sortirait de l'écran ou passerait sous le panneau. */

.walls{position:absolute;left:0;top:0;pointer-events:none;z-index:6}
.walls .wall{stroke:#8a7458;stroke-width:6;stroke-linecap:square}
/* Ouverture : franchissable, mais c'est bien une limite entre deux Zones */
.walls .wall.ouv{stroke-width:4;stroke-dasharray:6 5;opacity:.75}
.walls .door{stroke-width:12;stroke-linecap:butt}
.hatch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(var(--zs)*.45);height:calc(var(--zs)*.45);border-radius:6px;border:2px dashed var(--cc);
  background:#00000055;color:var(--cc);display:grid;place-items:center;
  font-size:15px;font-weight:700;pointer-events:none;z-index:2}

/* ---------- vue Logique : graphe nodal ---------- */
#logic{display:none;position:relative;background:#0d0b0a;border:3px solid #4a4038;
  border-radius:4px;min-width:760px;min-height:460px}
body.logicview #mapView{display:none}
body.logicview #logic{display:block}
body.logicview #zoomBar{display:none}
/* Pas de width/height:100% avec une viewBox : le SVG serait mis à l'échelle
   (la viewBox portait la largeur bordure comprise, la boîte non) et les liens
   dérivaient d'autant plus qu'on s'éloignait de l'origine. */
#logic svg.links{position:absolute;left:0;top:0;pointer-events:none}
#logic svg.links path{fill:none;stroke-width:2.5}
#logic svg.links path.on{stroke:#7fd48a}
#logic svg.links path.off{stroke:#c07a34;stroke-dasharray:6 4}
#logic svg.links path.hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.gnode{position:absolute;width:196px;border:2px solid var(--nc);border-radius:8px;
  background:#241f1b;padding:6px 9px;user-select:none;cursor:grab;z-index:2}
/* Un nœud à deux entrées réserve une gouttière à gauche pour leurs libellés,
   sinon « active » / « désactive » se superposent au titre. */
.gnode.two{padding-left:64px;min-height:68px}
.gnode.drag{cursor:grabbing;box-shadow:0 4px 14px #000a}
.gnode .t{font-size:12px;font-weight:700;color:var(--nc)}
.gnode .d{font-size:10px;color:var(--dim);line-height:1.3}
.gnode.sel{box-shadow:0 0 0 2px var(--gold)}
.gnode.mission{border-style:double;border-width:4px}
.port{position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid #0009;
  background:#3c352e;cursor:pointer;z-index:3}
.port:hover{background:var(--gold)}
.port.out{right:-9px;top:calc(50% - 7px)}
.port.in{left:-9px;top:calc(50% - 7px)}
.port.in.two1{top:8px}
.port.in.two2{top:auto;bottom:8px}
.port.filled{background:#7fd48a}
.port.filled.off{background:#c07a34}
.port .lb{position:absolute;left:19px;top:-2px;font-size:9px;color:var(--dim);
  white-space:nowrap;pointer-events:none}
#logicHint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--dim);
  max-width:70%;line-height:1.4;pointer-events:none}

/* ---------- vue Tuiles ---------- */
#tiles{display:none}
body.tilesview #mapView,body.tilesview #logic{display:none}
body.tilesview #tiles{display:block;width:100%}
body.tilesview #zoomBar{display:none}
/* Ailleurs la scène se centre en margin:auto et se réduit à son contenu ; ici
   elle doit prendre toute la largeur, sinon le canevas centré entraîne la
   galerie avec lui et celle-ci se retrouve large de 390 px. */
body.tilesview #wrap .stage{margin:0;flex:1;min-width:0}
/* Le canevas est seul dans la zone principale : on le centre. Les outils sont
   dans le panneau de droite, comme pour les autres vues. */
#tileWork{display:flex;justify-content:center;margin-bottom:14px}
/* --ova = opacité des repères posés sur l'image (murs, teinte des bâtiments).
   La taille est fixée en JS : c'est le zoom de la vue Tuiles. */
#tileEdit{position:relative;--ova:.55;width:390px;height:390px;flex:0 0 auto;
  border:3px solid #4a4038;border-radius:4px;background:#0d0b0a;
  background-size:cover;background-position:center}
#tileEdit .tc{position:absolute;width:33.333%;height:33.333%;cursor:pointer;
  border:1px dashed #ffffff35;display:grid;place-items:center;
  font-size:26px;font-weight:800;color:#fff;text-shadow:0 0 6px #000,0 0 3px #000}
#tileEdit .tc:hover{background:#c9a22733}
#tileEdit .tc.rue{color:#ffffff55}
#tileEdit .tc.bat{background:rgba(51,41,31,calc(var(--ova)*.55))}
#tileEdit .tw{position:absolute;background:rgba(240,217,160,var(--ova));
  box-shadow:0 0 3px #000a;z-index:3;pointer-events:none}
/* Ouverture : la même convention qu'en jeu et dans la vue Carte — un mur percé
   en son milieu, plutôt qu'un pointillé sur toute la longueur. */
#tileEdit .tw.lim-ouverture{box-shadow:none;
  background:linear-gradient(90deg,
    rgba(240,217,160,var(--ova)) 0 30%, transparent 30% 70%,
    rgba(240,217,160,var(--ova)) 70% 100%)}
#tileEdit .tw.lim-ouverture.vert{background:linear-gradient(180deg,
    rgba(240,217,160,var(--ova)) 0 30%, transparent 30% 70%,
    rgba(240,217,160,var(--ova)) 70% 100%)}
/* Ouverture : mur volontairement absent (pas encore de porte) — pointillé.
   Le sens du pointillé suit celui du mur, d'où la variante .vert. */
#tileEdit .tw.ouv{box-shadow:none;
  background:repeating-linear-gradient(90deg,
    rgba(240,217,160,var(--ova)) 0 5px, transparent 5px 10px)}
#tileEdit .tw.ouv.vert{background:repeating-linear-gradient(0deg,
    rgba(240,217,160,var(--ova)) 0 5px, transparent 5px 10px)}
#tileEdit .td{position:absolute;z-index:4;border-radius:2px;box-shadow:0 0 3px #000}
#tileEdit .teh{position:absolute;z-index:5;cursor:pointer;background:#c9a2271a;
  outline:1px dashed #c9a22766;border-radius:3px}
#tileEdit .teh:hover{background:#c9a22788}
/* .vide = arête sans mur : on la montre en creux, pour pouvoir en poser un */
#tileEdit .teh.vide{background:#ffffff0d;outline:1px dotted #ffffff40}
#tileEdit .teh.vide:hover{background:#c9a22766;outline:1px solid var(--gold)}
#tileGal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;
  max-height:330px;overflow:auto;padding:4px;background:#191614;border:1px solid var(--line);
  border-radius:6px}
.tg{position:relative;border:2px solid var(--line);border-radius:5px;overflow:hidden;
  cursor:pointer;aspect-ratio:1}
.tg img{width:100%;height:100%;object-fit:cover;display:block}
.tg .lb{position:absolute;left:0;right:0;bottom:0;background:#000a;font-size:10px;
  text-align:center;padding:1px 0}
.tg.on{border-color:var(--gold);box-shadow:0 0 0 2px #c9a22766}
.tg.faite{border-color:#4f9d5a}
.tg .ok{position:absolute;right:2px;top:1px;font-size:11px;color:#7fd48a;text-shadow:0 0 3px #000}

/* aperçu d'une tuile posée sur la carte */
.tileBg{position:absolute;background-size:100% 100%;background-repeat:no-repeat;
  opacity:.5;pointer-events:none;z-index:0}

#crypts{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.cz{width:150px;height:150px;border:2px solid var(--cc);border-radius:8px;
  background:#241d28 center/cover no-repeat;padding:7px 9px;position:relative}
.cz::before{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background:linear-gradient(180deg,#000000cc 0%,#00000044 45%,#000000aa 100%)}
.cz .h,.cz .i{position:relative;z-index:1}
.cz .h{font-size:11px;font-weight:700;color:var(--cc);letter-spacing:.5px;
  text-shadow:0 1px 3px #000,0 0 6px #000}
.cz .i{font-size:10px;color:#d8cfc2;text-shadow:0 1px 3px #000}

#side{width:410px;min-width:410px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh}
#side header{padding:10px 12px;border-bottom:1px solid var(--line);background:#1a1714}
#side header h1{font-size:15px;color:var(--gold);letter-spacing:.5px}
#scroll{flex:1;overflow-y:auto;padding:10px 12px}
.card{background:#2a2521;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.card h3{font-size:13px;color:var(--gold);margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.g{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.row.g button{width:100%}
label{font-size:12px;color:var(--dim)}
.hint{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.4}
textarea{width:100%;height:150px;font-family:Consolas,monospace;font-size:11px;resize:vertical}
#msg{padding:6px 12px;font-size:12px;min-height:30px;border-top:1px solid var(--line);background:#191614}
#msg.err{color:#e08080}#msg.ok{color:#8fd08f}
#foot{padding:8px 12px;border-top:1px solid var(--line);background:#1a1714;display:flex;gap:6px;flex-wrap:wrap}
button.col{border-color:var(--bc);color:var(--bc);font-weight:600}
button.col.on{background:var(--bc);color:#1a1714;border-color:var(--bc)}
.cond{display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center;margin-top:5px}
.cond select{width:100%;font-size:12px;padding:2px 4px}
</style>
</head>
<body>

<div id="pane">
  <div id="zoomBar">
    <button id="zOut" title="Dézoomer (Ctrl + molette, ou -)">−</button>
    <span id="zLbl">100 %</span>
    <button id="zIn" title="Zoomer (Ctrl + molette, ou +)">+</button>
    <button id="zFit" title="Ajuster la carte à la fenêtre (touche 0)">Ajuster</button>
  </div>
  <div id="viewTabs">
    <button id="tabMap" class="on">🗺 Carte</button>
    <button id="tabLogic">🔗 Logique</button>
    <button id="tabTiles">🧩 Tuiles</button>
  </div>
  <div id="wrap"><div class="stage">
    <div id="mapView"><div id="grid"></div><div id="crypts"></div></div>
    <div id="logic"></div>
    <div id="tiles"></div>
  </div></div>
</div>

<div id="side">
  <header><h1>ÉDITEUR DE CARTE</h1>
    <div class="hint" style="margin:0">Zombicide : Black Plague — génère un objet <code>QUEST</code></div>
  </header>
  <div id="scroll"></div>
  <div id="msg"></div>
  <div id="foot">
    <button id="btnPlay" class="prim">Jouer cette carte</button>
    <button id="btnBack">Retour au jeu</button>
    <input type="file" id="tileFile" accept="application/json,.json" style="display:none">
  </div>
</div>

<script src="zombicide_fichiers/zombicide_missions/missions.js"></script>
<script>
"use strict";
const DXY={n:[0,-1],s:[0,1],e:[1,0],w:[-1,0]}, OPP={n:"s",s:"n",e:"w",w:"e"};
const SIDES=["n","e","s","w"];
/* La boîte de base contient 2 Zones de Crypte (violette, jaune) et 2 portes de
   chaque couleur. Les portes d'une même couleur mènent toutes à la même Zone de
   Crypte, posée à côté du plateau : c'est ainsi qu'on relie deux endroits par
   un souterrain. */
const CRYPT_COLORS = {violet:"#a06bd8", jaune:"#c9a227"};
/* Jetons Zone de Crypte officiels, dans le dossier des tuiles. */
const CRYPT_IMG = {violet:"Vault_Purple", jaune:"Vault_Yellow"};
const CRYPT_NOM = {violet:"violette", jaune:"jaune"};      // « crypte » est féminin
const cryptNom = c => CRYPT_NOM[c] || c;
const COLORS = {
  red:    {f:"rouge",    m:"rouge",  css:"#b5462d"},
  blue:   {f:"bleue",    m:"bleu",   css:"#3d6fb5"},
  green:  {f:"verte",    m:"vert",   css:"#4f9d5a"},
  purple: {f:"violette", m:"violet", css:"#a06bd8"},
  grey:   {f:"grise",    m:"gris",   css:"#8a8a8a"}
};
const colF=c=>(COLORS[c]||{}).f||c, colM=c=>(COLORS[c]||{}).m||c;
const colCss=c=>(COLORS[c]||{}).css||"#8a8a8a";
/* --------------------------------------------------------------------------
   IMAGES — mêmes fichiers que le jeu, même dossier
   L'éditeur doit montrer la carte telle qu'elle sera jouée : il relit donc le
   même ./sprites/. Chaque fichier est facultatif ; sans lui on garde la
   pastille de couleur ou le jeton dessiné en CSS.
   -------------------------------------------------------------------------- */
const SPRITE_DIR = "zombicide_fichiers/sprites/";
const SPRITES = {

const SPRITE_OK = {};
const SPRITE_RATIO = {};                      // largeur/hauteur de chaque image
/* Les images arrivent après le premier rendu : on redessine une fois qu'on
   sait lesquelles existent, plutôt que de retarder l'affichage de la carte. */
function preloadSprites(cb){
  const keys=Object.keys(SPRITES); let left=keys.length;
  if(!left) return cb();
  keys.forEach(k=>{
    const im=new Image();
    im.onload =()=>{ SPRITE_OK[k]=true;
      // le ratio réel sert à ne pas déformer les jetons (voir .spw.img)
      if(im.naturalHeight) SPRITE_RATIO[k]=im.naturalWidth/im.naturalHeight;
      if(!--left) cb(); };
    im.onerror=()=>{ SPRITE_OK[k]=false; if(!--left) cb(); };
    im.src=SPRITE_DIR+SPRITES[k];
  });
}
/* Habille un élément d'une image si elle existe ; sinon laisse le CSS opérer. */
function habille(e, cle){
  if(!SPRITE_OK[cle]) return false;
  e.classList.add("img");
  e.style.setProperty("--ratio", SPRITE_RATIO[cle]||1);
  e.style.backgroundImage=`url(${SPRITE_DIR+SPRITES[cle]})`;
  e.textContent="";
  return true;
}

/* --------------------------------------------------------------------------
   CATALOGUE DE MISSIONS
   Un navigateur ne sait pas lister un dossier : la liste vient du fichier
   zombicide_fichiers/zombicide_missions/missions.js, inclus par une balise de
   script dans la page.
   Une entrée porte soit la quête directement (`quest`), soit le nom d'un JSON
   voisin (`file`). Le second cas passe par fetch(), que les navigateurs
   REFUSENT quand la page est ouverte en file:// — d'où le message explicite.
   -------------------------------------------------------------------------- */
const MISSION_DIR = "zombicide_fichiers/zombicide_missions/";
/* Chaque mission est un fichier .js qui s'annonce lui-même par ZBP_MISSION().
   C'est la seule forme qui marche AUSSI en file:// : une balise de script est
   autorisée là où fetch ne l'est pas. Surtout, la quête n'existe qu'à UN seul
   endroit — une copie dans le catalogue finissait fatalement par dater. */
window.ZBP_MISSIONS = window.ZBP_MISSIONS || [];
window.ZBP_MISSION = e => { if(e) window.ZBP_MISSIONS.push(e); };
const missionsDispo = () => Array.isArray(window.ZBP_MISSIONS) ? window.ZBP_MISSIONS : [];
/* Charge les fichiers listés par missions.js, puis rend la main. Un fichier
   absent est ignoré : le menu montre simplement les autres. */
function chargerFichiersMissions(cb){
  const liste = Array.isArray(window.ZBP_MISSION_FILES) ? window.ZBP_MISSION_FILES : [];
  let reste = liste.length;
  if(!reste) return cb();
  liste.forEach(f=>{
    const sc=document.createElement("script");
    sc.src = MISSION_DIR + f;
    sc.onload = sc.onerror = ()=>{ if(!--reste) cb(); };
    document.head.appendChild(sc);
  });
}
/* Quand une entrée porte les DEUX, le FICHIER fait foi : la copie `quest` du
   catalogue n'est qu'un repli pour file://, où fetch est interdit. Sans cette
   priorité, modifier le .json resterait sans effet — la copie l'emporterait en
   silence. `chargerMission` rend aussi d'où vient la quête, pour le dire. */
async function chargerMission(entree){
  if(!entree) return null;
  if(entree.file){
    let r=null, lisible=true;
    try{ r = await fetch(MISSION_DIR + entree.file); }
    catch(e){ lisible=false; }
    if(lisible && r && r.ok){
      const q = await r.json();
      q.__source = "fichier";
      return q;
    }
    if(!entree.quest)
      throw new Error(lisible
        ? ("fichier introuvable : "+entree.file)
        : "lecture impossible depuis file:// — sers le dossier en http, "+
          "ou écris la quête dans missions.js (champ `quest`)");
  }
  if(entree.quest){
    const q = JSON.parse(JSON.stringify(entree.quest));
    q.__source = entree.file ? "copie du catalogue" : "catalogue";
    return q;
  }
  throw new Error("entrée de mission sans `quest` ni `file`");
}

/* ==========================================================================
   LES MURS FONT FOI
   Un mur est déclaré arête par arête, comme sur le dessin d'une tuile — au
   lieu d'être déduit d'un nom de pièce. Les pièces, elles, se déduisent des
   murs (piecesParPropagation) : deux tuiles juxtaposées dont on a retiré le
   mur commun forment donc une seule pièce, sans avoir à accorder des lettres.

   Chaque arête interne est le Nord ou l'Ouest d'exactement une case : on la
   nomme toujours de la même façon, d'où qu'on la regarde. Sans ça, une même
   arête aurait deux entrées et pourrait se contredire.
   ========================================================================== */
function cleMur(x,y,s){
  if(s==="s" && y+1<M.H) return x+","+(y+1)+",n";
  if(s==="e" && x+1<M.W) return (x+1)+","+y+",w";
  return x+","+y+","+s;
}

/* --------------------------------------------------------------------------
   TYPES DE LIMITE
   Vocabulaire des règles : une Zone de rue fait toujours UNE case ; une Zone de
   bâtiment peut en couvrir plusieurs, à condition qu'AUCUNE limite ne les
   sépare. Toute limite — même franchissable — sépare deux Zones, et c'est ce
   qui compte pour la génération des monstres : une Invasion se résout dans
   chaque Zone, donc deux fois de part et d'autre d'une ouverture.

   L'absence de limite n'est pas un type : c'est l'absence d'entrée, et c'est le
   seul cas qui FUSIONNE deux cases de bâtiment en une seule Zone.
   -------------------------------------------------------------------------- */
const LIMITES = {
  mur:       {n:"Mur",       c:"#8a7458", bloqueMouv:true,  bloqueVue:true,
              aide:"Infranchissable, et coupe la ligne de vue."},
  ouverture: {n:"Ouverture", c:"#c9a227", bloqueMouv:false, bloqueVue:false,
              aide:"On passe et on voit librement, mais ce sont bien DEUX Zones : une Invasion s'y résout deux fois."}
  /* À venir (Green Horde) — la structure les accepte déjà, il manque leurs
     règles dans le moteur :
       barriere {bloqueMouv:true,  bloqueVue:false}
       haie     {bloqueMouv:false, bloqueVue:true}
       rebord / rive : bords de Zone immergée, mouvement distinct joueurs/zombies */
};
const LIMITES_ORDRE = ["mur","ouverture"];

const limiteDe = (x,y,s)=>M.limites[cleMur(x,y,s)]||null;
const poseLimite=(x,y,s,t)=>{ M.limites[cleMur(x,y,s)]=t; };
const oteLimite =(x,y,s)=>{ delete M.limites[cleMur(x,y,s)]; };
const estMur    =(x,y,s)=>limiteDe(x,y,s)==="mur";
/* Sépare-t-elle deux Zones ? Toute limite le fait, une porte aussi. */
const separe    =(x,y,s)=>!!limiteDe(x,y,s) || !!findDoor(x,y,s);
/* Bloque-t-elle le déplacement ? (une porte se franchit une fois ouverte) */
function bloqueMouv(x,y,s){
  const t=limiteDe(x,y,s);
  return !!(t && LIMITES[t] && LIMITES[t].bloqueMouv);
}

/* Les pièces se déduisent des murs : deux cases de Bâtiment voisines sans mur
   entre elles sont la même pièce. Rend un tableau de lettres (une par case,
   null pour la Rue) — c'est exactement le `map` du format de quête. */
function piecesParPropagation(){
  const lab=new Array(M.W*M.H).fill(null);
  let n=0;
  for(let y=0;y<M.H;y++) for(let x=0;x<M.W;x++){
    if(!estBat(ch(x,y)) || lab[I(x,y)]) continue;
    const L=POOL_LETTRES[n++]||"?";
    const pile=[[x,y]]; lab[I(x,y)]=L;
    while(pile.length){
      const [cx,cy]=pile.pop();
      for(const s of SIDES){
        const nx=cx+DXY[s][0], ny=cy+DXY[s][1];
        if(!IN(nx,ny) || !estBat(ch(nx,ny)) || lab[I(nx,ny)]) continue;
        if(separe(cx,cy,s)) continue;      // ouverture comprise : deux Zones
        lab[I(nx,ny)]=L; pile.push([nx,ny]);
      }
    }
  }
  return {lab, n};
}
/* Une porte normale est symétrique (deux cases) ; une porte de crypte
   appartient à une seule case et peut border le plateau. */
function findDoor(x,y,s){
  const nx=x+DXY[s][0], ny=y+DXY[s][1];
  return M.doors.find(d=> (d.x===x&&d.y===y&&d.s===s) ||
                          (d.x===nx&&d.y===ny&&d.s===OPP[s]) );
}
const findCrypt = (x,y) => M.cryptDoors.find(d=>d.x===x&&d.y===y);

/* Conditions offertes à la composition : le vocabulaire fixe, plus ce que la
   carte contient réellement — un Objectif précis se désigne par sa case. */
/* Même clé que le jeu : casse, accents et ponctuation ignorés. */
const cleObj = n => (n||"").toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");

function condsDisponibles(){
  const l = CONDS.filter(c=>c[0]);
  /* Un Objectif nommé se vise par son NOM : le déplacer ne casse pas la quête. */
  M.objectives.filter(o=>o.name).forEach(o=>
    l.push([`objective:named:${cleObj(o.name)}`, `« ${o.name} » récupéré`]));
  M.objectives.forEach(o=>l.push([`objective:at:${o.x},${o.y}`,
    `l'Objectif en (${o.x+1},${o.y+1}) récupéré`]));
  [["yellow","Jaune"],["orange","Orange"],["red","Rouge"]].forEach(([k,n])=>
    l.push([`danger:${k}`, `niveau ${n} atteint par un Survivant`]));
  return l;
}
function condTexte(c){
  const fixe = CONDS.find(x=>x[0]===(c||""));
  if(fixe) return fixe[1];
  const mn=/^objective:named:(.+)$/.exec(c||"");
  if(mn){ const o=M.objectives.find(o=>o.name && cleObj(o.name)===mn[1]);
          return `« ${o ? o.name : mn[1]} » récupéré`; }
  const ma=/^objective:at:(\d+),(\d+)$/.exec(c||"");
  if(ma) return `l'Objectif en (${+ma[1]+1},${+ma[2]+1}) récupéré`;
  const md=/^danger:(\w+)$/.exec(c||"");
  if(md) return `niveau ${({yellow:"Jaune",orange:"Orange",red:"Rouge",blue:"Bleu"})[md[1]]||md[1]} atteint par un Survivant`;
  return c;
}
const EXIT_TXT  = {all:"tous les Survivants vivants doivent sortir",
                   any:"au moins un Survivant doit sortir",
                   none:"aucune sortie requise"};
const texteBut = g => g.label || (g.need||[]).map(condTexte).join(" et ");
function missionTexte(){
  const b=(M.win.goals||[]).filter(g=>(g.need||[]).length).map(texteBut);
  let t = b.join(M.win.mode==="any" ? " OU " : ", puis ");
  if(M.win.exit!=="none") t += (t?", puis ":"")+(EXIT_TXT[M.win.exit]||EXIT_TXT.all);
  return t || "aucune condition";
}

/* Une porte se pose sur un MUR. Chaque arête interne du plateau est le Nord ou
   l'Ouest d'exactement une case : une seule zone cliquable par arête, donc
   aucun recouvrement entre cases voisines. */
/* Une porte se pose sur une limite existante, mur comme ouverture — poser la
   porte fait alors du passage un mur qui la porte. */
const edgeSides = (x,y) => ["n","w"].filter(s=>!!limiteDe(x,y,s));
/* Toutes les arêtes d'une case, sans doublon entre voisines : l'outil Murs doit
   pouvoir en AJOUTER un là où il n'y en a pas, donc on ne filtre pas. */
function toutesAretes(x,y){
  const l=["n","w"];
  if(x===M.W-1) l.push("e");
  if(y===M.H-1) l.push("s");
  return l;
}

  const {lab}=piecesParPropagation();
  for(let y=0;y<M.H;y++) for(let x=0;x<M.W;x++){
    const c=ch(x,y), d=document.createElement("div");
    d.className="c"+(estBat(c)?" room":"");
    const lb=document.createElement("div"); lb.className="lbl"; lb.textContent=`${x},${y}`;

      r.textContent=lab[I(x,y)]||"?"; r.title="Pièce "+(lab[I(x,y)]||"?")+" (déduite des murs)";
      d.appendChild(r); }
    const tk=document.createElement("div"); tk.className="tk";
    const T=(cl,t,sp)=>{const e=document.createElement("div");e.className="tok "+cl;
      e.textContent=t; if(sp) habille(e,sp); tk.appendChild(e); return e;};
    if(eqp(M.exit,{x,y})){
      // la Sortie se pose sur un bord, comme un pion d'Invasion
      const e=document.createElement("div");
      e.className="spw exitk "+((M.exit.side)||"n");
      e.style.setProperty("--sc","#2f6b4a");
      e.textContent="S"; e.title="Zone de Sortie";
      habille(e,"tok_exit");
      d.appendChild(e);
    }
    if(eqp(M.start,{x,y})) T("start","D","tok_start");
    const o=M.objectives.find(p=>p.x===x&&p.y===y);
    if(o){ const e=T("obj"+(o.hidden?" hidden":""), o.hidden?"?":"O",
                     o.hidden?"tok_obj_hidden":"tok_obj_"+(o.color||"red"));
           e.style.setProperty("--oc", colCss(o.hidden?"red":o.color)); }
    d.appendChild(tk);
    // Zones d'Invasion : un rectangle par pion, sur le bord choisi
    M.spawns.filter(p=>p.x===x&&p.y===y).forEach(p=>{
      const e=document.createElement("div");
      e.className="spw "+(p.side||"n");
      e.style.setProperty("--sc", colCss(p.color||"red"));
      habille(e, "tok_spawn_"+(p.color||"red"));
      e.title=`Zone d'Invasion ${colF(p.color||"red")} (bord ${p.side||"n"})`;
      d.appendChild(e);
    });
    // marqueurs de Zone, sous les autres jetons
    (M.markers||[]).filter(k=>k.x===x&&k.y===y).forEach(k=>{
      const m=document.createElement("div");
      if(SPRITE_OK["tok_"+k.t]){ m.className="zmark";
        m.style.backgroundImage=`url(${SPRITE_DIR+SPRITES["tok_"+k.t]})`; }
      else { m.className="zmark vide"; m.textContent=MARQUEURS[k.t].n; }
      m.title=MARQUEURS[k.t].n;
      d.appendChild(m);
    });
    // objets posés dans la Zone
    const its=M.items.filter(i=>i.x===x&&i.y===y);
    if(its.length){
      const e=el("div","itk", its.length>1?String(its.length):"◈");
      // avec une image, le compte reste écrit par-dessus
      if(habille(e,"tok_item") && its.length>1) e.textContent=String(its.length);
      e.title=its.map(i=>eqNom(i.id)).join(", ");
      d.appendChild(e);
    }
    // zombies de départ : une pastille par type, empilée, avec l'effectif
    const zs=M.zombies.filter(z=>z.x===x&&z.y===y)
                      .sort((a,b)=>Z_ORDRE.indexOf(a.t)-Z_ORDRE.indexOf(b.t));
    if(zs.length){
      const zc=el("div","zpile");
      zs.forEach(z=>{
        const pr=ZT_ED[z.t]||{n:z.t,ini:"?",c:"#888"};
        const e=el("div","zp"+(z.n>2?" pile3":(z.n>1?" pile2":"")), pr.ini);
        e.style.setProperty("--zc", pr.c);
        habille(e, z.t);                       // l'effectif est rajouté plus bas
        e.title=`${z.n} ${ZT_ED[z.t]?plurZ(z.t,z.n):pr.n}`;
        if(z.n>1){ const b=el("span","nb",z.n); e.appendChild(b); }
        zc.appendChild(e);
      });
      zc.style.setProperty("--gc", Math.max(1, Math.ceil(Math.sqrt(zc.children.length))));
      d.appendChild(zc);
    }
    const cd=findCrypt(x,y);
    if(cd){
      const t=document.createElement("div"); t.className="hatch";
      t.style.setProperty("--cc", CRYPT_COLORS[cd.color]||"#888");
      t.textContent="⛒"; t.title="Trappe de crypte "+cd.color;
      d.appendChild(t);
    }
    // arêtes cliquables : murs internes pour une porte normale,
    // les 4 côtés de toute case pour une porte de crypte.
    if(tool==="door"){
      edgeSides(x,y).forEach(s=>{
        const e=document.createElement("div");
        e.className="eh "+s+(findDoor(x,y,s)?" has":"");
        e.title = findDoor(x,y,s) ? "Retirer cette porte" : "Poser une porte";
        e.onclick=ev=>{ ev.stopPropagation(); toggleDoor(x,y,s); };
        d.appendChild(e);
      });
    }
    if(tool==="limites"){
      toutesAretes(x,y).forEach(s=>{
        const cur=limiteDe(x,y,s);
        const e=document.createElement("div");
        e.className="eh "+s+(cur?" has":"");
        e.title = cur===limiteType
          ? "Retirer cette limite"+(limiteType==="mur"?" (les Zones fusionnent)":"")
          : (cur ? "Remplacer : "+LIMITES[cur].n+" → "+LIMITES[limiteType].n
                 : "Poser : "+LIMITES[limiteType].n);
        e.onclick=ev=>{ ev.stopPropagation(); toggleLimite(x,y,s,limiteType); };
        d.appendChild(e);
      });
    }
    d.onclick=()=>paint(x,y);
    d.oncontextmenu=ev=>{ ev.preventDefault(); erase(x,y); };
    g.appendChild(d);
  }
  g.appendChild(renderTileBackgrounds());
  g.appendChild(renderWalls());
  renderCrypts();
  if(view==="logic") renderLogic();
  if(view==="tiles") renderTiles();
  renderPanel();
}
/* Image des tuiles posées, en fond de la grille : la carte ressemble alors au
   plateau réel. Purement décoratif, sans effet sur les règles. */
function renderTileBackgrounds(){
  const zs=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--zs"))||76;
  const frag=document.createDocumentFragment();
  Object.entries(M.tiles||{}).forEach(([k,v])=>{
    const [tx,ty]=k.split(",").map(Number);
    if(tx*3>=M.W || ty*3>=M.H) return;
    const d=el("div","tileBg");
    d.style.left=(tx*3*zs)+"px"; d.style.top=(ty*3*zs)+"px";
    d.style.width=(3*zs)+"px";   d.style.height=(3*zs)+"px";
    d.style.backgroundImage=`url("${tileImg(v.id)}")`;
    d.style.opacity=tileOpacity;
    if(v.rot) d.style.transform=`rotate(${v.rot*90}deg)`;
    frag.appendChild(d);
  });
  const wrap=document.createElement("div");
  wrap.style.cssText="position:absolute;inset:0;pointer-events:none;z-index:0";
  wrap.appendChild(frag);
  return wrap;
}
function renderWalls(){
  const NS="http://www.w3.org/2000/svg";
  const zs=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--zs"))||76;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","walls");
  svg.setAttribute("width",M.W*zs); svg.setAttribute("height",M.H*zs);
  svg.setAttribute("viewBox",`0 0 ${M.W*zs} ${M.H*zs}`);
  const line=(x1,y1,x2,y2,cl,col)=>{const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
    l.setAttribute("class",cl); if(col) l.setAttribute("stroke",col);
    svg.appendChild(l);};
  const p=(k,lo,hi)=>lo+(hi-lo)*k;
  for(let y=0;y<M.H;y++) for(let x=0;x<M.W;x++){
    const X=x*zs, Y=y*zs;
    const seg={ n:[X,Y,X+zs,Y], w:[X,Y,X,Y+zs], e:[X+zs,Y,X+zs,Y+zs], s:[X,Y+zs,X+zs,Y+zs] };
    for(const s of toutesAretes(x,y)){
      const t=limiteDe(x,y,s);
      if(!t) continue;
      const [a,b,c,d]=seg[s];
      if(t==="ouverture"){
        /* Même convention qu'en jeu : le mur est là, percé d'un passage.
           Une porte ne peut pas s'y poser — la poser convertit l'arête en mur. */
        line(a, b, p(.30,a,c), p(.30,b,d), "wall");
        line(p(.70,a,c), p(.70,b,d), c, d, "wall");
      } else line(a,b,c,d,"wall lim-"+t);
      const dr=findDoor(x,y,s);
      if(!dr) continue;
      const col=colCss(dr.color||"grey");
      if(dr.open){   // ouverte : deux battants écartés
        line(p(.20,a,c),p(.20,b,d),p(.33,a,c),p(.33,b,d),"door",col);
        line(p(.67,a,c),p(.67,b,d),p(.80,a,c),p(.80,b,d),"door",col);
      } else line(p(.22,a,c),p(.22,b,d),p(.78,a,c),p(.78,b,d),"door",col);
    }
  }
  return svg;
}
function renderCrypts(){
  const box=document.getElementById("crypts"); box.innerHTML="";
  const cols=cryptColorsUsed();
  box.style.display = cols.length ? "flex" : "none";
  cols.forEach(col=>{
    const n=M.cryptDoors.filter(d=>d.color===col).length;
    const d=document.createElement("div"); d.className="cz";
    d.style.setProperty("--cc", CRYPT_COLORS[col]||"#888");
    if(CRYPT_IMG[col]) d.style.backgroundImage=`url("${TILE_DIR}${CRYPT_IMG[col]}.jpg")`;
    const h=document.createElement("div"); h.className="h"; h.textContent="CRYPTE "+cryptNom(col).toUpperCase();
    const i=document.createElement("div"); i.className="i";
    i.textContent = n+" trappe(s)"+(n<2?" — une seule : cul-de-sac":" — souterrain reliant ces "+n+" accès");
    d.appendChild(h); d.appendChild(i); box.appendChild(d);
  });
}

/* ---------- outils ---------- */
function paint(x,y){
  if(tool==="door") return;
  if(tool==="tile"){
    if(!tileStamp) return say("Aucune tuile sélectionnée.","err");
    poserTuile(Math.floor(x/3), Math.floor(y/3), tileStamp, tileRot);
    return render();
  }
  if(tool==="crypt"){
    const ex=findCrypt(x,y);
    if(ex){ M.cryptDoors.splice(M.cryptDoors.indexOf(ex),1); say(""); return render(); }
    if(M.cryptDoors.filter(d=>d.color===cryptKind).length>=2)
      return say(`La boîte ne contient que 2 accès de crypte ${cryptKind} — retire-en un d'abord.`,"err");
    M.cryptDoors.push({x,y,color:cryptKind}); say("");
    return render();
  }
  if(tool==="room")        setCell(x,y,BAT);
  else if(tool==="street") setCell(x,y,".");
  else if(tool==="start")  M.start={x,y};
  else if(tool==="exit")   M.exit={x,y,side:exitSide};
  else if(tool==="spawn"){
    // un pion par clic ; même couleur ET même bord déjà présents ⇒ on le retire
    const k=M.spawns.findIndex(p=>p.x===x&&p.y===y&&p.color===spawnColor&&p.side===spawnSide);
    if(k>=0) M.spawns.splice(k,1);
    else M.spawns.push({x,y,color:spawnColor,side:spawnSide});
  }
  else if(tool==="item"){
    M.items.push({x,y,id:itemId}); say("");
  }
  else if(tool==="zomb"){
    // un clic ajoute une figurine du type courant ; les identiques s'empilent
    const ex=M.zombies.find(z=>z.x===x&&z.y===y&&z.t===zombType);
    const total=M.zombies.filter(z=>z.t===zombType).reduce((a,z)=>a+z.n,0);
    if(total>=ZT_ED[zombType].pool)
      return say(`La boîte ne contient que ${ZT_ED[zombType].pool} ${plurZ(zombType,2)}.`,"err");
    if(ex) ex.n++; else M.zombies.push({x,y,t:zombType,n:1});
    say("");
  }
  else if(tool==="marq"){
    const k=M.markers.findIndex(m=>m.x===x&&m.y===y&&m.t===marqType);
    if(k>=0) M.markers.splice(k,1); else M.markers.push({x,y,t:marqType});
    say("");
  }
  else if(tool==="obj"){
    const k=M.objectives.findIndex(p=>p.x===x&&p.y===y);
    if(k>=0) M.objectives.splice(k,1);
    else {
      M.objectives.push(objHidden ? {x,y,hidden:true} : {x,y,color:objColor});
      /* Poser un Objectif de couleur met son déclencheur à disposition : c'est
         le cas courant, autant ne pas le faire réclamer. */
      if(!objHidden){
        M.triggers = M.triggers || [];
        const d="objective:"+objColor;
        if(!M.triggers.includes(d)) M.triggers.push(d);
      }
    }
  }
  render();
}
function erase(x,y){
  if(tool==="item"){
    const k=[...M.items].reverse().findIndex(i=>i.x===x&&i.y===y);
    if(k>=0) M.items.splice(M.items.length-1-k,1);
    return render();
  }
  if(tool==="zomb"){
    const ex=M.zombies.find(z=>z.x===x&&z.y===y&&z.t===zombType);
    if(ex){ ex.n--; if(ex.n<=0) M.zombies.splice(M.zombies.indexOf(ex),1); }
    else M.zombies=M.zombies.filter(z=>!(z.x===x&&z.y===y));   // sinon on vide la case
    return render();
  }
  if(tool==="tile"){ retirerTuile(Math.floor(x/3), Math.floor(y/3)); say("Bloc vidé."); return render(); }
  M.markers = M.markers.filter(p=>!(p.x===x&&p.y===y));
  M.cryptDoors = M.cryptDoors.filter(p=>!(p.x===x&&p.y===y));
  M.spawns = M.spawns.filter(p=>!(p.x===x&&p.y===y));
  M.objectives = M.objectives.filter(p=>!(p.x===x&&p.y===y));
  if(eqp(M.start,{x,y})) M.start=null;
  if(eqp(M.exit,{x,y}))  M.exit=null;
  render();
}
/* Une case de Bâtiment naît entièrement murée : on ouvre ensuite à la main les
   côtés où la pièce se poursuit. En repassant en Rue, on ne retire que les murs
   qui ne bordent plus rien — ceux d'un bâtiment voisin lui appartiennent. */
function setCell(x,y,v){
  if(ch(x,y)===v) return;
  M.cells[I(x,y)]=v;
  for(const s of SIDES){
    const nx=x+DXY[s][0], ny=y+DXY[s][1];
    const voisinBat = IN(nx,ny) && estBat(ch(nx,ny));
    if(estBat(v)) poseLimite(x,y,s,"mur");
    else if(!voisinBat) oteLimite(x,y,s);
  }
  M.doors = M.doors.filter(d=>IN(d.x,d.y) && estMur(d.x,d.y,d.s));
}
/* Clic sur une arête, outil Limites : applique le type courant, ou le retire si
   c'est déjà lui — même geste que l'outil Portes. Retirer TOUTE limite entre
   deux cases de Bâtiment les réunit en une seule Zone ; poser une Ouverture les
   laisse séparées tout en laissant passer. */
function toggleLimite(x,y,s,t){
  if(limiteDe(x,y,s)===t) oteLimite(x,y,s);
  else poseLimite(x,y,s,t);
  // une porte n'a de sens que sur un mur
  if(!estMur(x,y,s)){
    const dr=findDoor(x,y,s); if(dr) M.doors.splice(M.doors.indexOf(dr),1);
  }
  say(""); render();
}
/* Clic sur une arête : pose une porte du type courant (couleur + état). Si une
   porte identique s'y trouve déjà elle est retirée, sinon elle est remplacée. */
function toggleDoor(x,y,s){
  const ex=findDoor(x,y,s);
  if(ex){
    const identique = (ex.color||"grey")===doorColor && !!ex.open===doorOpen;
    M.doors.splice(M.doors.indexOf(ex),1);
    if(identique){ say(""); return render(); }
  } else if(!limiteDe(x,y,s))
    return say("Une porte se pose sur une limite : commence par un Mur ou une Ouverture.","err");
  /* Une porte implique un mur : sans ça une porte fermée posée sur une
     ouverture ne bloquerait rien. Le trait redevient plein, avec son icône. */
  if(!estMur(x,y,s)) poseLimite(x,y,s,"mur");
  const d={x,y,s,color:doorColor};
  if(doorOpen) d.open=true;
  M.doors.push(d);
  say(""); render();
}

/* ---------- validation ---------- */
function problems(){
  const p=[];
  if(!M.start) p.push("Zone de départ manquante.");
  if(!M.exit && M.win.exit!=="none") p.push("Zone de sortie manquante.");
  if(!M.spawns.length) p.push("Aucune Zone d'Invasion.");
  if(!M.objectives.length) p.push("Aucun Objectif.");
  /* Accès d'une Zone de bâtiment. Exiger une porte serait faux : une Ouverture
     laisse passer tout autant. Est un accès toute arête menant à une AUTRE Zone
     et qui ne bloque pas le déplacement, porte comprise. */
  const {lab:labV}=piecesParPropagation();
  const zoneOuverte = r => {
    for(let y=0;y<M.H;y++) for(let x=0;x<M.W;x++){
      if(labV[I(x,y)]!==r) continue;
      for(const s of SIDES){
        const nx=x+DXY[s][0], ny=y+DXY[s][1];
        if(!IN(nx,ny)) continue;             // bord de plateau : rien au-delà
        if(labV[I(nx,ny)]===r) continue;     // arête interne à la Zone
        if(findDoor(x,y,s) || !bloqueMouv(x,y,s)) return true;
      }
    }
    return false;
  };
  const closes = [...new Set(labV.filter(Boolean))].filter(r=>!zoneOuverte(r));
  closes.forEach(r=>p.push(`La Zone « ${r} » n'a aucun accès : ni porte, ni ouverture.`));
  if(M.start && estBat(ch(M.start.x,M.start.y)) && closes.includes(labV[I(M.start.x,M.start.y)]))
    p.push("Le départ est dans une Zone close : les Survivants y seraient enfermés.");
  // conditions portant sur une couleur d'Objectif absente de la carte
  const couleursObj = couleursDisponibles();
  const verifCond=(cible,libelle)=>Object.entries(M.locks[cible]||{}).forEach(([col,cond])=>{
    const m=/^objective:(\w+)$/.exec(cond||"");
    if(m && !couleursObj.has(m[1]))
      p.push(`${libelle} ${colF(col)} attend un Objectif ${colM(m[1])}, mais la carte n'en contient aucun.`);
  });
  verifCond("spawns","Les Zones d'Invasion");
  verifCond("doors","Les portes");
  // la condition de victoire doit être atteignable
  const toutesConds = (M.win.goals||[]).flatMap(g=>g.need||[]);
  const mw=/^objective:(\w+)$/.exec(toutesConds.find(c=>/^objective:\w+$/.test(c))||"");
  if(mw && !couleursObj.has(mw[1]))
    p.push(`La mission exige un Objectif ${colM(mw[1])}, mais la carte n'en contient aucun.`);
  if(toutesConds.includes("never")) p.push("Un objectif de mission est réglé sur « jamais » : elle ne peut pas être gagnée.");
  (M.win.goals||[]).forEach(g=>{ (g.need||[]).forEach(c=>{
    const ma=/^objective:at:(\d+),(\d+)$/.exec(c);
    if(ma && !M.objectives.some(o=>o.x===+ma[1] && o.y===+ma[2]))
      p.push(`Un objectif de mission attend l'Objectif en (${+ma[1]+1},${+ma[2]+1}), absent de la carte.`);
    const mn=/^objective:named:(.+)$/.exec(c);
    if(mn && !M.objectives.some(o=>o.name && cleObj(o.name)===mn[1]))
      p.push(`Un objectif de mission attend l'Objectif nommé « ${mn[1]} », absent de la carte.`);
  }); });
  /* Deux Objectifs de même nom seraient indiscernables pour la quête. */
  const parNom={};
  M.objectives.filter(o=>o.name).forEach(o=>{
    const k=cleObj(o.name); (parNom[k]=parNom[k]||[]).push(o); });
  Object.values(parNom).forEach(l=>{ if(l.length>1)
    p.push(`${l.length} Objectifs portent le nom « ${l[0].name} » : la quête ne pourrait pas les distinguer.`); });
  if(M.win.exit==="none" && !toutesConds.length)
    p.push("Mission sans condition ni sortie : elle serait gagnée dès le premier instant.");
  // une porte grise ne peut pas être verrouillée
  if((M.locks.doors||{}).grey) p.push("Les portes grises ne peuvent pas être verrouillées.");
  // toutes les Zones d'Invasion inactives pour toujours ?
  if(M.spawns.length && M.spawns.every(sp=>(M.locks.spawns||{})[sp.color]==="never"))
    p.push("Toutes les Zones d'Invasion sont verrouillées sur « jamais » : aucun zombie n'apparaîtra.");
  M.items.forEach(i=>{ if(!EQ_ED[i.id]) p.push(`Objet inconnu posé en (${i.x},${i.y}) : ${i.id}.`); });
  // un effet ne sert à rien si aucun Objectif de cette couleur n'est récupérable
  /* Une chasse au Nécromancien devient impossible si ses cartes sont mises de
     côté ET qu'aucun Nécromancien n'est posé au départ. */
  const conditions = toutesConds
    .concat(Object.values(M.locks.spawns||{}), Object.values(M.locks.doors||{}),
            Object.values(M.locks.spawnsOff||{}));
  if(conditions.includes("kill:necromancer") && (M.rules||{}).necroAside
     && !M.zombies.some(z=>z.t==="necromancer"))
    p.push("Une condition exige de tuer un Nécromancien, mais ses cartes sont mises de côté et aucun n'est placé au départ.");
  // une condition « Artefacts » suppose au moins une crypte sur la carte
  const utiliseArtefacts = conditions.includes("vault:all");
  if(utiliseArtefacts && !cryptColorsUsed().length)
    p.push("Une condition attend les Artefacts de crypte, mais la carte n'a aucune crypte.");
  Object.entries(M.objEffects||{}).forEach(([col,l])=>{
    if(l && l.length && !couleursDisponibles().has(col))
      p.push(`Des effets sont prévus pour l'Objectif ${colM(col)}, absent de la carte.`);
    (l||[]).forEach(ef=>{
      if(ef.t==="equip" && !EQ_ED[ef.id])
        p.push(`Effet d'Objectif ${colM(col)} : équipement inconnu (${ef.id}).`);
      if(ef.t==="draw"){
        if(!(ef.ids||[]).length) p.push(`Effet d'Objectif ${colM(col)} : liste de tirage vide.`);
        (ef.ids||[]).forEach(id=>{ if(!EQ_ED[id])
          p.push(`Effet d'Objectif ${colM(col)} : carte inconnue dans le tirage (${id}).`); });
      }
    });
  });
  /* Façade de bâtiment ouverte sur la rue SANS limite : légitime si c'est
     voulu, mais c'est le plus souvent l'oubli d'un mur — on le signale. */
  const facades=[];
  for(let y=0;y<M.H;y++) for(let x=0;x<M.W;x++) for(const s of toutesAretes(x,y)){
    const nx=x+DXY[s][0], ny=y+DXY[s][1];
    if(!IN(nx,ny) || estBat(ch(x,y))===estBat(ch(nx,ny))) continue;
    if(!limiteDe(x,y,s)) facades.push(`(${x},${y})`);
  }
  if(facades.length)
    p.push(`Façade sans limite entre bâtiment et rue en ${[...new Set(facades)].join(", ")} — mur oublié ?`);
  (M.markers||[]).forEach(k=>{ if(!MARQUEURS[k.t])
    p.push(`Marqueur inconnu en (${k.x},${k.y}) : ${k.t}.`); });
  if((M.cryptPool||[]).length && !cryptColorsUsed().length)
    p.push("Une réserve de crypte est prévue, mais la carte n'a aucune crypte.");
  (M.cryptPool||[]).forEach(id=>{ if(!EQ_ED[id])
    p.push(`Objet inconnu dans la réserve de crypte : ${id}.`); });
  Object.entries(M.cryptItems||{}).forEach(([col,l])=>{
    if(l.length && !cryptColorsUsed().includes(col))
      p.push(`Des objets sont prévus pour la crypte ${cryptNom(col)}, qui n'existe pas sur la carte.`);
  });
  Z_ORDRE.forEach(t=>{
    const n=M.zombies.filter(z=>z.t===t).reduce((a,z)=>a+z.n,0);
    if(n>ZT_ED[t].pool)
      p.push(`${n} ${plurZ(t,n)} placés alors que la boîte n'en contient que ${ZT_ED[t].pool}.`);
  });
  M.zombies.forEach(z=>{
    if(M.start && z.x===M.start.x && z.y===M.start.y)
      p.push(`Des ${plurZ(z.t,2)} occupent la Zone de départ : les Survivants y commenceraient au contact.`);
  });
  cryptColorsUsed().forEach(col=>{
    if(M.cryptDoors.filter(d=>d.color===col).length<2)
      p.push(`La crypte ${col} n'a qu'un accès : elle ne relie rien (cul-de-sac).`);
  });
  // connexité depuis le départ, portes considérées comme ouvrables,
  // cryptes traitées comme des nœuds reliant toutes leurs portes
  if(M.start){
    const key=(x,y)=>y*M.W+x;
    const seen=new Set([key(M.start.x,M.start.y)]);
    const seenCrypt=new Set();
    const q=[{x:M.start.x,y:M.start.y}];
    while(q.length){
      const c=q.shift();
      // la trappe de la case donne accès à toutes les autres de la même couleur
      const cd=findCrypt(c.x,c.y);
      if(cd && !seenCrypt.has(cd.color)){
        seenCrypt.add(cd.color);
        M.cryptDoors.filter(o=>o.color===cd.color).forEach(o=>{
          if(!seen.has(key(o.x,o.y))){ seen.add(key(o.x,o.y)); q.push({x:o.x,y:o.y}); }
        });
      }
      for(const s of SIDES){
        const nx=c.x+DXY[s][0], ny=c.y+DXY[s][1];
        if(!IN(nx,ny)) continue;
        if(bloqueMouv(c.x,c.y,s) && !findDoor(c.x,c.y,s)) continue;
        if(seen.has(key(nx,ny))) continue;
        seen.add(key(nx,ny)); q.push({x:nx,y:ny});
      }
    }
    const chk=(pt,nm)=>{ if(pt && !seen.has(key(pt.x,pt.y))) p.push(nm+" est inatteignable depuis le départ."); };
    chk(M.exit,"La Zone de sortie");
    M.objectives.forEach((o,k)=>chk(o,`L'Objectif ${k+1} (${o.x},${o.y})`));
    M.spawns.forEach((o,k)=>chk(o,`La Zone d'Invasion ${k+1} (${o.x},${o.y})`));
  }
  return p;
}

/* ---------- import / export ---------- */
/* Traduction du modèle « murs » vers le format de quête, qui reste fondé sur
   des lettres (le jeu, les sauvegardes et les quêtes existantes ne bougent pas).
   Les lettres viennent de la propagation ; restent les arêtes que les lettres
   seules ne savent pas dire, et qu'on énumère explicitement :
     openings — l'éditeur n'a PAS de mur là où les lettres en impliquent un
                (une façade ouverte sur la rue, un bord de plateau ouvert) ;
     walls    — l'éditeur A un mur là où les lettres n'en impliquent aucun
                (un mur entre deux Rues, ou dans une pièce qui communique en
                contournant). */
/* Les lettres de `map` disent déjà « même Zone ou non ». Reste à donner le TYPE
   des limites, quand il ne correspond pas à ce que les lettres impliquent :
     - lettres différentes  → un mur est implicite ; on n'émet que si c'est autre
                              chose (ouverture, ou rien du tout) ;
     - lettres identiques   → aucune limite implicite ; on émet dès qu'il y en a
                              une (typiquement un mur entre deux Zones de rue).
   Le type "aucune" est un cas réel : une façade de bâtiment ouverte sur la rue,
   sans limite du tout — deux Zones distinctes, franchissables. */
function limitesExplicites(lab){
  const out=[];
  for(let y=0;y<M.H;y++) for(let x=0;x<M.W;x++) for(const s of toutesAretes(x,y)){
    const nx=x+DXY[s][0], ny=y+DXY[s][1], dedans=IN(nx,ny);
    const a = lab[I(x,y)]||".";
    const b = dedans ? (lab[I(nx,ny)]||".") : null;
    const implicite = (dedans ? a!==b : a!==".") ? "mur" : null;
    const reel = limiteDe(x,y,s);
    if(reel===implicite) continue;
    out.push({x,y,s,t: reel || "aucune"});
  }
  return out;
}
function toQuest(){
  const {lab}=piecesParPropagation();
  const map=[];
  for(let y=0;y<M.H;y++){ let r=""; for(let x=0;x<M.W;x++) r+=(lab[I(x,y)]||"."); map.push(r); }
  const lim=limitesExplicites(lab);
  const q = { name:M.name, description:M.description||"", goal:M.goal, W:M.W, H:M.H, map,
    minSurvivors:Math.max(1, M.minSurvivors|0 || 1),
    difficulty:M.difficulty||"", duration:M.duration||"",
    doors:M.doors.map(d=>{const o={x:d.x,y:d.y,s:d.s,color:d.color||"grey"};
                          if(d.open) o.open=true; return o;}),
    cryptDoors:M.cryptDoors.map(d=>({x:d.x,y:d.y,color:d.color})),
    spawns:M.spawns.map(p=>({x:p.x,y:p.y,color:p.color||"red",side:p.side||"n"})),
    start:M.start,
    exit:M.exit ? {x:M.exit.x, y:M.exit.y, side:M.exit.side||"n"} : null,
    objectives:M.objectives.map(o=>{
      const e = o.hidden ? {x:o.x,y:o.y,hidden:true} : {x:o.x,y:o.y,color:o.color||"red"};
      if(o.name) e.name = o.name;          // Objectif désigné par son nom
      return e;
    }) };
  if(lim.length) q.limits=lim;
  if(M.zombies.length) q.zombies=M.zombies.map(z=>({x:z.x,y:z.y,t:z.t,n:z.n}));
  if(M.items.length) q.items=M.items.map(i=>({x:i.x,y:i.y,id:i.id}));
  const ci={}; Object.entries(M.cryptItems||{}).forEach(([c,l])=>{ if(l&&l.length) ci[c]=[...l]; });
  if(Object.keys(ci).length) q.cryptItems=ci;
  if((M.cryptPool||[]).length) q.cryptPool=[...M.cryptPool];
  if((M.markers||[]).length) q.markers=M.markers.map(k=>({x:k.x,y:k.y,t:k.t}));
  if(M.hiddenBacks.length) q.hiddenBacks=[...M.hiddenBacks];
  const L={};
  if(Object.keys(M.locks.spawns||{}).length)    L.spawns   ={...M.locks.spawns};
  if(Object.keys(M.locks.doors ||{}).length)    L.doors    ={...M.locks.doors};
  if(Object.keys(M.locks.spawnsOff||{}).length) L.spawnsOff={...M.locks.spawnsOff};
  if(Object.keys(L).length) q.locks=L;
  const R={}; Object.entries(M.rules||{}).forEach(([k,v])=>{ if(v) R[k]=true; });
  if(Object.keys(R).length) q.rules=R;
  const E={}; Object.entries(M.objEffects||{}).forEach(([c,l])=>{
    if(l && l.length) E[c]=l.map(e=>({...e})); });
  if(Object.keys(E).length) q.objEffects=E;
  q.win={exit:M.win.exit};
  if(M.win.mode==="any") q.win.mode="any";      // « all » est la valeur par défaut
  const buts=(M.win.goals||[]).filter(g=>g.need && g.need.length)
    .map(g=>({label:g.label||"", need:[...g.need]}));
  if(buts.length) q.win.goals=buts;
  if(Object.keys(M.tiles||{}).length) q.tiles={...M.tiles};
  return q;
}
function fromQuest(q){
  const m=blank(q.W,q.H);
  m.name=q.name||"Quête"; m.goal=q.goal||""; m.description=q.description||"";
  /* Déclencheurs et intitulés se recomposent d'après ce qui est branché : la
     liste n'a pas besoin de voyager dans le fichier de quête. */
  m.triggers=[]; m.trigNames={};
  m.minSurvivors = Math.max(1, q.minSurvivors|0 || 1);
  m.difficulty = q.difficulty||""; m.duration = q.duration||"";
  for(let y=0;y<q.H;y++) for(let x=0;x<q.W;x++)
    m.cells[y*q.W+x] = q.map[y][x]==="." ? "." : BAT;
  m.doors=(q.doors||[]).filter(d=>!d.crypt)
            .map(d=>({x:d.x,y:d.y,s:d.s,color:d.color||"grey",open:!!d.open}));
  /* Chemin inverse : on repart des lettres pour reconstituer les murs, puis on
     applique les exceptions déclarées. C'est ce qui rend l'aller-retour exact. */
  const cle=(x,y,s)=>{
    if(s==="s" && y+1<q.H) return x+","+(y+1)+",n";
    if(s==="e" && x+1<q.W) return (x+1)+","+y+",w";
    return x+","+y+","+s;
  };
  const lettre=(x,y)=>(x<0||y<0||x>=q.W||y>=q.H) ? null : q.map[y][x];
  m.limites={};
  for(let y=0;y<q.H;y++) for(let x=0;x<q.W;x++){
    const cotes=["n","w"];
    if(x===q.W-1) cotes.push("e");
    if(y===q.H-1) cotes.push("s");
    for(const s of cotes){
      const a=lettre(x,y), b=lettre(x+DXY[s][0], y+DXY[s][1]);
      // au bord du plateau, seul un bâtiment est muré (voir limitesExplicites)
      if(b===null ? a!=="." : a!==b) m.limites[cle(x,y,s)]="mur";
    }
  }
  (q.limits||[]).forEach(l=>{
    const k=cle(l.x,l.y,l.s);
    if(!l.t || l.t==="aucune") delete m.limites[k];
    else m.limites[k]=l.t;
  });
  // formats antérieurs : openings = plus de limite, walls = un mur
  (q.openings||[]).forEach(o=>{ delete m.limites[cle(o.x,o.y,o.s)]; });
  (q.walls   ||[]).forEach(w=>{ m.limites[cle(w.x,w.y,w.s)]="mur"; });
  // ancien format accepté : une porte marquée `crypt` devient une trappe
  m.cryptDoors=(q.cryptDoors||[]).map(d=>({x:d.x,y:d.y,color:d.color}))
    .concat((q.doors||[]).filter(d=>d.crypt).map(d=>({x:d.x,y:d.y,color:d.crypt})));
  m.spawns=(q.spawns||[]).map(p=>({x:p.x,y:p.y,color:p.color||"red",side:p.side||"n"}));
  m.objectives=(q.objectives||[]).map(p=>{
    const o = p.hidden ? {x:p.x,y:p.y,hidden:true} : {x:p.x,y:p.y,color:p.color||"red"};
    if(p.name) o.name = p.name;
    return o;
  });
  m.zombies=(q.zombies||[]).map(z=>({x:z.x,y:z.y,t:z.t,n:Math.max(1,z.n|0||1)}));
  m.items=(q.items||[]).map(i=>({x:i.x,y:i.y,id:i.id}));
  m.cryptItems={}; Object.entries(q.cryptItems||{}).forEach(([c,l])=>m.cryptItems[c]=[...l]);
  m.cryptPool=[...(q.cryptPool||[])];
  m.markers=(q.markers||[]).filter(k=>MARQUEURS[k.t]).map(k=>({x:k.x,y:k.y,t:k.t}));
  m.hiddenBacks=[...(q.hiddenBacks||[])];
  m.locks={spawns:{...((q.locks||{}).spawns||{})}, doors:{...((q.locks||{}).doors||{})},
           spawnsOff:{...((q.locks||{}).spawnsOff||{})}};
  m.rules={...(q.rules||{})};
  m.objEffects={};
  Object.entries(q.objEffects||{}).forEach(([c,l])=>m.objEffects[c]=(l||[]).map(e=>({...e})));
  /* Un `win` fourni fait foi : sans objectif déclaré, la mission n'a aucune
     condition préalable. L'ancienne forme `need` (une seule condition) est
     relue comme un objectif unique. */
  m.win = q.win
    ? {exit: q.win.exit || "all", mode: q.win.mode==="any" ? "any" : "all",
       goals: Array.isArray(q.win.goals)
         ? q.win.goals.map(g=>({label:g.label||"",
             need: Array.isArray(g.need) ? [...g.need] : (g.need?[g.need]:[])}))
             .filter(g=>g.need.length)
         : (q.win.need ? [{label:"", need:[q.win.need]}] : [])}
    : {goals:[{label:"", need:["objectives:all"]}], exit:"all", mode:"all"};
  /* Les intitulés des objectifs redeviennent des noms de déclencheurs, et les
     couleurs d'Objectif posées reprennent leur place à gauche. */
  (m.win.goals||[]).forEach(g=>(g.need||[]).forEach(c=>{ if(g.label) m.trigNames[c]=g.label; }));
  m.objectives.filter(o=>!o.hidden).forEach(o=>{
    const d="objective:"+(o.color||"red");
    if(!m.triggers.includes(d)) m.triggers.push(d);
  });
  m.tiles = {...(q.tiles||{})};
  m.start=q.start?{x:q.start.x,y:q.start.y}:null;
  m.exit=q.exit?{x:q.exit.x,y:q.exit.y,side:q.exit.side||"n"}:null;
  return m;
}
function questSource(){
  const q=toQuest(), pt=p=>`{x:${p.x},y:${p.y}}`;
  const L=[];
  L.push(`  name:${JSON.stringify(q.name)},`);
  L.push(`  description:${JSON.stringify(q.description||"")},`);
  L.push(`  goal:${JSON.stringify(q.goal)},`);
  L.push(`  W:${q.W}, H:${q.H},`);
  L.push(`  map:[`);
  L.push(q.map.map(r=>'    "'+r+'"').join(",\n"));
  L.push(`  ],`);
  L.push(`  doors:[ ${q.doors.map(d=>`{x:${d.x},y:${d.y},s:"${d.s}",color:"${d.color}"${d.open?",open:true":""}}`).join(", ")} ],`);
  L.push(`  cryptDoors:[ ${q.cryptDoors.map(d=>`{x:${d.x},y:${d.y},color:"${d.color}"}`).join(", ")} ],`);
  L.push(`  spawns:[ ${q.spawns.map(p=>`{x:${p.x},y:${p.y},color:"${p.color}",side:"${p.side}"}`).join(", ")} ],`);
  L.push(`  start:${pt(q.start||{x:0,y:0})},`);
  L.push(`  exit:${q.exit?`{x:${q.exit.x},y:${q.exit.y},side:"${q.exit.side||"n"}"}`:"null"},`);
  const fin=[];
  fin.push(`  objectives:[ ${q.objectives.map(o=>o.hidden?`{x:${o.x},y:${o.y},hidden:true}`:`{x:${o.x},y:${o.y},color:"${o.color}"}`).join(", ")} ]`);
  if(q.limits) fin.push(`  limits:${JSON.stringify(q.limits)}`);
  if(q.zombies) fin.push(`  zombies:${JSON.stringify(q.zombies)}`);
  if(q.items) fin.push(`  items:${JSON.stringify(q.items)}`);
  if(q.cryptItems) fin.push(`  cryptItems:${JSON.stringify(q.cryptItems)}`);
  if(q.cryptPool)  fin.push(`  cryptPool:${JSON.stringify(q.cryptPool)}`);
  if(q.markers)    fin.push(`  markers:${JSON.stringify(q.markers)}`);
  if(q.hiddenBacks) fin.push(`  hiddenBacks:${JSON.stringify(q.hiddenBacks)}`);
  if(q.locks)       fin.push(`  locks:${JSON.stringify(q.locks)}`);
  if(q.rules)       fin.push(`  rules:${JSON.stringify(q.rules)}`);
  if(q.objEffects)  fin.push(`  objEffects:${JSON.stringify(q.objEffects)}`);
  fin.push(`  win:${JSON.stringify(q.win)}`);
  // décor : quelles tuiles composent le plateau (ignoré par les règles)
  if(q.tiles) fin.push(`  tiles:${JSON.stringify(q.tiles)}`);
  return "const DEFAULT_QUEST = {\n" + L.join("\n") + "\n" + fin.join(",\n") + "\n};";
}

/* Objectifs de mission : une liste, tous requis, « dans l'ordre que vous
   voulez ». Chacun porte un intitulé libre et une ou plusieurs conditions,
   toutes nécessaires — de quoi écrire « Tuez au moins une Abomination ET un
   Nécromancien » en un seul objectif. */
/* Les déclencheurs affichés à gauche du graphe. On les choisit ici : tout
   afficher rendrait la colonne illisible dès qu'une carte porte plusieurs
   Objectifs. Un déclencheur déjà branché reste visible même s'il n'est plus
   coché — sinon on perdrait de vue un lien existant. */
function carteDeclencheurs(p){
  const c=el("div","card"); c.appendChild(el("h3",null,"Déclencheurs"));
  c.appendChild(el("div","hint",
    "Ce qui apparaît dans la colonne de gauche du graphe. Ajoute ceux dont tu as besoin, "+
    "puis relie-les à une porte, une Zone d'Invasion ou la Victoire."));
  M.triggers = M.triggers || [];
  const possibles = declencheursPossibles();
  const affiches = possibles.filter(n=>M.triggers.includes(n.id) || declencheurUtilise(n.id));

  if(!affiches.length) c.appendChild(el("div","hint","Aucun pour l'instant."));
  M.trigNames = M.trigNames || {};
  affiches.forEach(n=>{
    const bloc=el("div"); bloc.style.cssText=
      "margin-top:6px;padding:6px 7px;border:1px solid var(--line);border-radius:6px";
    const r=el("div","row");
    r.appendChild(el("span","hint","• "+n.titre+" — "+n.detail
      +(declencheurUtilise(n.id)?" · branché":"")));
    r.appendChild(btn("✕", ()=>{
      M.triggers = M.triggers.filter(x=>x!==n.id);
      if(declencheurUtilise(n.id))
        say("Ce déclencheur reste affiché : il est encore branché.","err");
      render(); },"danger"));
    bloc.appendChild(r);
    /* L'intitulé est celui que le joueur lira : « Terrasser la bête et son
       maître ». Deux déclencheurs de même nom forment UN objectif exigeant les
       deux — c'est ce qui donne le ET à l'intérieur d'un OU. */
    const ri=el("div","row"); ri.style.marginTop="3px";
    const inp=document.createElement("input"); inp.style.flex="1";
    inp.placeholder="Intitulé — ex. « Terrasser la bête et son maître »";
    inp.value=M.trigNames[n.id]||"";
    inp.oninput=e=>{ const v=e.target.value.trim();
                     if(v) M.trigNames[n.id]=v; else delete M.trigNames[n.id];
                     majIntitules(); };
    inp.onblur=()=>render();
    ri.appendChild(inp);
    bloc.appendChild(ri);
    c.appendChild(bloc);
  });

  const reste = possibles.filter(n=>!M.triggers.includes(n.id) && !declencheurUtilise(n.id));
  if(reste.length){
    const ra=el("div","row"); ra.style.marginTop="6px";
    const sel=document.createElement("select"); sel.style.flex="1";
    reste.forEach(n=>{ const o=document.createElement("option");
      o.value=n.id; o.textContent=n.titre+" — "+n.detail; sel.appendChild(o); });
    ra.appendChild(sel);
    ra.appendChild(btn("+ Ajouter", ()=>{
      if(!M.triggers.includes(sel.value)) M.triggers.push(sel.value);
      render(); },"prim"));
    c.appendChild(ra);
  }
  p.appendChild(c);
}

function carteReglesSpeciales(p){
  const c=el("div","card"); c.appendChild(el("h3",null,"Règles spéciales"));
  c.appendChild(el("div","hint","Ce que la fiche de quête ajoute aux règles de base."));

  M.rules = M.rules || {};
  Object.entries(REGLES_GLOBALES).forEach(([k,lib])=>{
    const l=el("label","chk"); l.style.display="flex"; l.style.gap="6px";
    l.style.alignItems="flex-start"; l.style.marginTop="6px"; l.style.cursor="pointer";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!M.rules[k];
    cb.onchange=e=>{ M.rules[k]=e.target.checked; render(); };
    l.appendChild(cb); l.appendChild(el("span",null,lib));
    c.appendChild(l);
  });

  c.appendChild(el("div","hint","— Effets déclenchés en récupérant un Objectif —"));
  const cols=[...couleursDisponibles()];
  if(!cols.length){
    c.appendChild(el("div","hint","Aucune couleur d'Objectif sur la carte pour l'instant."));
    p.appendChild(c); return;
  }
  M.objEffects = M.objEffects || {};
  cols.forEach(col=>{
    const liste = M.objEffects[col] = M.objEffects[col] || [];
    const t=el("div","hint","Objectif "+colM(col)+" :");
    t.style.color=colCss(col); t.style.marginTop="8px"; c.appendChild(t);

    liste.forEach((ef,i)=>{
      const r=el("div","row");
      r.appendChild(el("span","hint","• "+texteEffet(ef)));
      r.appendChild(btn("✕", ()=>{ liste.splice(i,1); render(); },"danger"));
      c.appendChild(r);
    });

    // composition d'un nouvel effet
    const etat = efNouv[col] = efNouv[col] || {t:"xp", n:5, id:"torch"};
    const r=el("div","row"); r.style.marginTop="4px";
    const sel=document.createElement("select"); sel.style.flex="1";
    EFFETS_ORDRE.forEach(k=>{ const o=document.createElement("option");
      o.value=k; o.textContent=EFFETS_OBJ[k].n; if(etat.t===k) o.selected=true; sel.appendChild(o); });
    sel.onchange=e=>{ etat.t=e.target.value; render(); };
    r.appendChild(sel);
    if(EFFETS_OBJ[etat.t].val==="nombre"){
      const nb=document.createElement("input"); nb.type="number"; nb.min=1; nb.max=99;
      nb.value=etat.n; nb.style.width="58px";
      nb.oninput=e=>{ etat.n=Math.max(1, parseInt(e.target.value)||1); };
      r.appendChild(nb);
    }
    if(EFFETS_OBJ[etat.t].val==="liste"){
      etat.ids = etat.ids || [];
      const se=document.createElement("select"); se.style.flex="1";
      EQUIP_ED.forEach(e2=>{ const o=document.createElement("option");
        o.value=e2.id; o.textContent=e2.n; if(etat.id===e2.id) o.selected=true; se.appendChild(o); });
      se.onchange=e=>{ etat.id=e.target.value; };
      r.appendChild(se);
      r.appendChild(btn("＋", ()=>{ etat.ids.push(etat.id||EQUIP_ED[0].id); render(); }));
    }
    if(EFFETS_OBJ[etat.t].val==="equip"){
      const se=document.createElement("select"); se.style.flex="1";
      EQUIP_ED.forEach(e2=>{ const o=document.createElement("option");
        o.value=e2.id; o.textContent=e2.n; if(etat.id===e2.id) o.selected=true; se.appendChild(o); });
      se.onchange=e=>{ etat.id=e.target.value; };
      r.appendChild(se);
    }
    const bAdd=btn("Ajouter", ()=>{
      const ef={t:etat.t};
      if(ef.t==="xp") ef.n=Math.max(1, etat.n|0);
      if(ef.t==="equip") ef.id=etat.id;
      if(ef.t==="draw"){ ef.ids=[...(etat.ids||[])]; etat.ids=[]; }
      liste.push(ef); render();
    });
    if(etat.t==="draw" && !(etat.ids||[]).length) bAdd.disabled=true;
    r.appendChild(bAdd);
    c.appendChild(r);
    if(etat.t==="draw"){
      c.appendChild(el("div","hint", (etat.ids||[]).length
        ? "Liste en cours : "+etat.ids.map(eqNom).join(", ")
        : "Compose la liste avec ＋, puis Ajouter. Une seule carte en sera tirée, au hasard, à chaque partie."));
      if((etat.ids||[]).length){
        const rv=el("div","row");
        rv.appendChild(btn("Vider la liste", ()=>{ etat.ids=[]; render(); },"danger"));
        c.appendChild(rv);
      }
    }
  });
  c.appendChild(el("div","hint","Les effets d'une couleur se résolvent dans l'ordre affiché, en plus des 5 XP habituels de l'Objectif."));
  p.appendChild(c);
}

/* ==========================================================================
   ÉCRIRE DANS LE DOSSIER DES MISSIONS
   Un navigateur n'écrit pas où il veut. Là où l'API File System Access existe
   (Chrome, Edge), on désigne le dossier zombicide_missions UNE FOIS : ensuite
   l'éditeur y dépose le fichier de mission ET met à jour missions.js tout seul.
   Ailleurs, il reste le téléchargement, à déposer et déclarer à la main.
   ========================================================================== */
const FSA_DIR = typeof window.showDirectoryPicker === "function";
let dossierMissions = null;

function idbMission(op, val){
  return new Promise(res=>{
    let rq; try{ rq=indexedDB.open("zbp-editeur",1); }catch(e){ return res(null); }
    rq.onupgradeneeded = ()=>rq.result.createObjectStore("h");
    rq.onerror = ()=>res(null);
    rq.onsuccess = ()=>{
      let st; try{ st=rq.result.transaction("h", op==="get"?"readonly":"readwrite").objectStore("h"); }
      catch(e){ return res(null); }
      const r = op==="get" ? st.get("missions") : (val ? st.put(val,"missions") : st.delete("missions"));
      r.onsuccess=()=>res(op==="get"?r.result:true);
      r.onerror=()=>res(null);
    };
  });
}
async function lierDossierMissions(){
  try{
    const h = await window.showDirectoryPicker({mode:"readwrite"});
    dossierMissions = h; await idbMission("put", h);
    say(`Dossier « ${h.name} » lié : les missions s'y enregistreront.`,"ok");
  }catch(e){
    if(e.name!=="AbortError") say("Liaison impossible : "+e.message,"err");
  }
  render();
}
async function accesDossier(){
  if(!dossierMissions) return false;
  const ok = await dossierMissions.queryPermission({mode:"readwrite"}) === "granted"
          || await dossierMissions.requestPermission({mode:"readwrite"}) === "granted";
  return ok;
}
async function ecrireFichier(dir, nom, contenu){
  const f = await dir.getFileHandle(nom, {create:true});
  const w = await f.createWritable();
  await w.write(contenu); await w.close();
}
/* missions.js n'est qu'une liste de noms de fichiers : on la relit, on y ajoute
   le nôtre s'il manque, et on la réécrit. Éditer ce fichier à la main était le
   pas de trop. */
async function majCatalogue(dir, nomFichier){
  let liste = [];
  try{
    const f = await dir.getFileHandle("missions.js");
    const txt = await (await f.getFile()).text();
    const m = /\[([\s\S]*?)\]/.exec(txt);
    if(m) liste = (m[1].match(/"[^"]+"|'[^']+'/g)||[]).map(x=>x.slice(1,-1));
  }catch(e){ /* pas encore de catalogue : on le crée */ }
  const neuf = !liste.includes(nomFichier);
  if(neuf) liste.push(nomFichier);
  const contenu = [
    "/* Catalogue des missions — tenu à jour par zombicide-editor.html.",
    "   Un navigateur ne peut pas lister un dossier : cette liste lui dit quoi charger. */",
    "window.ZBP_MISSION_FILES = [",
    ...liste.map((n,i)=>`  ${JSON.stringify(n)}${i<liste.length-1?",":""}`),
    "];", ""].join(String.fromCharCode(10));
  await ecrireFichier(dir, "missions.js", contenu);
  return {neuf, total:liste.length};
}

/* Contenu d'un fichier de mission. En .js la quête s'annonce elle-même : une
   seule source de vérité, et le menu la voit même sans serveur. Le .json reste
   utile comme échange. */
function contenuMission(q, ext){
  if(ext!=="js") return JSON.stringify(q,null,1);
  const NL = String.fromCharCode(10);
  const corps = JSON.stringify(q,null,1).split(NL).join(NL+"  ");
  return [
    "/* Mission Zombicide — dossier zombicide_fichiers/zombicide_missions/ */",
    "ZBP_MISSION({name:"+JSON.stringify(q.name||"Ma mission")+",",
    "  quest:"+corps+"});", ""].join(NL);
}

function nomFichierMission(nom, ext){
  const base=(nom||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  return (base||"ma-mission")+"."+(ext||"js");
}

  const enregistrerDansDossier = async ()=>{

  const enregistrer=(ext)=>{

    /* En .js la quête s'annonce elle-même : une seule source de vérité, et le
       menu la voit même sans serveur. Le .json reste utile comme échange. */
    const contenu = contenuMission(q, ext);

    const u=URL.createObjectURL(blob), a=document.createElement("a");

  const decl=el("textarea"); decl.readOnly=true; decl.style.height="40px";

  c6.appendChild(decl);

  c6.appendChild(el("div","hint","« Code JS » produit le bloc à coller dans zombicide.html à la place de DEFAULT_QUEST. « JSON » sert à sauvegarder / réimporter ici."));
  p.appendChild(c6);

function resize(W,H){
  W=Math.max(3,Math.min(20,W)); H=Math.max(3,Math.min(20,H));
  const n=blank(W,H); n.name=M.name; n.goal=M.goal; n.description=M.description;
  n.hiddenBacks=[...M.hiddenBacks]; n.locks=M.locks;
  n.triggers=[...(M.triggers||[])]; n.trigNames={...(M.trigNames||{})};
  n.win={exit:M.win.exit, mode:M.win.mode||"all",
         goals:(M.win.goals||[]).map(g=>({label:g.label, need:[...g.need]}))};
  n.rules={...(M.rules||{})};
  n.objEffects={}; Object.entries(M.objEffects||{}).forEach(([c,l])=>n.objEffects[c]=l.map(e=>({...e})));
  n.tiles={}; Object.entries(M.tiles||{}).forEach(([k,v])=>{
    const [tx,ty]=k.split(",").map(Number);
    if(tx*3<W && ty*3<H) n.tiles[k]=v; });
  for(let y=0;y<Math.min(H,M.H);y++) for(let x=0;x<Math.min(W,M.W);x++) n.cells[y*W+x]=ch(x,y);
  /* Les cases de Bâtiment qui se retrouvent au nouveau bord doivent y retrouver
     un mur : sans ça, agrandir puis rétrécir ouvrirait le bâtiment sur le vide. */
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(n.cells[y*W+x]===".") continue;
    if(x===W-1) n.limites[(x)+","+y+",e"]="mur";
    if(y===H-1) n.limites[x+","+(y)+",s"]="mur";
  }
  const keep=p=>p&&p.x<W&&p.y<H?p:null;
  n.doors=M.doors.filter(d=>d.x<W&&d.y<H);
  n.limites={}; Object.entries(M.limites||{}).forEach(([k,t])=>{
    const [wx,wy]=k.split(",").map(Number);
    if(wx<W && wy<H) n.limites[k]=t; });
  n.cryptDoors=M.cryptDoors.filter(d=>d.x<W&&d.y<H);
  n.spawns=M.spawns.filter(p=>p.x<W&&p.y<H);
  n.objectives=M.objectives.filter(p=>p.x<W&&p.y<H);
  n.zombies=M.zombies.filter(p=>p.x<W&&p.y<H);
  n.items=M.items.filter(p=>p.x<W&&p.y<H);
  n.cryptItems=JSON.parse(JSON.stringify(M.cryptItems||{}));
  n.cryptPool=[...(M.cryptPool||[])];
  n.markers=(M.markers||[]).filter(k=>k.x<W&&k.y<H);
  n.start=keep(M.start); n.exit=keep(M.exit);
  M=n; render();
}
