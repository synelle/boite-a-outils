  return x+","+y+","+s;
}
const tLim   = (t,x,y,s)=>(t.limites||{})[cleMurT(x,y,s)]||null;
const tPose  = (t,x,y,s,ty)=>{ (t.limites=t.limites||{})[cleMurT(x,y,s)]=ty||"mur"; };
const tOte   = (t,x,y,s)=>{ if(t.limites) delete t.limites[cleMurT(x,y,s)]; };
const tIn    = (x,y)=>x>=0&&y>=0&&x<3&&y<3;

/* Ancien format (lettres + openings) → nouveau (cases + murs explicites).
   Le mur se déduisait des lettres : on fige cette déduction une fois pour
   toutes, puis on rouvre les arêtes qui étaient déclarées comme ouvertures. */
function migrerTuile(t){
  if(!t || !t.cells) return t;
  if(t.limites) return t;                       // déjà au format « limites typées »
  if(t.walls){                                  // format intermédiaire : murs binaires
    const nt={cells:[...t.cells], limites:{}};
    Object.keys(t.walls).forEach(k=>{ nt.limites[k]="mur"; });
    return nt;
  }
  const anc=t.cells;                            // format d'origine : lettres + ouvertures
  const nt={cells:anc.map(c=>c==="."?".":BAT), limites:{}};
  for(let y=0;y<3;y++) for(let x=0;x<3;x++) for(const s of SIDES){
    const nx=x+DXY[s][0], ny=y+DXY[s][1];
    const mur = !tIn(nx,ny) ? anc[y*3+x]!=="."          // bord : mur si bâtiment
                            : anc[y*3+x]!==anc[ny*3+nx];
    if(mur) nt.limites[cleMurT(x,y,s)]="mur";
  }
  (t.openings||[]).forEach(o=>{ delete nt.limites[cleMurT(o.x,o.y,o.s)]; });
  return nt;
}
/* Vue Tuiles : taille de la boîte d'édition (zoom) et opacité des repères. */
const TZ_MIN=260, TZ_MAX=1040, TZ_DEF=390, TZ_PAS=90;
let tileZoom=TZ_DEF, tileAlpha=0.55;

function chargerTuiles(){
  try{ const b=localStorage.getItem("zbp_tiles"); if(b) TILES=JSON.parse(b)||{}; }catch(e){ TILES={}; }
  /* Deux migrations successives du format de tuile :
     1. portes colorées → ouvertures (la couleur se choisit sur la carte) ;
     2. lettres + ouvertures → cases + murs explicites (les murs font foi). */
  Object.values(TILES).forEach(t=>{
    if(t && t.doors && !t.openings){
      t.openings=t.doors.map(d=>({x:d.x,y:d.y,s:d.s}));
      delete t.doors;
    }
  });
  Object.keys(TILES).forEach(k=>{ TILES[k]=migrerTuile(TILES[k]); });
}
/* --------------------------------------------------------------------------
   BIBLIOTHÈQUE VERSIONNÉE
   Pour qu'un dépôt cloné parte avec des tuiles déjà décrites, la bibliothèque
   peut vivre dans un fichier : zombicide_fichiers/tuiles_zombicide/zombicide-tuiles.json
   — celui que produit « Exporter ». Il n'est lisible qu'en http:// ; un
   navigateur refuse de lire un fichier voisin depuis une page file://.

   Arbitrage : le fichier ne s'installe QUE si ce navigateur n'a pas déjà sa
   propre bibliothèque, pour ne jamais écraser un travail en cours. Un bouton
   permet de le charger explicitement. */
const TUILES_FICHIER = TILE_DIR + "zombicide-tuiles.json";
let tuilesDuFichier = null;              // contenu lu, en attente d'adoption
let tuilesOrigine = "navigateur";        // d'où vient la bibliothèque affichée
function adopterTuiles(src){
  TILES = {};
  Object.entries(src).forEach(([k,v])=>{ TILES[k]=migrerTuile(v); });
  enregistrerTuiles();
}
async function chargerTuilesFichier(cb){
  try{
    const r = await fetch(TUILES_FICHIER);
    if(r.ok){
      const j = await r.json();
      if(j && typeof j==="object"){
        tuilesDuFichier = j;
        if(!Object.keys(TILES).filter(k=>tuileDefinie(k)).length){
          adopterTuiles(j); tuilesOrigine = "fichier";
        }
      }
    }
  }catch(e){ /* file:// ou fichier absent : la bibliothèque locale reste */ }
  cb && cb();
}
/* Provenance de la bibliothèque + reprise explicite de celle du dépôt. */
function infosBibliotheque(c){
  c.appendChild(el("div","hint","Chargée depuis : "+
    (tuilesOrigine==="fichier" ? "le fichier du dépôt" : "ce navigateur")+"."));
  if(tuilesDuFichier){
    if(tuilesOrigine!=="fichier"){
      const nbF=Object.values(tuilesDuFichier).filter(t=>t&&t.cells).length;
      const rf=el("div","row");
      rf.appendChild(btn(`Charger le fichier du dépôt (${nbF})`, ()=>{
        adopterTuiles(tuilesDuFichier); tuilesOrigine="fichier";
        render(); say("Bibliothèque du dépôt chargée.","ok"); },"danger"));
      c.appendChild(rf);
      c.appendChild(el("div","hint","Remplace la bibliothèque de ce navigateur."));
    }
  } else {
    c.appendChild(el("div","hint","Aucun fichier de dépôt lu — attendu en ouvrant la page d'un double-clic, sa lecture exigeant http. Pour la versionner : « Exporter », puis dépose le fichier dans zombicide_fichiers/tuiles_zombicide/ sous le nom zombicide-tuiles.json."));
  }
}
function enregistrerTuiles(){
  try{ localStorage.setItem("zbp_tiles", JSON.stringify(TILES)); }catch(e){}
}
/* Réglages d'affichage de la vue Tuiles — confort de travail, sans rapport
   avec le contenu des tuiles, d'où une clé de stockage distincte. */
function chargerVueTuile(){

    if(v){
      if(v.zoom)  tileZoom =Math.max(TZ_MIN,Math.min(TZ_MAX, v.zoom));

}
const tuileDefinie = id => !!(TILES[id] && TILES[id].cells);
function tuileVide(){ return {cells:new Array(9).fill("."), limites:{}}; }

/* Rotation d'une tuile par quarts de tour horaires : la case (x,y) va en
   (2-y, x) et chaque côté tourne avec elle. */
/* Aperçu d'une tuile telle qu'elle sera POSÉE : l'illustration tournée de
   l'angle choisi, et par-dessus les limites déclarées, à la même convention
   qu'en jeu (mur plein, ouverture percée). Cela permet de vérifier d'un coup
   d'œil que l'orientation tombe juste avant de cliquer la carte. */
function apercuTuile(id, rot, px){
  const base = TILES[id];
  const box = document.createElement("div");
  box.style.cssText = `width:${px}px;height:${px}px;position:relative;flex:0 0 auto;`+
    `border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#14110f`;
  if(!base) return box;
  const t = tuileTournee(base, rot);
  const im = document.createElement("div");
  im.style.cssText = `position:absolute;inset:0;background:url("${tileImg(id)}") center/cover no-repeat;`+
    `transform:rotate(${((rot%4)+4)%4*90}deg)`;
  box.appendChild(im);

  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 300 300");
  svg.setAttribute("preserveAspectRatio","none");
  svg.style.cssText="position:absolute;inset:0;width:100%;height:100%";
  const trait=(x1,y1,x2,y2)=>{
    const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",x1); l.setAttribute("y1",y1);
    l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    l.setAttribute("stroke","#f0d9a0"); l.setAttribute("stroke-width","7");
    l.setAttribute("stroke-linecap","square");
    svg.appendChild(l);
  };
  const U=100, p=(k,lo,hi)=>lo+(hi-lo)*k;
  for(let y=0;y<3;y++) for(let x=0;x<3;x++) for(const sd of tCotes(x,y)){
    const ty = tLim(t,x,y,sd);
    if(!ty) continue;
    const X=x*U, Y=y*U;
    const seg = {n:[X,Y,X+U,Y], w:[X,Y,X,Y+U],
                 e:[X+U,Y,X+U,Y+U], s:[X,Y+U,X+U,Y+U]}[sd];
    const [a,b,c,d]=seg;
    if(ty==="ouverture"){
      trait(a, b, p(.30,a,c), p(.30,b,d));
      trait(p(.70,a,c), p(.70,b,d), c, d);
    } else trait(a,b,c,d);
  }
  box.appendChild(svg);
  return box;
}

function tuileTournee(t, rot){
  let cells=[...t.cells], limites={...(t.limites||{})};
  const ROT={n:"e",e:"s",s:"w",w:"n"};
  for(let k=0;k<((rot%4)+4)%4;k++){
    const nc=new Array(9);
    for(let y=0;y<3;y++) for(let x=0;x<3;x++) nc[x*3+(2-y)]=cells[y*3+x];
    cells=nc;
    const nl={};
    for(let y=0;y<3;y++) for(let x=0;x<3;x++) for(const s of SIDES){
      const ty=limites[cleMurT(x,y,s)];
      if(ty) nl[cleMurT(2-y, x, ROT[s])]=ty;
    }
    limites=nl;
  }
  return {cells, limites};
}

/* ==========================================================================
   VUE LOGIQUE — graphe nodal des conditions de quête
   Colonne de gauche : les conditions (Objectifs récupérés).
   Colonne de droite  : ce qu'elles commandent (portes, Invasions, Mission).
   Un lien = « cette condition débloque cette cible ». Chaque cible n'accepte
   qu'une condition : relier une nouvelle source remplace l'ancienne.
   Les Zones d'Invasion ont deux entrées : ACTIVE et DÉSACTIVE (spawnsOff).
   ========================================================================== */
let view = "map";          // map | logic
let linkFrom = null;       // source en cours de branchement

/* Couleurs d'Objectif qu'un Survivant peut réellement récupérer :
   les Objectifs visibles, les versos déclarés, et ROUGE dès qu'un Objectif
   caché n'a pas de verso — le jeu lui en attribue un rouge par défaut. */
function couleursDisponibles(){
  const d = new Set(M.objectives.filter(o=>!o.hidden).map(o=>o.color).concat(M.hiddenBacks));
  if(M.objectives.filter(o=>o.hidden).length > M.hiddenBacks.length) d.add("red");
  return d;
}
/* Catalogue des déclencheurs POSSIBLES. Le graphe n'en montre qu'une partie :
   voir graphNodes(). */
function declencheursPossibles(){
  const dispo = couleursDisponibles();
  const src = OBJ_COLORS.filter(c=>dispo.has(c)).map(c=>({
    id:"objective:"+c, color:c, titre:"Objectif "+colM(c),
    detail:(()=>{
      const vis=M.objectives.filter(o=>!o.hidden&&o.color===c).length;
      let cach=M.hiddenBacks.filter(x=>x===c).length;
      const sansVerso=M.objectives.filter(o=>o.hidden).length - M.hiddenBacks.length;
      if(c==="red" && sansVerso>0) cach+=sansVerso;      // versos par défaut
      return `${vis} visible(s), ${cach} caché(s)`;
    })()}));
  /* Un Objectif NOMMÉ est une condition à part entière : il peut commander une
     porte ou une Zone d'Invasion, pas seulement la Victoire. */
  M.objectives.filter(o=>o.name).forEach(o=>src.push({
    id:"objective:named:"+cleObj(o.name),
    color:o.hidden ? "grey" : (o.color||"red"),
    titre:o.name,
    detail:`Objectif ${o.hidden?"caché":colM(o.color||"red")} en (${o.x+1},${o.y+1})`}));
  /* Chaque Objectif POSÉ est un déclencheur à part entière : « l'Objectif en
     (3,3) récupéré ». C'est ce qui manquait à gauche pour pouvoir le brancher
     sur une porte ou une Zone d'Invasion. */
  M.objectives.filter(o=>!o.name).forEach(o=>src.push({
    id:`objective:at:${o.x},${o.y}`,
    color:o.hidden ? "grey" : (o.color||"red"),
    titre:`Objectif (${o.x+1},${o.y+1})`,
    detail:o.hidden ? "caché — récupéré" : colM(o.color||"red")+" — récupéré"}));
  src.push({id:"objectives:all", color:"grey", titre:"Tous les Objectifs",
            detail:M.objectives.length+" au total"});
  /* Récupérer les deux Artefacts est un but atteignable seulement si la carte
     comporte des cryptes : sans crypte, ils n'entrent jamais en jeu. */
  if(cryptColorsUsed().length)
    src.push({id:"vault:all", color:"grey", titre:"Artefacts de crypte",
              detail:"les deux récupérés"});
  /* Chasse au Nécromancien / à l'Abomination : toujours proposées, un zombie
     pouvant arriver par une carte d'Invasion. */
  [["necromancer","Nécromancien tué","au moins un"],
   ["abomination","Abomination tuée","au moins une"]].forEach(([t,titre,detail])=>{
    const pose = M.zombies.some(z=>z.t===t);
    src.push({id:"kill:"+t, color:"grey", titre,
              detail: pose ? detail : detail+" — aucun sur la carte"});
  });
  /* Niveaux de Danger : atteignables dans toute partie. */
  [["yellow","Jaune"],["orange","Orange"],["red","Rouge"]].forEach(([k,n])=>
    src.push({id:"danger:"+k, color:k==="yellow"?"yellow":k,
              titre:"Niveau "+n, detail:"atteint par un Survivant"}));
  return src;
}
/* Un déclencheur déjà branché quelque part : il reste visible même s'il n'est
   plus dans la liste choisie, sinon on perdrait de vue un lien existant. */
const declencheurUtilise = c => (M.win.goals||[]).some(g=>(g.need||[]).includes(c))
  || ["doors","spawns","spawnsOff"].some(b=>Object.values(M.locks[b]||{}).includes(c));

function graphNodes(){
  /* Le graphe ne montre PAS tous les déclencheurs possibles — la colonne serait
     illisible. Seulement ceux ajoutés dans le panneau, plus ceux déjà branchés. */
  const retenu = id => (M.triggers||[]).includes(id) || declencheurUtilise(id);
  const src = declencheursPossibles().filter(n=>retenu(n.id));

  // cibles : seulement ce qui existe sur la carte
  const tgt = [];
  DOOR_COLORS.filter(c=>c!=="grey").forEach(c=>{
    const n=M.doors.filter(d=>d.color===c).length;
    if(n) tgt.push({id:"door:"+c, color:c, titre:"Portes "+colF(c)+"s",
                    detail:n+" porte(s) — verrouillées sans condition remplie", ports:1});
  });
  SPAWN_COLORS.forEach(c=>{
    const n=M.spawns.filter(x=>x.color===c).length;
    if(n) tgt.push({id:"spawn:"+c, color:c, titre:"Invasion "+colF(c),
                    detail:n+" pion(s)", ports:2});
  });
  tgt.push({id:"mission", color:"grey", titre:"VICTOIRE", detail:missionTexte(),
            ports:1, mission:true});
  return {src, tgt};
}
function graphLinks(){
  const L=[];
  Object.entries(M.locks.doors||{}).forEach(([c,v])=>{ if(v) L.push({from:v,to:"door:"+c,kind:"on"}); });
  Object.entries(M.locks.spawns||{}).forEach(([c,v])=>{ if(v) L.push({from:v,to:"spawn:"+c,kind:"on"}); });
  Object.entries(M.locks.spawnsOff||{}).forEach(([c,v])=>{ if(v) L.push({from:v,to:"spawn:"+c,kind:"off"}); });
  // un lien par condition citée dans un objectif de mission
  (M.win.goals||[]).forEach(g=>(g.need||[]).forEach(c=>
    L.push({from:c, to:"mission", kind:"on"})));
  return L;
}
function bucketOf(to, kind){
  if(to==="mission") return null;
  const t = to.split(":")[0];
  return t==="door" ? "doors" : (kind==="off" ? "spawnsOff" : "spawns");
}
/* Un intitulé modifié se répercute sur les objectifs déjà branchés : on les
   reconstruit depuis les conditions branchées et les noms courants, ce qui
   regroupe au passage celles qui portent désormais le même nom. */
function majIntitules(){
  const conds=[];
  (M.win.goals||[]).forEach(g=>(g.need||[]).forEach(c=>{ if(!conds.includes(c)) conds.push(c); }));
  const goals=[];
  conds.forEach(c=>{
    const nom=(M.trigNames||{})[c] || "";
    const jumeau = nom && goals.find(g=>g.label===nom);
    if(jumeau) jumeau.need.push(c); else goals.push({label:nom, need:[c]});
  });
  M.win.goals = goals;
}

function setLink(from, to, kind){
  if(to==="mission"){
    /* Chaque déclencheur branché sur VICTOIRE devient un objectif de quête.
       Deux déclencheurs de MÊME NOM n'en forment qu'un, exigeant les deux :
       c'est ainsi qu'on écrit « A OU (B ET C) » sans carte séparée. */
    M.win.goals = M.win.goals || [];
    if(M.win.goals.some(g=>(g.need||[]).includes(from))) return;
    const nom = (M.trigNames||{})[from] || "";
    const jumeau = nom && M.win.goals.find(g=>g.label===nom);
    if(jumeau) jumeau.need.push(from);
    else M.win.goals.push({label:nom, need:[from]});
    return;
  }
  const c = to.split(":")[1], b = bucketOf(to,kind);
  M.locks[b] = M.locks[b]||{}; M.locks[b][c] = from;
}
function clearLink(to, kind, from){
  if(to==="mission"){
    // sans source précisée (clic sur l'entrée), on retire tout
    if(!from){ M.win.goals = []; return; }
    M.win.goals = (M.win.goals||[]).map(g=>({...g, need:(g.need||[]).filter(c=>c!==from)}))
                                   .filter(g=>g.need.length);
    return;
  }
  const c = to.split(":")[1], b = bucketOf(to,kind);
  if(M.locks[b]) delete M.locks[b][c];
}
function linkOn(to, kind){
  // « rempli » dès qu'un objectif existe ; on rend sa première condition
  if(to==="mission"){
    const g=(M.win.goals||[]).find(x=>(x.need||[]).length);
    return g ? g.need[0] : null;
  }
  const c = to.split(":")[1], b = bucketOf(to,kind);
  return (M.locks[b]||{})[c] || null;
}

const NW=196, NH=58, GAPY=86, TOPY=28;
/* La colonne de droite se cale sur la place disponible : sur une fenêtre
   étroite elle se rapproche plutôt que de sortir de l'écran. */
function colonnes(){
  const w = document.getElementById("wrap");
  const dispo = (w ? w.clientWidth : 900) - 60;
  return [34, Math.max(NW+70, Math.min(470, dispo - NW))];
}
function nodePos(id, defaut){
  const p = (M.nodePos||{})[id];
  return p ? p : defaut;
}
function renderLogic(){
  const box=document.getElementById("logic");
  box.innerHTML="";
  const {src,tgt}=graphNodes();
  const COLX=colonnes(), pos={};
  src.forEach((n,i)=>pos[n.id]=nodePos(n.id,{x:COLX[0], y:TOPY+i*GAPY}));
  tgt.forEach((n,i)=>pos[n.id]=nodePos(n.id,{x:COLX[1], y:TOPY+i*GAPY}));
  // taille provisoire : les nœuds sont en position absolue, la redimensionner
  // ensuite ne les déplace pas.
  box.style.width=(COLX[1]+NW+34)+"px"; box.style.height="420px";

  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","links");
  box.appendChild(svg);                       // sous les nœuds

  const refPort={};                           // (id|kind) → élément du connecteur
  const refNode={};
  const faire=(n,role)=>{
    const d=document.createElement("div");
    d.className="gnode"+(n.mission?" mission":"")+(linkFrom===n.id?" sel":"");
    d.style.setProperty("--nc", colCss(n.color));
    d.style.left=pos[n.id].x+"px"; d.style.top=pos[n.id].y+"px";
    d.appendChild(el("div","t",n.titre));
    d.appendChild(el("div","d",n.detail));
    if(role==="src"){
      const port=el("div","port out");
      refPort[n.id+"|out"]=port;
      port.title="Cliquer, puis cliquer une entrée à droite";
      port.onclick=ev=>{ ev.stopPropagation();
        linkFrom = (linkFrom===n.id) ? null : n.id;
        say(linkFrom ? "Source « "+n.titre+" » — clique maintenant une entrée." : "");
        render(); };
      d.appendChild(port);
      d.onclick=()=>port.onclick({stopPropagation(){}});
    } else {
      const mk=(kind,cls,lbl)=>{
        const port=el("div","port in "+cls+(linkOn(n.id,kind)?" filled":"")+(kind==="off"?" off":""));
        refPort[n.id+"|"+kind]=port;
        if(lbl){ const t=el("span","lb",lbl); port.appendChild(t); }
        port.title = kind==="off" ? "Désactive quand la condition est remplie"
                                  : "Active / déverrouille quand la condition est remplie";
        port.onclick=ev=>{ ev.stopPropagation();
          if(!linkFrom){ if(linkOn(n.id,kind)){ clearLink(n.id,kind); say("Lien retiré."); render(); }
                         else say("Choisis d'abord une condition à gauche.","err");
                         return; }
          setLink(linkFrom, n.id, kind); linkFrom=null; say("Lien créé."); render(); };
        d.appendChild(port);
      };
      if((n.ports||1)>=2){ d.classList.add("two"); mk("on","two1","active"); mk("off","two2","désactive"); }
      else mk("on","","");
      if(n.mission){
        /* La combinaison des objectifs se règle ici : la carte séparée a
           disparu, le graphe se suffit à lui-même. */
        const buts=(M.win.goals||[]).filter(g=>(g.need||[]).length);
        if(buts.length>1){
          const rm=el("div","row"); rm.style.cssText="margin-top:4px;gap:3px";
          [["all","TOUS"],["any","UN SEUL"]].forEach(([k,lab])=>{
            const b=btn(lab, ev=>{ M.win.mode=k; render(); },
                        (M.win.mode||"all")===k?"on":"");
            b.style.cssText="font-size:10px;padding:1px 5px";
            b.onclick=ev=>{ ev.stopPropagation(); M.win.mode=k; render(); };
            rm.appendChild(b);
          });
          d.appendChild(rm);
        }
        const sel=document.createElement("select");
        sel.style.cssText="width:100%;font-size:11px;margin-top:4px;padding:1px 3px";
        Object.entries(EXIT_TXT).forEach(([v,t])=>{ const o=document.createElement("option");
          o.value=v; o.textContent=t; if(M.win.exit===v) o.selected=true; sel.appendChild(o); });
        sel.onclick=ev=>ev.stopPropagation();
        sel.onchange=ev=>{ M.win.exit=ev.target.value; render(); };
        d.appendChild(sel);
      }
    }
    rendreDeplacable(d, n.id);
    refNode[n.id]=d;
    box.appendChild(d);
  };
  src.forEach(n=>faire(n,"src"));
  tgt.forEach(n=>faire(n,"tgt"));

  /* Les nœuds sont posés : on mesure la géométrie RÉELLE des connecteurs plutôt
     que de la déduire d'une hauteur supposée — le contenu des nœuds varie. */
  /* Taille finale d'abord : la scène est centrée par `margin:auto`, donc
     redimensionner la boîte la déplace à l'écran. Mesurer l'origine avant le
     redimensionnement décalait tous les liens d'autant. */
  const dims=Object.values(refNode).map(n=>({d:n.offsetLeft+n.offsetWidth,
                                             b:n.offsetTop+n.offsetHeight}));
  const largeur=Math.max(COLX[1]+NW+34, ...dims.map(o=>o.d+34));
  const hauteur=Math.max(420, ...dims.map(o=>o.b+34));
  box.style.width=largeur+"px"; box.style.height=hauteur+"px";
  svg.setAttribute("width",largeur); svg.setAttribute("height",hauteur);
  svg.setAttribute("viewBox",`0 0 ${largeur} ${hauteur}`);

  // Origine du repère SVG relevée APRÈS le redimensionnement.
  const rSvg=svg.getBoundingClientRect();
  const centre=(id,kind)=>{
    const pt=refPort[id+"|"+kind];
    if(!pt) return null;
    const r=pt.getBoundingClientRect();
    return {x:r.left-rSvg.left+r.width/2, y:r.top-rSvg.top+r.height/2};
  };

  graphLinks().forEach(l=>{
    const a=centre(l.from,"out"), b=centre(l.to,l.kind);
    if(!a||!b) return;                        // lien orphelin : ignoré
    const dx=Math.max(40,(b.x-a.x)/2);
    const d=`M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
    const trait=document.createElementNS(NS,"path");
    trait.setAttribute("d",d); trait.setAttribute("class",l.kind);
    svg.appendChild(trait);
    const zone=document.createElementNS(NS,"path");   // zone de clic élargie
    zone.setAttribute("d",d); zone.setAttribute("class","hit");
    zone.style.pointerEvents="stroke";
    zone.onclick=()=>{ clearLink(l.to,l.kind,l.from); say("Lien retiré."); render(); };
    svg.appendChild(zone);
  });

  const aide=el("div"); aide.id="logicHint";
  aide.textContent = linkFrom
    ? "Clique une entrée (rond de gauche) d'un nœud de droite pour créer le lien."
    : "Clique un nœud de gauche pour choisir une condition, puis une entrée à droite. "+
      "Clique un lien ou une entrée déjà remplie pour la retirer. Les nœuds se déplacent au glisser.";
  box.appendChild(aide);
}
/* Déplacement d'un nœud ; la position n'est PAS exportée dans la quête. */
function rendreDeplacable(d, id){
  d.onpointerdown=ev=>{
    if(ev.target.closest(".port,select")) return;
    ev.preventDefault();
    const bx=document.getElementById("logic");
    const rb=bx.getBoundingClientRect();
    // origine = boîte INTÉRIEURE : `left`/`top` d'un enfant absolu s'y réfèrent,
    // sinon le nœud dérivait de l'épaisseur de bordure à chaque déplacement
    const box={left:rb.left+bx.clientLeft, top:rb.top+bx.clientTop};
    const r=d.getBoundingClientRect();
    const dx=ev.clientX-r.left, dy=ev.clientY-r.top;
    d.classList.add("drag"); d.setPointerCapture(ev.pointerId);
    let bougé=false;
    const move=e=>{
      bougé=true;
      const x=Math.max(0, e.clientX-box.left-dx), y=Math.max(0, e.clientY-box.top-dy);
      d.style.left=x+"px"; d.style.top=y+"px";
      M.nodePos=M.nodePos||{}; M.nodePos[id]={x:Math.round(x),y:Math.round(y)};
    };
    const up=()=>{ d.classList.remove("drag");
      d.removeEventListener("pointermove",move); d.removeEventListener("pointerup",up);
      if(bougé) render(); };
    d.addEventListener("pointermove",move); d.addEventListener("pointerup",up);
  };
}
function setView(v){
  view=v; linkFrom=null;
  document.body.classList.toggle("logicview", v==="logic");
  document.body.classList.toggle("tilesview", v==="tiles");
  document.getElementById("tabMap").classList.toggle("on", v==="map");
  document.getElementById("tabLogic").classList.toggle("on", v==="logic");
  document.getElementById("tabTiles").classList.toggle("on", v==="tiles");
  render();
}


/* ---------- pose d'une tuile sur la carte ----------
   Plus aucun remappage de lettres : une tuile pose des cases et des murs. Deux
   tuiles voisines dont les bords en vis-à-vis n'ont pas de mur forment une
   seule pièce, calculée après coup. C'est ce qui règle le bâtiment coupé en
   deux à la jointure.
   Sur une arête commune à deux tuiles, la DERNIÈRE posée fait foi ; l'outil
   Murs permet ensuite de rectifier à la main. */
const POOL_LETTRES="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789".split("");
/* Ce que la tuile posée à cet endroit déclare pour une arête, ou null si aucune
   tuile n'y est posée (case peinte à la main, ou emplacement vide). */
function limiteTuileEn(X,Y,s){
  const rec=(M.tiles||{})[Math.floor(X/3)+","+Math.floor(Y/3)];
  if(!rec) return null;
  const base=TILES[rec.id];
  if(!base || !base.cells) return null;
  const t=tuileTournee(base, rec.rot||0);
  return tLim(t, X-Math.floor(X/3)*3, Y-Math.floor(Y/3)*3, s);
}
/* Sur une arête, on réunit ce que déclarent les DEUX tuiles de part et d'autre.
   Une tuile de rue ne déclare rien sur son bord : son silence ne doit pas
   effacer le mur de la façade d'en face. Un mur l'emporte sur une ouverture,
   qui l'emporte sur rien — c'est ce qu'on voit en accolant deux plateaux. */
function limiteComposee(X,Y,s){
  const nx=X+DXY[s][0], ny=Y+DXY[s][1];
  const a=limiteTuileEn(X,Y,s);
  const b=IN(nx,ny) ? limiteTuileEn(nx,ny,OPP[s]) : null;
  if(a==="mur"||b==="mur") return "mur";
  if(a==="ouverture"||b==="ouverture") return "ouverture";
  if(a||b) return a||b;
  /* Silence des deux côtés. Entre un bâtiment et la rue, ça ne peut pas vouloir
     dire « rien » : une façade est murée par défaut, et une tuile de rue n'a
     rien à déclarer. Sans cette règle, la façade s'ouvrait toute seule à la
     jointure — c'est le prolongement du cas réglé pour un mur d'un seul côté.
     Deux Rues ou deux cases d'un même bâtiment restent, elles, sans limite. */
  const dedans = IN(nx,ny);
  const ici = estBat(ch(X,Y));
  const la  = dedans ? estBat(ch(nx,ny)) : false;
  if(!dedans) return ici ? "mur" : null;        // bord de plateau : façade murée
  if(ici!==la) return "mur";
  return null;
}
/* Réécrit les limites d'un bloc 3×3 d'après les tuiles réellement posées —
   la sienne et ses voisines. Appelé après pose comme après retrait, pour que
   les deux opérations donnent le même résultat. */
function recalculerLimitesBloc(tx,ty){
  const x0=tx*3, y0=ty*3;
  for(let y=0;y<3;y++) for(let x=0;x<3;x++) for(const s of SIDES){
    const X=x0+x, Y=y0+y, ty2=limiteComposee(X,Y,s);
    if(ty2) poseLimite(X,Y,s,ty2); else oteLimite(X,Y,s);
  }
}
function poserTuile(tx,ty,id,rot){
  const base=TILES[id];
  if(!base || !base.cells) return say("Cette tuile n'est pas encore configurée.","err");
  const t=tuileTournee(base, rot||0);
  const x0=tx*3, y0=ty*3;
  if(x0+3>M.W || y0+3>M.H) return say("La tuile déborde du plateau.","err");

  M.doors=M.doors.filter(d=>!(d.x>=x0&&d.x<x0+3&&d.y>=y0&&d.y<y0+3));
  for(let y=0;y<3;y++) for(let x=0;x<3;x++)
    M.cells[(y0+y)*M.W+(x0+x)] = t.cells[y*3+x]==="." ? "." : BAT;
  // enregistrer AVANT de recalculer : le bloc doit se voir lui-même
  M.tiles=M.tiles||{}; M.tiles[tx+","+ty]={id, rot:((rot%4)+4)%4};
  recalculerLimitesBloc(tx,ty);
  say(`Tuile ${tileNum(id)} posée${rot?" (rotation "+(rot*90)+"°)":""}.`,"ok");
}
function retirerTuile(tx,ty){
  const x0=tx*3, y0=ty*3;
  for(let y=0;y<3;y++) for(let x=0;x<3;x++) M.cells[(y0+y)*M.W+(x0+x)]=".";
  M.doors=M.doors.filter(d=>!(d.x>=x0&&d.x<x0+3&&d.y>=y0&&d.y<y0+3));
  if(M.tiles) delete M.tiles[tx+","+ty];
  // les murs des tuiles voisines qui bordent ce bloc doivent survivre
  recalculerLimitesBloc(tx,ty);
}

/* ---------- vue Tuiles : configuration d'une tuile 3×3 ---------- */
const tSide={n:[0,-1],e:[1,0],s:[0,1],w:[-1,0]};
/* Arêtes à parcourir pour une case de tuile : Nord et Ouest couvrent toutes les
   arêtes internes sans doublon, plus Est/Sud sur la dernière colonne/ligne. */
function tCotes(x,y){
  const l=["n","w"];
  if(x===2) l.push("e");
  if(y===2) l.push("s");
  return l;
}
/* Poser une case de Bâtiment la mure entièrement ; la remettre en Rue ne
   retire que les murs qui ne bordent plus de bâtiment. Même règle que la carte. */
function tSetCell(t,x,y,v){
  t.cells[y*3+x]=v;
  for(const s of SIDES){
    const nx=x+tSide[s][0], ny=y+tSide[s][1];
    const voisinBat = tIn(nx,ny) && estBat(t.cells[ny*3+nx]);
    if(estBat(v)) tPose(t,x,y,s,"mur");
    else if(!voisinBat) tOte(t,x,y,s);
  }
}

function renderTiles(){
  const box=document.getElementById("tiles");
  box.innerHTML="";
  const work=el("div"); work.id="tileWork";

  // --- éditeur 3×3 sur l'image ---
  const ed=el("div"); ed.id="tileEdit";
  ed.style.width=tileZoom+"px"; ed.style.height=tileZoom+"px";
  ed.style.setProperty("--ova", tileAlpha);
  if(tileSel){
    ed.style.backgroundImage=`url("${tileImg(tileSel)}")`;
    const t=TILES[tileSel] || tuileVide();
    for(let y=0;y<3;y++) for(let x=0;x<3;x++){
      const c=t.cells[y*3+x];
      const d=el("div","tc "+(c==="."?"rue":"bat"));
      d.style.left=(x*33.333)+"%"; d.style.top=(y*33.333)+"%";
      d.textContent = c==="." ? "·" : "▪";
      d.title = c==="." ? "Rue" : "Bâtiment";
      d.onclick=()=>{ if(tileMode!=="cells") return;
        tSetCell(t, x, y, estBat(c) ? "." : BAT);
        TILES[tileSel]=t; enregistrerTuiles(); render(); };
      ed.appendChild(d);
    }
    /* Murs déduits. Est et Sud se dessinent comme le Ouest / Nord de la case
       suivante : une seule formule pour les quatre côtés. */
    const U=33.333;
    const EP=Math.max(3, Math.round(tileZoom/98));   // épaisseur du mur, suit le zoom
    const trait=(x,y,side,cls)=>{
      const vert=(side==="w"||side==="e");
      const w=el("div", cls + (vert?" vert":""));    // .vert oriente le pointillé
      const px=(x+(side==="e"?1:0))*U, py=(y+(side==="s"?1:0))*U;
      w.style.cssText = vert
        ? `left:calc(${px}% - ${EP/2}px);top:${py}%;height:${U}%;width:${EP}px`
        : `left:${px}%;top:calc(${py}% - ${EP/2}px);width:${U}%;height:${EP}px`;
      ed.appendChild(w);
    };
    for(let y=0;y<3;y++) for(let x=0;x<3;x++) for(const side of tCotes(x,y)){
      const ty=tLim(t,x,y,side);
      if(ty) trait(x,y,side,"tw lim-"+ty);
      if(tileMode==="limites"){
        const h=el("div","teh");
        const vert=(side==="w"||side==="e");
        const bord=!tIn(x+tSide[side][0], y+tSide[side][1]);
        const px=(x+(side==="e"?1:0))*U, py=(y+(side==="s"?1:0))*U;
        const HB=Math.max(16, Math.round(tileZoom/22));  // zone cliquable, suit le zoom
        /* Sur un bord de tuile la zone cliquable est rentrée vers l'intérieur,
           pour rester dans l'image plutôt que de déborder autour. */
        const dec = bord ? (side==="e"||side==="s" ? `- ${HB}px` : "+ 0px") : `- ${HB/2}px`;
        h.style.cssText = vert
          ? `left:calc(${px}% ${dec});top:calc(${py}% + 6%);height:21%;width:${HB}px`
          : `left:calc(${px}% + 6%);top:calc(${py}% ${dec});width:21%;height:${HB}px`;
        h.className="teh"+(ty?"":" vide");
        h.title = ty===limiteType ? "Retirer cette limite"
                : (ty ? "Remplacer : "+LIMITES[ty].n+" → "+LIMITES[limiteType].n
                      : "Poser : "+LIMITES[limiteType].n);
        h.onclick=ev=>{ ev.stopPropagation();
          if(tLim(t,x,y,side)===limiteType) tOte(t,x,y,side);
          else tPose(t,x,y,side,limiteType);
          TILES[tileSel]=t; enregistrerTuiles(); render(); };
        ed.appendChild(h);
      }
    }
  } else {
    ed.style.display="grid"; ed.style.placeItems="center";
    ed.appendChild(el("div","hint","Choisis une tuile dans la galerie ci-dessous."));
  }
  work.appendChild(ed);

  box.appendChild(work);

  // --- galerie ---
  const gal=el("div"); gal.id="tileGal";
  TILE_IDS.forEach(id=>{
    const d=el("div","tg"+(id===tileSel?" on":"")+(tuileDefinie(id)?" faite":""));
    const im=document.createElement("img");
    im.src=tileImg(id); im.loading="lazy"; im.alt=id;
    im.onerror=()=>{ d.style.background="#3a2020"; im.remove();
                     d.appendChild(el("div","hint","image absente")); };
    d.appendChild(im);
    d.appendChild(el("div","lb", tileNum(id)));
    if(tuileDefinie(id)) d.appendChild(el("div","ok","✓"));
    d.title=id+" — "+tileBox(id);
    d.onclick=()=>{ tileSel=id; if(!TILES[id]) TILES[id]=tuileVide(); render(); };
    gal.appendChild(d);
  });
  box.appendChild(gal);
}

/* ---------- zoom & cadrage ---------- */
const ZOOM_MIN=34, ZOOM_MAX=150, ZOOM_DEF=76;
let ZOOM = ZOOM_DEF;
function applyZoom(v, memoriser){
  ZOOM = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(v)));
  document.documentElement.style.setProperty("--zs", ZOOM+"px");
  document.getElementById("zLbl").textContent = Math.round(ZOOM/ZOOM_DEF*100)+" %";
  document.body.classList.toggle("zsmall", ZOOM < 52);
  if(memoriser!==false){ try{ localStorage.setItem("zbp_zoom_ed", ZOOM); }catch(e){} }
  if(M) render();
}
const zoomBy = f => applyZoom(ZOOM*f);
function zoomFit(){
  if(!M) return;
  const w = document.getElementById("wrap");
  const reserve = cryptColorsUsed().length ? 90 : 0;
  const calcul = () => Math.min((w.clientWidth  - 60) / M.W,
                                (w.clientHeight - 60 - reserve) / M.H);
  // deux passes : la barre de défilement disparue libère de la place
  applyZoom(calcul(), false);
  applyZoom(calcul());
}
document.getElementById("tabMap").onclick   = ()=>setView("map");
document.getElementById("tabLogic").onclick = ()=>setView("logic");
document.getElementById("tabTiles").onclick = ()=>setView("tiles");
document.getElementById("tileFile").onchange = async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f) return;
  try{ const d=JSON.parse(await f.text());
       if(typeof d!=="object") throw new Error("format inattendu");
       TILES=d; enregistrerTuiles(); render(); say("Bibliothèque importée.","ok"); }
  catch(err){ say("Import impossible : "+err.message,"err"); }
};
document.getElementById("zIn").onclick  = ()=>zoomBy(1.15);
document.getElementById("zOut").onclick = ()=>zoomBy(1/1.15);
document.getElementById("zFit").onclick = zoomFit;
document.getElementById("wrap").addEventListener("wheel", e=>{
  if(!e.ctrlKey) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1);
}, {passive:false});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(e.key==="+" || e.key==="=") { zoomBy(1.15); e.preventDefault(); }
  else if(e.key==="-")           { zoomBy(1/1.15); e.preventDefault(); }
  else if(e.key==="0")           { zoomFit(); e.preventDefault(); }
});

/* ---------- démarrage ---------- */
const textToB64 = t => btoa(String.fromCharCode(...new TextEncoder().encode(t)));
const b64ToText = s => new TextDecoder().decode(Uint8Array.from(atob(s), c=>c.charCodeAt(0)));

document.getElementById("btnBack").onclick = ()=>{ location.href="zombicide.html"; };

  const probs=problems();

  const json = JSON.stringify(toQuest());
  try{ localStorage.setItem("zbp_quest", json); localStorage.setItem("zbp_editor", json); }catch(e){}
  location.href = "zombicide.html#q=" + encodeURIComponent(textToB64(json));
};
(function loadDraft(){
  const m = location.hash.match(/[#&]q=([^&]+)/);
  if(m){ try{ M = fromQuest(JSON.parse(b64ToText(decodeURIComponent(m[1])))); return; }catch(e){} }
  try{ const d = localStorage.getItem("zbp_editor");
       if(d){ M = fromQuest(JSON.parse(d)); return; } }catch(e){}
  M = fromQuest(SAMPLE);
})();
chargerTuiles();
chargerVueTuile();
// la bibliothèque du dépôt arrive après coup : un seul redessin à son arrivée
chargerTuilesFichier(()=>{ if(tuilesDuFichier) render(); });
(function initZoom(){
  let memo=null;
  try{ memo=parseFloat(localStorage.getItem("zbp_zoom_ed")); }catch(e){}
  applyZoom(memo>0 ? memo : ZOOM_DEF, false);
  if(!(memo>0)) zoomFit();
})();
render();
// les images et les missions arrivent après coup : on redessine à leur arrivée
preloadSprites(()=>{ if(Object.values(SPRITE_OK).some(Boolean)) render(); });
chargerFichiersMissions(()=>{ if(missionsDispo().length) render(); });
/* Dossier lié lors d'une visite précédente. Sans permission encore accordée on
   garde la poignée : le navigateur la redemandera à la première écriture. */
(async ()=>{
  if(!FSA_DIR) return;
  const h = await idbMission("get"); if(!h) return;
  dossierMissions = h;
  try{ await h.queryPermission({mode:"readwrite"}); }catch(e){ dossierMissions=null; }
