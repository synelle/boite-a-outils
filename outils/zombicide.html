<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombicide : Black Plague</title>
<style>
:root{
  --zs: 92px;              /* taille d'une zone */
  --bg:#141210; --bg2:#1c1917; --panel:#221f1c; --line:#3a332c;
  --ink:#e8e0d2; --dim:#a2968a; --gold:#c9a227; --blood:#8e2b2b;
  --street:#2a2724; --room:#33291f; --fog:#181614;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.45 "Segoe UI",system-ui,sans-serif;
  display:flex; overflow:hidden;
}
button{font:inherit;color:var(--ink);background:#2e2925;border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;cursor:pointer}
button:hover:not(:disabled){background:#3c352e;border-color:var(--gold)}
button:disabled{opacity:.35;cursor:default}
button.prim{background:#4a3a1c;border-color:var(--gold)}
button.danger{background:#4a1f1f;border-color:#8e2b2b}
h1,h2,h3{margin:0;font-weight:600}
.hr{height:1px;background:var(--line);margin:8px 0}

/* ---------- plateau ---------- */
/* Le panneau de droite garde toute la hauteur : le plateau et le journal se
   partagent la colonne restante. `min-height:0` est indispensable, sans quoi
   un enfant défilant refuse de se comprimer dans un conteneur flex. */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#boardPane{flex:1;min-width:0;min-height:0;position:relative;display:flex}
#boardWrap{flex:1;overflow:auto;padding:18px;display:flex}
/* `margin:auto` centre sur les deux axes ET, contrairement à justify-content,
   ne rogne pas le bord gauche/haut quand le plateau dépasse la fenêtre. */
#boardWrap .stage{margin:auto}
#zoomBar{position:absolute;left:10px;top:10px;z-index:20;display:flex;gap:4px;
  align-items:center;background:#1a1714dd;border:1px solid var(--line);
  border-radius:6px;padding:3px 6px;backdrop-filter:blur(2px)}
#zoomBar button{padding:2px 8px;font-size:13px;line-height:1.1}
#zoomBar button.on{background:#4a3a1c;border-color:var(--gold)}
#zLbl{font-size:11px;color:var(--dim);min-width:42px;text-align:center;
  font-variant-numeric:tabular-nums}
#zTileOp{width:76px;accent-color:var(--gold)}
#board{display:grid;gap:0;position:relative;background:#0d0b0a;
  border:3px solid #4a4038;border-radius:4px}
.zone{position:relative;width:var(--zs);height:var(--zs);background:var(--street);
  overflow:visible}
.zone.room{background:var(--room)}
.zone.vault{background:#3b2a3a}
.zone.unexplored{background:var(--fog)}
/* Quand le plateau est pavé de tuiles, les Zones s'effacent pour laisser voir
   l'illustration. Un bâtiment encore clos reste plus sombre et strié, mais son
   dessin transparaît : sur le vrai plateau on VOIT le bâtiment, on ignore
   seulement ce qu'il contient — l'opacifier revenait à effacer la tuile. */
body.hastiles .zone{background:rgba(42,39,36,.18)}
body.hastiles .zone.room{background:rgba(51,41,31,.18)}
body.hastiles .zone.unexplored{
  background:repeating-linear-gradient(45deg,
    rgba(13,11,10,.62) 0 7px, rgba(13,11,10,.44) 7px 14px)}
.tileLayer{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.tileLayer div{position:absolute;background-size:100% 100%;background-repeat:no-repeat}
.zone::after{content:"";position:absolute;inset:0;pointer-events:none}
/* Zone atteignable : le liseré ne suit QUE le pourtour de la Zone, même si
   elle couvre plusieurs cases — les arêtes internes ne sont pas bordées.
   Le tracé est posé côté JS, en ombres portées internes par côté. */
.zone.legal{cursor:pointer;
  background-image:radial-gradient(circle,rgba(79,157,90,.22),transparent 70%)}
.zone.legalAtk{cursor:pointer;
  background-image:radial-gradient(circle,rgba(192,80,80,.22),transparent 70%)}
/* Trajet du groupe de zombies qui vient d'avancer : d'où il part, où il arrive. */
.zone.zdepart{background-image:radial-gradient(circle,rgba(192,80,80,.14),transparent 70%);
  outline:2px dashed #c0505099;outline-offset:-3px}
.zone.zarrivee{background-image:radial-gradient(circle,rgba(192,80,80,.3),transparent 65%);
  outline:2px solid #d06060;outline-offset:-3px}
.zone.selz{outline:2px solid var(--gold);outline-offset:-2px}
.zone .lbl{position:absolute;left:3px;top:2px;color:#6d6157;pointer-events:none;
  font-size:clamp(6px,calc(var(--zs)*.1),10px)}
/* classe portée par <body> : survit à tous les redessins du plateau */
body.zsmall .zone .lbl{display:none}

/* murs & portes : un calque SVG unique, un trait centré sur chaque arête */
.walls{position:absolute;left:0;top:0;pointer-events:none;z-index:6}
/* Flèches des déplacements zombies : au-dessus des murs, sous les fenêtres. */
.traces{position:absolute;left:0;top:0;pointer-events:none;z-index:7}
/* La couleur du trait est posée par le rendu : c'est celle du Zombie déplacé.
   Un liseré sombre garde la flèche lisible sur une tuile claire. */
.traces .trace{stroke-width:3;opacity:.9;stroke-dasharray:7 5;stroke-linecap:round;
  paint-order:stroke;filter:drop-shadow(0 0 1.5px #000c)}
.walls .wall{stroke:#8a7458;stroke-width:7;stroke-linecap:square}
/* Porte fermée : barre pleine de sa couleur. Porte ouverte : barre coupée en
   deux (tirets larges) — l'icône change donc à l'ouverture. */
.walls .door{stroke-width:13;stroke-linecap:butt}
.walls .door.locked{stroke-dasharray:3 3}
.walls .door.crypt{stroke:#a06bd8;stroke-dasharray:6 4}
.walls .door.crypt.jaune,.walls .door.crypt.yellow{stroke:#c9a227}
.walls .door.crypt.open{stroke-dasharray:none;stroke:#5fb98a}

.cryptHatch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(var(--zs)*.35);height:calc(var(--zs)*.35);border-radius:6px;border:2px dashed var(--cc);
  background:#00000055;color:var(--cc);display:grid;place-items:center;
  font-size:15px;font-weight:700;z-index:1;pointer-events:none}
.cryptHatch.open{border-style:solid;background:var(--cc);color:#1a1714}

/* Zones de Crypte : hors plateau, sous le plateau */
#crypts{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
/* La Zone de Crypte porte l'illustration du jeton officiel (le coffre des
   Artefacts). Un voile sombre garde le texte et les figurines lisibles. */
.cryptZone{width:186px;height:186px;border:2px solid var(--cc);border-radius:8px;
  background:#241d28 center/cover no-repeat;padding:7px 9px;position:relative;
  cursor:pointer;display:flex;flex-direction:column}
.cryptZone::before{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background:linear-gradient(180deg,#000000cc 0%,#00000055 38%,#00000033 70%,#000000aa 100%)}
.cryptZone.nobg{background-image:none!important;border-style:dashed}
.cryptZone.legal{outline:2px solid #4f9d5a;outline-offset:2px}
.cryptZone .ch,.cryptZone .ci,.cryptZone .actors{position:relative;z-index:1}
.cryptZone .ch{font-size:11px;font-weight:700;color:var(--cc);letter-spacing:.5px;
  text-shadow:0 1px 3px #000,0 0 6px #000}
.cryptZone .ci{font-size:10px;color:#d8cfc2;margin-bottom:4px;text-shadow:0 1px 3px #000}
/* Même disposition que sur le plateau : flux centré et diamètre plafonné.
   La Crypte gardait l'ancienne grille, avec sa dernière rangée collée à gauche. */
.cryptZone .actors{position:static;inset:auto;margin:auto auto 0;
  /* La Crypte est plus large qu'une case : sans borne, six figurines tiendraient
     sur une rangée et la grille carrée ne serait plus respectée. On limite donc
     la largeur à ce que --gc figurines réclament, dans les 164 px utiles. */
  --dispo:min(164px, calc(var(--gc,2)*var(--zs)*.33 + (var(--gc,2) - 1)*3px));
  --ps:calc((var(--dispo) - (var(--gc,2) - 1)*3px) / var(--gc,2));
  width:var(--dispo);
  display:flex;flex-wrap:wrap;justify-content:center;
  align-content:flex-end;align-items:flex-end;gap:3px}

.toks{position:absolute;right:2px;top:2px;display:flex;flex-direction:column;gap:2px;z-index:4}
.tok{width:calc(var(--zs)*.22);height:calc(var(--zs)*.22);border-radius:50%;
  display:grid;place-items:center;border:1px solid #0008;font-weight:700;
  font-size:clamp(7px,calc(var(--zs)*.11),12px)}
.tok.exit{background:#2f6b4a;color:#fff}
.tok.bile{background:#6bbf3f;color:#123}
/* Marqueur de Zone : 60 % de la case, centré, sous tout le reste (le décor des
   tuiles est en z-index 0, les figurines en 2, les jetons en 3). */
.zmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:60%;height:60%;z-index:1;pointer-events:none;
  background-size:contain;background-repeat:no-repeat;background-position:center}
.zmark.vide{border:1px dashed #ffffff4d;border-radius:6px;display:grid;
  place-items:center;font-size:10px;color:#ffffff8a;text-align:center;line-height:1.1}
/* La Sortie se comporte comme un pion d'Invasion : jeton de bord, orienté. */
.spw.exitk{display:grid;place-items:center;color:#fff;font-weight:700;
  font-size:clamp(7px,calc(var(--zs)*.12),13px)}
.spw.exitk.img{color:transparent}
.tok.item{background:#c9a227;color:#241c06;border-color:#000a}
.tok.vault{background:#a06bd8;color:#fff;border-color:#0009}
/* Objectif : jeton CARRÉ, comme dans la boîte — c'est ce qui le distingue des
   autres pastilles, toutes rondes. Un Objectif caché montre sa face rouge,
   marquée d'un « ? ». */
.tok.obj{background:var(--oc);color:#fff;border-color:#0009;border-radius:3px}
.tok.obj.hidden{border:2px dashed #fff8}
/* Bruit : triangle ÉQUILATÉRAL, base en bas. Base = 2 × .12 = .24 ; la hauteur
   d'un équilatéral vaut base × √3/2, soit .24 × .8660 = .2078. */
.tok.noise{width:0;height:0;border:none;border-radius:0;background:none;
  border-left:calc(var(--zs)*.12) solid transparent;
  border-right:calc(var(--zs)*.12) solid transparent;
  border-bottom:calc(var(--zs)*.2078) solid #d8d2c4;position:relative;color:transparent}
/* Le chiffre est blanc et gras ; le triangle étant beige clair, un liseré
   sombre le rend lisible. Il siège dans le bas du triangle, là où il est large. */
.tok.noise span{position:absolute;left:calc(var(--zs)*-.09);top:calc(var(--zs)*.065);
  width:calc(var(--zs)*.18);text-align:center;font-weight:800;color:#fff;
  font-size:clamp(9px,calc(var(--zs)*.14),16px);line-height:1;
  text-shadow:0 0 2px #000,0 0 3px #000,0 1px 1px #000}
/* Jeton remplacé par un PNG : l'image porte tout le décor, on efface le fond
   et la bordure dessinés en CSS. Le Bruit retrouve une boîte carrée, son
   triangle CSS n'ayant plus lieu d'être. */
.tok.img{background-size:cover;background-position:center;background-color:transparent;
  border:none;color:transparent}
.tok.obj.img{border-radius:3px}
.tok.noise.img{width:calc(var(--zs)*.22);height:calc(var(--zs)*.22);border-radius:0;
  position:relative}
.tok.noise.img span{position:absolute;left:0;top:auto;bottom:0;width:100%;
  color:#fff;text-shadow:0 0 2px #000,0 0 3px #000}

/* Zone d'Invasion : rectangle plaqué sur un bord de la case */
/* Empilement dans la case, du fond vers la surface :
   marqueur de Zone (1) < pion d'Invasion (2) < figurines (3) < jetons (4). */
.spw{position:absolute;background:var(--sc);border:1px solid #0009;z-index:2;
  display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;
  text-shadow:0 1px 1px #0008}
.spw.n{left:18%;top:2px;width:64%;height:calc(var(--zs)*.14)}
.spw.s{left:18%;bottom:2px;width:64%;height:calc(var(--zs)*.14)}
.spw.w{top:18%;left:2px;height:64%;width:calc(var(--zs)*.14)}
.spw.e{top:18%;right:2px;height:64%;width:calc(var(--zs)*.14)}
/* Avec une image, le pion d'Invasion devient un jeton CARRÉ posé au milieu du
   bord choisi, au lieu d'un bandeau étiré sur toute la longueur. */
/* Le jeton garde le RATIO de son image : on fixe la hauteur, la largeur en
   découle (--ratio = largeur/hauteur, relevé au préchargement).
   Il s'oriente ensuite selon le bord, dans le sens horaire :
   haut 0°, droite 90°, bas 180°, gauche 270°. Le jeton est centré sur le bord
   et tourne autour de ce centre, ce qui garde le même point d'ancrage quel que
   soit l'angle. */
.spw.img{background-color:transparent;border:none;
  background-size:contain;background-repeat:no-repeat;background-position:center}
.spw.img.n,.spw.img.s,.spw.img.w,.spw.img.e{
  height:calc(var(--zs)*.26);
  width:calc(var(--zs)*.26*var(--ratio,1));
  right:auto;bottom:auto}
.spw.img.n{left:50%;top:calc(var(--zs)*.13);
  transform:translate(-50%,-50%) rotate(0deg)}
.spw.img.e{left:calc(100% - var(--zs)*.13);top:50%;
  transform:translate(-50%,-50%) rotate(90deg)}
.spw.img.s{left:50%;top:calc(100% - var(--zs)*.13);
  transform:translate(-50%,-50%) rotate(180deg)}
.spw.img.w{left:calc(var(--zs)*.13);top:50%;
  transform:translate(-50%,-50%) rotate(270deg)}
.spw.off{opacity:.32;border-style:dashed}
.spw.necro{outline:1px solid #fff6;outline-offset:1px}

/* Grille carrée (2×2, 3×3, 4×4…) plutôt qu'un flux libre : évite qu'une Zone
   bondée de figurines s'étire sur une seule ligne. Le nombre de colonnes
   (--gc) est calculé en JS d'après l'effectif réel.
   En flux plutôt qu'en grille CSS : une dernière rangée incomplète se centre
   alors d'elle-même, au lieu de se tasser à gauche.
   --ps borne le diamètre à ce qu'une rangée de --gc peut contenir : sans cela,
   dix figurines débordaient largement de la case. */
.actors{position:absolute;inset:6px 6px 6px 6px;
  /* --dispo : largeur réellement disponible, exprimée en LONGUEUR. Un
     pourcentage se résoudrait au point d'usage — sur la hauteur dans `height`,
     sur la pastille elle-même pour ses badges — d'où des ovales et des badges
     minuscules. --ps en découle et reste utilisable partout. */
  --dispo:calc(var(--zs) - 12px);
  --ps:calc((var(--dispo) - (var(--gc,2) - 1)*2px) / var(--gc,2));
  display:flex;flex-wrap:wrap;justify-content:center;
  align-content:flex-end;align-items:flex-end;gap:2px;z-index:3}
.zone.avecjetons .actors{right:24px; --dispo:calc(var(--zs) - 30px)}
/* La figurine garde sa taille tant qu'il y a la place, et rétrécit ensuite.
   Les Survivants restent un peu plus gros que les Zombies.
   `--ps` contient un pourcentage : dans `width` il se résout sur la largeur du
   conteneur, mais dans `height` il se résoudrait sur sa HAUTEUR — ce qui
   aplatissait les pastilles en ovales. On ne fixe donc que la largeur et on
   laisse `aspect-ratio` rendre la hauteur. */
/* Pas d'`overflow:hidden` ici : les pastilles de Blessure et d'effectif
   débordent volontairement du cercle et seraient rognées. C'est la taille de
   police, réduite avec --ps, qui permet à la figurine de rétrécir. */
.actors .pastille{width:min(calc(var(--zs)*.28), var(--ps));
                  height:min(calc(var(--zs)*.28), var(--ps));
                  min-height:0;
                  font-size:min(clamp(7px,calc(var(--zs)*.12),13px), calc(var(--ps)*.5))}
.actors .pastille.sv{width:min(calc(var(--zs)*.33), var(--ps));
                     height:min(calc(var(--zs)*.33), var(--ps))}
/* Les pastilles de Blessure et d'effectif suivent, sinon elles finiraient
   plus grandes que la figurine qu'elles annotent. */
.actors .pastille .wnd{width:max(11px, min(14px, calc(var(--ps)*.5)));
                       height:max(11px, min(14px, calc(var(--ps)*.5)));
                       font-size:max(8px, min(9px, calc(var(--ps)*.34)))}
.actors .pastille .nb{min-width:max(13px, min(15px, calc(var(--ps)*.55)));
                      height:max(13px, min(15px, calc(var(--ps)*.55)));
                      font-size:max(9px, min(10px, calc(var(--ps)*.38)))}
.pastille{width:calc(var(--zs)*.28);height:calc(var(--zs)*.28);border-radius:50%;
  border:2px solid #0009;display:grid;place-items:center;font-weight:700;
  font-size:clamp(7px,calc(var(--zs)*.12),13px);
  background-size:cover;background-position:center;position:relative;flex:0 0 auto}
.pastille.sv{border-color:#f0e2b8;width:calc(var(--zs)*.33);height:calc(var(--zs)*.33)}
/* Figurine au premier plan : halo vert franc, large, pour la repérer d'un coup
   d'œil même dans une Zone bondée. --halo sert aussi aux états de survol. */
:root{--halo:#00ff00}
.pastille.sv.act{box-shadow:0 0 0 3px var(--halo),0 0 18px 3px #00ff0099}
/* Zombies en cours de déplacement pendant le pas-à-pas : halo rouge, pour
   suivre des yeux le groupe qui bouge. Contour + lueur plutôt qu'une ombre
   portée : `box-shadow` serait écrasé par l'effet de pile des zombies, qui
   l'utilise déjà. */
.pastille.zbouge{outline:3px solid #ff2b2b;outline-offset:1px;
  filter:drop-shadow(0 0 6px #ff2b2bcc) drop-shadow(0 0 12px #ff2b2b88)}
/* Figurine sélectionnable : le curseur et un léger halo l'annoncent. */
.pastille.sv.cliquable{cursor:pointer}
.pastille.sv.cliquable:hover{box-shadow:0 0 0 2px #f0e2b8}
.pastille.sv.cliquable.act:hover{box-shadow:0 0 0 3px var(--halo),0 0 22px 4px #00ff00cc}
/* Pendant un mode au clic, la figurine ne capte plus le geste : il revient à
   la Zone, qu'il s'agisse de la viser ou de s'y rendre. */
body.modeclic .pastille.sv.cliquable{cursor:inherit}
body.modeclic .pastille.sv.cliquable:hover{box-shadow:none}
body.modeclic .pastille.sv.cliquable.act:hover{
  box-shadow:0 0 0 3px var(--halo),0 0 18px 3px #00ff0099}
.pastille.dead{filter:grayscale(1) brightness(.5)}
.pastille .wnd{position:absolute;bottom:-3px;right:-3px;background:var(--blood);
  color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:grid;place-items:center}
/* Zombies identiques : une seule pastille, dessinée comme une pile, avec le
   nombre en pastille. Évite d'aligner quinze rondelles dans une Zone. */
.pastille.pile2{box-shadow:3px -3px 0 -2px var(--zc), 3px -3px 0 0 #000a}
.pastille.pile3{box-shadow:3px -3px 0 -2px var(--zc), 3px -3px 0 0 #000a,
                6px -6px 0 -3px var(--zc), 6px -6px 0 -1px #000a}
.pastille .nb{position:absolute;bottom:-4px;right:-5px;background:#1a1714;color:#f0e2b8;
  border:1px solid #000a;border-radius:8px;min-width:15px;height:15px;padding:0 3px;
  font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}

/* ---------- panneau ---------- */
/* Liste des Survivants : une colonne à part, entre le plateau et le panneau.
   Elle reste visible en permanence — les onglets, eux, défilaient avec
   l'inventaire et disparaissaient dès qu'on descendait un peu. */
/* La bande du bas est partagée : le journal à gauche, les Survivants à droite.
   La poignée règle la hauteur de l'ensemble. */
#bas{height:172px;flex:0 0 auto;display:flex;flex-direction:column;background:#191614}
#basCorps{flex:1;min-height:0;display:flex}
#survPane{width:42%;min-width:250px;flex:0 0 auto;display:flex;flex-direction:column;
  border-left:1px solid var(--line);background:#1c1917}
#survBar{padding:2px 10px;background:#1a1714;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.4px;color:var(--gold);text-transform:uppercase}
/* Les cartes s'égrènent librement et se rangent d'elles-mêmes en colonnes.
   Leur largeur est celle du NOM LE PLUS LONG, calculée à l'affichage : à moitié
   de panneau chacune, elles s'étiraient très au-delà de ce que le texte demande. */
#survivants{flex:1;min-height:0;overflow-y:auto;padding:6px;
  display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px}
#survivants .sv-carte{flex:0 0 auto}
.sv-carte{display:flex;gap:6px;align-items:center;padding:5px 6px;border-radius:6px;
  border:1px solid var(--line);background:#241f1b;cursor:pointer;text-align:left}
.sv-carte:hover{border-color:var(--gold)}
.sv-carte.on{background:#33291a;border-color:var(--gold)}
.sv-carte .pion{width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  border:2px solid #0009;background:var(--pc) center/cover no-repeat;
  display:grid;place-items:center;font-weight:700;font-size:12px;color:#1a1714}
.sv-carte .pion.img{color:transparent}
.sv-carte .txt{min-width:0;flex:1;line-height:1.2}
.sv-carte .nm{font-size:11.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sv-carte .et{font-size:10px}
.sv-carte .hp{font-size:9px;color:#e07070}
#side{width:430px;min-width:430px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh}
#side header{padding:10px 12px;border-bottom:1px solid var(--line);background:#1a1714}
/* Rappel des Objectifs encore à trouver, couleur par couleur, avec ce que
   chacune commande : sans cela, personne ne sait pourquoi chercher les bleus. */
#objLine{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px}
#objLine .objc{font-size:11px;color:var(--ink);border-left:3px solid var(--oc);
  padding-left:5px;line-height:1.35}
#objLine .objc i{color:var(--dim);font-style:normal}
#side header h1{font-size:15px;letter-spacing:.5px;color:var(--gold)}
#side header .sub{font-size:11px;color:var(--dim)}
#scroll{flex:1;overflow-y:auto;padding:10px 12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.card{background:#2a2521;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
/* Grille de 3 colonnes égales : en flex, le dernier bouton d'une ligne
   incomplète s'étirait sur toute la largeur. */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.tabs button{padding:4px 2px 6px;font-size:12px;position:relative;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:#4a3a1c;border-color:var(--gold)}
.tabs .hp{position:absolute;right:3px;top:1px;font-size:9px;color:#e07070}
/* Code couleur du nom selon les Actions restantes. Une barre sous le nom
   reprend la même couleur, pour rester lisible en cas de daltonisme. */
.tabs .na{position:absolute;left:3px;top:1px;font-size:9px;font-weight:700;color:inherit}
.tabs button::after{content:"";position:absolute;left:4px;right:4px;bottom:2px;
  height:2px;border-radius:1px;background:currentColor;opacity:.55}
.act-full{color:#7fd48a}                 /* toutes ses Actions */
.act-some{color:var(--gold)}             /* tour entamé, il en reste */
.act-none{color:#7b7168}                 /* plus d'Action */
.act-none::after{opacity:.18}
.act-out {color:#5d534b;font-style:italic}   /* mort ou évacué */
.act-out::after{display:none}
h3 .act-full,h3 .act-some,h3 .act-none,h3 .act-out{font-weight:600}

.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;border:1px solid var(--line);margin:5px 0}
.bar div{flex:1;font-size:9px;display:grid;place-items:center;color:#0007;font-weight:700}
.bar .b{background:#2f5b8a}.bar .y{background:#b5a12d}.bar .o{background:#c07a34}.bar .r{background:#8e2b2b}
.bar div.dim{opacity:.22}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}
.slot{border:1px solid var(--line);border-radius:5px;padding:5px 6px;background:#221e1a;
  min-height:44px;display:flex;gap:6px;align-items:flex-start}
.slot .txt{flex:1;min-width:0}
/* Illustration détourée : `contain`, sinon une lame en longueur serait rognée. */
.slot .im{flex:0 0 auto;width:42px;height:42px;background:center/contain no-repeat;
  filter:drop-shadow(0 1px 2px #0008)}
.slot.hand{border-color:#6b5c4a}
.slot.body{grid-column:1/-1;border-color:#4a5c6b}
.slot .nm{font-weight:600;font-size:12px}
.slot .st{font-size:10px;color:var(--dim);line-height:1.3}
.slot .acts{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.slot .acts button{padding:2px 6px;font-size:11px}
.slot .acts button.atk{border-color:var(--ac);color:var(--ac);font-weight:600}
.slot .acts button.atk:hover{background:var(--ac);color:#1a1714}
.slot .acts button.atk.melee {--ac:#c2703a}
.slot .acts button.atk.ranged{--ac:#4fb0a0}
.slot .acts button.atk.spell {--ac:#8a6bd8}
.slot.empty{opacity:.45;display:grid;place-items:center;font-size:11px;color:var(--dim)}
.slot.wound{border-color:var(--blood);background:#3a1f1f}
.slot.pick{cursor:pointer;outline:1px dashed var(--gold)}

#logPane{flex:1;min-width:0;display:flex;flex-direction:column}
/* Poignée de redimensionnement : une lisière fine qui remplace le filet du
   haut, assez large pour être attrapée sans gêner le plateau au-dessus. */
#logGrip{height:6px;flex:0 0 auto;cursor:ns-resize;background:var(--line);
  border-top:1px solid #0006}
#logGrip:hover,body.logdrag #logGrip{background:var(--gold)}
/* Pendant le glisser : pas de sélection de texte ni de curseur qui saute. */
body.logdrag{cursor:ns-resize;user-select:none}
body.logclos #logGrip{cursor:default}
body.logclos #logGrip:hover{background:var(--line)}
#logBar{display:flex;align-items:center;justify-content:space-between;
  padding:2px 10px;background:#1a1714;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.4px;color:var(--gold);text-transform:uppercase}
#logBar button{padding:0 7px;font-size:12px;line-height:1.5;background:transparent;border:none;
  color:var(--dim)}
#logBar button:hover:not(:disabled){background:transparent;color:var(--gold)}
#log{flex:1;min-height:0;overflow-y:auto;padding:6px 10px;font-size:12px;line-height:1.4}
/* Replié : il ne reste que la barre de titre, le plateau récupère la place. */
body.logclos #bas{height:auto}
body.logclos #basCorps{display:none}
#log div{margin-bottom:2px;white-space:pre-line}
.l-dice{color:#e8d48a}.l-kill{color:#8fd08f}.l-bad{color:#e08080}
.l-sys{color:#8fa8c8}.l-round{color:var(--gold);font-weight:700;margin-top:6px}
.l-obj{color:#d9a3e0}

#foot{padding:8px 12px;border-top:1px solid var(--line);background:#1a1714;display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;background:#332c25;border:1px solid var(--line);border-radius:10px;
  padding:1px 8px;font-size:11px;margin:1px}
.pill.free{background:#2d4030;border-color:#4f9d5a}
.skl{font-size:11px;color:#cbbf9e;margin:1px 0}
.skl.off{color:#6d6157}
/* Écran de sélection des Survivants */
#setup{position:fixed;inset:0;background:#0e0c0bf2;display:none;place-items:center;z-index:65}
#setup .bx{background:var(--panel);border:2px solid var(--gold);border-radius:10px;
  padding:20px 24px;width:min(720px,92vw);max-height:88vh;overflow:auto}
#setup h2{color:var(--gold);font-size:18px;letter-spacing:.5px}
#setup .sub{font-size:12px;color:var(--dim);margin:6px 0 14px}
#setupList{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:8px}
.pick{display:flex;gap:9px;align-items:flex-start;text-align:left;padding:8px 10px;
  border:1px solid var(--line);border-radius:7px;background:#241f1b;cursor:pointer}
.pick:hover{border-color:var(--gold)}
.pick.on{background:#33291a;border-color:var(--gold)}
.pick .dot{width:38px;height:38px;border-radius:50%;flex:0 0 auto;border:2px solid #0009;
  background:var(--pc);display:grid;place-items:center;font-weight:700;font-size:15px;color:#1a1714}
/* Avec son portrait, la pastille montre le personnage plutôt que son initiale ;
   le cercle de couleur reste en fond, visible si l'image est transparente. */
.pick .dot.img{background-image:var(--portrait);background-size:cover;
  background-position:center;color:transparent}
.pick .nm{font-weight:600;font-size:13px}
.pick .sk{font-size:11px;color:var(--dim);line-height:1.3}
/* Provenance et biographie : la bio peut être longue, on la borne à trois
   lignes et le texte entier reste accessible en infobulle. */
.pick .boite{display:inline-block;margin-top:3px;font-size:10px;color:var(--gold);
  border:1px solid #5c4a1c;border-radius:9px;padding:0 6px}
.pick .bio{font-size:11px;color:var(--dim);font-style:italic;line-height:1.3;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pick .nfo{min-width:0;flex:1}
/* Arbre de compétences : une ligne par niveau, chaque compétence en pastille
   survolable. La couleur de la puce rappelle le niveau de la fiche. */
.pick .niv{display:flex;gap:4px;align-items:baseline;margin-top:3px;flex-wrap:wrap}
.pick .niv .lv{font-size:9px;font-weight:700;letter-spacing:.5px;padding:0 4px;
  border-radius:3px;color:#1a1714;flex:0 0 auto}
.pick .niv.b .lv{background:#3d6fb5;color:#e8e0d2}
.pick .niv.o .lv{background:#c07a34}
.pick .niv.r .lv{background:#8e2b2b;color:#e8e0d2}
.pick .cmp{font-size:10.5px;line-height:1.35;padding:0 5px;border-radius:8px;
  border:1px solid var(--line);background:#1d1a17;color:var(--dim);cursor:help}
.pick .cmp:hover{border-color:var(--gold);color:var(--ink)}
/* Compétence du livret que le moteur n'applique pas : le dire ici évite de
   croire à un bonus qui n'existe pas en jeu. */
.pick .cmp.ko{border-color:#7a5a2a;color:#e0a060}

/* Infobulle : au-dessus de l'écran de choix, jamais hors de la fenêtre. */
#bulle{position:fixed;z-index:9999;max-width:330px;display:none;pointer-events:none;
  background:#14110f;border:1px solid var(--gold);border-radius:6px;padding:7px 9px;
  font-size:12px;line-height:1.45;color:var(--ink);box-shadow:0 6px 20px #000a}
#bulle .bt{font-weight:600;color:var(--gold);margin-bottom:3px}
#bulle .bk{margin-top:4px;color:#e0a060;font-size:11px}
.pick .gear{margin-top:5px;width:100%;font-size:11px;padding:2px 4px;
  background:#1a1714;color:var(--ink);border:1px solid var(--line);border-radius:4px}
.pick .ck{margin-left:auto;font-size:15px;color:var(--gold);opacity:0}
.pick.on .ck{opacity:1}
#setupMsg{min-height:18px;color:#e08080}
/* Lien vers le livret, dans la fenêtre des règles */
a.lienpdf{display:inline-block;padding:6px 12px;border:1px solid var(--gold);border-radius:6px;
  color:var(--gold);text-decoration:none;font-weight:600;font-size:13px}
a.lienpdf:hover{background:#4a3a1c}
#missionInfo{display:none;margin:0 0 10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:7px;background:#221d19}
#missionInfo .ti{font-weight:600;color:var(--gold);font-size:13px}
/* En-tête de fiche : difficulté · effectif · durée, en petites capitales. */
#missionInfo .fq{font-size:11px;color:#c9a227b8;margin-top:3px;letter-spacing:.6px;
  text-transform:uppercase}
#missionInfo .de{font-size:12px;color:var(--ink);margin-top:4px;line-height:1.45;white-space:pre-line}
#missionInfo .ob{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.45;white-space:pre-line}
#missionInfo .rs{font-size:11px;color:var(--dim);margin-top:6px}

#banner{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:60}
#banner .bx{background:var(--panel);border:2px solid var(--gold);border-radius:10px;
  padding:26px 34px;text-align:center;max-width:460px}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:70}
#modal .bx{background:var(--panel);border:1px solid var(--gold);border-radius:8px;
  padding:16px;min-width:340px;max-width:520px;max-height:80vh;overflow:auto}
#modal .opt{display:block;width:100%;text-align:left;margin-top:6px}
.hint{font-size:11px;color:var(--dim);margin-top:4px}
.zoneinfo{font-size:11px;color:var(--dim)}
</style>
</head>

<script>
"use strict";
/* ==========================================================================
   ZOMBICIDE : BLACK PLAGUE — moteur de règles
   Données de cartes / compétences / spawn extraites de zombicide.fandom.com
   (Black Plague, 2016). Voir le bouton « Règles » pour la liste des points
   d'interprétation et des simplifications assumées.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. SPRITES  —  pastilles PNG
   Dépose tes fichiers dans ./sprites/ . Si un PNG est absent, une pastille
   de couleur générée est utilisée à la place (le jeu reste fonctionnel).
   -------------------------------------------------------------------------- */
const SPRITE_DIR = "zombicide_fichiers/sprites/";
const SPRITES = {
  // figurines — la clé est celle du Survivant ou du type de Zombie
  ann:"surv_ann.png", baldric:"surv_baldric.png", clovis:"surv_clovis.png",
  nelly:"surv_nelly.png", samson:"surv_samson.png", silas:"surv_silas.png",
  walker:"z_walker.png", runner:"z_runner.png", brute:"z_fatty.png",
  abomination:"z_abomination.png", necromancer:"z_necromancer.png",
  // jetons posés dans une Zone. Un Objectif garde un fichier par couleur,
  // puisque son image doit rester lisible sans dépendre du fond CSS.
  tok_exit:"tok_sortie.png",
  tok_bile:"tok_bile.png",
  tok_cercle_magique:"tok_cercle_magique.png",
  tok_feu:"tok_feu.png",
  tok_item:"tok_objet.png",
  tok_noise:"tok_bruit.png",
  tok_obj_red:"tok_objectif_rouge.png",
  tok_obj_green:"tok_objectif_vert.png",
  tok_obj_blue:"tok_objectif_bleu.png",
  tok_obj_hidden:"tok_objectif_cache.png",
  tok_spawn_red:"tok_spawn_rouge.png",
  tok_spawn_blue:"tok_spawn_bleu.png",
  tok_spawn_green:"tok_spawn_vert.png",
  tok_spawn_purple:"tok_spawn_violet.png",
  tok_spawn_necro:"tok_spawn_necromancer.png"
};
const SPRITE_OK = {};                         // rempli par le préchargement
const SPRITE_RATIO = {};                      // largeur/hauteur de chaque image
function preloadSprites(cb){
  /* Deux vagues. Les figurines et les jetons décident de ce qui s'affiche sur
     le plateau : on les attend. Les illustrations de cartes ne concernent que
     le panneau et pèsent une dizaine de mégaoctets : on ne retient pas le
     démarrage pour elles, on redessine quand elles arrivent. */
  const differe = k => k.startsWith("eq_");
  const keys = Object.keys(SPRITES).filter(k=>!differe(k));
  const suite = () => {
    const tard = Object.keys(SPRITES).filter(differe);
    let reste = tard.length, vu = false;
    tard.forEach(k=>{
      const im = new Image();
      const fini = ok => { SPRITE_OK[k]=ok; vu = vu || ok;
        if(!--reste && vu && typeof render === "function" && G && G.zones) render(); };
      im.onload = ()=>fini(true); im.onerror = ()=>fini(false);
      im.src = SPRITE_DIR + SPRITES[k];
    });
    cb();
  };
  let left = keys.length;
  if(!left) return suite();
  keys.forEach(k=>{
    const im = new Image();
    im.onload  = ()=>{ SPRITE_OK[k]=true;
      // le ratio réel sert à ne pas déformer les jetons (voir .spw.img)
      if(im.naturalHeight) SPRITE_RATIO[k]=im.naturalWidth/im.naturalHeight;
      if(!--left) suite(); };
    im.onerror = ()=>{ SPRITE_OK[k]=false; if(!--left) suite(); };
    im.src = SPRITE_DIR + SPRITES[k];
  });
}

/* --------------------------------------------------------------------------
   2. PARAMÈTRES DE RÈGLES  (modifiables d'une ligne)
   -------------------------------------------------------------------------- */
const RULES = {
  actionsPerTurn: 3,            // +1 au niveau Jaune
  survivorWounds: 3,            // « éliminé dès que sa barre de blessure atteint 3 » (p.23)
  handSlots: 2, backSlots: 5,   // 8 cartes : 2 mains + 5 sac à dos + 1 corps (p.15)
  xpObjective: 5,
  xpVault: 5,
  // Sortir d'une zone occupée coûte 1 Action supplémentaire PAR zombie (p.18).
  extraActionPerZombie: true,
  // Défaite immédiate si un Nécromancien s'échappe alors qu'il y a 6 jetons
  // d'Invasion sur le plateau, le sien compris (p.28).
  necroEscapeLossTokens: 6
};
/* Ordre de priorité des cibles (p.27). Les touches vont d'abord à la priorité
   la plus forte ; si les Dégâts sont insuffisants, la touche est PERDUE — elle
   ne « saute » pas sur une cible de priorité inférieure. */
const TARGET_PRIORITY = { walker:1, brute:2, abomination:2, runner:3, necromancer:4 };
/* Couleurs de quête. Portes : bleue / verte / grise. Zones d'Invasion : bleue,
   verte, violette, rouge. Objectifs : rouge, vert, bleu. */
const COLORS = {
  red:    {f:"rouge",    m:"rouge",   css:"#b5462d"},
  blue:   {f:"bleue",    m:"bleu",    css:"#3d6fb5"},
  green:  {f:"verte",    m:"vert",    css:"#4f9d5a"},
  purple: {f:"violette", m:"violet",  css:"#a06bd8"},
  grey:   {f:"grise",    m:"gris",    css:"#8a8a8a"}
};
const colF   = c => (COLORS[c]||{}).f || c || "neutre";   // porte, Zone (féminin)
const colM   = c => (COLORS[c]||{}).m || c || "neutre";   // Objectif, pion (masculin)
const colCss = c => (COLORS[c]||{}).css || "#8a8a8a";

const DANGER = [
  {key:"blue",   name:"Bleu",   min:0,  max:6},
  {key:"yellow", name:"Jaune",  min:7,  max:18},
  {key:"orange", name:"Orange", min:19, max:42},
  {key:"red",    name:"Rouge",  min:43, max:Infinity}
];

/* --------------------------------------------------------------------------
   3. ZOMBIES  (profils officiels Black Plague)
   -------------------------------------------------------------------------- */
const ZT = {
  walker:      {n:"Walker",       actions:1, dmg:1, lethal:1, xp:1, c:"#6f8f4e", ini:"W", pool:35},
  runner:      {n:"Runner",       actions:2, dmg:1, lethal:1, xp:1, c:"#c07a34", ini:"R", pool:14},
  /* `pl` : pluriel irrégulier. Sans lui on ajoute simplement un « s ». */
  brute:       {n:"Fatty", pl:"Fatties", actions:1, dmg:1, lethal:2, xp:1, c:"#8b5a3c", ini:"F", pool:14},

/* --------------------------------------------------------------------------
   6 bis. DECKS PERSONNALISÉS
   zombicide_fichiers/decks/decks.js, écrit par zombicide-decks.html, remplace
   les quantités de la boîte et/ou la table d'Invasion. Le fichier est relu ici
   plutôt que cru sur parole : une carte inconnue ou une case illisible est
   signalée à la mise en place, pas silencieusement ignorée.
   -------------------------------------------------------------------------- */
const CASE_INVASION = /^(-|N|D|![WRB]|[1-9][WRBA])$/;
let DECKS_LISTE = [], soucisDecks = [];
(function lireDecks(){
  const src = window.ZBP_DECKS;
  if(!src || typeof src !== "object") return;
  /* Le fichier porte une LISTE de decks nommés. Un fichier d'avant, qui n'en
     décrivait qu'un seul à plat, reste lisible. */
  const brut = Array.isArray(src.decks) ? src.decks
             : (src.equip || src.spawn) ? [src] : [];
  if(!brut.length){ soucisDecks.push("fichier de decks vide"); return; }
  const connus = new Set(EQUIP.map(e=>e.id));
  brut.forEach((d, k)=>{
    if(!d || typeof d !== "object")
      return soucisDecks.push(`deck nº${k+1} : illisible`);
    const nom = String(d.nom || `Deck ${k+1}`);
    const dire = m => soucisDecks.push(`${nom} — ${m}`);
    const equip = {};
    Object.entries(d.equip || {}).forEach(([id, v])=>{
      if(!connus.has(id)) return dire(`équipement inconnu : ${id}`);
      const q = (typeof v === "number") ? {deck:v} : (v || {});
      const e = {};
      if(q.deck  != null) e.deck  = Math.max(0, q.deck|0);
      if(q.start != null) e.start = Math.max(0, q.start|0);
      if(q.vault != null) e.vault = Math.max(0, q.vault|0);
      equip[id] = e;
    });
    let spawn = null;
    if(Array.isArray(d.spawn) && d.spawn.length){
      spawn = [];
      d.spawn.forEach((r, i)=>{
        if(!Array.isArray(r) || r.length !== 4)
          return dire(`carte d'Invasion nº${i+1} : il faut 4 colonnes`);
        const mauvaise = r.find(c=>!CASE_INVASION.test(String(c)));
        if(mauvaise !== undefined)
          return dire(`carte d'Invasion nº${i+1} : « ${mauvaise} » incompréhensible`);
        spawn.push(r.map(String));
      });
      if(!spawn.length){ spawn = null; dire("aucune carte d'Invasion exploitable"); }
    }
    const rienDEquip = !Object.keys(equip).length;
    if(rienDEquip && !spawn) return dire("ne définit rien d'exploitable");
    DECKS_LISTE.push({nom, equip: rienDEquip ? null : equip, spawn});
  });
})();
/* Deck retenu pour la partie : null = les decks de la boîte. Un deck présent
   est proposé, pas imposé. */
let deckChoisi = null;

/* Quantité retenue pour une carte d'Équipement : celle du deck si elle y est,
   celle de la boîte sinon — un fichier partiel ne vide pas la pioche. */
function quantiteEquip(e, cle){
  const p = deckChoisi && deckChoisi.equip && deckChoisi.equip[e.id];
  if(p && p[cle] != null) return p[cle];
  /* `vault:1` marque l'Artefact ET compte pour un exemplaire ; les cartes des
     extensions valent 0 tant qu'un deck ne les réclame pas, sinon elles
     entreraient dans une partie Black Plague. */
  if(cle === "vault") return e.vault ? (e.boite ? 0 : 1) : 0;
  if(cle !== "vault" && e.boite) return 0;
  return e[cle] || 0;
}
function tableInvasion(){
  return (deckChoisi && deckChoisi.spawn) || SPAWN_TABLE;
}

/* Carte personnalisée produite par zombicide-editor.html (stockée dans localStorage). */
function validateQuest(q){
  if(!q || typeof q!=="object") return "objet invalide";
  if(!(q.W>0 && q.H>0)) return "dimensions manquantes";
  if(!Array.isArray(q.map) || q.map.length!==q.H) return "carte de hauteur incorrecte";
  if(q.map.some(r=>typeof r!=="string" || r.length!==q.W)) return "carte de largeur incorrecte";
  const ok = p => p && p.x>=0 && p.y>=0 && p.x<q.W && p.y<q.H;
  if(!ok(q.start)) return "Zone de départ absente ou hors plateau";
  const sortieRequise = !q.win || q.win.exit !== "none";
  if(sortieRequise && !ok(q.exit)) return "Zone de sortie absente ou hors plateau";
  if(q.exit && !ok(q.exit))        return "Zone de sortie hors plateau";
  if(!Array.isArray(q.spawns) || !q.spawns.length) return "aucune Zone d'Apparition";
  if(q.spawns.some(p=>!ok(p))) return "Zone d'Apparition hors plateau";
  if(!Array.isArray(q.objectives) || !q.objectives.length) return "aucun Objectif";
  if(q.objectives.some(p=>!ok(p))) return "Objectif hors plateau";
  if(q.win){
    if(q.win.exit && !["all","any","none"].includes(q.win.exit))
      return "condition de sortie inconnue : "+q.win.exit;
    if(q.win.mode && !["all","any"].includes(q.win.mode)) return "mode de victoire inconnu : "+q.win.mode;
    const condOK = c => /^(objectives:all|vault:all|never|objective:at:\d+,\d+|objective:named:.+|objective:\w+|kill:\w+|danger:\w+)$/.test(c);
    if(q.win.need && !condOK(q.win.need))
      return "condition de victoire inconnue : "+q.win.need;
    if(q.win.goals!==undefined){
      if(!Array.isArray(q.win.goals)) return "win.goals doit être une liste";
      for(const g of q.win.goals){
        const need = Array.isArray(g && g.need) ? g.need : (g&&g.need?[g.need]:[]);
        if(!need.length) return "objectif de mission sans condition";
        for(const c of need) if(!condOK(c)) return "condition de victoire inconnue : "+c;
      }
    }
  }
  const dxy = {n:[0,-1], s:[0,1], e:[1,0], w:[-1,0]};   // DXY n'existe pas encore ici
  for(const d of (q.doors||[])){
    if(!ok(d) || !dxy[d.s]) return "porte invalide";
    if(d.crypt) continue;                    // ancien format : trappe de crypte
    const nx=d.x+dxy[d.s][0], ny=d.y+dxy[d.s][1];
    if(nx<0||ny<0||nx>=q.W||ny>=q.H) return "porte sur un bord de plateau";
  }
  for(const o of (q.openings||[])){
    if(!ok(o) || !dxy[o.s]) return "ouverture invalide";
    // une ouverture peut border le plateau (tuile en attente de voisine) : pas d'erreur ici
  }
  for(const w of (q.walls||[])){
    if(!ok(w) || !dxy[w.s]) return "mur invalide";
  }
  for(const l of (q.limits||[])){
    if(!ok(l) || !dxy[l.s]) return "limite invalide";
  }
  for(const m of (q.markers||[])){
    if(!ok(m)) return "marqueur hors plateau";
    if(!MARQUEURS[m.t]) return "marqueur inconnu : "+m.t;
  }
  if(q.exit && q.exit.side && !dxy[q.exit.side]) return "bord de Sortie inconnu : "+q.exit.side;
  for(const [col,liste] of Object.entries(q.objEffects||{}))
    for(const ef of (liste||[])){
      if(!ef || !["xp","necro","equip","draw","zombie"].includes(ef.t))
        return `effet d'Objectif inconnu (${col}) : `+(ef&&ef.t);
      if(ef.t==="equip" && !EQ[ef.id]) return `effet d'Objectif ${col} : équipement inconnu `+ef.id;
      if(ef.t==="xp" && !(ef.n>0)) return `effet d'Objectif ${col} : XP invalides`;
      if(ef.t==="draw"){
        if(!Array.isArray(ef.ids) || !ef.ids.length) return `effet d'Objectif ${col} : liste de tirage vide`;
        for(const id of ef.ids) if(!EQ[id]) return `effet d'Objectif ${col} : carte inconnue `+id;
      }
    }
  for(const d of (q.cryptDoors||[])){
    if(!ok(d)) return "trappe de crypte hors plateau";
    if(!d.color) return "trappe de crypte sans couleur";
  }
  for(const z of (q.zombies||[])){
    if(!ok(z)) return "zombie de départ hors plateau";
    if(!z.t) return "zombie de départ sans type";
  }
  for(const it of (q.items||[])){
    if(!ok(it)) return "objet posé hors plateau";
    if(!it.id || !EQ[it.id]) return "objet inconnu : "+it.id;
  }
  for(const [col,liste] of Object.entries(q.cryptItems||{}))
    for(const id of (liste||[]))
      if(!EQ[id]) return `objet inconnu dans la crypte ${col} : ${id}`;
  for(const id of (q.cryptPool||[]))
    if(!EQ[id]) return `objet inconnu dans la réserve de crypte : ${id}`;
  return null;
}
const b64ToText = s => new TextDecoder().decode(Uint8Array.from(atob(s), c=>c.charCodeAt(0)));
const textToB64 = t => btoa(String.fromCharCode(...new TextEncoder().encode(t)));
/* Deux transports depuis l'éditeur : l'URL (#q=…) d'abord — seule voie fiable
   quand les deux fichiers sont ouverts en file:// — puis localStorage. */
function loadCustomQuest(){
  const sources = [];
  const m = location.hash.match(/[#&]q=([^&]+)/);
  if(m){ try{ sources.push(["URL", b64ToText(decodeURIComponent(m[1]))]); }catch(e){} }
  try{ const raw = localStorage.getItem("zbp_quest"); if(raw) sources.push(["mémoire", raw]); }catch(e){}
  for(const [origin, raw] of sources){
    let q; try{ q = JSON.parse(raw); }catch(e){ console.warn(`Carte (${origin}) illisible`, e); continue; }
    const err = validateQuest(q);
    if(err){ console.warn(`Carte (${origin}) ignorée : ${err}`); continue; }
    try{ localStorage.setItem("zbp_quest", raw); }catch(e){}
    return q;
  }
  return null;
}
const CUSTOM_QUEST = loadCustomQuest();
let QUEST = CUSTOM_QUEST || DEFAULT_QUEST;

/* ==========================================================================
   CONDITIONS DE QUÊTE
   `quest.locks` décrit ce qui est verrouillé et jusqu'à quand :
     locks.spawns = {red:"objective:red"}   → les Zones d'Invasion rouges sont
        inactives tant qu'aucun Objectif rouge n'a été récupéré (p.26) ;
     locks.doors  = {blue:"objective:blue"} → les portes bleues ne s'ouvrent pas
        avant qu'un Objectif bleu ait été récupéré (p.19) ;
     locks.spawnsOff = {green:"objectives:all"} → désactivation conditionnelle.
   Conditions reconnues : "objective:<couleur>", "objectives:all", "vault:all"
   (les deux Artefacts de crypte récupérés), "never".
   Une couleur absente de la table n'est soumise à aucune condition.
   ========================================================================== */
/* Un Objectif peut porter un NOM (« Livre Noir »). La quête le vise alors par
   ce nom et non par sa case : le déplacer sur la carte ne casse plus la
   condition, et l'intitulé du but reste lisible. La clé ignore casse, accents
   et ponctuation. */
const nomObjectif = cle =>
  ((G.q.objectives||[]).find(o=>o.name && cleObj(o.name)===cle)||{}).name || cle;
const cleObj = n => (n||"").toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");

function condMet(cond){
  if(!cond) return true;
  if(cond==="never") return false;
  if(cond==="objectives:all") return G.objectivesLeft===0;
  if(cond==="vault:all") return artefactsRecuperes();
  const mk = /^kill:(\w+)$/.exec(cond);
  if(mk) return (G.kills[mk[1]]||0) > 0;
  // un Objectif PRÉCIS, désigné par sa case
  const ma = /^objective:at:(\d+),(\d+)$/.exec(cond);
  if(ma) return !!G.takenAt[ma[1]+","+ma[2]];
  // un Objectif PRÉCIS, désigné par son nom
  const mn = /^objective:named:(.+)$/.exec(cond);
  if(mn) return !!G.takenNames[mn[1]];
  // niveau de danger atteint par AU MOINS un Survivant
  const md = /^danger:(\w+)$/.exec(cond);
  if(md){
    const seuil = DANGER.findIndex(x=>x.key===md[1]);
    if(seuil<0) return true;
    return G.survivors.some(s2=>!s2.dead && dangerIdx(s2.xp)>=seuil);
  }
  const m = /^objective:(\w+)$/.exec(cond);
  if(m) return !!G.taken[m[1]];
  console.warn("Condition de quête inconnue :", cond);
  return true;
}
function condText(cond){
  if(cond==="never") return "jamais";
  if(cond==="objectives:all") return "tous les Objectifs récupérés";
  if(cond==="vault:all") return "les deux Artefacts de crypte récupérés";
  const mk = /^kill:(\w+)$/.exec(cond||"");
  if(mk){ const z=ZT[mk[1]]||{}, e=z.f?"e":"";
    return `au moins un${e} ${z.n||mk[1]} tué${e}`; }
  const ma = /^objective:at:(\d+),(\d+)$/.exec(cond||"");
  if(ma) return `l'Objectif en (${+ma[1]+1},${+ma[2]+1}) récupéré`;
  const mn = /^objective:named:(.+)$/.exec(cond||"");
  if(mn) return `« ${nomObjectif(mn[1])} » récupéré`;
  const md = /^danger:(\w+)$/.exec(cond||"");
  if(md){ const n=(DANGER.find(x=>x.key===md[1])||{}).name || md[1];
    return `niveau ${n} atteint par un Survivant`; }
  const m = /^objective:(\w+)$/.exec(cond||"");
  return m ? `Objectif ${colM(m[1])} récupéré` : "—";
}
const locks = () => (G.q.locks||{});

/* Condition de victoire de la quête.
     win.need : condition à remplir avant de pouvoir sortir — même vocabulaire
                que les verrous ("objectives:all", "objective:green", …).
                Absente = aucune condition préalable.
     win.exit : "all"  → tous les Survivants vivants doivent sortir (défaut)
                "any"  → un seul suffit
                "none" → aucune sortie requise, la condition suffit.
   Par défaut : tous les Objectifs, puis tout le monde sort. */
/* Si la quête fournit un objet `win`, il fait foi tel quel : un `win` sans
   `need` signifie « aucune condition préalable », pas « tous les Objectifs ».
   Le défaut historique ne s'applique qu'aux quêtes sans `win` du tout. */
/* Objectifs de mission. La quête en déclare une LISTE — « atteignez ces
   objectifs dans l'ordre que vous voulez » — chacun portant son intitulé et
   une ou plusieurs conditions, toutes requises.
     win.goals : [{label, need:[cond, …]}, …]
   L'ancienne forme `win.need` (une seule condition) reste lue, et vaut un
   objectif unique sans intitulé. */
function winCond(){
  const w = G.q.win;
  if(!w) return {goals:[{label:"", need:["objectives:all"]}], exit:"all"};
  let goals = Array.isArray(w.goals) ? w.goals.map(g=>({
        label: g.label||"",
        need: Array.isArray(g.need) ? g.need.filter(Boolean) : (g.need?[g.need]:[])
      })).filter(g=>g.need.length)
    : (w.need ? [{label:"", need:[w.need]}] : []);
  /* `mode` combine les buts entre eux : « all » les exige tous, « any » se
     contente d'un seul. Chaque but reste un ET de ses conditions, ce qui écrit
     « A OU (B ET C) » avec mode=any, but1=[A], but2=[B,C]. */
  return {goals, exit: w.exit || "all", mode: w.mode==="any" ? "any" : "all"};
}
const objectifAtteint = g => g.need.every(condMet);
function missionPrete(){
  const w = winCond();
  if(!w.goals.length) return true;
  return w.mode==="any" ? w.goals.some(objectifAtteint) : w.goals.every(objectifAtteint);
}
const EXIT_TXT = {all:"tous les Survivants vivants doivent sortir",
                  any:"au moins un Survivant doit sortir",
                  none:"aucune sortie requise"};
/* Intitulé d'un objectif : celui de la quête, sinon ses conditions en clair. */
const texteObjectif = g => g.label || g.need.map(condText).join(" et ");
function missionText(){
  const w = winCond();
  const bouts = w.goals.map(texteObjectif);
  let txt = bouts.join(w.mode==="any" ? " OU " : ", puis ");
  if(w.exit!=="none") txt += (txt?", puis ":"")+(EXIT_TXT[w.exit] || EXIT_TXT.all);
  return txt || "aucune condition";
}
/* Même chose, mais coché : c'est ce qui s'affiche pendant la partie. */
/* Ce qu'une couleur d'Objectif commande : les joueurs doivent savoir POURQUOI
   chercher les bleus. On lit les verrous de la quête, pas une note à part. */
function roleCouleur(c){
  const L = locks(), r = [], cible = "objective:"+c;
  Object.entries(L.doors||{}).forEach(([col,cond])=>{
    if(cond===cible) r.push(`ouvre les portes ${colF(col)}s`); });
  Object.entries(L.spawns||{}).forEach(([col,cond])=>{
    if(cond===cible) r.push(`réveille l'Invasion ${colF(col)}`); });
  Object.entries(L.spawnsOff||{}).forEach(([col,cond])=>{
    if(cond===cible) r.push(`éteint l'Invasion ${colF(col)}`); });
  if(winCond().goals.some(g=>g.need.includes(cible))) r.push("objectif de victoire");
  return r;
}
/* Objectifs encore à trouver, par couleur. Les cachés restent secrets : on
   n'annonce que la RÉSERVE de versos déclarée par la quête — l'information dont
   les joueurs disposent — sous forme de « ? », retirés au fur et à mesure. */
function objectifsRestants(){
  const par = {};
  const dans = c => (par[c] = par[c] || {vus:0, caches:0});
  G.zones.forEach(z=>{ if(z.obj && !z.obj.hidden) dans(z.obj.color).vus++; });
  (G.q.hiddenBacks||[]).forEach(c=>dans(c).caches++);
  Object.keys(par).forEach(c=>{
    par[c].caches = Math.max(0, par[c].caches - (G.revealed[c]||0));
  });
  return par;
}
function ligneObjectifs(){
  const par = objectifsRestants();
  const bouts = Object.entries(par)
    .filter(([c,n])=>n.vus || n.caches)
    .map(([c,n])=>{
      const q = [n.vus ? "×"+n.vus : "", "?".repeat(Math.min(n.caches,4))]
                  .filter(Boolean).join(" ");
      const role = roleCouleur(c);
      return `<span class="objc" style="--oc:${colCss(c)}">${colM(c)} ${q}`+
             (role.length ? ` <i>— ${role.join(", ")}</i>` : "")+`</span>`;
    });
  return bouts.length ? bouts.join(" ") : "";
}
function missionChecklist(){
  const w = winCond();
  const bouts = w.goals.map(g=>(objectifAtteint(g)?"✓ ":"✗ ")+texteObjectif(g));
  // « un seul suffit » doit se voir : sinon les croix restantes inquiètent pour rien
  let txt = bouts.join(w.mode==="any" ? " OU " : " · ");
  if(w.goals.length>1 && w.mode==="any") txt = "un seul suffit — "+txt;
  if(w.exit!=="none") txt += (txt?" · ":"")+(EXIT_TXT[w.exit] || EXIT_TXT.all);
  return txt;
}
/* Une Zone d'Invasion est active si sa couleur n'est pas verrouillée (ou l'est
   devenue) et n'a pas été désactivée. */
function spawnActive(tok){
  if(tok.necro) return true;                       // pion Nécromancien : toujours actif
  const L = locks();
  if(!condMet((L.spawns||{})[tok.color])) return false;
  const off = (L.spawnsOff||{})[tok.color];
  if(off && condMet(off)) return false;
  return true;
}
function doorLocked(color){
  const c = (locks().doors||{})[color];
  return c ? !condMet(c) : false;
}

/* ==========================================================================
   MOTEUR
   ========================================================================== */
const rnd  = n => Math.floor(Math.random()*n);
const d6   = () => 1+rnd(6);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const OPP = {n:"s", s:"n", e:"w", w:"e"};
const DXY = {n:[0,-1], s:[0,1], e:[1,0], w:[-1,0]};

let G = null;                      // état de partie
let UI = {tab:0, mode:null, data:null, reorgSel:null};

/* ---------- construction du plateau ---------- */
function buildBoard(q){
  const zones = [];
  for(let y=0;y<q.H;y++) for(let x=0;x<q.W;x++){
    const ch = q.map[y][x];
    zones.push({
      i: y*q.W+x, x, y,
      room: ch==="." ? null : ch,          // lettre = bâtiment ; chaque case est une Zone
      building: ch==="." ? null : ch,
      edge: {n:"open", e:"open", s:"open", w:"open"},   // open | wall | door
      door: {n:false, e:false, s:false, w:false},       // porte ouverte ?
      doorColor:{n:null, e:null, s:null, w:null},       // couleur de la porte
      cryptDoor:null, cryptOpen:false,   // trappe de crypte AU CENTRE de la Zone
      spawnTokens:[],                    // [{color, side, necro}] — rectangles dans la case
      items:[],                          // cartes d'Équipement posées dans la Zone
      exit:false,
      obj:null,                          // {color, hidden, back, revealed}
      noise:0, bile:false,
      markers:[],               // repères de quête posés au centre de la Zone
      explored: false,          // bâtiment déjà révélé (brouillard)
      buildingOpened:false
    });
  }
  const at = (x,y) => (x<0||y<0||x>=q.W||y>=q.H) ? null : zones[y*q.W+x];

  // murs implicites : toute arête entre deux pièces différentes, ou entre
  // une pièce et la rue, est un mur.
  zones.forEach(z=>{
    for(const s of ["n","e","s","w"]){
      const [dx,dy]=DXY[s], nb = at(z.x+dx, z.y+dy);
      if(!nb){ z.edge[s]="wall"; continue; }
      if(z.room !== nb.room) z.edge[s]="wall";
    }
  });
  /* Limites explicites : le TYPE d'une arête, quand il ne correspond pas à ce
     que les lettres impliquent. Vocabulaire des règles :
       "mur"       infranchissable, coupe la vue ;
       "ouverture" franchissable et transparente, mais les deux Zones restent
                   DISTINCTES — c'est déjà le cas ici, où chaque case est une
                   Zone, donc rien de plus à faire que d'ouvrir l'arête ;
       "aucune"    pas de limite du tout (façade ouverte sur la rue).
     Un type inconnu (limites Green Horde à venir) est traité comme un mur :
     c'est le choix prudent tant que ses règles ne sont pas écrites. */
  /* « ouverture » et « aucune » se franchissent toutes deux, mais seule
     « aucune » signifie l'absence de limite. Une ouverture SÉPARE deux Zones
     (livret) et se dessine comme un mur percé : les confondre effaçait le
     contour des pièces et fusionnait des Zones distinctes. */
  const ETAT_LIM = {ouverture:"opening", aucune:"open"};
  (q.limits||[]).forEach(l=>{
    const z = at(l.x,l.y), nb = at(l.x+DXY[l.s][0], l.y+DXY[l.s][1]);
    if(!z) return;
    const etat = ETAT_LIM[l.t] || "wall";
    z.edge[l.s]=etat;
    if(nb) nb.edge[OPP[l.s]]=etat;
  });
  /* Format antérieur : murs explicites binaires. */
  (q.walls||[]).forEach(w=>{
    const z = at(w.x,w.y), nb = at(w.x+DXY[w.s][0], w.y+DXY[w.s][1]);
    if(!z) return;
    z.edge[w.s]="wall";
    if(nb) nb.edge[OPP[w.s]]="wall";
  });
  /* Ouvertures : murs volontairement absents (issus des tuiles de terrain, ou
     posés à la main dans l'éditeur) — un passage libre, sans porte. Une porte
     déclarée sur la même arête (ci-dessous) reprend le dessus. */
  (q.openings||[]).forEach(o=>{
    const z = at(o.x,o.y), nb = at(o.x+DXY[o.s][0], o.y+DXY[o.s][1]);
    if(!z || !nb) return;
    z.edge[o.s]="open"; nb.edge[OPP[o.s]]="open";
  });
  // portes déclarées par la quête
  (q.doors||[]).forEach(d=>{
    if(d.crypt) return;                       // ancien format, converti plus bas
    const z = at(d.x,d.y), nb = at(d.x+DXY[d.s][0], d.y+DXY[d.s][1]);
    if(!z || !nb) return;
    z.edge[d.s]="door";        nb.edge[OPP[d.s]]="door";
    z.doorColor[d.s]=d.color||null; nb.doorColor[OPP[d.s]]=d.color||null;
    if(d.open){ z.door[d.s]=true; nb.door[OPP[d.s]]=true; }   // porte déjà ouverte
  });
  /* Porte de crypte : ce n'est pas une arête mais une trappe posée AU CENTRE
     d'une Zone. L'ouvrir relie cette Zone à la Zone de Crypte de la même
     couleur, hors plateau (p.32). Le champ `crypt` sur une porte est l'ancien
     format et reste accepté. */
  const cryptDoors = (q.cryptDoors||[]).concat(
        (q.doors||[]).filter(d=>d.crypt).map(d=>({x:d.x,y:d.y,color:d.crypt})));
  cryptDoors.forEach(d=>{ const z=at(d.x,d.y); if(z) z.cryptDoor=d.color; });
  const colors = [...new Set(cryptDoors.map(d=>d.color))];
  colors.forEach(col=>{
    zones.push({
      i: zones.length, x:-1, y:-1, crypt: col, room:"crypte:"+col, building:"crypte:"+col,
      edge:{}, door:{}, doorColor:{}, cryptDoor:null, cryptOpen:true,
      spawnTokens:[], items:[], exit:false, obj:null,
      noise:0, bile:false, markers:[], explored:true, buildingOpened:true,
      vaultCards:[]
    });
  });
  // tokens
  q.spawns.forEach(p=>{
    const z=at(p.x,p.y); if(z) z.spawnTokens.push({color:p.color||"red", side:p.side||"n"});
  });
  if(q.exit && at(q.exit.x,q.exit.y)) at(q.exit.x,q.exit.y).exit = true;
  /* Marqueurs décrits par la quête. Un marqueur « bile » pose une vraie Bile de
     Dragon ; les autres ne sont, pour l'instant, que des repères visuels. */
  (q.markers||[]).forEach(m=>{
    const z=at(m.x,m.y); if(!z || !MARQUEURS[m.t]) return;
    if(m.t==="bile") z.bile=true; else z.markers.push(m.t);
  });
  q.objectives.forEach(p=>{
    const z=at(p.x,p.y); if(!z) return;
    z.obj = {color:p.color||"red", hidden:!!p.hidden, back:p.back||null,
             revealed:!p.hidden, name:p.name||null};
  });
  /* ---- Zones : une case de rue est une Zone à elle seule ; un bâtiment peut
     en couvrir plusieurs, tant qu'aucune limite ne les sépare (livret p.10 :
     « La position d'une figurine dans la zone et l'agencement des murs n'ont
     aucune importance »). `grp` porte la case de référence de la Zone : les
     figurines s'y tiennent, ce qui évite de les dessiner en double. */
  zones.forEach(z=>{ z.grp = z.i; });
  zones.filter(z=>z.room && !z.crypt).forEach(z=>{
    if(z.grp !== z.i) return;                       // déjà rattachée
    const pile=[z];
    while(pile.length){
      const c=pile.pop();
      for(const sd of ["n","e","s","w"]){
        if(c.edge[sd]!=="open") continue;   // mur, porte OU ouverture : Zones distinctes
        const nb = at(c.x+DXY[sd][0], c.y+DXY[sd][1]);
        if(!nb || !nb.room || nb.room!==z.room || nb.grp===z.i) continue;
        nb.grp = z.i; pile.push(nb);
      }
    }
  });
  /* ---- Complexes de bâtiment ----
     Une Ouverture sépare deux ZONES mais pas deux pièces : de part et d'autre,
     c'est le même bâtiment. C'est lui qu'une porte ouvre, et c'est dans chacune
     de ses Zones que l'Invasion se résout — une seule fois.
     Sans cette notion, chaque lettre passait pour un bâtiment distinct : entrer
     par une Ouverture n'ouvrait rien, et la porte suivante déclenchait une
     Invasion dans une Zone déjà occupée. */
  zones.forEach(z=>{ z.cplx = z.i; });
  zones.filter(z=>z.room && !z.crypt).forEach(z=>{
    if(z.cplx !== z.i) return;
    const pile=[z];
    while(pile.length){
      const c=pile.pop();
      for(const sd of ["n","e","s","w"]){
        if(c.edge[sd]!=="open" && c.edge[sd]!=="opening") continue;
        const nb = at(c.x+DXY[sd][0], c.y+DXY[sd][1]);
        if(!nb || !nb.room || nb.cplx===z.i) continue;
        nb.cplx = z.i; pile.push(nb);
      }
    }
  });
  /* Un bâtiment auquel on accède sans ouvrir de porte n'a jamais été clos :
     il est ouvert dès la mise en place, et ne déclenche aucune Invasion. */
  const ouverts = new Set();
  zones.filter(z=>z.room && !z.crypt).forEach(z=>{
    for(const sd of ["n","e","s","w"]){
      if(z.edge[sd]!=="open" && z.edge[sd]!=="opening") continue;
      const nb = at(z.x+DXY[sd][0], z.y+DXY[sd][1]);
      if(!nb || !nb.room) ouverts.add(z.cplx);       // donne sur la rue ou le bord
    }
  });
  zones.forEach(z=>{ if(z.room && ouverts.has(z.cplx)){
    z.buildingOpened = true; z.explored = true; } });

  // la rue est toujours visible ; les bâtiments sont dans le brouillard
  zones.forEach(z=>{ if(!z.room) z.explored=true; });
  // Un bâtiment dont une porte est déjà ouverte au départ n'est jamais envahi (p.19).
  (q.openAtStart||[]).forEach(b=>zones.filter(z=>z.building===b)
                                       .forEach(z=>{ z.buildingOpened=true; z.explored=true; }));
  return zones;
}
const cryptZone = col => G.zones.find(z=>z.crypt===col);
const Z  = i => G.zones[i];
const AT = (x,y) => (x<0||y<0||x>=G.q.W||y>=G.q.H) ? null : G.zones[y*G.q.W+x];

/* ---------- adjacence / déplacement ---------- */
function openSide(z,s){
  if(z.edge[s]==="open" || z.edge[s]==="opening") return true;
  if(z.edge[s]==="door") return !!z.door[s];
  return false;
}
/* Zones accessibles en 1 Déplacement. Une porte de crypte ouverte relie la case
   à la Zone de Crypte de sa couleur, « comme si elles étaient connectées » (p.32). */
/* Zones voisines. On part de TOUTES les cases de la Zone et on renvoie des
   Zones (leur case de référence), jamais des cases : deux cases d'une même
   Zone ne sont pas voisines, elles sont le même endroit. */
function neighbours(i){
  const z=Z(i);
  if(z.crypt){
    // depuis la crypte : toutes les Zones dont la trappe de cette couleur est ouverte
    const out=[];
    G.zones.forEach(o=>{ if(!o.crypt && o.cryptDoor===z.crypt && o.cryptOpen) out.push(ref(o.i)); });
    return [...new Set(out)];
  }
  const moi = ref(i), vus = new Set();
  casesZone(i).forEach(c=>{
    for(const sd of ["n","e","s","w"]){
      if(!openSide(c,sd)) continue;
      const nb = AT(c.x+DXY[sd][0], c.y+DXY[sd][1]);
      if(nb && ref(nb.i)!==moi) vus.add(ref(nb.i));
    }
    if(c.cryptDoor && c.cryptOpen){ const k=cryptZone(c.cryptDoor); if(k) vus.add(k.i); }
  });
  return [...vus];
}
/* Distances depuis i. `asIfOpen` : les zombies tracent leur route comme si
   toutes les portes étaient ouvertes (p.25), même si elles les bloquent. */
function bfsFrom(i, asIfOpen){
  const d = new Array(G.zones.length).fill(-1); d[i]=0;
  const q=[i];
  while(q.length){ const c=q.shift();
    for(const nb of (asIfOpen ? neighboursOpen(c) : neighbours(c)))
      if(d[nb]<0){ d[nb]=d[c]+1; q.push(nb); } }
  return d;
}
function neighboursOpen(i){
  const z=Z(i), out=[];
  if(z.crypt){
    G.zones.forEach(o=>{ if(!o.crypt && o.cryptDoor===z.crypt) out.push(o.i); });
    return out;
  }
  for(const s of ["n","e","s","w"]){
    if(z.edge[s]==="wall") continue;
    const nb = AT(z.x+DXY[s][0], z.y+DXY[s][1]);
    if(nb) out.push(nb.i);
  }
  if(z.cryptDoor){ const c=cryptZone(z.cryptDoor); if(c) out.push(c.i); }
  return out;
}

/* ---------- ligne de vue ----------
   Rue      : lignes droites dans les 4 directions à travers les zones de rue ;
              1 seule zone de profondeur à l'intérieur d'un bâtiment (porte ouverte).
   Bâtiment : voit toutes les zones de sa pièce ; et, par une porte ouverte
              donnant sur la rue, la ligne droite de rue au-delà.
   ------------------------------------------------------- */
/* Ligne de vue (p.10) :
   — dans la rue : lignes droites dans les 4 directions, autant de Zones de rue
     que la ligne en traverse, et UNE SEULE Zone à l'intérieur d'un bâtiment ;
   — dans un bâtiment : toutes les Zones partageant une ouverture, limité à
     UNE Zone de distance ; en regardant dehors, la rue en ligne droite ;
   — aucune ligne de vue entre une crypte et les Zones qui la relient (p.32). */
/* Ligne de vue : on regarde depuis chaque case de la Zone, et on ne retient
   que des Zones. */
function los(i){
  if(Z(i).crypt) return new Set([ref(i)]);
  const vues=new Set();
  casesZone(i).forEach(c=>losCase(c.i).forEach(k=>vues.add(ref(k))));
  return vues;
}
function losCase(i){
  const z=Z(i), seen=new Set([i]);
  if(z.crypt) return seen;                     // la crypte ne voit qu'elle-même
  const inside = !!z.building;
  for(const s of ["n","e","s","w"]){
    if(!openSide(z,s)) continue;
    let cur = AT(z.x+DXY[s][0], z.y+DXY[s][1]);
    if(!cur) continue;
    seen.add(cur.i);
    if(inside){
      // depuis un bâtiment : 1 Zone, sauf si on débouche sur la rue
      if(cur.building) continue;
    } else if(cur.building) continue;          // 1 seule Zone dans un bâtiment
    while(true){                               // la rue se voit en ligne droite
      if(!openSide(cur,s)) break;
      const nx = AT(cur.x+DXY[s][0], cur.y+DXY[s][1]);
      if(!nx) break;
      seen.add(nx.i);
      if(nx.building) break;                   // 1 seule Zone dans le bâtiment
      cur = nx;
    }
  }
  return seen;
}

/* ---------- accès rapides ---------- */
const alive     = () => G.survivors.filter(s=>!s.dead && !s.escaped);
const onBoard   = () => G.survivors.filter(s=>!s.dead && !s.escaped);
/* Une Zone peut couvrir plusieurs cases : on interroge toujours sa case de
   référence, où se tiennent les figurines. */
const ref        = i  => (Z(i) && Z(i).grp!=null) ? Z(i).grp : i;
const memeZone   = (a,b) => ref(a)===ref(b);
const casesZone  = i  => G.zones.filter(z=>ref(z.i)===ref(i));
const survIn    = i  => onBoard().filter(s=>s.z===ref(i));
const zombiesIn = i  => G.zombies.filter(zz=>zz.z===ref(i));
/* Pour le DESSIN, il faut interroger la case et non la Zone : sinon chaque
   case d'une Zone de plusieurs cases dessinerait les mêmes figurines. Les
   acteurs se tenant tous sur la case de référence, ils n'apparaissent qu'une
   fois, à cet endroit. */
const survInCase    = i => onBoard().filter(s=>s.z===i);
const zombiesInCase = i => G.zombies.filter(zz=>zz.z===i);
/* Le Bruit se compte par Zone : les jetons de toutes ses cases s'additionnent. */
function noiseOf(i){
  return casesZone(i).reduce((n,c)=>n+c.noise,0) + survIn(i).filter(s=>!s.invisible).length;
}

/* ---------- niveau de danger & compétences ---------- */
function dangerIdx(xp){ for(let k=0;k<4;k++) if(xp<=DANGER[k].max) return k; return 3; }
/* Équipement magique : la carte porte des gemmes indiquant à partir de quel
   Niveau de Danger elle s'utilise. En dessous, elle se transporte mais ne sert
   à rien. `niv` absent = utilisable dès le Bleu, comme la majorité des cartes. */
function niveauOK(s, e){ return !e || !e.niv || dangerIdx(s.xp) >= e.niv; }
function refusNiveau(e){
  return `${e.n} demande le Niveau ${DANGER[e.niv].name} : le Survivant ne peut pas encore s'en servir.`;
}
function teamDanger(){ return alive().length ? Math.max(...alive().map(s=>dangerIdx(s.xp))) : 0; }
/* Une compétence peut venir de la fiche du Survivant OU d'une carte équipée
   qui la confère — encore faut-il que la carte soit utilisable à son Niveau. */
function hasSkill(s, name){
  if(s.skills.includes(name)) return true;
  /* On lit `s.hands` et non handCards(), qui consulte lui-même les compétences
     (Grimoire) : la récursion serait sans fin. Une carte doit de toute façon
     être vraiment en main pour conférer quoi que ce soit. */
  return s.hands.some(c=>c && c.e.comp===name && niveauOK(s,c.e));
}
/* Nom d'un type de Zombie accordé en nombre. */
const plurZ = (t,n) => n>1 ? (ZT[t].pl || ZT[t].n+"s") : ZT[t].n;

/* Marqueurs de Zone : grande image posée au centre de la case, SOUS les
   figurines et les autres jetons. Seule la Bile a une règle dans le moteur ;
   Feu et Cercle magique sont pour l'instant de simples repères de quête. */
const MARQUEURS = {
  cercle_magique:{n:"Cercle magique", regle:false},
  feu:           {n:"Feu",            regle:false},
  bile:          {n:"Bile de Dragon", regle:true}
};
const MARQ_ORDRE = ["cercle_magique","feu","bile"];

/* --------------------------------------------------------------------------
   CATALOGUE DE MISSIONS
   Un navigateur ne sait pas lister un dossier : la liste vient du fichier
   zombicide_fichiers/zombicide_missions/missions.js, inclus par une balise de
   script dans la page.
   Une entrée porte soit la quête directement (`quest`), soit le nom d'un JSON
   voisin (`file`). Le second cas passe par fetch(), que les navigateurs
   REFUSENT quand la page est ouverte en file:// — d'où le message explicite.
   -------------------------------------------------------------------------- */
const MISSION_DIR = "zombicide_fichiers/zombicide_missions/";
/* Chaque mission est un fichier .js qui s'annonce lui-même par ZBP_MISSION().
   C'est la seule forme qui marche AUSSI en file:// : une balise de script est
   autorisée là où fetch ne l'est pas. Surtout, la quête n'existe qu'à UN seul
   endroit — une copie dans le catalogue finissait fatalement par dater. */
window.ZBP_MISSIONS = window.ZBP_MISSIONS || [];
window.ZBP_MISSION = e => { if(e) window.ZBP_MISSIONS.push(e); };
const missionsDispo = () => Array.isArray(window.ZBP_MISSIONS) ? window.ZBP_MISSIONS : [];
/* Charge les fichiers listés par missions.js, puis rend la main. Un fichier
   absent est ignoré : le menu montre simplement les autres. */
function chargerFichiersMissions(cb){
  const liste = Array.isArray(window.ZBP_MISSION_FILES) ? window.ZBP_MISSION_FILES : [];
  let reste = liste.length;
  if(!reste) return cb();
  liste.forEach(f=>{
    const sc=document.createElement("script");
    sc.src = MISSION_DIR + f;
    sc.onload = sc.onerror = ()=>{ if(!--reste) cb(); };
    document.head.appendChild(sc);
  });
}
/* Quand une entrée porte les DEUX, le FICHIER fait foi : la copie `quest` du
   catalogue n'est qu'un repli pour file://, où fetch est interdit. Sans cette
   priorité, modifier le .json resterait sans effet — la copie l'emporterait en
   silence. `chargerMission` rend aussi d'où vient la quête, pour le dire. */
async function chargerMission(entree){
  if(!entree) return null;
  if(entree.file){
    let r=null, lisible=true;
    try{ r = await fetch(MISSION_DIR + entree.file); }
    catch(e){ lisible=false; }
    if(lisible && r && r.ok){
      const q = await r.json();
      q.__source = "fichier";
      return q;
    }
    if(!entree.quest)
      throw new Error(lisible
        ? ("fichier introuvable : "+entree.file)
        : "lecture impossible depuis file:// — sers le dossier en http, "+
          "ou écris la quête dans missions.js (champ `quest`)");
  }
  if(entree.quest){
    const q = JSON.parse(JSON.stringify(entree.quest));
    q.__source = entree.file ? "copie du catalogue" : "catalogue";
    return q;
  }
  throw new Error("entrée de mission sans `quest` ni `file`");
}

/* --------------------------------------------------------------------------
   RÈGLES SPÉCIALES DE QUÊTE
   Deux familles. Les règles GLOBALES modifient la mise en place ou la lecture
   des cartes ; les EFFETS D'OBJECTIF se déclenchent quand un Survivant
   récupère un Objectif de la couleur voulue.
   -------------------------------------------------------------------------- */
const regles = () => (G && G.q.rules) || {};
const REGLES_GLOBALES = {
  necroAside:  "Cartes Nécromancien mises de côté",
  abomAsFatty: "Un « A » sur une carte d'Invasion place un Fatty"
};
const EFFETS_OBJ = {
  xp:    {n:"Gagner des XP",             val:"nombre"},
  necro: {n:"Faire apparaître un Nécromancien"},
  equip: {n:"Recevoir un Équipement précis", val:"equip"},
  draw:  {n:"Tirer une carte au hasard dans une liste", val:"liste"}
};
/* Les Artefacts de crypte ne sont pas une récompense mais un BUT : « récupérer
   les deux Artefacts » est une condition, au même titre que « tous les
   Objectifs ». Elle peut donc commander une porte, une Invasion ou la Mission. */
/* Illustrations des cartes : zombicide_fichiers/sprites/equip_<id>.png, même
   convention que surv_<id>.png. La clé est préfixée pour ne pas risquer de
   heurter celle d'un Survivant ou d'un Zombie. */
EQUIP.forEach(e=>{ SPRITES["eq_"+e.id] = "equip_" + e.id + ".png"; });

const ARTEFACTS = EQUIP.filter(e=>e.vault).map(e=>e.id);
function artefactsRecuperes(){
  if(!ARTEFACTS.length) return true;
  return ARTEFACTS.every(id => G.survivors.some(s =>
    [...s.hands, ...s.back, s.body].some(c => c && c.id===id)));
}
function texteEffet(ef){
  if(!ef || !EFFETS_OBJ[ef.t]) return "?";
  if(ef.t==="xp")    return `+${ef.n|0} XP`;
  if(ef.t==="equip") return "Équipement : "+((EQ[ef.id]||{}).n || ef.id);
  if(ef.t==="draw")  return `Tirage au hasard parmi ${(ef.ids||[]).length} carte(s)`;
  return EFFETS_OBJ[ef.t].n;
}

/* --------------------------------------------------------------------------
   MISE EN PLACE
   -------------------------------------------------------------------------- */
/* `ids` : identifiants des Survivants retenus. Sans argument, tous jouent. */
function newGame(ids){
  const choisis = (ids && ids.length) ? ids : SURVIVORS.map(v=>v.id);
  document.getElementById("setup").style.display="none";
  document.getElementById("banner").style.display="none";
  document.getElementById("modal").style.display="none";
  document.getElementById("log").innerHTML="";
  UI = {tab:0, mode:null, data:null, reorgSel:null};
  const q = QUEST;
  G = {
    q, zones: buildBoard(q), survivors: [], zombies: [], nextZid: 1,
    round: 1, phase: "players", over: false,
    equipDeck: [], equipDiscard: [], spawnDeck: [], spawnDiscard: [],
    pool: {}, vaultDeck: [], objectivesLeft: q.objectives.length, firstPlayer: 0,
    taken: {},                       // Objectifs récupérés, par couleur
    kills: {},                       // zombies tués, par type
    traces: [],                      // trajets de la dernière Phase des Zombies
    takenAt: {},                     // Objectifs récupérés, par case "x,y"
    takenNames: {},                  // Objectifs nommés récupérés, par clé
    revealed: {},                    // versos d'Objectifs cachés déjà retournés
    customMap: JSON.stringify(q) !== JSON.stringify(DEFAULT_QUEST)
  };
  /* Objectifs cachés : recto toujours rouge, verso tiré au sort dans la réserve
     `hiddenBacks` de la quête (les versos non fournis restent rouges). */
  const caches = G.zones.filter(z=>z.obj && z.obj.hidden);
  const versos = shuffle((q.hiddenBacks||[]).slice());
  caches.forEach(z=>{ if(!z.obj.back) z.obj.back = versos.pop() || "red"; });
  Object.keys(ZT).forEach(k=>G.pool[k]=ZT[k].pool);

  /* Zombies présents dès la mise en place, décrits par la quête. Placés APRÈS
     l'initialisation du stock, sinon ils ne seraient pas décomptés. */
  (q.zombies||[]).forEach(z=>{
    if(!ZT[z.t]) return console.warn("Type de zombie inconnu :", z.t);
    const zone = at2(q, z.x, z.y);
    if(zone==null) return;
    for(let k=0;k<Math.max(1, z.n|0 || 1);k++) addZombie(z.t, zone);
  });

  // decks
  const starters=[];
  EQUIP.forEach(e=>{
    for(let k=0;k<quantiteEquip(e,"start");k++) starters.push(mkCard(e.id));
    /* Un Artefact reste mis de côté quoi qu'en dise le deck : il ne se trouve
       qu'en Crypte. */
    if(!e.vault) for(let k=0;k<quantiteEquip(e,"deck");k++) G.equipDeck.push(mkCard(e.id));
    /* Les Artefacts se comptent eux aussi : sans quoi ceux des extensions
       s'inviteraient dans une partie qui n'en veut pas. */
    if(e.vault) for(let k=0;k<quantiteEquip(e,"vault");k++) G.vaultDeck.push(mkCard(e.id));
  });
  shuffle(G.equipDeck); shuffle(starters); shuffle(G.vaultDeck);
  /* « Mettez de côté les cartes Nécromancien » : elles quittent le paquet,
     elles ne sont pas simplement ignorées à la lecture. */
  G.tableInv = tableInvasion();
  let cartesInv = G.tableInv.map((r,i)=>({id:i+1, row:r}));
  if((q.rules||{}).necroAside){
    const avant = cartesInv.length;
    cartesInv = cartesInv.filter(c=>!c.row.some(x=>x.indexOf("N")>=0));
    logLine(`Règle spéciale : ${avant-cartesInv.length} carte(s) Nécromancien mises de côté.`,"l-sys");
  }
  G.spawnDeck = shuffle(cartesInv);
  if(deckChoisi)
    logLine(`Deck « ${deckChoisi.nom} » : ${G.equipDeck.length} cartes de Fouille, `+
            `${starters.length} armes de départ, ${G.tableInv.length} cartes d'Invasion.`,"l-sys");

  // survivants retenus — on conserve l'index d'origine dans SURVIVORS, dont
  // dépend la relecture des sauvegardes
  SURVIVORS.forEach((sv,k)=>{
    if(!choisis.includes(sv.id)) return;
    G.survivors.push({
      ...sv, idx:k, z: ref(q.start.y*q.W + q.start.x), xp:0, wounds:0,
      dead:false, escaped:false,
      hands:new Array(RULES.handSlots).fill(null),
      back: new Array(RULES.backSlots).fill(null),
      body:null,
      skills:[], pending:[], actions:0, free:[], searched:false,
      reorgFree:true, invisible:false, ench:{}, hitRun:false,
      jumped:false, sprinted:false
    });
    /* Arme de départ : celle choisie sur l'écran de sélection si elle est
       encore disponible, sinon une carte prise au hasard dans ce qui reste. */
    const voulu = GEAR[sv.id];
    let c = null;
    if(voulu){
      const k = starters.findIndex(x=>x.id===voulu);
      if(k>=0) c = starters.splice(k,1)[0];
      else console.warn("Arme de départ épuisée pour", sv.id, ":", voulu);
    }
    if(!c) c = starters.pop();
    if(c) G.survivors[G.survivors.length-1].hands[0]=c;
  });
  /* Objets posés par la quête.
       q.items      : [{x,y,id}]           — une carte dans une Zone du plateau
       q.cryptItems : {couleur:[id,…]}     — le contenu d'une crypte
     Si la quête ne décrit aucun contenu de crypte, on garde le comportement par
     défaut : les Artefacts de crypte sont répartis entre les cryptes (p.33). */
  (q.items||[]).forEach(it=>{
    const zi = at2(q, it.x, it.y);
    if(zi==null) return;
    const c = mkCard(it.id);
    if(!c.e) return console.warn("Objet inconnu :", it.id);
    for(let k=0;k<Math.max(1, it.n|0 || 1);k++) G.zones[zi].items.push(mkCard(it.id));
  });
  const crypts = G.zones.filter(z=>z.crypt);
  const ci = q.cryptItems || null;
