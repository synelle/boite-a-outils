const rnd  = n => Math.floor(Math.random()*n);
const d6   = () => 1+rnd(6);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const OPP = {n:"s", s:"n", e:"w", w:"e"};
const DXY = {n:[0,-1], s:[0,1], e:[1,0], w:[-1,0]};

let G = null;                      // état de partie
let UI = {tab:0, mode:null, data:null, reorgSel:null};

/* ---------- construction du plateau ---------- */
function buildBoard(q){
  const zones = [];
  for(let y=0;y<q.H;y++) for(let x=0;x<q.W;x++){
    const ch = q.map[y][x];
    zones.push({
      i: y*q.W+x, x, y,
      room: ch==="." ? null : ch,          // lettre = bâtiment ; chaque case est une Zone
      building: ch==="." ? null : ch,
      edge: {n:"open", e:"open", s:"open", w:"open"},   // open | wall | door
      door: {n:false, e:false, s:false, w:false},       // porte ouverte ?
      doorColor:{n:null, e:null, s:null, w:null},       // couleur de la porte
      cryptDoor:null, cryptOpen:false,   // trappe de crypte AU CENTRE de la Zone
      spawnTokens:[],                    // [{color, side, necro}] — rectangles dans la case
      exit:false,
      obj:null,                          // {color, hidden, back, revealed}
      noise:0, bile:false,
      explored: false,          // bâtiment déjà révélé (brouillard)
      buildingOpened:false
    });
  }
  const at = (x,y) => (x<0||y<0||x>=q.W||y>=q.H) ? null : zones[y*q.W+x];

  // murs implicites : toute arête entre deux pièces différentes, ou entre
  // une pièce et la rue, est un mur.
  zones.forEach(z=>{
    for(const s of ["n","e","s","w"]){
      const [dx,dy]=DXY[s], nb = at(z.x+dx, z.y+dy);
      if(!nb){ z.edge[s]="wall"; continue; }
      if(z.room !== nb.room) z.edge[s]="wall";
    }
  });
  // portes déclarées par la quête
  (q.doors||[]).forEach(d=>{
    if(d.crypt) return;                       // ancien format, converti plus bas
    const z = at(d.x,d.y), nb = at(d.x+DXY[d.s][0], d.y+DXY[d.s][1]);
    if(!z || !nb) return;
    z.edge[d.s]="door";        nb.edge[OPP[d.s]]="door";
    z.doorColor[d.s]=d.color||null; nb.doorColor[OPP[d.s]]=d.color||null;
    if(d.open){ z.door[d.s]=true; nb.door[OPP[d.s]]=true; }   // porte déjà ouverte
  });
  /* Porte de crypte : ce n'est pas une arête mais une trappe posée AU CENTRE
     d'une Zone. L'ouvrir relie cette Zone à la Zone de Crypte de la même
     couleur, hors plateau (p.32). Le champ `crypt` sur une porte est l'ancien
     format et reste accepté. */
  const cryptDoors = (q.cryptDoors||[]).concat(
        (q.doors||[]).filter(d=>d.crypt).map(d=>({x:d.x,y:d.y,color:d.crypt})));
  cryptDoors.forEach(d=>{ const z=at(d.x,d.y); if(z) z.cryptDoor=d.color; });
  const colors = [...new Set(cryptDoors.map(d=>d.color))];
  colors.forEach(col=>{
    zones.push({
      i: zones.length, x:-1, y:-1, crypt: col, room:"crypte:"+col, building:"crypte:"+col,
      edge:{}, door:{}, doorColor:{}, cryptDoor:null, cryptOpen:true,
      spawnTokens:[], exit:false, obj:null,
      noise:0, bile:false, explored:true, buildingOpened:true,
      vaultCards:[]
    });
  });
  // tokens
  q.spawns.forEach(p=>{
    const z=at(p.x,p.y); if(z) z.spawnTokens.push({color:p.color||"red", side:p.side||"n"});
  });
  if(q.exit && at(q.exit.x,q.exit.y)) at(q.exit.x,q.exit.y).exit = true;
  q.objectives.forEach(p=>{
    const z=at(p.x,p.y); if(!z) return;
    z.obj = {color:p.color||"red", hidden:!!p.hidden, back:p.back||null, revealed:!p.hidden};
  });
  // la rue est toujours visible ; les bâtiments sont dans le brouillard
  zones.forEach(z=>{ if(!z.room) z.explored=true; });
  // Un bâtiment dont une porte est déjà ouverte au départ n'est jamais envahi (p.19).
  (q.openAtStart||[]).forEach(b=>zones.filter(z=>z.building===b)
                                       .forEach(z=>{ z.buildingOpened=true; z.explored=true; }));
  return zones;
}
const cryptZone = col => G.zones.find(z=>z.crypt===col);
const Z  = i => G.zones[i];
const AT = (x,y) => (x<0||y<0||x>=G.q.W||y>=G.q.H) ? null : G.zones[y*G.q.W+x];

/* ---------- adjacence / déplacement ---------- */
function openSide(z,s){
  if(z.edge[s]==="open") return true;
  if(z.edge[s]==="door") return !!z.door[s];
  return false;
}
/* Zones accessibles en 1 Déplacement. Une porte de crypte ouverte relie la case
   à la Zone de Crypte de sa couleur, « comme si elles étaient connectées » (p.32). */
function neighbours(i){
  const z=Z(i), out=[];
  if(z.crypt){
    // depuis la crypte : toutes les Zones dont la trappe de cette couleur est ouverte
    G.zones.forEach(o=>{ if(!o.crypt && o.cryptDoor===z.crypt && o.cryptOpen) out.push(o.i); });
    return out;
  }
  for(const s of ["n","e","s","w"]){
    if(!openSide(z,s)) continue;
    const nb = AT(z.x+DXY[s][0], z.y+DXY[s][1]);
    if(nb) out.push(nb.i);
  }
  if(z.cryptDoor && z.cryptOpen){ const c=cryptZone(z.cryptDoor); if(c) out.push(c.i); }
  return out;
}
/* Distances depuis i. `asIfOpen` : les zombies tracent leur route comme si
   toutes les portes étaient ouvertes (p.25), même si elles les bloquent. */
function bfsFrom(i, asIfOpen){
  const d = new Array(G.zones.length).fill(-1); d[i]=0;
  const q=[i];
  while(q.length){ const c=q.shift();
    for(const nb of (asIfOpen ? neighboursOpen(c) : neighbours(c)))
      if(d[nb]<0){ d[nb]=d[c]+1; q.push(nb); } }
  return d;
}
function neighboursOpen(i){
  const z=Z(i), out=[];
  if(z.crypt){
    G.zones.forEach(o=>{ if(!o.crypt && o.cryptDoor===z.crypt) out.push(o.i); });
    return out;
  }
  for(const s of ["n","e","s","w"]){
    if(z.edge[s]==="wall") continue;
    const nb = AT(z.x+DXY[s][0], z.y+DXY[s][1]);
    if(nb) out.push(nb.i);
  }
  if(z.cryptDoor){ const c=cryptZone(z.cryptDoor); if(c) out.push(c.i); }
  return out;
}

/* ---------- ligne de vue ----------
   Rue      : lignes droites dans les 4 directions à travers les zones de rue ;
              1 seule zone de profondeur à l'intérieur d'un bâtiment (porte ouverte).
   Bâtiment : voit toutes les zones de sa pièce ; et, par une porte ouverte
              donnant sur la rue, la ligne droite de rue au-delà.
   ------------------------------------------------------- */
/* Ligne de vue (p.10) :
   — dans la rue : lignes droites dans les 4 directions, autant de Zones de rue
     que la ligne en traverse, et UNE SEULE Zone à l'intérieur d'un bâtiment ;
   — dans un bâtiment : toutes les Zones partageant une ouverture, limité à
     UNE Zone de distance ; en regardant dehors, la rue en ligne droite ;
   — aucune ligne de vue entre une crypte et les Zones qui la relient (p.32). */
function los(i){
  const z=Z(i), seen=new Set([i]);
  if(z.crypt) return seen;                     // la crypte ne voit qu'elle-même
  const inside = !!z.building;
  for(const s of ["n","e","s","w"]){
    if(!openSide(z,s)) continue;
    let cur = AT(z.x+DXY[s][0], z.y+DXY[s][1]);
    if(!cur) continue;
    seen.add(cur.i);
    if(inside){
      // depuis un bâtiment : 1 Zone, sauf si on débouche sur la rue
      if(cur.building) continue;
    } else if(cur.building) continue;          // 1 seule Zone dans un bâtiment
    while(true){                               // la rue se voit en ligne droite
      if(!openSide(cur,s)) break;
      const nx = AT(cur.x+DXY[s][0], cur.y+DXY[s][1]);
      if(!nx) break;
      seen.add(nx.i);
      if(nx.building) break;                   // 1 seule Zone dans le bâtiment
      cur = nx;
    }
  }
  return seen;
}

/* ---------- accès rapides ---------- */
const alive     = () => G.survivors.filter(s=>!s.dead && !s.escaped);
const onBoard   = () => G.survivors.filter(s=>!s.dead && !s.escaped);
const survIn    = i  => onBoard().filter(s=>s.z===i);
const zombiesIn = i  => G.zombies.filter(zz=>zz.z===i);
function noiseOf(i){ return Z(i).noise + survIn(i).filter(s=>!s.invisible).length; }

/* ---------- niveau de danger & compétences ---------- */
function dangerIdx(xp){ for(let k=0;k<4;k++) if(xp<=DANGER[k].max) return k; return 3; }
function teamDanger(){ return alive().length ? Math.max(...alive().map(s=>dangerIdx(s.xp))) : 0; }
function hasSkill(s, name){ return s.skills.includes(name); }

/* --------------------------------------------------------------------------
   MISE EN PLACE
   -------------------------------------------------------------------------- */
function newGame(){
  document.getElementById("banner").style.display="none";
  document.getElementById("modal").style.display="none";
  document.getElementById("log").innerHTML="";
  UI = {tab:0, mode:null, data:null, reorgSel:null};
  const q = QUEST;
  G = {
    q, zones: buildBoard(q), survivors: [], zombies: [], nextZid: 1,
    round: 1, phase: "players", over: false,
    equipDeck: [], equipDiscard: [], spawnDeck: [], spawnDiscard: [],
    pool: {}, vaultDeck: [], objectivesLeft: q.objectives.length, firstPlayer: 0,
    taken: {},                       // Objectifs récupérés, par couleur
    customMap: JSON.stringify(q) !== JSON.stringify(DEFAULT_QUEST)
  };
  /* Objectifs cachés : recto toujours rouge, verso tiré au sort dans la réserve
     `hiddenBacks` de la quête (les versos non fournis restent rouges). */
  const caches = G.zones.filter(z=>z.obj && z.obj.hidden);
  const versos = shuffle((q.hiddenBacks||[]).slice());
  caches.forEach(z=>{ if(!z.obj.back) z.obj.back = versos.pop() || "red"; });
  Object.keys(ZT).forEach(k=>G.pool[k]=ZT[k].pool);

  // decks
  const starters=[];
  EQUIP.forEach(e=>{
    for(let k=0;k<(e.start||0);k++)  starters.push(mkCard(e.id));
    for(let k=0;k<(e.deck||0);k++)   G.equipDeck.push(mkCard(e.id));
    if(e.vault) G.vaultDeck.push(mkCard(e.id));
  });
  shuffle(G.equipDeck); shuffle(starters); shuffle(G.vaultDeck);
  G.spawnDeck = shuffle(SPAWN_TABLE.map((r,i)=>({id:i+1, row:r})));

  // survivants
  SURVIVORS.forEach((sv,k)=>{
    G.survivors.push({
      ...sv, idx:k, z: q.start.y*q.W + q.start.x, xp:0, wounds:0,
      dead:false, escaped:false,
      hands:new Array(RULES.handSlots).fill(null),
      back: new Array(RULES.backSlots).fill(null),
      body:null,
      skills:[], pending:[], actions:0, free:[], searched:false,
      reorgFree:true, invisible:false, ench:{}, hitRun:false
    });
    // 1 carte d'Équipement de départ, tirée au hasard
    const c = starters.pop(); if(c) G.survivors[k].hands[0]=c;
  });
  // Les Artefacts de crypte sont mis de côté et répartis dans les cryptes (p.33).
  const crypts = G.zones.filter(z=>z.crypt);
  if(crypts.length) G.vaultDeck.forEach((c,k)=>crypts[k%crypts.length].vaultCards.push(c));
  else G.vaultDeck = [];
  refreshSkills(true);
  startPlayersPhase();
  logLine("── Round 1 ──","l-round");
  logLine("Quête : "+q.name+". "+q.goal,"l-sys");
  render();
}
function mkCard(id){ const e=EQ[id]; return {id, e, loaded:true, used:false}; }

function refreshSkills(silent){
  G.survivors.forEach(s=>{
    const lvl = dangerIdx(s.xp);
    const want = [];
    if(lvl>=0) want.push(...s.blue);
    if(lvl>=1) want.push("+1 Action");
    if(lvl>=2) want.push({choice:s.orange, lv:"Orange"});
    if(lvl>=3) want.push({choice:s.red,    lv:"Rouge"});
    want.forEach(w=>{
      if(typeof w === "string"){ if(!s.skills.includes(w)) s.skills.push(w); }
      else {
        const already = w.choice.some(c=>s.skills.includes(c));
        if(!already && !s.pending.some(p=>p.lv===w.lv)) s.pending.push(w);
      }
    });
  });
}

/* --------------------------------------------------------------------------
   PHASE DES JOUEURS
   -------------------------------------------------------------------------- */
function startPlayersPhase(){
  G.phase="players";
  onBoard().forEach(s=>{
    s.actions = RULES.actionsPerTurn + (hasSkill(s,"+1 Action") ? 1 : 0);
    s.free = [];
    const add=(types,label)=>s.free.push({types, label});
    if(hasSkill(s,"+1 Action Déplacement gratuite")) add(["move"],"Déplacement");
    if(hasSkill(s,"+1 Action Mêlée gratuite"))       add(["melee"],"Mêlée");
    if(hasSkill(s,"+1 Action Distance gratuite"))    add(["ranged"],"Distance");
    if(hasSkill(s,"+1 Action Magie gratuite"))       add(["magic","ench"],"Magie");
    if(hasSkill(s,"Lanceur de sorts"))               add(["magic","ench"],"Sorts");
    if(hasSkill(s,"+1 Action Combat gratuite"))      add(["melee","ranged","magic"],"Combat");
    s.searched=false; s.reorgFree=true; s.hitRun=false;
    Object.keys(s.ench).forEach(k=>s.ench[k]=false);
  });
  UI.tab = onBoard().length ? G.survivors.indexOf(onBoard()[0]) : 0;
}
function canPay(s,type){
  if(s.free.some(f=>f.types.includes(type))) return true;
  return s.actions>0;
}
function pay(s,type){
  // on consomme d'abord l'Action gratuite la plus spécialisée
  const cand = s.free.map((f,i)=>({f,i})).filter(o=>o.f.types.includes(type))
                     .sort((a,b)=>a.f.types.length-b.f.types.length);
  if(cand.length){ s.free.splice(cand[0].i,1); return true; }
  if(s.actions>0){ s.actions--; return true; }
  return false;
}
function refund(s,type){ s.actions++; }

/* ---------- déplacement ---------- */
function moveCost(s){
  if(hasSkill(s,"Anguille")) return 1;
  return RULES.extraActionPerZombie ? 1 + zombiesIn(s.z).length : 1;
}
function legalMoves(s){ return neighbours(s.z); }

function doMove(s, target, freeMove){
  const cost = freeMove ? 0 : moveCost(s);
  if(!freeMove){
    if(s.actions < cost && !(cost===1 && s.free.some(f=>f.types.includes("move")))){
      return toast("Pas assez d'Actions (sortir de cette Zone coûte "+cost+" Actions).");
    }
    if(cost===1){ if(!pay(s,"move")) return; }
    else s.actions -= cost;
  }
  s.z = target;
  logLine(`${s.n} se déplace en ${zn(target)}${cost>1?" ("+cost+" Actions)":""}.`);
  afterMove(s);
}
function afterMove(s){
  const z=Z(s.z);
  if(z.exit) tryExit(s);
  render(); checkEnd();
}
function tryExit(s){
  if(zombiesIn(s.z).length){ logLine("La Zone de Sortie est occupée par des Zombies.","l-bad"); return; }
  const w = winCond();
  if(!condMet(w.need)){
    logLine(`Sortie impossible — la mission exige : ${condText(w.need)}.`,"l-bad"); return;
  }
  s.escaped=true;
  logLine(`${s.n} quitte le plateau par la Sortie !`,"l-obj");
}

/* ---------- ouvrir une porte ---------- */
/* « Les armes de MÊLÉE avec le symbole Ouvrir une porte » (p.19). */
function doorTools(s){
  return handCards(s).filter(c=>c && c.e.door && c.e.kind==="melee");
}
/* Portes fermées atteignables. Une porte de crypte peut être ouverte depuis
   l'intérieur de la crypte (p.32) : on renvoie alors la case du plateau. */
function doorSides(s){
  const z=Z(s.z), out=[];
  if(z.crypt){
    // depuis la crypte, on peut ouvrir n'importe quelle trappe de sa couleur
    G.zones.forEach(o=>{ if(!o.crypt && o.cryptDoor===z.crypt && !o.cryptOpen) out.push({z:o, crypt:true}); });
    return out;
  }
  for(const side of ["n","e","s","w"])
    if(z.edge[side]==="door" && !z.door[side]) out.push({z, side});
  if(z.cryptDoor && !z.cryptOpen) out.push({z, crypt:true});
  return out;
}
/* Portes atteignables ET ouvrables (une porte de couleur peut être verrouillée). */
const doorSidesOpenable = s => doorSides(s).filter(d=>d.crypt || !doorLocked(d.z.doorColor[d.side]));
const SIDE_NAME = {n:"Nord", e:"Est", s:"Sud", w:"Ouest"};
function doorLabel(d){
  if(d.crypt) return `Trappe de crypte ${d.z.cryptDoor} en (${d.z.x+1},${d.z.y+1})`;
  const nb = AT(d.z.x+DXY[d.side][0], d.z.y+DXY[d.side][1]);
  const col = d.z.doorColor[d.side];
  return `Porte ${SIDE_NAME[d.side]}${col?" "+colF(col):""} → `+
         (nb && nb.building ? "bâtiment "+nb.building : "rue");
}
/* Ouvrir une porte (p.19) — arme de MÊLÉE au symbole Porte, 1 Action, 1 porte.
   • symbole AVEC icône dé : lancez les dés de l'arme, la porte s'ouvre si un dé
     atteint la Précision ; un jeton Bruit est posé dans tous les cas.
   • symbole SANS icône dé (Hache) : aucun jet, bruit seulement si l'arme est bruyante.
   Ce n'est PAS une Action de Mêlée : ni Ambidextrie, ni bonus de compétence,
   ni dé supplémentaire de la Dague — seule la valeur brute de Dés compte. */
async function doOpenDoor(s){
  const tools = doorTools(s);
  if(!tools.length) return toast("Il faut une arme de Mêlée au symbole « Ouvrir une porte » en main.");
  const toutes = doorSides(s);
  const sides = doorSidesOpenable(s);
  if(!toutes.length) return toast("Aucune porte fermée accessible depuis cette Zone.");
  if(!sides.length){
    const d = toutes[0], col = d.z.doorColor[d.side];
    return toast(`Porte ${colF(col)} verrouillée — condition : ${condText((locks().doors||{})[col])}.`);
  }
  if(!canPay(s,"door")) return toast("Plus d'Action disponible.");

  let door = sides[0];
  if(sides.length>1){
    const r = await choose("Quelle porte ouvrir ?",
      sides.map((d,k)=>({label:doorLabel(d), v:k})).concat([{label:"Annuler", v:null}]));
    if(r==null) return;
    door = sides[r];
  }
  let tool = tools[0];
  if(tools.length>1){
    const r = await choose("Avec quelle arme ?",
      tools.map((c,k)=>({label:`${c.e.n} (${c.e.doorNoRoll?"sans jet":c.e.dice+" dé"+(c.e.dice>1?"s":"")+", "+c.e.acc+"+"})`, v:k}))
           .concat([{label:"Annuler", v:null}]));
    if(r==null) return;
    tool = tools[r];
  }
  pay(s,"door");
  const z = door.z, side = door.side;

  if(tool.e.doorNoRoll){
    logLine(`${s.n} ouvre la porte avec ${tool.e.n} (aucun jet).`);
  } else {
    const rolls = rollDice(tool.e.dice);
    const ok = rolls.some(r=>r>=tool.e.acc);
    Z(s.z).noise++;                                   // le jet fait du bruit
    logLine(`${s.n} force la porte — ${tool.e.n} : ${tool.e.dice} dé(s), ${tool.e.acc}+ → [${rolls.join(" ")}] ${ok?"ouverte !":"échec."} (Bruit)`,"l-dice");
    if(!ok){ render(); return checkEnd(); }
  }
  if(door.crypt){
    // Les cryptes ne provoquent aucune Invasion à leur découverte (p.32).
    z.cryptOpen = true;
    logLine(`La trappe de crypte ${z.cryptDoor} de ${zn(z.i)} est ouverte.`,"l-obj");
  } else {
    z.door[side]=true;
    const nb=AT(z.x+DXY[side][0], z.y+DXY[side][1]);
    if(nb) nb.door[OPP[side]]=true;
    if(nb && nb.building) openBuilding(nb.building);
    if(z.building) openBuilding(z.building);
  }
  render(); checkEnd();
}
/* Invasion dans les bâtiments (p.19) : ouvrir une porte sur un bâtiment encore
   clos déclenche une Invasion dans CHACUNE de ses Zones, l'une après l'autre. */
function openBuilding(b){
  const cells = G.zones.filter(o=>o.building===b && !o.crypt);
  if(!cells.length || cells[0].buildingOpened) return;
  cells.forEach(c=>{ c.buildingOpened=true; c.explored=true; });
  logLine(`Bâtiment « ${b} » ouvert : Invasion dans ses ${cells.length} Zone(s).`,"l-bad");
  runSpawnSequence(cells.map(c=>c.i));
}

/* ---------- fouiller ---------- */
/* Réalimentation de la pioche : on remélange la défausse SAUF les Artefacts de
   crypte (Inferno, Orcish Crossbow), qui ne reviennent jamais dans le deck (p.18). */
function drawEquip(){
  if(!G.equipDeck.length){
    const back = G.equipDiscard.filter(c=>!c.e.vault);
    G.equipDiscard = G.equipDiscard.filter(c=>c.e.vault);
    if(!back.length) return null;
    G.equipDeck = shuffle(back);
    logLine("Le deck d'Équipement est remélangé (hors Artefacts de crypte).","l-sys");
  }
  return G.equipDeck.pop();
}
async function doSearch(s){
  const z=Z(s.z);
  if(z.crypt)   return toast("Les cryptes ne peuvent pas être Fouillées.");
  if(!z.building) return toast("On ne peut Fouiller qu'à l'intérieur d'un bâtiment.");
  if(zombiesIn(s.z).length) return toast("Impossible de Fouiller : des Zombies occupent la Zone.");
  if(s.searched) return toast("Ce Survivant a déjà Fouillé ce Tour.");
  if(!canPay(s,"search")) return toast("Plus d'Action disponible.");
  pay(s,"search"); s.searched=true;
  const n = handCards(s).some(c=>c && c.e.torch) ? 2 : 1;
  logLine(`${s.n} fouille${n===2?" (Torche : 2 cartes)":""}…`);
  for(let k=0;k<n;k++){
    const c = drawEquip();
    if(!c){ logLine("Plus aucune carte d'Équipement.","l-sys"); break; }
    if(c.e.kind==="aaahh"){
      logLine("Aaahh !! Un Marcheur surgit !","l-bad");
      G.equipDiscard.push(c); addZombie("walker", s.z);
      render(); continue;
    }
    logLine(`… ${s.n} trouve : ${c.e.n}.`,"l-kill");
    await giveCard(s,c);
  }
  s.reorgFree = true;          // réorganisation gratuite après une Fouille (p.18)
  render(); checkEnd();
}

/* ---------- inventaire ---------- */
/* Cartes considérées comme tenues en main : les 2 Mains, plus la carte nommée
   sur la fiche du Survivant si elle occupe l'emplacement Corps (p.15), plus le
   sac à dos pour les sorts avec la compétence Grimoire. */
function handCards(s){
  const out=[...s.hands];
  if(s.body && s.body.id===s.bodyItem) out.push(s.body);
  if(hasSkill(s,"Grimoire")) s.back.forEach(c=>{ if(c && (c.e.kind==="spell"||c.e.kind==="ench")) out.push(c); });
  return out;
}
function bodyAccepts(s,c){ return c.e.kind==="armor" || c.id===s.bodyItem; }
function freeSlot(s){
  for(let k=0;k<s.hands.length;k++) if(!s.hands[k]) return {a:"hands",k};
  for(let k=0;k<s.back.length;k++)  if(!s.back[k])  return {a:"back",k};
  return null;
}
async function giveCard(s,c){
  const f = freeSlot(s);
  if(f){ s[f.a][f.k]=c; return; }
  const opts = [];
  s.hands.forEach((x,k)=>opts.push({label:"Remplacer Main "+(k+1)+" : "+cardName(x), v:["hands",k]}));
  s.back.forEach((x,k)=> opts.push({label:"Remplacer Sac "+(k+1)+" : "+cardName(x), v:["back",k]}));
  opts.push({label:"Défausser « "+c.e.n+" »", v:null});
  const r = await choose("Inventaire plein — "+c.e.n, opts);
  if(!r){ G.equipDiscard.push(c); return; }
  const old = s[r[0]][r[1]];
  if(old) G.equipDiscard.push(old);
  s[r[0]][r[1]] = c;
}
function cardName(c){ return c ? c.e.n : "vide"; }

/* ---------- objectifs ---------- */
/* Un Objectif caché montre toujours sa face rouge ; sa vraie couleur (le verso)
   n'est révélée qu'au moment où un Survivant le récupère. */
function doObjective(s){
  const z=Z(s.z);
  if(!z.obj) return toast("Aucun Objectif dans cette Zone.");
  if(!canPay(s,"objective")) return toast("Plus d'Action disponible.");
  pay(s,"objective");
  const o = z.obj, couleur = o.hidden ? (o.back||"red") : o.color;
  z.obj = null; G.objectivesLeft--;
  G.taken[couleur] = (G.taken[couleur]||0) + 1;
  gainXP(s, RULES.xpObjective);
  logLine(`${s.n} récupère un Objectif ${colM(couleur)}`+
          (o.hidden ? ` (face cachée retournée !)` : ``) +
          ` (+${RULES.xpObjective} XP). Restants : ${G.objectivesLeft}.`,"l-obj");
  announceUnlocks(couleur);
  render(); checkEnd();
}
/* Signale les verrous que ce nouvel Objectif vient de lever. */
function announceUnlocks(couleur){
  const L = locks();
  Object.entries(L.spawns||{}).forEach(([col,cond])=>{
    if(cond===`objective:${couleur}` && condMet(cond))
      logLine(`▲ Les Zones d'Invasion de couleur ${colF(col)} sont désormais ACTIVES.`,"l-bad");
  });
  Object.entries(L.spawnsOff||{}).forEach(([col,cond])=>{
    if(condMet(cond))
      logLine(`▼ Les Zones d'Invasion de couleur ${colF(col)} sont désormais inactives.`,"l-obj");
  });
  Object.entries(L.doors||{}).forEach(([col,cond])=>{
    if(cond===`objective:${couleur}` && condMet(cond))
      logLine(`🔓 Les portes de couleur ${colF(col)} peuvent maintenant être ouvertes.`,"l-obj");
  });
}
/* Artefacts de crypte (p.33) : 1 Action pour en prendre un, ce n'est PAS une
   Action de Fouille, et l'action est répétable si la crypte en contient plusieurs. */
async function doTakeArtefact(s){
  const z=Z(s.z);
  if(!z.crypt || !z.vaultCards.length) return toast("Aucun Artefact ici.");
  if(!canPay(s,"objective")) return toast("Plus d'Action disponible.");
  pay(s,"objective");
  const c = z.vaultCards.shift();
  gainXP(s, RULES.xpVault);
  logLine(`${s.n} récupère l'Artefact de crypte « ${c.e.n} » (+${RULES.xpVault} XP).`,"l-obj");
  await giveCard(s,c);
  render(); checkEnd();
}
function doNoise(s){
  if(!canPay(s,"noise")) return toast("Plus d'Action disponible.");
  pay(s,"noise"); Z(s.z).noise++; s.invisible=false;
  logLine(`${s.n} fait du bruit en ${zn(s.z)}.`);
  render();
}

/* ---------- expérience ---------- */
function gainXP(s,n){
  const before = dangerIdx(s.xp);
  s.xp += n;
  if(dangerIdx(s.xp) > before){
    logLine(`${s.n} atteint le niveau ${DANGER[dangerIdx(s.xp)].name} !`,"l-obj");
    refreshSkills();
  }
}

/* --------------------------------------------------------------------------
   COMBAT
   -------------------------------------------------------------------------- */
function weaponProfile(s, c, useAlt){
  const e = useAlt && c.e.alt ? {...c.e, ...c.e.alt} : c.e;
  const kind = e.kind;                                  // melee | ranged | spell
  const act  = kind==="spell" ? "magic" : kind;         // type d'Action
  let dice = e.dice, acc = e.acc, dmg = e.dmg;
  // Ambidextrie : 2 exemplaires identiques en main avec le symbole Ambidextre
  const dualable = e.dual || (kind==="melee" && hasSkill(s,"Maître d'armes"));
  const twin = dualable && handCards(s).filter(x=>x && x.id===c.id).length>=2;
  if(twin) dice *= 2;
  // Dague : +1 dé à l'autre arme de Mêlée équipée
  if(kind==="melee" && !twin){
    const dag = handCards(s).filter(x=>x && x.e.offhandDie && x!==c).length;
    if(dag) dice += 1;
  }
  // Compétences « +1 dé » : l'arme gagne un dé, donc DEUX dés avec une paire
  // d'armes Ambidextres identiques (p.37).
  const per = twin ? 2 : 1;
  if(kind==="melee"){
    if(hasSkill(s,"+1 dé : Mêlée"))          dice += per;
    if(hasSkill(s,"+1 au jet de dé : Mêlée"))acc--;
    if(hasSkill(s,"+1 Dégât : Mêlée"))       dmg++;
  }
  if(kind==="ranged"){
    if(hasSkill(s,"+1 dé : Distance"))          dice += per;
    if(hasSkill(s,"+1 au jet de dé : Distance"))acc--;
  }
  if(kind==="spell"){
    if(hasSkill(s,"+1 dé : Magie")) dice += per;
  }
  if(hasSkill(s,"+1 dé : Combat")) dice += per;
  if(hasSkill(s,"+1 au jet de dé : Combat")) acc--;
  acc = Math.max(2, acc);
  let rmin = e.rmin, rmax = e.rmax;
  if(kind!=="melee" && hasSkill(s,"À bout portant")) rmin = 0;
  return {e, kind, act, dice, acc, dmg, rmin, rmax, twin, noise:!!e.noise, keyw:e.keyw};
}
function targetZones(s, p){
  if(p.kind==="melee") return [s.z];
  const seen = los(s.z), dist = bfsFrom(s.z), out=[];
  seen.forEach(i=>{
    let d = dist[i]; if(d<0) d = 99;
    if(d>=p.rmin && d<=p.rmax) out.push(i);
  });
  return out;
}
async function doAttack(s, c, targetZ, useAlt){
  const p = weaponProfile(s, c, useAlt);
  if(c.e.reload && !c.loaded) return toast(c.e.n+" doit être rechargée.");
  if(!canPay(s,p.act)) return toast("Plus d'Action disponible.");
  pay(s, p.act);
  if(c.e.reload) c.loaded=false;

  let dice = p.dice;
  // Barbare / Pluie de fer : le nombre de dés de l'arme PEUT être remplacé par
  // le nombre de Zombies dans la Zone ciblée ; les bonus de dés s'appliquent quand même.
  const zc = zombiesIn(targetZ).length;
  const base  = p.twin ? p.e.dice*2 : p.e.dice;
  const bonus = dice - base;
  if((p.kind==="melee"  && hasSkill(s,"Barbare")) ||
     (p.kind==="ranged" && hasSkill(s,"Pluie de fer")))
    dice = Math.max(dice, zc + bonus);

  if(p.noise){ Z(s.z).noise++; s.invisible=false; }

  let rolls = rollDice(dice);
  // Provisions de flèches / carreaux : relance de l'attaque à Distance
  if(p.kind==="ranged" && p.keyw){
    const prov = handCards(s).concat(s.back).some(x=>x && x.e.reroll===p.keyw);
    const hits0 = countHits(rolls, p.acc);
    if(prov && hits0 < dice){
      const nr = rollDice(dice);
      logLine(`Provision de ${p.keyw.toLowerCase()} : relance [${rolls.join(" ")}] → [${nr.join(" ")}]`,"l-dice");
      rolls = nr;
    }
  }
  let hits = countHits(rolls, p.acc);
  // « Résultat 6 : +1 dé Combat »
  if(hasSkill(s,"Résultat 6 : +1 dé Combat")){
    let sixes = rolls.filter(r=>r===6).length;
    while(sixes>0){
      const extra = rollDice(sixes);
      logLine(`Résultat 6 : ${sixes} dé(s) supplémentaire(s) → [${extra.join(" ")}]`,"l-dice");
      hits += countHits(extra, p.acc);
      sixes = extra.filter(r=>r===6).length;
      rolls = rolls.concat(extra);
    }
  }
  const misses = rolls.length - hits;
  logLine(`${s.n} — Action de ${ATK[p.kind].n} · ${p.e.n}${p.twin?" ×2":""} sur ${zn(targetZ)} : `+
          `${dice} dé(s), ${p.acc}+ → [${rolls.join(" ")}] = ${hits} succès, ${misses} échec(s).`,"l-dice");

  const pointBlank = p.kind!=="melee" && hasSkill(s,"À bout portant") && targetZ===s.z;
  resolveHits(s, targetZ, hits, p.dmg, p.kind, pointBlank);
  if(p.kind!=="melee") await friendlyFire(s, targetZ, misses, p.dmg, pointBlank);
  UI.mode=null; render(); checkEnd();
}
function rollDice(n){ const r=[]; for(let k=0;k<n;k++) r.push(d6()); return r; }
// Un 6 réussit toujours, un 1 échoue toujours ; « +1 au jet » est déjà intégré à acc.
function countHits(rolls, acc){ return rolls.filter(r=> r===6 || (r!==1 && r>=acc)).length; }
/* Attribution des succès (p.27). Chaque succès va à la cible de PRIORITÉ la plus
   forte présente dans la Zone ; si les Dégâts de l'arme sont insuffisants pour
   l'éliminer, le succès est PERDU — il ne se reporte pas sur une cible de
   priorité inférieure. « À bout portant » à Portée 0 lève cette contrainte :
   le Survivant choisit librement ses cibles. */
function resolveHits(s, zi, hits, dmg, kind, pointBlank){
  let killed=0, wasted=0;
  while(hits>0){
    const here = zombiesIn(zi);
    if(!here.length){ wasted+=hits; break; }
    let target;
    if(pointBlank){
      const killable = here.filter(zz=>ZT[zz.t].lethal<=dmg);
      if(!killable.length){ wasted+=hits; break; }
      killable.sort((a,b)=>TARGET_PRIORITY[a.t]-TARGET_PRIORITY[b.t]);
      target = killable[0];
    } else {
      const best = Math.min(...here.map(zz=>TARGET_PRIORITY[zz.t]));
      const tied = here.filter(zz=>TARGET_PRIORITY[zz.t]===best);
      // à priorité égale (Costaud / Abomination) le tireur choisit : on prend
      // d'abord une cible que l'arme peut réellement tuer.
      target = tied.find(zz=>ZT[zz.t].lethal<=dmg) || tied[0];
    }
    hits--;
    if(ZT[target.t].lethal<=dmg){ killZombie(target, s); killed++; }
    else { wasted++; logLine(`→ Succès perdu sur ${ZT[target.t].n} (Dégâts ${dmg} < ${ZT[target.t].lethal}).`,"l-bad"); }
  }
  if(killed) logLine(`→ ${killed} Zombie(s) éliminé(s).`,"l-kill");
  if(wasted && !killed) logLine(`→ ${wasted} succès perdu(s).`,"l-bad");
  if(killed && hasSkill(s,"Frappe et esquive") && !s.hitRun){
    s.hitRun=true;
    logLine(`${s.n} peut utiliser « Frappe et esquive » (Déplacement gratuit).`,"l-obj");
  }
}
/* Tir ami (p.27) — uniquement à Distance et en Magie. Ce sont les ÉCHECS du jet
   qui blessent les Survivants présents dans la Zone visée, chacun infligeant
   autant de Blessures que la valeur de Dégâts de l'arme. Le tireur ne peut se
   tirer dessus. Les jets d'Armure sont autorisés. Tuer un Survivant ne rapporte
   aucune expérience. « À bout portant » annule le tir ami à Portée 0. */
async function friendlyFire(s, zi, misses, dmg, pointBlank){
  if(misses<=0 || pointBlank) return;
  for(let k=0;k<misses;k++){
    const victims = survIn(zi).filter(o=>o!==s);
    if(!victims.length) return;
    let v = victims[0];
    if(victims.length>1){
      const r = await choose(`Tir ami : qui encaisse ${dmg} Blessure(s) ?`,
        victims.map((o,j)=>({label:`${o.n} (${o.wounds}/${RULES.survivorWounds} Blessures${o.body&&o.body.e.armor?", Armure "+o.body.e.armor+"+":""})`, v:j})));
      v = victims[r ?? 0];
    }
    logLine(`Tir ami ! ${v.n} encaisse ${dmg} Blessure(s).`,"l-bad");
    for(let w=0; w<dmg && !v.dead; w++) wound(v, false);
  }
}
function killZombie(zz, by){
  G.zombies.splice(G.zombies.indexOf(zz),1);
  G.pool[zz.t]++;
  if(by) gainXP(by, ZT[zz.t].xp);
  if(zz.t==="necromancer") onNecroKilled(zz);
}
/* Règle officielle : à la mort d'un Nécromancien, les joueurs choisissent UNE
   Zone d'Apparition (y compris celle du Nécromancien) et la retirent du plateau.
   Ici le retrait est automatique : jeton Nécromancien en priorité. */
function onNecroKilled(){
  const zones = G.zones.filter(z=>z.spawnTokens.length);
  if(!zones.length) return;
  const target = zones.find(z=>z.spawnTokens.some(t=>t.necro)) || zones[0];
  const k = target.spawnTokens.findIndex(t=>t.necro);
  target.spawnTokens.splice(k>=0?k:0, 1);
  logLine(`Nécromancien abattu : un pion d'Invasion est retiré de ${zn(target.i)}.`,"l-obj");
}
const spawnTokens = () => G.zones.reduce((a,z)=>a+z.spawnTokens.length,0);
const activeTokens = () => G.zones.reduce((a,z)=>a+z.spawnTokens.filter(spawnActive).length,0);
const hasSpawn = z => z.spawnTokens.length>0;

/* ---------- blessures / armure ---------- */
function armorValue(s){
  let v = 99;
  if(s.body && s.body.e.armor) v = s.body.e.armor;
  const sh = s.hands.filter(c=>c && c.e.kind==="shield").length;
  if(sh) v = Math.min(v, 4);
  if(hasSkill(s,"Peau de fer")) v = Math.min(v, 5);
  return v;
}
/* Une Blessure avance la barre de Blessures du tableau de bord — elle n'occupe
   PAS d'emplacement d'inventaire (p.23). Élimination à 3. */
function wound(s, noArmor){
  if(s.dead) return;
  const av = armorValue(s);
  if(!noArmor && av<99){
    const bonus = (hasSkill(s,"Peau de fer") && s.body && s.body.e.armor) ? 1 : 0;
    let r = d6(), eff = Math.min(6, r+bonus), ok = eff>=av;
    // Bouclier : relance possible seulement si une armure est portée sur le Corps
    const canReroll = !ok && s.hands.some(c=>c && c.e.kind==="shield") && s.body && s.body.e.armor;
    if(canReroll){
      const r2=d6(), e2=Math.min(6,r2+bonus);
      logLine(`Armure ${av}+ : ${r} → relance (Bouclier) ${r2}`,"l-dice");
      r=r2; eff=e2; ok=eff>=av;
    } else logLine(`Armure ${av}+ : ${r}${bonus?" (+"+bonus+")":""}`,"l-dice");
    if(ok){ logLine(`${s.n} pare le coup !`,"l-kill"); return; }
  }
  s.wounds++;
  logLine(`${s.n} subit une Blessure (${s.wounds}/${RULES.survivorWounds}).`,"l-bad");
  if(s.wounds>=RULES.survivorWounds){
    s.dead=true;
    [...s.hands, ...s.back, s.body].forEach(c=>{ if(c) G.equipDiscard.push(c); });
    s.hands=new Array(RULES.handSlots).fill(null);
    s.back =new Array(RULES.backSlots).fill(null);
    s.body =null;
    logLine(`💀 ${s.n} est éliminé — sa figurine et son équipement quittent le jeu.`,"l-bad");
  }
}

/* --------------------------------------------------------------------------
   OBJETS & ENCHANTEMENTS
   -------------------------------------------------------------------------- */
function discardFrom(s,c){
  ["hands","back"].forEach(a=>{ const k=s[a].indexOf(c); if(k>=0) s[a][k]=null; });
  if(s.body===c) s.body=null;
  G.equipDiscard.push(c);
}
function useItem(s, c){
  const e=c.e;
  if(e.xpItem){
    if(!canPay(s,"item")) return toast("Plus d'Action disponible.");
    pay(s,"item"); gainXP(s,e.xpItem); discardFrom(s,c);
    logLine(`${s.n} consomme ${e.n} (+${e.xpItem} XP).`);
    return render();
  }
  if(e.bile){
    if(!canPay(s,"item")) return toast("Plus d'Action disponible.");
    UI.mode={t:"bile", s, c}; return render();
  }
  if(e.torch){
    const zs = [s.z, ...neighbours(s.z)].filter(i=>Z(i).bile);
    if(!zs.length) return toast("Aucun jeton Bile de Dragon à Portée 0-1.");
    if(!canPay(s,"item")) return toast("Plus d'Action disponible.");
    UI.mode={t:"torch", s, c, zones:zs}; return render();
  }
  if(e.kind==="ench"){
    if(s.ench[e.ench]) return toast("Cet Enchantement a déjà été utilisé ce Tour.");
    if(!canPay(s,"ench")) return toast("Plus d'Action disponible.");
    UI.mode = (e.ench==="repulse") ? {t:"repulse", s, c} : {t:"ench", s, c};
    return render();
  }
  // Emplacement Corps : armure, ou la carte nommée sur la fiche du Survivant.
  if(bodyAccepts(s,c)){
    if(s.body){ const old=s.body; s.body=null; giveCard(s,old); }
    ["hands","back"].forEach(a=>{ const k=s[a].indexOf(c); if(k>=0) s[a][k]=null; });
    s.body=c;
    logLine(`${s.n} place ${e.n} sur l'emplacement Corps${c.id===s.bodyItem?" (compte comme tenue en main)":""}.`);
    return render();
  }
  if(e.reload && !c.loaded){
    if(!canPay(s,"item")) return toast("Plus d'Action disponible.");
    pay(s,"item"); c.loaded=true; logLine(`${s.n} recharge ${e.n}.`); return render();
  }
}
function dragonFire(zi, by){
  logLine(`🔥 Feu du Dragon en ${zn(zi)} !`,"l-bad");
  Z(zi).bile=false;
  zombiesIn(zi).slice().forEach(zz=>{ killZombie(zz, by); });
  survIn(zi).forEach(s=>{ s.wounds=RULES.survivorWounds; s.dead=true;
    logLine(`💀 ${s.n} périt dans les flammes.`,"l-bad"); });
  logLine("Toutes les figurines de la Zone sont détruites, sans jet de dé.","l-sys");
}
function applyEnch(s, c, target){
  const kind=c.e.ench;
  pay(s,"ench"); s.ench[kind]=true;
  if(kind==="heal"){
    if(target.wounds>0){
      target.wounds--;
      logLine(`${s.n} soigne ${target.n} (1 Blessure).`,"l-kill");
    } else logLine("Aucune Blessure à soigner.","l-sys");
  }
  if(kind==="invis"){ target.invisible=true;
    logLine(`${target.n} devient Invisible (effet Putride jusqu'à la fin du Round).`,"l-obj"); }
  if(kind==="speed"){
    if(zombiesIn(target.z).length) logLine("Vitesse : la Zone contient des Zombies.","l-bad");
    else { UI.mode={t:"speed", s:target, left:2}; logLine(`${target.n} peut se déplacer de 2 Zones.`,"l-obj"); }
  }
  UI.mode = (kind==="speed") ? UI.mode : null;
  render();
}

/* --------------------------------------------------------------------------
   PHASE DES ZOMBIES
   -------------------------------------------------------------------------- */
function addZombie(t, zi){
  if(G.pool[t]<=0){
    logLine(`Plus de figurines de ${ZT[t].n} : Activation supplémentaire pour ce type !`,"l-bad");
    activateType(t); return null;
  }
  G.pool[t]--;
  const z = {id:G.nextZid++, t, z:zi, entry:zi};
  G.zombies.push(z); return z;
}
async function zombiePhase(){
  G.phase="zombies";
  logLine("— Phase des Zombies —","l-sys");
  await activateAll(false);
  await activateAll(true);      // 2e Action des Coureurs
  spawnPhase();
  endPhase();
}
/* « Résoudre toutes les attaques d'abord, puis les mouvements » (p.23). */
async function activateAll(runnersOnly){
  const groups = {};
  G.zombies.forEach(zz=>{
    if(runnersOnly && ZT[zz.t].actions<2) return;
    (groups[zz.z] ||= []).push(zz);
  });
  const moves = [], attacks = [];
  Object.keys(groups).forEach(k=>{
    const zi = +k, list = groups[zi];
    const targetsHere = survIn(zi).filter(s=>!s.invisible);
    if(targetsHere.length){
      attacks.push({zi, list});
      return;
    }
    // Les Nécromanciens fuient vers un pion Invasion, les autres suivent le bruit.
    const necros = list.filter(zz=>zz.t==="necromancer");
    const rest   = list.filter(zz=>zz.t!=="necromancer");
    necros.forEach(zz=>{ const d=necroStep(zz); if(d!=null && d!==zz.z) moves.push({zz, dest:d}); });
    if(!rest.length) return;
    const steps = zombieSteps(zi);
    if(!steps.length) return;
    // Scission (p.24) : un groupe face à plusieurs routes de même longueur se
    // divise en groupes ÉGAUX, en AJOUTANT des figurines si nécessaire.
    // Abominations et Nécromanciens ne se scindent jamais.
    const byType = {};
    rest.forEach(zz=>(byType[zz.t] ||= []).push(zz));
    Object.keys(byType).forEach(t=>{
      const group = byType[t];
      if(steps.length===1 || t==="abomination"){
        const dest = steps[0];                       // une seule direction
        group.forEach(zz=>{ if(dest!==zz.z) moves.push({zz, dest}); });
        return;
      }
      steps.forEach((dest,k)=>{
        group.forEach(zz=>{
          if(k===0){ if(dest!==zz.z) moves.push({zz, dest}); return; }
          const extra = addZombie(t, zi);             // renfort pour égaliser
          if(extra && dest!==zi) moves.push({zz:extra, dest});
        });
      });
      if(steps.length>1)
        logLine(`Le groupe de ${ZT[t].n}s se scinde en ${steps.length} (renforts ajoutés).`,"l-bad");
    });
  });
  // 1) toutes les attaques
  for(const a of attacks) await resolveZombieAttacks(a.zi, a.list);
  // 2) puis tous les mouvements
  moves.forEach(m=>{
    if(!G.zombies.includes(m.zz)) return;
    m.zz.z = m.dest;
    if(m.zz.t==="necromancer" && hasSpawn(Z(m.dest)) && m.dest!==m.zz.entry)
      necroEscape(m.zz);
  });
  if(moves.length) logLine(`${moves.length} Zombie(s) se déplacent.`);
  render();
}
/* Chaque zombie de la Zone attaque et inflige 1 Blessure, sans jet. Les joueurs
   répartissent librement les Blessures entre les Survivants présents (p.23). */
async function resolveZombieAttacks(zi, list){
  for(const zz of list){
    const victims = survIn(zi).filter(s=>!s.invisible && !s.dead);
    if(!victims.length) return;
    let v = victims[0];
    if(victims.length>1){
      const r = await choose(`${ZT[zz.t].n} attaque en ${zn(zi)} — qui encaisse la Blessure ?`,
        victims.map((o,k)=>({label:`${o.n} — ${o.wounds}/${RULES.survivorWounds} Blessures`+
          (o.body&&o.body.e.armor?`, Armure ${o.body.e.armor}+`:"")+
          (hasSkill(o,"Peau de fer")?", Peau de fer":""), v:k})));
      v = victims[r ?? 0];
    }
    logLine(`${ZT[zz.t].n} attaque ${v.n} en ${zn(zi)}.`,"l-bad");
    wound(v, ZT[zz.t].noArmor);
  }
}
/* Choix de la Zone de destination (p.24) :
   1. la Zone la plus bruyante PARMI CELLES QUI CONTIENNENT UN SURVIVANT VISIBLE ;
   2. sinon la Zone la plus bruyante du plateau, quelle que soit la distance.
   Puis un pas d'une Zone vers elle par le chemin le plus court ; les chemins de
   même longueur font se scinder le groupe.
   Les zombies calculent leur route comme si les portes étaient ouvertes, mais
   une porte fermée les arrête quand même : ils s'y accumulent. */
function zombieSteps(zi){
  const seen = los(zi);
  let cands = [], best = 0;
  seen.forEach(i=>{
    if(!survIn(i).some(s=>!s.invisible)) return;      // 1. survivants visibles
    const nz = noiseOf(i);
    if(nz>best){ best=nz; cands=[i]; } else if(nz===best) cands.push(i);
  });
  if(!cands.length){                                   // 2. la Zone la plus bruyante
    best = 0;
    G.zones.forEach(z=>{
      const nz = noiseOf(z.i);
      if(nz>best){ best=nz; cands=[z.i]; } else if(nz===best && nz>0) cands.push(z.i);
    });
  }
  if(!cands.length || cands.includes(zi)) return [];
  // distances calculées portes ouvertes (les portes fermées bloquent le pas réel)
  const steps = new Set();
  let bd = 1e9;
  const dists = cands.map(t=>({t, d:bfsFrom(t, true)}));
  dists.forEach(o=>{ if(o.d[zi]>=0 && o.d[zi]<bd) bd=o.d[zi]; });
  if(bd===1e9) return [];
  dists.filter(o=>o.d[zi]===bd).forEach(o=>{
    neighbours(zi).forEach(nb=>{ if(o.d[nb]===bd-1) steps.add(nb); });
  });
  return [...steps];
}
function necroStep(zz){
  const outs = G.zones.filter(z=>hasSpawn(z) && z.i!==zz.entry).map(z=>z.i);
  if(!outs.length) return null;
  const d = bfsFrom(zz.z);
  let bd=1e9, best=null;
  outs.forEach(t=>{ if(d[t]>=0 && d[t]<bd){ bd=d[t]; best=t; } });
  if(best==null) return null;
  if(zz.z===best) { necroEscape(zz); return null; }
  const dt = bfsFrom(best);
  const step = neighbours(zz.z).find(nb=>dt[nb]===dt[zz.z]-1);
  return step ?? null;
}
function necroEscape(zz){
  logLine("Un Nécromancien s'échappe du plateau !","l-bad");
  const nz = G.zones.find(z=>z.spawnTokens.some(t=>t.necro));
  if(nz){ const t=nz.spawnTokens.find(x=>x.necro); t.necro=false; t.color="purple"; }
  const k = G.zombies.indexOf(zz);
  if(k>=0){ G.zombies.splice(k,1); G.pool.necromancer++; }
  const tokens = spawnTokens();
  if(tokens >= RULES.necroEscapeLossTokens)
    lose("Un Nécromancien s'est échappé alors que "+tokens+" jetons d'Apparition sont sur le plateau.");
}
/* Activation supplémentaire d'un type de zombie (carte d'activation, ou pénurie
   de figurines). Résolue immédiatement, sans interruption : les Blessures sont
   attribuées au Survivant le moins blessé de la Zone. */
function activateType(t){
  const groups={};
  G.zombies.filter(z=>z.t===t).forEach(zz=>(groups[zz.z] ||= []).push(zz));
  Object.keys(groups).forEach(k=>{
    const zi=+k, list=groups[zi], here=survIn(zi).filter(s=>!s.invisible);
    if(here.length){ list.forEach(zz=>{
      const alive2=survIn(zi).filter(s=>!s.invisible && !s.dead);
      if(!alive2.length) return;
      const v=alive2.reduce((a,b)=>a.wounds<=b.wounds?a:b);
      logLine(`${ZT[t].n} (activation suppl.) attaque ${v.n}.`,"l-bad"); wound(v, ZT[t].noArmor); }); return; }
    const steps = zombieSteps(zi);
    list.forEach((zz,k)=>{ if(steps.length) zz.z = steps[k%steps.length]; });
  });
}

/* ---------- apparition ---------- */
function drawSpawn(){
  if(!G.spawnDeck.length){ G.spawnDeck = shuffle(G.spawnDiscard); G.spawnDiscard=[]; }
  const c = G.spawnDeck.pop(); G.spawnDiscard.push(c); return c;
}
/* Résout UNE carte d'Invasion déjà tirée (hors « double invasion »). */
function applySpawnCell(cell, zi){
  if(cell==="-"){ logLine(`Invasion ${zn(zi)} : rien.`); return; }
  if(cell==="N"){
    // Une seule figurine de Nécromancien dans la boîte (p.27) : s'il est déjà
    // en jeu, la carte ne donne qu'une Activation supplémentaire.
    if(G.zombies.some(z=>z.t==="necromancer") || G.pool.necromancer<=0){
      logLine(`Invasion ${zn(zi)} : Nécromancien déjà en jeu → Activation supplémentaire.`,"l-bad");
      activateType("necromancer"); return;
    }
    logLine(`Invasion ${zn(zi)} : NÉCROMANCIEN !`,"l-bad");
    G.pool.necromancer--;
    G.zombies.push({id:G.nextZid++, t:"necromancer", z:zi, entry:zi});
    Z(zi).spawnTokens.push({color:"purple", side:"s", necro:true});   // pion supplémentaire
    // « Jouez immédiatement une Invasion de Zombies pour ce pion » (p.28).
    // Il n'y a pas de « Zone suivante » ici : une double invasion tirée dans
    // cette sous-séquence double donc les cartes de ce même pion.
    let due = 1, guard = 0;
    while(due>0 && guard++ < 6){
      due--;
      const c2 = drawSpawn().row[teamDanger()];
      if(c2==="D"){ due += 2; logLine(`Invasion ${zn(zi)} : DOUBLE INVASION pour le pion du Nécromancien.`,"l-bad"); }
      else applySpawnCell(c2, zi);
    }
    return;
  }
  if(cell==="D"){                                   // sécurité : jamais résolu ici
    logLine(`Invasion ${zn(zi)} : double invasion ignorée (hors séquence).`,"l-sys"); return; }
  if(cell[0]==="!"){ const t=LTR[cell[1]];
    logLine(`Invasion ${zn(zi)} : Activation supplémentaire — ${ZT[t].n}.`,"l-bad");
    activateType(t); return; }
  const n = +cell[0], t = LTR[cell[1]];
  logLine(`Invasion ${zn(zi)} : ${n} ${ZT[t].n}${n>1?"s":""}.`, "l-bad");
  for(let k=0;k<n;k++) addZombie(t, zi);
}
/* Séquence d'Invasion sur une liste ordonnée de Zones (p.26).
   Une carte « double invasion » ne fait apparaître personne ici : c'est la Zone
   SUIVANTE qui tire 2 cartes (4 si deux doubles sont tirées sur la même Zone).
   Tirée sur la dernière Zone, elle déborde sur la première. */
function runSpawnSequence(list){
  if(!list.length) return;
  const n = list.length;
  let k = 0, draws = 1, guard = 0;
  while((k < n || draws > 1) && guard < 60){
    const zi = list[k % n];
    let doubles = 0;
    for(let d=0; d<draws && guard<60; d++){
      guard++;
      const cell = drawSpawn().row[teamDanger()];
      if(cell==="D"){ doubles++; logLine(`Invasion ${zn(zi)} : DOUBLE INVASION → reportée sur la Zone suivante.`,"l-bad"); }
      else applySpawnCell(cell, zi);
    }
    draws = doubles ? Math.pow(2, doubles) : 1;
    k++;
  }
}
function spawnPhase(){
  const total=spawnTokens(), actifs=activeTokens();
  logLine(`— Invasion (niveau ${DANGER[teamDanger()].name}, ${actifs}/${total} pion(s) actif(s)) —`,"l-sys");
  const list = [];      // 1 carte par pion ACTIF (une Zone peut en porter plusieurs)
  G.zones.forEach(z=>z.spawnTokens.forEach(t=>{ if(spawnActive(t)) list.push(z.i); }));
  runSpawnSequence(list);
}
function endPhase(){
  G.zones.forEach(z=>z.noise=0);
  G.survivors.forEach(s=>{
    s.invisible=false;
    [...s.hands,...s.back].forEach(c=>{ if(c && c.e && c.e.reload) c.loaded=true; });
  });
  G.round++; G.firstPlayer = (G.firstPlayer+1) % G.survivors.length;
  logLine(`── Round ${G.round} ──`,"l-round");
  startPlayersPhase();
  render(); checkEnd();
}

/* --------------------------------------------------------------------------
   FIN DE PARTIE
   -------------------------------------------------------------------------- */
function checkEnd(){
  if(G.over) return;
  const living = G.survivors.filter(s=>!s.dead);
  if(!living.length) return lose("Tous les Survivants sont morts.");
  const w = winCond();
  if(!condMet(w.need)) return;
  const sortis = living.filter(s=>s.escaped).length;
  if(w.exit==="none")                    return win("Mission accomplie : "+missionText()+".");
  if(w.exit==="any"  && sortis>0)        return win("Mission accomplie : "+missionText()+".");
  if(w.exit!=="any"  && sortis===living.length)
                                         return win("Mission accomplie : "+missionText()+".");
}
function win(t){ G.over=true; clearSave(); banner("VICTOIRE", t); }
function lose(t){ G.over=true; clearSave(); banner("DÉFAITE", t); }
function banner(t,x){
  document.getElementById("bTitle").textContent=t;
  document.getElementById("bText").textContent=x;
  document.getElementById("banner").style.display="grid";
}

/* ==========================================================================
   SAUVEGARDE
   Deux mécanismes : une sauvegarde automatique en mémoire locale (reprise à la
   réouverture de la page) et un export / import JSON explicite.
   Les cartes ne sont stockées que par leur identifiant : les caractéristiques
   sont relues dans EQUIP au chargement, donc corriger une carte corrige aussi
   les parties déjà sauvegardées.
   ========================================================================== */
const SAVE_KEY = "zbp_save", SAVE_VERSION = 1;

const cardOut = c => c ? {id:c.id, loaded:c.loaded!==false} : null;
function cardIn(o){
  if(!o) return null;
  const e = EQ[o.id];
  if(!e){ console.warn("Carte inconnue ignorée :", o.id); return null; }
  return {id:o.id, e, loaded:o.loaded!==false, used:false};
}
const padTo = (a,n) => { const r=a.slice(0,n); while(r.length<n) r.push(null); return r; };

function serialize(){
  return {
    v:SAVE_VERSION, date:new Date().toISOString(),
    q:G.q, round:G.round, phase:G.phase, over:G.over,
    nextZid:G.nextZid, objectivesLeft:G.objectivesLeft, firstPlayer:G.firstPlayer,
    taken:{...G.taken},
    pool:{...G.pool}, tab:UI.tab,
    // seul l'état mutable des Zones est stocké : la structure (murs, portes,
    // cryptes) est reconstruite depuis la quête.
    zones:G.zones.map(z=>({
      door:{...z.door}, cryptOpen:!!z.cryptOpen,
      spawnTokens:z.spawnTokens.map(t=>({...t})),
      obj:z.obj?{...z.obj}:null, noise:z.noise, bile:z.bile, explored:z.explored,
      buildingOpened:z.buildingOpened, vaultCards:(z.vaultCards||[]).map(cardOut)
    })),
    survivors:G.survivors.map(s=>({
      idx:s.idx, z:s.z, xp:s.xp, wounds:s.wounds, dead:s.dead, escaped:s.escaped,
      hands:s.hands.map(cardOut), back:s.back.map(cardOut), body:cardOut(s.body),
      skills:[...s.skills], pending:s.pending.map(p=>({choice:[...p.choice], lv:p.lv})),
      actions:s.actions, free:s.free.map(f=>({types:[...f.types], label:f.label})),
      searched:s.searched, reorgFree:s.reorgFree, invisible:s.invisible,
      ench:{...s.ench}, hitRun:s.hitRun
    })),
    zombies:G.zombies.map(z=>({id:z.id, t:z.t, z:z.z, entry:z.entry})),
    equipDeck:G.equipDeck.map(cardOut), equipDiscard:G.equipDiscard.map(cardOut),
    spawnDeck:G.spawnDeck.map(c=>c.id), spawnDiscard:G.spawnDiscard.map(c=>c.id),
    log:[...document.querySelectorAll("#log div")].slice(-80)
          .map(d=>({t:d.textContent, c:d.className}))
  };
}

function loadState(d){
  if(!d || typeof d!=="object") throw new Error("fichier vide ou illisible");
  if(d.v!==SAVE_VERSION) throw new Error("version de sauvegarde "+d.v+" non prise en charge");
  const err = validateQuest(d.q);
  if(err) throw new Error("carte de la sauvegarde invalide — "+err);
  if(!Array.isArray(d.survivors) || !Array.isArray(d.zones)) throw new Error("contenu incomplet");

  QUEST = d.q;
  const zones = buildBoard(d.q);
  if(d.zones.length !== zones.length)
    throw new Error("la carte ne correspond pas au nombre de Zones sauvegardées");
  d.zones.forEach((sz,k)=>{
    const z = zones[k];
    Object.assign(z, {
      door: {...z.door, ...(sz.door||{})}, cryptOpen: !!sz.cryptOpen,
      spawnTokens: (sz.spawnTokens||[]).map(t=>({...t})),
      obj: sz.obj ? {...sz.obj} : null,
      noise: sz.noise|0, bile: !!sz.bile, explored: !!sz.explored,
      buildingOpened: !!sz.buildingOpened
    });
    if(z.crypt) z.vaultCards = (sz.vaultCards||[]).map(cardIn).filter(Boolean);
  });

  const survivors = d.survivors.map((ss,k)=>{
    const base = SURVIVORS[ss.idx] || SURVIVORS[k];
    return {
      ...base, idx: ss.idx, z: ss.z, xp: ss.xp|0, wounds: ss.wounds|0,
      dead: !!ss.dead, escaped: !!ss.escaped,
      hands: padTo((ss.hands||[]).map(cardIn), RULES.handSlots),
      back:  padTo((ss.back ||[]).map(cardIn), RULES.backSlots),
      body:  cardIn(ss.body),
      skills: ss.skills||[], pending: ss.pending||[],
      actions: ss.actions|0, free: ss.free||[],
      searched: !!ss.searched, reorgFree: ss.reorgFree!==false,
      invisible: !!ss.invisible, ench: ss.ench||{}, hitRun: !!ss.hitRun
    };
  });

  G = {
    q: d.q, zones, survivors,
    zombies: (d.zombies||[]).map(z=>({id:z.id, t:z.t, z:z.z, entry:z.entry})),
    nextZid: d.nextZid||1, round: d.round||1, phase: "players", over: false,
    equipDeck: (d.equipDeck||[]).map(cardIn).filter(Boolean),
    equipDiscard: (d.equipDiscard||[]).map(cardIn).filter(Boolean),
    spawnDeck: (d.spawnDeck||[]).map(i=>({id:i, row:SPAWN_TABLE[i-1]})).filter(c=>c.row),
    spawnDiscard: (d.spawnDiscard||[]).map(i=>({id:i, row:SPAWN_TABLE[i-1]})).filter(c=>c.row),
    pool: d.pool || {}, vaultDeck: [], taken: d.taken || {},
    objectivesLeft: d.objectivesLeft|0, firstPlayer: d.firstPlayer|0,
    customMap: JSON.stringify(d.q) !== JSON.stringify(DEFAULT_QUEST)
  };
  Object.keys(ZT).forEach(k=>{ if(typeof G.pool[k]!=="number") G.pool[k]=ZT[k].pool; });

  UI = {tab: d.tab|0, mode:null, data:null, reorgSel:null};
  document.getElementById("banner").style.display="none";
  document.getElementById("modal").style.display="none";
  const lg=document.getElementById("log"); lg.innerHTML="";
  (d.log||[]).forEach(l=>{ const e=document.createElement("div");
    if(l.c) e.className=l.c; e.textContent=l.t; lg.appendChild(e); });
  lg.scrollTop = lg.scrollHeight;
  render();
}

function autoSave(){
  if(!G) return;
  if(G.over) return clearSave();
  if(G.phase!=="players") return;      // seul point de reprise propre
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); }
  catch(e){ /* quota ou stockage interdit : la partie continue sans persistance */ }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* Reprise au démarrage : uniquement si la sauvegarde porte sur la MÊME carte
   que celle demandée (sinon, arriver de l'éditeur relancerait l'ancienne partie). */
function tryRestore(){
  let raw; try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
  if(!raw) return false;
  let d; try{ d = JSON.parse(raw); }catch(e){ clearSave(); return false; }
  if(JSON.stringify(d.q) !== JSON.stringify(QUEST)) return false;
  try{
    loadState(d);
    logLine(`↻ Partie reprise — Round ${G.round}.`,"l-sys");
    return true;
  }catch(e){
    console.warn("Sauvegarde inutilisable :", e);
    clearSave(); return false;
  }
}
function downloadSave(){
  if(!G) return;
  const nom = (G.q.name||"partie").normalize("NFD").replace(/[̀-ͯ]/g,"")
                                  .replace(/[^\w-]+/g,"_");
  const blob = new Blob([JSON.stringify(serialize(), null, 1)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `zombicide-${nom}-round${G.round}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  logLine("Sauvegarde exportée en JSON.","l-sys");
}

const zn = i => `(${Z(i).x+1},${Z(i).y+1})`;
function logLine(t, cls){

  l.appendChild(d); l.scrollTop=l.scrollHeight;

function pastille(kind, key, label, extra){

function renderBoard(){
  const b=document.getElementById("board");
  b.style.gridTemplateColumns=`repeat(${G.q.W}, var(--zs))`;
  b.innerHTML="";
  const act = G.survivors[UI.tab];

  if(act && !act.dead && !act.escaped && G.phase==="players"){
    if(UI.mode?.t==="move")  legalMoves(act).forEach(i=>legal.add(i));
    if(UI.mode?.t==="speed" || UI.mode?.t==="bloodlust" || UI.mode?.t==="hitrun")
      legalMoves(UI.mode.s).forEach(i=>legal.add(i));
    if(UI.mode?.t==="attack") UI.mode.zones.forEach(i=>legalAtk.add(i));
    if(UI.mode?.t==="bile")   [act.z,...neighbours(act.z)].forEach(i=>legal.add(i));
    if(UI.mode?.t==="torch")  UI.mode.zones.forEach(i=>legal.add(i));
    if(UI.mode?.t==="repulse")los(act.z).forEach(i=>{ if(zombiesIn(i).length) legalAtk.add(i); });
  }
  G.zones.filter(z=>!z.crypt).forEach(z=>{
    const d=document.createElement("div");

    d.dataset.i=z.i;
    const lb=document.createElement("div"); lb.className="lbl";

    // jetons
    const tk=document.createElement("div"); tk.className="toks";
    const T=(c,t,title)=>{const e=document.createElement("div");e.className="tok "+c;e.textContent=t;e.title=title||"";tk.appendChild(e);return e;};
    if(z.exit) T("exit","S","Sortie");
    if(z.obj){
      // face rouge tant que l'Objectif est caché ; sa vraie couleur reste secrète
      const face = z.obj.hidden ? "red" : z.obj.color;
      const e = T("obj"+(z.obj.hidden?" hidden":""), z.obj.hidden?"?":"O",
        z.obj.hidden ? "Objectif face cachée (recto rouge) — +5 XP"
                     : `Objectif ${colM(z.obj.color)} — +5 XP`);
      e.style.setProperty("--oc", colCss(face));
    }
    if(z.bile) T("bile","B","Bile de Dragon");
    if(z.noise){ const e=T("noise","","Bruit : "+z.noise);
                 const sp=document.createElement("span"); sp.textContent=z.noise; e.appendChild(sp); }
    d.appendChild(tk);
    // Zones d'Invasion : un rectangle par pion, plaqué sur le bord choisi
    z.spawnTokens.forEach(t=>{

      const e=document.createElement("div");

      e.style.setProperty("--sc", colCss(t.color));
      e.textContent = t.necro ? "N" : "";
      const cond = (locks().spawns||{})[t.color];
      e.title = `Zone d'Invasion ${colF(t.color)}`+(t.necro?" (Nécromancien)":"")+
                (actif ? " — active" : ` — inactive : ${condText(cond)}`);
      d.appendChild(e);
    });
    if(z.cryptDoor){                       // trappe de crypte, au centre de la Zone
      const t=document.createElement("div");
      t.className="cryptHatch"+(z.cryptOpen?" open":"");
      t.style.setProperty("--cc", CRYPT_COLORS[z.cryptDoor]||"#a06bd8");
      t.textContent = z.cryptOpen ? "⌷" : "⛒";
      t.title = `Trappe de crypte ${z.cryptDoor} — ${z.cryptOpen?"ouverte":"fermée"}`;
      d.appendChild(t);
    }
    // figurines
    const ac=document.createElement("div"); ac.className="actors";
    survIn(z.i).forEach(s=>{
      const p=pastille(s.c, s.id, s.n[0], "sv"+(s===act?" act":""));

      if(s.wounds){const w=document.createElement("div");w.className="wnd";w.textContent=s.wounds;p.appendChild(w);}
      ac.appendChild(p);
    });
    const cnt={};
    zombiesIn(z.i).forEach(zz=>cnt[zz.t]=(cnt[zz.t]||0)+1);
    Object.keys(cnt).forEach(t=>{
      for(let k=0;k<Math.min(cnt[t],6);k++){
        const p=pastille(ZT[t].c, t, ZT[t].ini); p.title=ZT[t].n; ac.appendChild(p);
      }
      if(cnt[t]>6){ const e=document.createElement("div"); e.className="pastille";
        e.style.background="#000a"; e.textContent="+"+(cnt[t]-6); ac.appendChild(e); }
    });
    d.appendChild(ac);
    d.onclick=()=>onZoneClick(z.i);
    b.appendChild(d);
  });
  b.appendChild(renderWalls());
  renderCrypts();
}
/* Un seul calque SVG au-dessus de la grille : chaque arête interne est tracée
   UNE fois, centrée sur la frontière (les bords de plateau sont matérialisés
   par la bordure du conteneur). */
function renderWalls(){
  const NS="http://www.w3.org/2000/svg";
  const zs = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--zs")) || 92;
  const W=G.q.W, H=G.q.H;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","walls");
  svg.setAttribute("width", W*zs); svg.setAttribute("height", H*zs);
  svg.setAttribute("viewBox", `0 0 ${W*zs} ${H*zs}`);
  const line=(x1,y1,x2,y2,cls)=>{
    const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",x1); l.setAttribute("y1",y1);
    l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    l.setAttribute("class",cls); svg.appendChild(l); return l;
  };
  G.zones.forEach(z=>{
    const x0=z.x*zs, y0=z.y*zs;
    // seules les arêtes Nord et Ouest sont parcourues : chaque arête interne
    // du plateau est le Nord ou l'Ouest d'exactement une case.
    const seg={ n:[x0, y0, x0+zs, y0], w:[x0, y0, x0, y0+zs] };
    for(const s of ["n","w"]){
      if(!AT(z.x+DXY[s][0], z.y+DXY[s][1])) continue;   // bord du plateau
      if(z.edge[s]==="open") continue;
      const [a,b,c,d]=seg[s];
      line(a,b,c,d,"wall");
      if(z.edge[s]==="door"){
        const p=(k,lo,hi)=>lo+(hi-lo)*k;
        const col = z.doorColor[s], verrou = !z.door[s] && doorLocked(col);
        if(z.door[s]){
          // ouverte : deux battants écartés, laissant le passage libre au centre
          line(p(.20,a,c), p(.20,b,d), p(.33,a,c), p(.33,b,d), "door open").setAttribute("stroke", colCss(col));
          line(p(.67,a,c), p(.67,b,d), p(.80,a,c), p(.80,b,d), "door open").setAttribute("stroke", colCss(col));
        } else {
          line(p(.22,a,c), p(.22,b,d), p(.78,a,c), p(.78,b,d), "door"+(verrou?" locked":""))
            .setAttribute("stroke", colCss(col));
        }
      }
    }
  });
  return svg;
}

const CRYPT_COLORS = {violet:"#a06bd8", violette:"#a06bd8", jaune:"#c9a227",
                      purple:"#a06bd8", yellow:"#c9a227"};
function onZoneClick(i){
  if(G.over || G.phase!=="players") return;
  const m=UI.mode; const act=G.survivors[UI.tab];
  if(!m){ return; }
  if(m.t==="move"){ if(legalMoves(act).includes(i)){ UI.mode=null; doMove(act,i); } return; }
  if(m.t==="speed"||m.t==="bloodlust"||m.t==="hitrun"){
    const s=m.s;
    if(!legalMoves(s).includes(i)) return;
    const hadZ = zombiesIn(s.z).length;
    s.z=i; logLine(`${s.n} se déplace en ${zn(i)} (${m.t==="speed"?"Vitesse":m.t==="bloodlust"?"Soif de sang":"Frappe et esquive"}).`);
    m.left--;
    const stop = zombiesIn(i).length>0;
    if(m.t==="bloodlust" && (m.left<=0 || stop)){
      if(zombiesIn(i).length){ s.free.push({types:["melee"],label:"Soif de sang"}); logLine("→ Action de Mêlée gratuite.","l-obj"); }
      else logLine("Soif de sang : aucune Zone avec Zombie atteinte.","l-bad");
      UI.mode=null;
    } else if(m.left<=0 || stop) UI.mode=null;
    afterMove(s); return;
  }
  if(m.t==="attack"){ if(m.zones.includes(i)) doAttack(m.s, m.c, i, m.alt); return; }
  if(m.t==="bile"){
    if(i!==m.s.z && !neighbours(m.s.z).includes(i)) return;
    pay(m.s,"item"); Z(i).bile=true; discardFrom(m.s,m.c);
    logLine(`${m.s.n} lance une Bile de Dragon en ${zn(i)}.`); UI.mode=null; render(); return;
  }
  if(m.t==="torch"){
    if(!m.zones.includes(i)) return;
    pay(m.s,"item"); discardFrom(m.s,m.c); dragonFire(i, m.s);
    UI.mode=null; render(); checkEnd(); return;
  }
  if(m.t==="repulse"){
    if(!zombiesIn(i).length) return;
    const from=m.s.z, d=bfsFrom(from);
    const dests = neighbours(i).filter(nb=>d[nb]===d[i]+1);
    if(!dests.length){ toast("Aucune Zone de destination valide."); UI.mode=null; return render(); }
    zombiesIn(i).forEach(zz=>zz.z=dests[0]);
    pay(m.s,"ench"); m.s.ench.repulse=true;
    logLine(`Repousser : les Zombies de ${zn(i)} sont poussés en ${zn(dests[0])}.`,"l-obj");
    UI.mode=null; render(); return;
  }
}

function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

/* État d'Actions d'un Survivant, pour le code couleur du nom.
   Les Actions gratuites comptent : un Survivant à 0 Action générale mais avec
   une Action de Mêlée gratuite peut encore jouer. */
function actionState(s){
  if(s.dead)    return {cls:"act-out",  n:0, txt:"éliminé"};
  if(s.escaped) return {cls:"act-out",  n:0, txt:"évacué"};
  const n = s.actions + s.free.length;
  if(n <= 0)    return {cls:"act-none", n:0, txt:"plus d'Action"};
  const total = RULES.actionsPerTurn + (hasSkill(s,"+1 Action") ? 1 : 0);
  const detail = s.free.length
    ? `${s.actions} Action(s) + ${s.free.map(f=>f.label).join(", ")} gratuite(s)`
    : `${s.actions} Action(s)`;
  return {cls: s.actions >= total ? "act-full" : "act-some", n, txt:detail};
}

/* Les trois types d'Action de Combat, distingués partout : bouton, aide de
   ciblage et journal. */
const ATK = {
  melee:  {n:"Mêlée",    label:"⚔ Mêlée",    css:"#c2703a"},
  ranged: {n:"Distance", label:"🏹 Distance", css:"#4fb0a0"},
  spell:  {n:"Magie",    label:"✦ Magie",    css:"#8a6bd8"}
};
function cardStats(e){
  if(e.kind==="armor") return "Armure "+e.armor+"+";
  if(e.kind==="shield") return e.txt;
  if(e.kind==="melee"||e.kind==="ranged"||e.kind==="spell"){
    const t = `Portée ${e.rmin}-${e.rmax} · ${e.dice} dé${e.dice>1?"s":""} · ${e.acc}+ · Dégâts ${e.dmg}`;
    const f=[]; if(e.dual)f.push("Ambidextre"); if(e.door)f.push("Porte");
    if(e.noise)f.push("Bruit"); if(e.keyw)f.push(e.keyw);
    return t + (f.length?" · "+f.join(", "):"") + (e.txt?" — "+e.txt:"");
  }
  return e.txt||"";
}
function startAttack(s,c,alt){
  const p=weaponProfile(s,c,alt);
  const zs=targetZones(s,p);
  if(!zs.length) return toast("Aucune Zone à portée.");
  UI.mode={t:"attack", s, c, alt, zones:zs}; render();

function onSlotClick(s,area,k){
  if(!UI.reorgSel){ UI.reorgSel={area,k}; return render(); }
  const a=UI.reorgSel; UI.reorgSel=null;
  if(a.area===area && a.k===k) return render();
  if(!s.reorgFree){ if(!canPay(s,"reorg")) { toast("Plus d'Action pour réorganiser."); return render(); } pay(s,"reorg"); }
  else { s.reorgFree=false; }
  const t=s[a.area][a.k]; s[a.area][a.k]=s[area][k]; s[area][k]=t;
  logLine(`${s.n} réorganise son inventaire.`);

async function tradeWith(s,o){
  const opts=[];
  s.hands.forEach((c,k)=>{ if(c) opts.push({label:"Donner "+c.e.n, v:["hands",k]}); });
  s.back.forEach((c,k)=>{ if(c) opts.push({label:"Donner "+c.e.n, v:["back",k]}); });
  if(!opts.length) return toast("Rien à donner.");
  const r=await choose("Échange avec "+o.n, opts);
  if(!r) return;
  if(!s.reorgFree){ if(!canPay(s,"reorg")) return toast("Plus d'Action."); pay(s,"reorg"); }
  else s.reorgFree=false;
  const c=s[r[0]][r[1]]; s[r[0]][r[1]]=null;
  await giveCard(o,c);
  logLine(`${s.n} donne ${c.e.n} à ${o.n}.`);
  render();
}
/* Une compétence apprise en cours de Round prend effet immédiatement. */
function applyNewSkill(s, name){
  if(G.phase!=="players" || s.dead || s.escaped) return;
  if(name==="+1 Action") s.actions++;
  const add=(types,label)=>s.free.push({types,label});
  if(name==="+1 Action Déplacement gratuite") add(["move"],"Déplacement");
  if(name==="+1 Action Mêlée gratuite")       add(["melee"],"Mêlée");
  if(name==="+1 Action Distance gratuite")    add(["ranged"],"Distance");
  if(name==="+1 Action Magie gratuite")       add(["magic","ench"],"Magie");
  if(name==="Lanceur de sorts")               add(["magic","ench"],"Sorts");
  if(name==="+1 Action Combat gratuite")      add(["melee","ranged","magic"],"Combat");
}

/* ---------- zoom & cadrage ----------
   Le zoom fait varier la taille d'une Zone (--zs) puis redessine : le calque SVG
   des murs est recalculé, donc le trait reste net à tous les niveaux (ce qu'un
   transform:scale() ne permet pas). */
const ZOOM_MIN=36, ZOOM_MAX=170, ZOOM_DEF=92;
let ZOOM = ZOOM_DEF;
function applyZoom(v, memoriser){
  ZOOM = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(v)));
  document.documentElement.style.setProperty("--zs", ZOOM+"px");
  document.getElementById("zLbl").textContent = Math.round(ZOOM/ZOOM_DEF*100)+" %";
  // les coordonnées de case deviennent illisibles en dessous d'une certaine
  // taille ; la classe est posée sur <body> pour survivre aux redessins
  document.body.classList.toggle("zsmall", ZOOM < 58);
  if(memoriser!==false){ try{ localStorage.setItem("zbp_zoom", ZOOM); }catch(e){} }
  if(G) renderBoard();
}
const zoomBy = f => applyZoom(ZOOM*f);
/* Ajuste la carte à la place disponible, marge et bandeau des cryptes compris. */
function zoomFit(){
  if(!G) return;
  const w = document.getElementById("boardWrap");
  const reserve = G.zones.some(z=>z.crypt) ? 130 : 0;   // bandeau des cryptes
  const calcul = () => Math.min((w.clientWidth  - 46) / G.q.W,
                                (w.clientHeight - 46 - reserve) / G.q.H);
  // Deux passes : si une barre de défilement était présente, elle disparaît
  // après la première et libère la place réellement disponible.
  applyZoom(calcul(), false);
  applyZoom(calcul());
}

(donc +2 avec une paire).</p>
<p><b>Ordre de priorité des cibles</b> (p.27) — 1 Marcheur, 2 Costaud ou Abomination (au choix du
tireur), 3 Coureur, 4 Nécromancien. Chaque succès frappe la priorité la plus forte présente ; si les
Dégâts sont insuffisants, <b>le succès est perdu</b> — il ne se reporte pas sur une cible plus faible.</p>
<p><b>Tir ami</b> (p.27) — à Distance et en Magie seulement : ce sont les <b>échecs</b> du jet qui
blessent les Survivants de la Zone visée, chacun infligeant autant de Blessures que la valeur de
Dégâts. Le tireur ne peut se toucher ; les jets d'Armure s'appliquent ; tuer un Survivant ne rapporte
aucune expérience. « À bout portant » supprime le tir ami à Portée 0.</p>
<p><b>Ligne de Vue</b> (p.10) — en rue : lignes droites dans les 4 directions, et <b>une seule Zone</b>
à l'intérieur d'un bâtiment. Dans un bâtiment : les Zones partageant une ouverture, limité à une Zone ;
en regardant dehors, la rue en ligne droite.</p>
<p><b>Bruit</b> (p.13) — chaque Survivant vaut 1 bruit. Les sorts de combat, l'action « Faire du bruit »
et l'ouverture d'une porte avec jet posent un jeton. Les jetons sont retirés en Phase de Fin.</p>
<p><b>Phase des Zombies</b> (p.23-24) — toutes les attaques d'abord, puis tous les déplacements.
Destination : la Zone la plus bruyante <i>parmi celles contenant un Survivant visible</i> ; à défaut,
la Zone la plus bruyante du plateau, <b>quelle que soit la distance</b>. Puis un pas par le plus court
chemin. Les routes de même longueur font <b>scinder le groupe en parts égales, en ajoutant des
figurines</b> ; Abominations et Nécromanciens ne se scindent jamais. Les zombies tracent leur route
comme si les portes étaient ouvertes, mais une porte fermée les arrête. Les Coureurs rejouent après
tous les autres.</p>
<p><b>Invasion</b> (p.25-26) — 1 carte par <i>pion</i>, lue au niveau de danger du Survivant le plus
expérimenté. Une carte <b>Double Invasion</b> ne fait rien apparaître ici : c'est la Zone
<b>suivante</b> qui tire 2 cartes (4 si deux doubles), et elle déborde sur la première Zone si elle
sort en dernier. Les cartes d'Activation supplémentaire n'ont aucun effet au niveau Bleu. En panne de
figurines, on place ce qui reste puis tout le type concerné gagne une activation.</p>
<p><b>Nécromanciens</b> (p.28) — un seul sur le plateau à la fois ; une carte supplémentaire ne donne
alors qu'une activation. À son arrivée il pose un pion Invasion et déclenche une Invasion immédiate.
Il fuit vers le pion Invasion le plus proche (jamais sa Zone d'arrivée). Défaite si un Nécromancien
s'échappe alors qu'il y a 6 pions sur le plateau. Le tuer retire un pion.</p>
<p><b>Cryptes</b> (p.32-33) — une porte de crypte est une <b>trappe posée au centre d'une Zone</b>,
pas sur un mur. Toutes les trappes d'une même couleur mènent à la <b>même Zone de Crypte hors
plateau</b> : deux trappes créent un souterrain entre deux endroits.
Aucune ligne de vue entre la crypte et les Zones qui la relient. Les cryptes sont des bâtiments mais
ne peuvent pas être fouillées et ne provoquent aucune Invasion à leur découverte. Une trappe s'ouvre
avec l'action « Ouvrir une porte », et aussi depuis l'intérieur de la crypte. Les <b>Artefacts de crypte</b> (Enfer, Arbalète orque) y sont
stockés : 1 Action pour en prendre un, ce n'est pas une Fouille, répétable s'il en reste.</p>
<p><b>Expérience</b> (p.16) — 1 XP par Zombie (5 pour l'Abomination), 5 XP par Objectif.
Bleu 0-6 · Jaune 7-18 (4ᵉ Action) · Orange 19-42 (1 compétence parmi 2) · Rouge 43+ (1 parmi 3).</p>
<h3>Simplifications assumées</h3>
<ul>
<li>Lors d'une <i>activation supplémentaire</i>, les Blessures vont automatiquement au Survivant le
moins blessé (ailleurs, le joueur choisit).</li>
<li>À priorité égale entre Costaud et Abomination, la cible que l'arme peut réellement tuer est
choisie automatiquement.</li>
<li>Une Double Invasion tirée pendant l'Invasion immédiate d'un Nécromancien double les cartes de ce
même pion, faute de « Zone suivante » dans cette sous-séquence.</li>
<li>À la mort d'un Nécromancien, le pion Invasion retiré est choisi automatiquement.</li>
<li>Les portes de couleur à condition de quête et les règles spéciales de quête ne sont pas
modélisées.</li>
<li>La quête « La Cloche de l'Aube » est un plan original respectant la grammaire officielle — utilise
l'éditeur pour transcrire une quête du livret.</li>
</ul>
<p><b>Couleurs de quête</b> — les Zones d'Invasion de couleur ne déploient aucun Zombie tant qu'un
événement ne les active pas (p.26), et les portes de couleur ne peuvent pas être ouvertes avant que
leur condition soit remplie (p.19). Ces conditions sont décrites par <code>quest.locks</code> :
<code>locks.spawns</code> pour l'activation des Zones d'Invasion, <code>locks.doors</code> pour le
déverrouillage des portes, <code>locks.spawnsOff</code> pour une désactivation. Conditions
reconnues : <code>objective:&lt;couleur&gt;</code>, <code>objectives:all</code>, <code>never</code>.
Une couleur absente de la table n'est soumise à aucune condition.</p>
<p><b>Condition de victoire</b> — <code>quest.win</code> décrit ce qu'il faut accomplir :
<code>need</code> est la condition préalable (même vocabulaire que les verrous :
<code>objectives:all</code>, <code>objective:&lt;couleur&gt;</code>, ou rien), et <code>exit</code>
dit qui doit quitter le plateau : <code>all</code> (tous les Survivants vivants, défaut),
<code>any</code> (un seul suffit) ou <code>none</code> (aucune sortie requise). Tant que
<code>need</code> n'est pas remplie, la Zone de Sortie refuse les Survivants. On peut ainsi bâtir
une mission où seul l'Objectif vert compte, les autres n'étant que des bonus d'expérience.</p>
<p><b>Objectifs face cachée</b> — leur recto est toujours ROUGE ; le verso, tiré au sort dans
<code>hiddenBacks</code> en début de partie, n'est révélé qu'à la récupération. Un Objectif caché
peut donc déverrouiller une porte… ou pas.</p>
<h3>Sauvegarde</h3>
<p><b>Automatique</b> — la partie est enregistrée dans la mémoire locale du navigateur après chaque
action, et reprise telle quelle à la réouverture de la page. L'enregistrement n'a lieu que pendant
la Phase des Joueurs, seul point de reprise propre ; il est effacé en fin de partie et par
« Nouvelle partie ».</p>
<p><b>Fichier JSON</b> — « Sauvegarder » exporte l'état complet (plateau, Survivants, inventaires,
zombies, pioches, journal) dans un fichier ; « Charger… » le relit. Les cartes ne sont stockées que
par leur identifiant : corriger une carte d'Équipement corrige aussi les parties déjà sauvegardées.
Une sauvegarde portant sur une autre carte est chargée avec sa carte ; une sauvegarde illisible ou
d'une version inconnue est refusée avec un message, sans casser la partie en cours.</p>
<h3>Sprites</h3>
<p>Dépose tes pastilles PNG dans <code>./sprites/</code> : <code>surv_ann.png</code>,
<code>surv_baldric.png</code>, <code>surv_clovis.png</code>, <code>surv_nelly.png</code>,
<code>surv_samson.png</code>, <code>surv_silas.png</code>, <code>z_walker.png</code>,
<code>z_runner.png</code>, <code>z_brute.png</code>, <code>z_abomination.png</code>,
<code>z_necromancer.png</code>. En leur absence, des pastilles colorées sont générées.</p>
`;

/* ---------- démarrage ---------- */
document.getElementById("zIn").onclick  = ()=>zoomBy(1.15);
document.getElementById("zOut").onclick = ()=>zoomBy(1/1.15);
document.getElementById("zFit").onclick = zoomFit;
document.getElementById("boardWrap").addEventListener("wheel", e=>{
  if(!e.ctrlKey) return;                      // Ctrl + molette : zoom
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1);
}, {passive:false});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(e.key==="+" || e.key==="=") { zoomBy(1.15); e.preventDefault(); }
  else if(e.key==="-")           { zoomBy(1/1.15); e.preventDefault(); }
  else if(e.key==="0")           { zoomFit(); e.preventDefault(); }
});
document.getElementById("btnEnd").onclick = ()=>{ if(!G.over){ UI.mode=null; zombiePhase(); } };
document.getElementById("btnNew").onclick = ()=>{ clearSave(); location.reload(); };
document.getElementById("btnSave").onclick = downloadSave;
document.getElementById("btnLoad").onclick = ()=>document.getElementById("fileLoad").click();
document.getElementById("fileLoad").onchange = async e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value = "";                       // permet de recharger le même fichier
  if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    loadState(d);
    logLine(`↻ Sauvegarde « ${f.name} » chargée — Round ${G.round}.`,"l-sys");
  }catch(err){ toast("Chargement impossible : "+err.message); }
};
document.getElementById("btnEditor").onclick = ()=>{
  // on emmène la carte courante dans l'éditeur
  location.href = "zombicide-editor.html#q=" + encodeURIComponent(textToB64(JSON.stringify(QUEST)));
};
if(CUSTOM_QUEST){
  const b=document.getElementById("btnDefault");
  b.style.display="";
  b.onclick=()=>{
    try{ localStorage.removeItem("zbp_quest"); }catch(e){}
    clearSave();
    location.href = location.pathname;          // retire aussi le #q= de l'URL
  };
}
document.getElementById("btnRules").onclick = ()=>{
  const m=document.getElementById("modal");
  document.getElementById("mTitle").textContent="Règles & notes";
  const b=document.getElementById("mBody"); b.innerHTML=RULES_TXT+
    '<button class="opt" id="mClose">Fermer</button>';
  document.getElementById("mClose").onclick=()=>m.style.display="none";
  m.style.display="grid";
};
document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal") e.currentTarget.style.display="none";
});
preloadSprites(()=>{
  let memo = null;
  try{ memo = parseFloat(localStorage.getItem("zbp_zoom")); }catch(e){}
  applyZoom(memo > 0 ? memo : ZOOM_DEF, false);
  if(!tryRestore()) newGame();
  if(!(memo > 0)) zoomFit();          // première visite : on cadre la carte
});
</script>
