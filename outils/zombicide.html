const zn = i => `(${Z(i).x+1},${Z(i).y+1})`;
function logLine(t, cls){
  const l=document.getElementById("log");
  const d=document.createElement("div"); if(cls) d.className=cls; d.textContent=t;
  l.appendChild(d); l.scrollTop=l.scrollHeight;
}
function toast(t){ logLine("⚠ "+t,"l-bad"); }

/* Ajoute une pastille par TYPE de zombie présent dans la Zone, avec l'effectif
   et un effet de pile — plutôt qu'une pastille par figurine. */
/* Fixe la grille (--gc) sur une pastillothèque : côté = racine carrée
   arrondie au-dessus (1→1, 2..4→2, 5..9→3, 10..16→4, …). */
/* Cliquer une figurine de Survivant le met au premier plan du panneau.
   Quand un mode au clic est en cours (déplacement, ciblage…), on laisse au
   contraire passer le clic vers la Zone : sans quoi on ne pourrait plus viser
   ni rejoindre une Zone occupée par un allié. */
function rendreSelectionnable(p, s){
  p.classList.add("cliquable");
  p.onclick = ev=>{
    if(UI.mode) return;                       // le clic appartient à la Zone
    ev.stopPropagation();
    const k = G.survivors.indexOf(s);
    if(k<0 || k===UI.tab) return;
    annulerBascule();                         // choisir soi-même l'emporte
    UI.tab = k; render();
  };
}
function calerGrille(container){
  const n=container.children.length;
  container.style.setProperty("--gc", Math.max(1, Math.ceil(Math.sqrt(n))));
}
function ajouterZombies(container, zoneIdx){
  const cnt={};
  zombiesInCase(zoneIdx).forEach(zz=>cnt[zz.t]=(cnt[zz.t]||0)+1);
  Object.keys(cnt).sort((a,b)=>TARGET_PRIORITY[a]-TARGET_PRIORITY[b]).forEach(t=>{
    const n=cnt[t];
    /* Halo rouge sur le groupe qui vient d'avancer, le temps de l'étape. */
    const bouge = etapeZombies && etapeZombies.t===t
                  && memeZone(zoneIdx, etapeZombies.ou);
    const p=pastille(ZT[t].c, t, ZT[t].ini,
      (n>2?"pile3":(n>1?"pile2":""))+(bouge?" zbouge":""));
    p.style.setProperty("--zc", ZT[t].c);
    /* Repères pour les flèches de déplacement, qui se mesurent sur le jeton
       lui-même plutôt que sur le centre de la Zone. */
    p.dataset.zt = t; p.dataset.zi = ref(zoneIdx);
    p.title = n+" "+plurZ(t,n);
    if(n>1){ const e=document.createElement("div"); e.className="nb"; e.textContent=n; p.appendChild(e); }
    container.appendChild(p);
  });
}

function pastille(kind, key, label, extra){
  const d=document.createElement("div");
  d.className="pastille "+(extra||"");
  if(SPRITE_OK[key]) d.style.backgroundImage=`url(${SPRITE_DIR+SPRITES[key]})`;
  else { d.style.background=kind; d.textContent=label; }
  return d;
}
/* Jetons, marqueurs et Sortie d'une Zone, posés dans le conteneur `d`.
   Extrait de la boucle du plateau pour servir aussi aux Cryptes, qui n'en
   affichaient aucun : un jeton Bruit ou un objet déposé y était invisible. */
function poserJetons(d, z){
  const tk=document.createElement("div"); tk.className="toks";
  /* `sp` : clé d'image facultative. Si le PNG existe il remplace le jeton
     dessiné en CSS ; sinon on garde la pastille et sa lettre. */
  const T=(c,t,title,sp)=>{
    const e=document.createElement("div"); e.className="tok "+c;
    if(sp && SPRITE_OK[sp]){ e.classList.add("img");
      e.style.backgroundImage=`url(${SPRITE_DIR+SPRITES[sp]})`; }
    else e.textContent=t;
    e.title=title||""; tk.appendChild(e); return e;};
  if(z.exit){
    // la Sortie se pose sur un bord, comme un pion d'Invasion
    const e=document.createElement("div");
    const cote=(G.q.exit && G.q.exit.side) || "n";
    e.className="spw exitk "+cote;
    e.style.setProperty("--sc","#2f6b4a");
    e.textContent="S"; e.title="Zone de Sortie";
    if(SPRITE_OK.tok_exit){ e.classList.add("img");
      e.style.setProperty("--ratio", SPRITE_RATIO.tok_exit||1);
      e.style.backgroundImage=`url(${SPRITE_DIR+SPRITES.tok_exit})`; }
    d.appendChild(e);
  }
  if(z.obj){
    // face rouge tant que l'Objectif est caché ; sa vraie couleur reste secrète
    const face = z.obj.hidden ? "red" : z.obj.color;
    const e = T("obj"+(z.obj.hidden?" hidden":""), z.obj.hidden?"?":"O",
      z.obj.hidden ? "Objectif face cachée (recto rouge) — +5 XP"
                   : `Objectif ${colM(z.obj.color)} — +5 XP`,
      z.obj.hidden ? "tok_obj_hidden" : "tok_obj_"+z.obj.color);
    e.style.setProperty("--oc", colCss(face));
  }
  if(z.items && z.items.length)
    T("item", z.items.length>1?String(z.items.length):"◈",
      z.items.map(c=>c.e.n).join(", "), "tok_item");
  /* Artefacts de crypte : ils n'avaient qu'une mention en texte, alors qu'ils
     sont l'unique contenu d'une Crypte. Un jeton les rend visibles. */
  if(z.vaultCards && z.vaultCards.length)
    T("vault", z.vaultCards.length>1?String(z.vaultCards.length):"✦",
      "Artefact(s) de crypte : "+z.vaultCards.map(c=>c.e.n).join(", "), "tok_vault");
  /* Marqueurs de Zone, sous le reste. La Bile en fait partie : avec son
     image elle devient un grand marqueur, sinon elle garde sa pastille. */
  const marq=[...(z.markers||[])];
  if(z.bile && SPRITE_OK.tok_bile) marq.push("bile");
  else if(z.bile) T("bile","B","Bile de Dragon");
  marq.forEach(t=>{
    const m=document.createElement("div");
    const cle="tok_"+t;
    if(SPRITE_OK[cle]){ m.className="zmark";
      m.style.backgroundImage=`url(${SPRITE_DIR+SPRITES[cle]})`; }
    else { m.className="zmark vide"; m.textContent=MARQUEURS[t].n; }
    m.title=MARQUEURS[t].n;
    d.appendChild(m);
  });
  if(z.noise){ const e=T("noise","","Bruit : "+z.noise,"tok_noise");
               const sp=document.createElement("span"); sp.textContent=z.noise; e.appendChild(sp); }
  /* La colonne de jetons occupe le haut-droit. Réserver sa largeur en
     permanence rétrécit les figurines pour rien quand la Zone n'en porte
     aucun : on ne le fait donc que si elle en contient. */
  if(tk.children.length) d.classList.add("avecjetons");
  d.appendChild(tk);
}

function renderBoard(){
  const b=document.getElementById("board");
  b.style.gridTemplateColumns=`repeat(${G.q.W}, var(--zs))`;
  b.innerHTML="";
  b.appendChild(renderTileLayer());        // sous les Zones
  const act = G.survivors[UI.tab];
  const legal = new Set(), legalAtk = new Set();
  if(act && !act.dead && !act.escaped && G.phase==="players"){
    // une Zone peut couvrir plusieurs cases : on les éclaire toutes
    zonesMode(UI.mode, act).forEach(i=>casesZone(i).forEach(c=>legal.add(c.i)));
    if(UI.mode?.t==="attack") UI.mode.zones.forEach(i=>casesZone(i).forEach(c=>legalAtk.add(c.i)));
    if(UI.mode?.t==="bile")   [act.z,...neighbours(act.z)].forEach(i=>legal.add(i));
    if(UI.mode?.t==="torch")  UI.mode.zones.forEach(i=>legal.add(i));
    if(UI.mode?.t==="pousser") UI.mode.zones.forEach(i=>legal.add(i));
    if(UI.mode?.t==="provoc")  UI.mode.zones.forEach(i=>legal.add(i));
    if(UI.mode?.t==="feu")     UI.mode.zones.forEach(i=>legal.add(i));
    if(UI.mode?.t==="repulse")los(act.z).forEach(i=>{ if(zombiesIn(i).length) legalAtk.add(i); });
  }
  G.zones.filter(z=>!z.crypt).forEach(z=>{
    const d=document.createElement("div");
    d.className="zone"+(z.building?" room":"")+(z.building&&!z.explored?" unexplored":"");
    if(legal.has(z.i)) d.className+=" legal";
    if(legalAtk.has(z.i)) d.className+=" legalAtk";
    /* Trajet du groupe de zombies en cours de déplacement. */
    if(etapeZombies){
      if(memeZone(z.i, etapeZombies.de))   d.className+=" zdepart";
      if(memeZone(z.i, etapeZombies.vers)) d.className+=" zarrivee";
    }
    /* Un seul contour par Zone : on ne borde un côté que s'il donne sur autre
       chose que la même Zone mise en avant. */
    const surb = legalAtk.has(z.i) ? {jeu:legalAtk, col:"#c05050"}
               : legal.has(z.i)    ? {jeu:legal,    col:"#4f9d5a"} : null;
    if(surb){
      const dec={n:"inset 0 2px 0 0", s:"inset 0 -2px 0 0",
                 w:"inset 2px 0 0 0", e:"inset -2px 0 0 0"};
      const bords=[];
      for(const sd of ["n","e","s","w"]){
        const nb=AT(z.x+DXY[sd][0], z.y+DXY[sd][1]);
        if(nb && surb.jeu.has(nb.i) && memeZone(nb.i, z.i)) continue;   // arête interne
        bords.push(dec[sd]+" "+surb.col);
      }
      d.style.boxShadow = bords.join(",");
    }
    d.dataset.i=z.i;
    const lb=document.createElement("div"); lb.className="lbl";
    lb.textContent=(z.x+1)+","+(z.y+1)+(z.building?" "+z.building:""); d.appendChild(lb);
    // jetons
    poserJetons(d, z);
    // Zones d'Invasion : un rectangle par pion, plaqué sur le bord choisi
    z.spawnTokens.forEach(t=>{
      const actif = spawnActive(t);
      const e=document.createElement("div");
      e.className="spw "+(t.side||"n")+(actif?"":" off")+(t.necro?" necro":"");
      e.style.setProperty("--sc", colCss(t.color));
      e.textContent = t.necro ? "N" : "";
      // un jeton dessiné remplace le bandeau de couleur, s'il existe
      // le pion posé par un Nécromancien a son propre jeton
      const sp = t.necro && SPRITE_OK.tok_spawn_necro ? "tok_spawn_necro"
                                                      : "tok_spawn_"+t.color;
      if(SPRITE_OK[sp]){ e.classList.add("img");
        e.style.setProperty("--ratio", SPRITE_RATIO[sp]||1);
        e.style.backgroundImage=`url(${SPRITE_DIR+SPRITES[sp]})`; }
      const cond = (locks().spawns||{})[t.color];
      e.title = `Zone d'Invasion ${colF(t.color)}`+(t.necro?" (Nécromancien)":"")+
                (actif ? " — active" : ` — inactive : ${condText(cond)}`);
      d.appendChild(e);
    });
    if(z.cryptDoor){                       // trappe de crypte, au centre de la Zone
      const t=document.createElement("div");
      t.className="cryptHatch"+(z.cryptOpen?" open":"");
      t.style.setProperty("--cc", CRYPT_COLORS[z.cryptDoor]||"#a06bd8");
      t.textContent = z.cryptOpen ? "⌷" : "⛒";
      t.title = `Trappe de crypte ${cryptNom(z.cryptDoor)} — ${z.cryptOpen?"ouverte":"fermée"}`;
      d.appendChild(t);
    }
    // figurines
    const ac=document.createElement("div"); ac.className="actors";
    survInCase(z.i).forEach(s=>{
      const p=pastille(s.c, s.id, s.n[0], "sv"+(s===act?" act":""));
      rendreSelectionnable(p, s);
      p.title=s.n+" — "+s.wounds+" Blessure(s) · clic pour le sélectionner";
      if(s.wounds){const w=document.createElement("div");w.className="wnd";w.textContent=s.wounds;p.appendChild(w);}
      ac.appendChild(p);
    });
    ajouterZombies(ac, z.i);
    calerGrille(ac);
    d.appendChild(ac);
    d.onclick=()=>onZoneClick(z.i);
    b.appendChild(d);
  });
  b.appendChild(renderWalls());
  /* Après les jetons : leur position se mesure, elle ne se devine pas. */
  b.appendChild(renderTraces(b));
  renderCrypts();
}
/* Illustrations des tuiles de terrain, sous la grille. Purement décoratif :
   les règles ne dépendent que de la carte en lettres et des portes. */
const TILE_DIR = "zombicide_fichiers/tuiles_zombicide/";
let tileBg = true, tileBgOpacity = 0.9;
function renderTileLayer(){
  const couche = document.createElement("div");
  couche.className = "tileLayer";
  const tuiles = (G.q.tiles && typeof G.q.tiles === "object") ? G.q.tiles : null;
  document.body.classList.toggle("hastiles", !!tuiles && tileBg);
  if(!tuiles || !tileBg) return couche;
  const zs = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--zs")) || 92;
  Object.entries(tuiles).forEach(([k,v])=>{
    const [tx,ty] = k.split(",").map(Number);
    if(!(tx>=0 && ty>=0) || tx*3>=G.q.W || ty*3>=G.q.H) return;
    const d = document.createElement("div");
    d.style.left=(tx*3*zs)+"px"; d.style.top=(ty*3*zs)+"px";
    d.style.width=(3*zs)+"px";   d.style.height=(3*zs)+"px";
    d.style.backgroundImage=`url("${TILE_DIR}${v.id}.jpg")`;
    d.style.opacity=tileBgOpacity;
    if(v.rot) d.style.transform=`rotate(${v.rot*90}deg)`;
    couche.appendChild(d);
  });
  return couche;
}
const questAvecTuiles = () => !!(G && G.q.tiles && Object.keys(G.q.tiles).length);

/* Flèches des déplacements de la dernière Phase des Zombies : elles répondent
   à « d'où viennent-ils ? » une fois le tour des joueurs commencé, quand le
   ralenti est déjà passé. Une flèche par type et par trajet, à la couleur du
   Zombie déplacé.
   Les Zones de Crypte sont hors du plateau : leurs trajets ne peuvent pas être
   tracés ici, le journal les mentionne. */
let voirTraces = true;
function centreZone(i){
  const zs = parseInt(getComputedStyle(document.documentElement)
               .getPropertyValue("--zs")) || 92;
  const cs = casesZone(i).filter(z=>!z.crypt);
  if(!cs.length) return null;                        // Crypte : hors plateau
  const cx = cs.reduce((a,z)=>a+z.x,0)/cs.length;
  const cy = cs.reduce((a,z)=>a+z.y,0)/cs.length;
  return {x:(cx+.5)*zs, y:(cy+.5)*zs};
}
/* Position réelle du jeton d'un type dans une Zone, en pixels du plateau.
   Renvoie null si ce type n'y figure pas — c'est le cas courant au départ,
   puisque les flèches se dessinent une fois les Zombies arrivés. */
function posJeton(zoneIdx, t, plateau){
  const p = plateau.querySelector(`.pastille[data-zi="${ref(zoneIdx)}"][data-zt="${t}"]`);
  if(!p) return null;
  const r = p.getBoundingClientRect(), b = plateau.getBoundingClientRect();
  if(!r.width) return null;
  return {x: r.left - b.left + r.width/2, y: r.top - b.top + r.height/2};
}
/* Flèches du dernier déplacement des Zombies.
   Une flèche par type ET par trajet : la couleur est celle du jeton déplacé,
   ce qui suppose de ne plus fondre les types ensemble.
   Les extrémités visent les JETONS, pas le centre des Zones — deux types
   partant du même endroit ne se recouvrent donc plus. Le jeton de départ,
   lui, n'existe plus : on reporte à l'identique l'écart mesuré à l'arrivée,
   ce qui donne des flèches parallèles et lisibles. */
function renderTraces(plateau){
  const NS="http://www.w3.org/2000/svg";
  const zs = parseInt(getComputedStyle(document.documentElement)
               .getPropertyValue("--zs")) || 92;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","traces");
  svg.setAttribute("width", G.q.W*zs); svg.setAttribute("height", G.q.H*zs);
  svg.setAttribute("viewBox", `0 0 ${G.q.W*zs} ${G.q.H*zs}`);
  if(!voirTraces || G.phase!=="players" || !(G.traces||[]).length) return svg;

  const def=document.createElementNS(NS,"defs");
  svg.appendChild(def);
  /* Une pointe par couleur : un marqueur ne tient pas la couleur du trait. */
  const pointes = {};
  const pointe = c => {
    if(pointes[c]) return pointes[c];
    const id = "pointe"+Object.keys(pointes).length;
    const mk=document.createElementNS(NS,"marker");
    mk.setAttribute("id",id); mk.setAttribute("viewBox","0 0 10 10");
    mk.setAttribute("refX","9"); mk.setAttribute("refY","5");
    mk.setAttribute("markerWidth","5"); mk.setAttribute("markerHeight","5");
    mk.setAttribute("orient","auto-start-reverse");
    const tri=document.createElementNS(NS,"path");
    tri.setAttribute("d","M 0 1 L 10 5 L 0 9 z"); tri.setAttribute("fill",c);
    mk.appendChild(tri); def.appendChild(mk);
    return (pointes[c] = id);
  };

  /* Trajets identiques cumulés, type par type : deux vagues de Runners sur la
     même route ne doivent pas superposer deux flèches. */
  const parTrajet = {};
  (G.traces||[]).forEach(tr=>{
    parTrajet[tr.de+">"+tr.vers+">"+tr.t] ||= {de:tr.de, vers:tr.vers, t:tr.t};
  });
  Object.values(parTrajet).forEach(tr=>{
    const ca=centreZone(tr.de), cb=centreZone(tr.vers);
    if(!ca || !cb) return;                            // Crypte : rien à tracer
    const ja = plateau ? posJeton(tr.de,   tr.t, plateau) : null;
    const jb = plateau ? posJeton(tr.vers, tr.t, plateau) : null;
    // écart du jeton au centre de sa Zone, reporté au départ s'il a disparu
    const ex = jb ? jb.x-cb.x : 0, ey = jb ? jb.y-cb.y : 0;
    const a = ja || {x:ca.x+ex, y:ca.y+ey};
    const b = jb || cb;
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy) || 1;
    const marge = zs*.16;                             // on dégage les jetons
    const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",a.x+dx/L*marge); l.setAttribute("y1",a.y+dy/L*marge);
    l.setAttribute("x2",b.x-dx/L*marge); l.setAttribute("y2",b.y-dy/L*marge);
    l.setAttribute("class","trace");
    l.setAttribute("stroke", ZT[tr.t].c);
    l.setAttribute("marker-end",`url(#${pointe(ZT[tr.t].c)})`);
    l.appendChild(document.createElementNS(NS,"title"))
     .textContent = `${ZT[tr.t].n} : ${zn(tr.de)} → ${zn(tr.vers)}`;
    svg.appendChild(l);
  });
  return svg;
}

/* Un seul calque SVG au-dessus de la grille : chaque arête interne est tracée
   UNE fois, centrée sur la frontière (les bords de plateau sont matérialisés
   par la bordure du conteneur). */
function renderWalls(){
  const NS="http://www.w3.org/2000/svg";
  const zs = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--zs")) || 92;
  const W=G.q.W, H=G.q.H;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","walls");
  svg.setAttribute("width", W*zs); svg.setAttribute("height", H*zs);
  svg.setAttribute("viewBox", `0 0 ${W*zs} ${H*zs}`);
  const line=(x1,y1,x2,y2,cls)=>{
    const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",x1); l.setAttribute("y1",y1);
    l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    l.setAttribute("class",cls); svg.appendChild(l); return l;
  };
  G.zones.forEach(z=>{
    const x0=z.x*zs, y0=z.y*zs;
    // seules les arêtes Nord et Ouest sont parcourues : chaque arête interne
    // du plateau est le Nord ou l'Ouest d'exactement une case.
    const seg={ n:[x0, y0, x0+zs, y0], w:[x0, y0, x0, y0+zs] };
    for(const s of ["n","w"]){
      if(!AT(z.x+DXY[s][0], z.y+DXY[s][1])) continue;   // bord du plateau
      if(z.edge[s]==="open") continue;
      const [a,b,c,d]=seg[s];
      if(z.edge[s]==="opening"){
        /* Ouverture : le mur est bien là, percé d'un passage. On lit ainsi le
           contour de la pièce tout en voyant par où l'on passe. */
        const p=(k,lo,hi)=>lo+(hi-lo)*k;
        line(a, b, p(.30,a,c), p(.30,b,d), "wall");
        line(p(.70,a,c), p(.70,b,d), c, d, "wall");
        continue;
      }
      line(a,b,c,d,"wall");
      if(z.edge[s]==="door"){
        const p=(k,lo,hi)=>lo+(hi-lo)*k;
        const col = z.doorColor[s], verrou = !z.door[s] && doorLocked(col);
        if(z.door[s]){
          // ouverte : deux battants écartés, laissant le passage libre au centre
          line(p(.20,a,c), p(.20,b,d), p(.33,a,c), p(.33,b,d), "door open").setAttribute("stroke", colCss(col));
          line(p(.67,a,c), p(.67,b,d), p(.80,a,c), p(.80,b,d), "door open").setAttribute("stroke", colCss(col));
        } else {
          line(p(.22,a,c), p(.22,b,d), p(.78,a,c), p(.78,b,d), "door"+(verrou?" locked":""))
            .setAttribute("stroke", colCss(col));
        }
      }
    }
  });
  return svg;
}

const CRYPT_COLORS = {violet:"#a06bd8", violette:"#a06bd8", jaune:"#c9a227",
                      purple:"#a06bd8", yellow:"#c9a227"};
/* Jetons Zone de Crypte officiels, dans le dossier des tuiles. */
const CRYPT_IMG = {violet:"Vault_Purple", violette:"Vault_Purple", purple:"Vault_Purple",
                   jaune:"Vault_Yellow",  yellow:"Vault_Yellow"};
// « crypte » est féminin : violet → violette
const CRYPT_NOM = {violet:"violette", purple:"violette", jaune:"jaune", yellow:"jaune"};
const cryptNom = c => CRYPT_NOM[c] || c;
function onZoneClick(i){
  if(G.over || G.phase!=="players") return;
  i = ref(i);            // cliquer n'importe quelle case d'une Zone vaut la Zone
  const m=UI.mode; const act=G.survivors[UI.tab];
  if(!m){ return; }
  if(m.t==="move"){ if(legalMoves(act).includes(i)){ UI.mode=null; doMove(act,i); } return; }
  if(m.t==="jump"){
    const s=m.s;
    if(!jumpCibles(s).includes(i)) return;
    s.z=i; UI.mode=null;
    logLine(`${s.n} bondit jusqu'en ${zn(i)} (Saut).`);
    afterMove(s); return;
  }
  if(m.t==="speed"||m.t==="bloodlust"||m.t==="hitrun"||m.t==="sprint"||m.t==="charge"){
    const s=m.s;
    if(!zonesMode(m, act).includes(i)) return;
    s.z=i; logLine(`${s.n} se déplace en ${zn(i)} (${NOM_MODE[m.t]}).`);
    m.left--;
    const stop = zombiesIn(i).length>0;
    if(m.t==="bloodlust" && (m.left<=0 || stop)){
      if(zombiesIn(i).length){
        s.free.push({types:m.gain.types, label:m.gain.label});
        logLine(`→ Action de ${m.gain.label} gratuite.`,"l-obj");
      } else logLine("Soif de sang : aucune Zone avec Zombie atteinte.","l-bad");
      UI.mode=null;
    } else if(m.left<=0 || stop) UI.mode=null;
    afterMove(s); return;
  }
  if(m.t==="attack"){ if(m.zones.includes(i)) doAttack(m.s, m.c, i, m.alt); return; }
  if(m.t==="bile"){
    if(i!==m.s.z && !neighbours(m.s.z).includes(i)) return;
    pay(m.s,"item"); Z(i).bile=true; discardFrom(m.s,m.c);
    logLine(`${m.s.n} lance une Bile de Dragon en ${zn(i)}.`); UI.mode=null; render(); return;
  }
  if(m.t==="feu"){
    if(!m.zones.includes(i)) return;
    pay(m.s,"item"); discardFrom(m.s,m.c);
    logLine(`${m.s.n} défausse « ${m.c.e.n} » pour allumer un Feu du Dragon.`,"l-bad");
    dragonFire(i, m.s);
    UI.mode=null; render(); checkEnd(); return;
  }
  if(m.t==="torch"){
    if(!m.zones.includes(i)) return;
    /* La Torche se consume ; l'Épée enflammée, non. */
    pay(m.s,"item"); if(m.c.e.torch) discardFrom(m.s,m.c); dragonFire(i, m.s);
    UI.mode=null; render(); checkEnd(); return;
  }
  if(m.t==="provoc"){
    if(!m.zones.includes(i)) return;
    provoquer(m.s, i);
    return;
  }
  if(m.t==="pousser"){
    if(!m.zones.includes(i)) return;
    const liste = zombiesIn(m.s.z);
    m.s.pousse = true;                       // gratuit, mais une fois par Tour
    liste.forEach(zz=>{ (G.traces ||= []).push({de:zz.z, vers:i, t:zz.t, n:1}); zz.z = i; });
    logLine(`Poussée : ${liste.length} Zombie(s) poussé(s) de ${zn(m.s.z)} en ${zn(i)}.`,"l-obj");
    UI.mode=null; render(); checkEnd(); return;
  }
  if(m.t==="repulse"){
    if(!zombiesIn(i).length) return;
    const from=m.s.z, d=bfsFrom(from);
    const dests = neighbours(i).filter(nb=>d[nb]===d[i]+1);
    if(!dests.length){ toast("Aucune Zone de destination valide."); UI.mode=null; return render(); }
    zombiesIn(i).forEach(zz=>{
      (G.traces ||= []).push({de:zz.z, vers:dests[0], t:zz.t, n:1});
      zz.z = dests[0];
    });
    pay(m.s,"ench"); m.s.ench.repulse=true;
    logLine(`Repousser : les Zombies de ${zn(i)} sont poussés en ${zn(dests[0])}.`,"l-obj");
    UI.mode=null; render(); return;
  }
}

/* ---------- panneau latéral ---------- */
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function btn(label, fn, cls, dis){ const b=el("button",cls,label); b.onclick=fn; b.disabled=!!dis; return b; }

/* État d'Actions d'un Survivant, pour le code couleur du nom.
   Les Actions gratuites comptent : un Survivant à 0 Action générale mais avec
   une Action de Mêlée gratuite peut encore jouer. */
/* La colonne des Survivants. Chaque carte : portrait, nom, Actions restantes,
   Blessures. Cliquer sélectionne et recentre, comme le faisaient les onglets. */
function renderSurvivants(){
  const box=document.getElementById("survivants");
  if(!box) return;
  box.innerHTML="";
  G.survivors.forEach((s,k)=>{
    const a=actionState(s);
    const d=el("div","sv-carte"+(k===UI.tab?" on":""));
    d.style.setProperty("--pc", s.c);
    d.title = `${s.n} — ${a.txt}`;
    const pion=el("div","pion", (s.n[0]||"?").toUpperCase());
    if(SPRITE_OK[s.id]){ pion.classList.add("img");
      pion.style.backgroundImage=`url(${SPRITE_DIR+SPRITES[s.id]})`; }
    d.appendChild(pion);
    const txt=el("div","txt");
    txt.appendChild(el("div","nm",(s.dead?"† ":s.escaped?"✓ ":"")+s.n));
    const et=el("div","et "+a.cls,
      s.dead?"éliminé" : s.escaped?"évacué" :
      a.n ? a.n+" Action"+(a.n>1?"s":"") : "plus d'Action");
    txt.appendChild(et);
    if(!s.dead && !s.escaped && s.wounds)
      txt.appendChild(el("div","hp","♥".repeat(Math.max(0,RULES.survivorWounds-s.wounds))));
    d.appendChild(txt);
    d.onclick=()=>{ annulerBascule(); UI.tab=k; UI.mode=null; UI.centrer=s; render(); };
    box.appendChild(d);
  });
  /* Toutes à la même largeur, celle qu'exige le nom le plus long — et jamais
     plus large que la colonne disponible. */
  const cartes = [...box.querySelectorAll(".sv-carte")];
  cartes.forEach(c=>{ c.style.width = "max-content"; });
  const large = Math.max(0, ...cartes.map(c=>c.offsetWidth));
  const plafond = Math.max(80, box.clientWidth - 12);
  if(large) cartes.forEach(c=>{ c.style.width = Math.min(large, plafond) + "px"; });
}

function actionState(s){
  if(s.dead)    return {cls:"act-out",  n:0, txt:"éliminé"};
  if(s.escaped) return {cls:"act-out",  n:0, txt:"évacué"};
  const n = s.actions + s.free.length;
  if(n <= 0)    return {cls:"act-none", n:0, txt:"plus d'Action"};
  const total = RULES.actionsPerTurn + (hasSkill(s,"+1 Action") ? 1 : 0);
  const detail = s.free.length
    ? `${s.actions} Action(s) + ${s.free.map(f=>f.label).join(", ")} gratuite(s)`
    : `${s.actions} Action(s)`;
  return {cls: s.actions >= total ? "act-full" : "act-some", n, txt:detail};
}

  if(s.invisible) acts.appendChild(el("span","pill","Invisible"));

  p.appendChild(head);

  if(s.dead||s.escaped){ p.appendChild(el("div","hint","Ce Survivant ne joue plus.")); return; }

  // zone courante
  const zi=Z(s.z);
  const info=el("div","card");

    `Zone ${zn(s.z)} — ${zi.crypt?"Crypte "+zi.crypt:zi.building?"Bâtiment "+zi.building:"Rue"}`+
    (nbCases>1?` · ${nbCases} cases`:"")+
    (zombiesIn(s.z).length?` · ${zombiesIn(s.z).length} Zombie(s)`:"")+
    (bruitZone?` · Bruit ${bruitZone}`:"")));
  const ar=el("div","row"); ar.style.marginTop="6px";
  ar.appendChild(btn(UI.mode?.t==="move"?"Annuler":"Déplacer ("+moveCost(s)+")",

    UI.mode?.t==="move"?"prim":"", !canPay(s,"move")));
  ar.appendChild(btn("Fouiller", ()=>doSearch(s), "", s.searched||!zi.building||zi.crypt||zombiesIn(s.z).length||!canPay(s,"search")));
  /* Le bouton ne se grise que s'il n'y a rien à ouvrir. Auparavant, l'absence
     d'arme au symbole « Ouvrir une porte » le désactivait sans un mot : devant
     une trappe de crypte bien visible, le joueur ne pouvait pas savoir ce qui
     lui manquait. Le clic délivre maintenant la raison exacte. */
  const portes = doorSides(s), ouvrables = doorSidesOpenable(s), outils = doorTools(s);
  const rienQueTrappes = portes.length && portes.every(d=>d.crypt);
  const bOuvrir = btn(
    portes.length && !ouvrables.length ? "Porte verrouillée"

    ()=>doOpenDoor(s), "", !portes.length);

    ? "Aucune porte ni trappe fermée accessible depuis cette Zone."
    : portes.map(doorLabel).join(" · ")
      + (!outils.length ? " — il faut une arme de Mêlée au symbole « Ouvrir une porte » en main."
       : !canPay(s,"door") ? " — plus d'Action disponible." : "");
  ar.appendChild(bOuvrir);
  /* Le contenu se cherche dans toute la Zone, qui peut couvrir plusieurs cases. */
  const cObj  = casesZone(s.z).find(c=>c.obj);
  const cArt  = casesZone(s.z).find(c=>c.crypt && c.vaultCards.length);
  const cItem = casesZone(s.z).find(c=>c.items && c.items.length);
  if(cObj) ar.appendChild(btn(
    cObj.obj.hidden ? "Prendre l'Objectif (face cachée)" : `Prendre l'Objectif ${colM(cObj.obj.color)}`,

    ar.appendChild(btn(missionPrete() ? "Sortir" : "Sortie verrouillée",

  /* Soif de sang : 1 Action, jusqu'à 2 Zones vers des Zombies, puis une Action

  });
  /* Déplacement payé d'avance : Saut et Sprint coûtent une Action de
     Déplacement, pénalité de Zone comprise, et ne servent qu'une fois par Tour. */
  const payerDeplacement = () => {
    const cout = moveCost(s);
    if(s.actions < cout && !(cout===1 && s.free.some(f=>f.types.includes("move")))){
      toast("Pas assez d'Actions (sortir de cette Zone coûte "+cout+" Actions)."); return false;
    }
    if(cout===1){ if(!pay(s,"move")) return false; }

  if(hasSkill(s,"Saut"))

  if(hasSkill(s,"Sprint"))

      logLine(`${s.n} : Sprint — jusqu'à 3 Zones.`); render();

  if(hasSkill(s,"Charge"))

      if(UI.mode?.t==="charge"){ UI.mode=null; return render(); }

      UI.mode={t:"charge", s, left:2};
      logLine(`${s.n} : Charge — 2 Zones vers des Zombies.`); render();
    }, UI.mode?.t==="charge"?"prim":""));
  if(s.hitRun) ar.appendChild(btn("Fuite", ()=>{ UI.mode={t:"hitrun",s,left:1}; s.hitRun=false; render(); },"prim"));
  if(hasSkill(s,"Transmutation"))
    ar.appendChild(btn("Transmuter", ()=>doTransmuter(s)));

  if(hasSkill(s,"Provocation") && !s.provoc)

/* Les trois types d'Action de Combat, distingués partout : bouton, aide de
   ciblage et journal. */
const ATK = {
  melee:  {n:"Mêlée",    label:"⚔ Mêlée",    css:"#c2703a"},
  ranged: {n:"Distance", label:"🏹 Distance", css:"#4fb0a0"},
  spell:  {n:"Magie",    label:"✦ Magie",    css:"#8a6bd8"}
};
function cardStats(e){
  /* Ce qui s'ajoute à toute carte : le Niveau exigé, et l'aveu que sa règle
     spéciale n'est pas appliquée. */
  const sup = (e.niv ? ` · Niveau ${DANGER[e.niv].name} requis` : "")
            + (e.na  ? " · règle spéciale non appliquée" : "");
  if(e.kind==="armor")  return "Armure "+e.armor+"+" + sup;
  if(e.kind==="shield") return (e.txt||"") + sup;
  if(e.kind==="melee"||e.kind==="ranged"||e.kind==="spell"){
    const t = `Portée ${e.rmin}-${e.rmax} · ${e.dice} dé${e.dice>1?"s":""} · ${e.acc}+ · Dégâts ${e.dmg}`;
    const f=[]; if(e.dual)f.push("Ambidextre"); if(e.door)f.push("Porte");
    if(e.noise)f.push("Bruit"); if(e.keyw)f.push(e.keyw);
    return t + (f.length?" · "+f.join(", "):"") + sup + (e.txt?" — "+e.txt:"");
  }
  return (e.txt||"") + sup;
}
function startAttack(s,c,alt){
  if(!niveauOK(s,c.e)) return toast(refusNiveau(c.e));
  const p=weaponProfile(s,c,alt);
  const zs=targetZones(s,p);
  if(!zs.length) return toast("Aucune Zone à portée.");
  UI.mode={t:"attack", s, c, alt, zones:zs}; render();
}
function renderEnchTargets(box, s, c){
  const seen = los(s.z);
  const targets = onBoard().filter(o=>seen.has(o.z));
  const r=el("div","row");
  /* Double Enchantement : on désigne les DEUX cibles avant de résoudre, comme
     le livret le demande. La Vitesse fait exception — elle ouvre une Zone de
     déplacement, et deux ne peuvent pas être ouvertes à la fois. */
  const double = hasSkill(s,"Double Enchantement") && c.e.ench !== "speed";
  const dejaChoisie = UI.mode && UI.mode.premiere;
  r.appendChild(el("span","hint",
    double ? (dejaChoisie ? `Seconde cible (1ʳᵉ : ${dejaChoisie.n}) : ` : "Première cible : ")
           : "Cible : "));
  targets.forEach(o=>r.appendChild(btn(o.n, ()=>{
    if(double && !dejaChoisie){
      UI.mode = {...UI.mode, premiere:o};
      logLine(`Double Enchantement : ${o.n} désigné, choisis la seconde cible.`,"l-obj");
      return render();
    }
    if(dejaChoisie){
      applyEnch(s, c, dejaChoisie);              // la première paie l'Action
      logLine(`Double Enchantement : seconde cible ${o.n}.`,"l-obj");
      applyEnch(s, c, o, true);                  // la seconde est offerte
      return;
    }
    applyEnch(s, c, o);
  })));
  if(double && dejaChoisie)
    r.appendChild(btn("Une seule cible", ()=>{ applyEnch(s, c, dejaChoisie); }, "danger"));
  box.appendChild(r);
}
function onSlotClick(s,area,k){
  if(!UI.reorgSel){ UI.reorgSel={area,k}; return render(); }
  const a=UI.reorgSel; UI.reorgSel=null;
  if(a.area===area && a.k===k) return render();
  if(!s.reorgFree){ if(!canPay(s,"reorg")) { toast("Plus d'Action pour réorganiser."); return render(); } pay(s,"reorg"); }
  else { s.reorgFree=false; }
  const t=s[a.area][a.k]; s[a.area][a.k]=s[area][k]; s[area][k]=t;
  logLine(`${s.n} réorganise son inventaire.`);
  render();
}
async function tradeWith(s,o){
  const opts=[];
  s.hands.forEach((c,k)=>{ if(c) opts.push({label:"Donner "+c.e.n, v:["hands",k]}); });
  s.back.forEach((c,k)=>{ if(c) opts.push({label:"Donner "+c.e.n, v:["back",k]}); });
  if(!opts.length) return toast("Rien à donner.");
  const r=await choose("Échange avec "+o.n, opts);
  if(!r) return;
  if(!s.reorgFree){ if(!canPay(s,"reorg")) return toast("Plus d'Action."); pay(s,"reorg"); }
  else s.reorgFree=false;
  const c=s[r[0]][r[1]]; s[r[0]][r[1]]=null;
  await giveCard(o,c);
  logLine(`${s.n} donne ${c.e.n} à ${o.n}.`);
  render();
}
/* Une compétence apprise en cours de Round prend effet immédiatement. */
function applyNewSkill(s, name){
  if(G.phase!=="players" || s.dead || s.escaped) return;
  if(name==="+1 Action") s.actions++;
  const add=(types,label)=>s.free.push({types,label});
  if(name==="+1 Action de Déplacement gratuite") add(["move"],"Déplacement");
  if(name==="+1 Action de Mêlée gratuite")       add(["melee"],"Mêlée");
  if(name==="+1 Action À distance gratuite")    add(["ranged"],"Distance");
  if(name==="+1 Action de Magie gratuite")       add(["magic","ench"],"Magie");
  if(name==="Lanceur de sorts")               add(["magic","ench"],"Sorts");
  if(name==="+1 Action de Combat gratuite")      add(["melee","ranged","magic"],"Combat");
}

/* ---------- modales ---------- */
function choose(title, opts){
  return new Promise(res=>{
    const m=document.getElementById("modal");
    document.getElementById("mTitle").textContent=title;
    const b=document.getElementById("mBody"); b.innerHTML="";
    opts.forEach(o=>{ const x=el("button","opt",o.label);
      x.onclick=()=>{ m.style.display="none"; res(o.v); }; b.appendChild(x); });
    m.style.display="grid";
  });
}
/* Amener un Survivant au centre de la fenêtre. Demandé quand la main passe
   toute seule ou qu'on choisit un onglet — pas en cliquant une figurine, qui
   est déjà sous les yeux. Le recentrage attend la fin du rendu : les Zones
   n'existent pas avant. */
function centrerSur(s){
  if(!s || s.dead || s.escaped) return;
  centrerSurZone(s.z);
}
function centrerSurZone(i){
  const wrap = document.getElementById("boardWrap");
  if(!wrap) return;
  const zone = Z(i);
  const cible = zone && zone.crypt
    ? [...document.querySelectorAll("#crypts .cryptZone")]
        .find(d=>d.textContent.includes(cryptNom(zone.crypt).toUpperCase()))
    : [...document.querySelectorAll("#board .zone")].find(d=>+d.dataset.i===ref(i));
  if(!cible) return;
  const w = wrap.getBoundingClientRect(), c = cible.getBoundingClientRect();
  wrap.scrollTo({
    left: wrap.scrollLeft + (c.left + c.width/2)  - (w.left + w.width/2),
    top:  wrap.scrollTop  + (c.top  + c.height/2) - (w.top  + w.height/2),
    behavior: "smooth"
  });
}
function render(){ if(!G) return;
  passerLaMain();
  /* Un mode au clic est en cours : les figurines rendent la main à la Zone. */
  document.body.classList.toggle("modeclic", !!UI.mode);
  renderBoard(); renderPanel(); majBoutonTuiles();
  /* Pendant un Tour gratuit, « Fin de tour » relancerait une Phase des Zombies
     par-dessus celle qui est en cours : c'est le bouton du Tour gratuit qui
     rend la main. */
  document.getElementById("btnEnd").disabled =
    G.over || G.phase!=="players" || !!UI.tourGratuit;
  if(UI.centrer){ const s=UI.centrer; UI.centrer=null; centrerSur(s); }
  autoSave(); }

  "+1 dé : Combat","+1 dé : Mêlée","+1 dé : À distance","+1 dé : Magie",
  "+1 au résultat du dé : Combat","+1 au résultat du dé : Mêlée",
  "+1 au résultat du dé : À distance","+1 au résultat du dé : Magie",
  "+1 Dégât : Mêlée","Sur un 6 : +1 dé Combat","Soif de sang : Mêlée",
  "Insaisissable","Barbare","Fuite","Grimoire","Lanceur de sorts",
  "Maître d'Armes","Corps de fer","Pluie de fer","À bout portant",
  "Saut","Sprint","Charge","Tireur d'élite","+1 Portée max",
  "Faucheur : Combat","Soif de sang : Combat",
  /* Appliquées depuis l'arrivée des cartes qui les confèrent. */
  "Chanceux","Poussée",
  /* Arrivées avec les Survivants de Green Horde. */
  "Fureur Guerrière","Faucheur : Mêlée","Faucheur : À distance","Faucheur : Magie",
  /* Compétences des Survivants de Green Horde. */
  "Provocation","Transmutation","Double Enchantement","Lien Zombie"
];
function competencesConnues(){ return new Set(COMP_MOTEUR); }
/* Rend le nom interne d'une compétence écrite en français OU en anglais. */
function normaliserComp(nom, connues){
  if(connues.has(nom)) return nom;
  if(connues.has(nomActuel(nom))) return nomActuel(nom);
  const c = cleComp(nom);
  for(const k of connues) if(cleComp(k)===c) return k;
  for(const [en,fr] of Object.entries(ALIAS_COMP)) if(cleComp(en)===c) return fr;
  return null;
}
const estDuLivret = nom => COMP_LIVRET.some(k=>cleComp(k)===cleComp(nom));
function chargerSurvivants(){
  const connues = competencesConnues();      // relevé AVANT tout ajout
  const liste = Array.isArray(window.ZBP_SURVIVANTS) ? window.ZBP_SURVIVANTS : [];
  const soucis = [];
  liste.forEach(v=>{
    if(!v || !v.id || !v.n) return soucis.push("entrée sans identifiant ou sans nom");
    if(SURVIVORS.some(x=>x.id===v.id)) return soucis.push(`identifiant déjà pris : ${v.id}`);
    /* on traduit ce qui peut l'être, on garde le reste tel quel pour le signaler */
    const conv = l => (l||[]).map(k=>normaliserComp(k, connues) || k);
    const sv = {id:v.id, n:v.n, c:v.c||"#8a8a8a", bodyItem:v.bodyItem||null,
                bio:v.bio||"", boite:v.boite||"",
                blue:conv(v.blue), orange:conv(v.orange), red:conv(v.red)};
    if(!sv.blue.length) soucis.push(`${sv.n} : aucune compétence de départ (niveau Bleu)`);
    [...sv.blue, ...sv.orange, ...sv.red].forEach(k=>{
      if(connues.has(k)) return;
      soucis.push(estDuLivret(k)
        ? `${sv.n} : « ${k} » existe dans le livret mais n'est pas encore appliquée par le moteur`
        : `${sv.n} : compétence inconnue — « ${k} » (faute de frappe ?)`);
    });
    if(sv.bodyItem && !EQ[sv.bodyItem])
      soucis.push(`${sv.n} : objet de Corps inconnu — « ${sv.bodyItem} »`);
    SURVIVORS.push(sv);
    // portrait : surv_<id>.png, sauf nom explicite
    SPRITES[sv.id] = v.sprite || ("surv_"+sv.id+".png");
  });
  return soucis;
}
let soucisSurvivants = [];

/* ---------- écran de sélection des Survivants ---------- */
let TEAM = SURVIVORS.map(v=>v.id);
/* Armes de départ : le stock est limité (champ `start`), et il DÉPEND DU DECK
   retenu — Green Horde n'offre pas les mêmes que Black Plague, et « départ
   seulement » d'une extension n'apporte que celles-là. La liste se recalcule
   donc à chaque affichage, au lieu d'être figée au chargement.
   Chaque Survivant peut se voir attribuer la sienne ; sans choix, elle est
   tirée au hasard. */
const starterList = () => EQUIP
  .map(e=>({id:e.id, n:e.n, nb:quantiteEquip(e,"start")}))
  .filter(x=>x.nb > 0);
let GEAR = {};                       // id du Survivant → id de l'arme, "" = au hasard
const gearPris = (id, saufQui) =>
  TEAM.filter(x=>x!==saufQui && GEAR[x]===id).length;
function sauverGear(){ try{ localStorage.setItem("zbp_gear", JSON.stringify(GEAR)); }catch(e){} }
function chargerGear(){
  try{ const g=JSON.parse(localStorage.getItem("zbp_gear"));
       if(g && typeof g==="object") GEAR=g; }catch(e){}
  // on ne garde que des choix encore valides
  Object.keys(GEAR).forEach(k=>{
    if(GEAR[k] && !starterList().some(st=>st.id===GEAR[k])) delete GEAR[k];
  });
}
/* --------------------------------------------------------------------------
   INFOBULLE DES COMPÉTENCES
   `title` arriverait trop tard et sans mise en forme : on gère une bulle à
   nous, au-dessus de l'écran de choix et toujours dans la fenêtre.
   -------------------------------------------------------------------------- */
const compAppliquee = k => COMP_MOTEUR.includes(k);
let bulleEl = null;
function bulle(){
  if(!bulleEl){ bulleEl=document.createElement("div"); bulleEl.id="bulle";
                document.body.appendChild(bulleEl); }
  return bulleEl;
}
function montrerBulle(nom, x, y){
  const b=bulle();
  const txt = SKILL_TXT[nom];
  const applique = compAppliquee(nom);
  b.innerHTML = `<div class="bt">${htm(nom)}</div>`+
    (txt ? `<div>${htm(txt)}</div>`
         : `<div>Compétence du livret. Reporte-toi aux règles pour son effet exact.</div>`)+
    (applique ? "" :
      `<div class="bk">⚠ Pas encore appliquée par le moteur : le Survivant joue sans.</div>`);
  b.style.display="block";
  placerBulle(x,y);
}
function placerBulle(x,y){
  const b=bulle(), r=b.getBoundingClientRect(), m=12;
  let gx = x+14, gy = y+16;
  if(gx + r.width  > innerWidth  - m) gx = Math.max(m, x - 14 - r.width);
  if(gy + r.height > innerHeight - m) gy = Math.max(m, y - 16 - r.height);
  b.style.left = gx+"px"; b.style.top = gy+"px";
}
const cacherBulle = ()=>{ if(bulleEl) bulleEl.style.display="none"; };
/* Délégation : les cartes sont reconstruites à chaque clic, pas les écouteurs. */
(()=>{
  const zone = document.getElementById("setupList");
  if(!zone) return;
  zone.addEventListener("mouseover", e=>{
    const c=e.target.closest(".cmp"); if(!c) return;
    montrerBulle(c.dataset.c, e.clientX, e.clientY);
  });
  zone.addEventListener("mousemove", e=>{
    if(bulleEl && bulleEl.style.display==="block") placerBulle(e.clientX, e.clientY);
  });
  zone.addEventListener("mouseout", e=>{
    if(e.target.closest(".cmp")) cacherBulle();
  });
  zone.addEventListener("click", cacherBulle);   // la carte se redessine sous le curseur
})();

/* Texte d'origine extérieure inséré dans du balisage : toujours échappé. */
const htm = t => String(t==null?"":t).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showSetup(){
  try{ const m=JSON.parse(localStorage.getItem("zbp_team"));
       if(Array.isArray(m) && m.length) TEAM=m.filter(id=>SURVIVORS.some(v=>v.id===id)); }catch(e){}
  if(!TEAM.length) TEAM=SURVIVORS.map(v=>v.id);
  chargerGear();
  renderMissions();
  renderSetup();
  document.getElementById("setupMsg").textContent="";
  document.getElementById("missionMsg").textContent="";
  // on ne peut annuler que s'il y a une partie en cours à retrouver
  document.getElementById("setupCancel").style.display = (G && !G.over) ? "" : "none";
  document.getElementById("setup").style.display="grid";
}
/* Résumé des Objectifs d'une quête, pour l'écran de choix. */
function resumeObjectifs(q){
  const o=q.objectives||[];
  if(!o.length) return "aucun Objectif";
  const parCouleur={}; let caches=0;
  o.forEach(x=>{ if(x.hidden) caches++;
    else { const c=x.color||"red"; parCouleur[c]=(parCouleur[c]||0)+1; } });
  const bouts=Object.entries(parCouleur).map(([c,n])=>`${n} ${colM(c)}`);
  /* Les versos déclarés sont une information publique : les joueurs savent
     qu'un bleu se cache parmi les faces cachées. */
  const versos = {};
  (q.hiddenBacks||[]).forEach(c=>versos[c]=(versos[c]||0)+1);
  if(caches){
    const detail = Object.entries(versos).map(([c,n])=>`${n} ${colM(c)}`).join(", ");
    bouts.push(`${caches} face cachée${caches>1?"s":""}`+(detail?` (dont ${detail})`:""));
  }
  return `${o.length} Objectif${o.length>1?"s":""} : ${bouts.join(", ")}`;
}
/* Fiche de la mission choisie : description, objectif, et un repère chiffré.
   Une entrée qui ne porte qu'un `file` n'est lisible qu'après chargement. */
/* Effectif minimum imposé par la fiche de quête. Absent = aucune exigence. */
const minSurv = q => Math.max(1, (q && q.minSurvivors|0) || 1);

function afficherInfoMission(q, entree){
  const b=document.getElementById("missionInfo");
  b.innerHTML="";
  if(!q){
    b.style.display = entree ? "block" : "none";
    if(entree){
      b.appendChild(el("div","ti", entree.name||"Mission"));
      b.appendChild(el("div","ob","Clique « Charger » pour lire le détail."));
    }
    return;
  }
  b.style.display="block";
  b.appendChild(el("div","ti", q.name||"Mission"));
  /* En-tête de la fiche de quête, à la manière des cartes officielles :
     « FACILE · 4+ SURVIVANTS · 45 MINUTES ». Seul ce qui est renseigné sort. */
  const enTete=[q.difficulty, minSurv(q)>1?`${minSurv(q)}+ Survivants`:"", q.duration]
                 .filter(Boolean);
  if(enTete.length) b.appendChild(el("div","fq", enTete.join(" · ")));
  if(q.description) b.appendChild(el("div","de", q.description));
  if(q.goal) b.appendChild(el("div","ob","Objectif — "+q.goal));
  const t=Object.keys(q.tiles||{}).length;
  b.appendChild(el("div","rs",
    `${q.W}×${q.H} Zones · ${resumeObjectifs(q)}`+(t?` · ${t} tuile(s)`:"")));
}
/* Remplit le menu des missions. Masqué s'il n'y a pas de catalogue. */
function renderMissions(){
  const row=document.getElementById("missionRow");
  const sel=document.getElementById("missionSel");
  const list=missionsDispo();
  row.style.display = list.length ? "" : "none";
  // sans catalogue, la fiche doit disparaître aussi, pas garder l'ancienne
  if(!list.length){ afficherInfoMission(null, null); return; }
  sel.innerHTML="";
  list.forEach((m,i)=>{
    const o=document.createElement("option");
    o.value=i; o.textContent=m.name || m.file || ("Mission "+(i+1));
    sel.appendChild(o);
  });
  // la fiche suit le menu, sans attendre le chargement quand la quête est là
  sel.onchange=()=>{
    const e=list[+sel.value];
    afficherInfoMission(e && e.quest ? e.quest : null, e);
    document.getElementById("missionMsg").textContent="";
  };
  sel.onchange();
}
/* Rappel d'effectif : visible pendant qu'on coche, pas seulement au moment de
   cliquer « Commencer ». */
function renderEffectif(){
  const e=document.getElementById("effectif"); if(!e) return;
  const mn=minSurv(QUEST);
  if(mn<=1){ e.style.display="none"; return; }
  const ok = TEAM.length >= mn;
  e.style.display="block";
  e.style.color = ok ? "#8fd08f" : "#e0a060";
  e.textContent = ok
    ? `✓ ${TEAM.length} Survivants — l'effectif conseillé de ${mn} est atteint.`
    : `⚠ Mission prévue pour ${mn} Survivants minimum — ${TEAM.length} ${TEAM.length>1?"sélectionnés":"sélectionné"}. `+
      `La partie reste jouable, mais l'Invasion ne diminue pas.`;
}
/* Choix du deck. Rien ne s'affiche sans fichier de decks : la boîte reste la
   règle par défaut. Un fichier illisible se dit ici, il ne se devine pas. */
function renderDecks(){
  const row=document.getElementById("deckRow"); if(!row) return;
  if(!DECKS_LISTE.length && !soucisDecks.length){ row.style.display="none"; return; }
  row.style.display="flex";
  const sel=document.getElementById("deckSel"), lib=document.getElementById("deckLib");
  row.style.borderColor = DECKS_LISTE.length ? "" : "#7a5a2a";
  sel.innerHTML="";
  /* Première entrée : les decks de la boîte. C'est le choix par défaut — un
     fichier présent propose, il n'impose pas. */
  const ajouter=(lib2,v)=>{ const o=document.createElement("option");
    o.value=v; o.textContent=lib2; sel.appendChild(o); };
  ajouter("Decks de la boîte (Black Plague)", "");
  DECKS_LISTE.forEach((d,k)=>ajouter(d.nom, String(k)));
  sel.disabled = !DECKS_LISTE.length;
  sel.value = deckChoisi ? String(DECKS_LISTE.indexOf(deckChoisi)) : "";

  const decrire=()=>{
    const d = deckChoisi;
    const bouts=[];
    if(d){
      if(d.equip){
        let f=0, dep=0, art=0;
        EQUIP.forEach(e=>{ if(!e.vault) f+=quantiteEquip(e,"deck");
          dep+=quantiteEquip(e,"start"); art+=quantiteEquip(e,"vault"); });
        bouts.push(`${f} Fouille · ${dep} départ · ${art} Artefact${art>1?"s":""}`);
      }
      if(d.spawn) bouts.push(`${d.spawn.length} carte${d.spawn.length>1?"s":""} d'Invasion`);
    }
    lib.innerHTML = d
      ? `<span style="color:var(--dim)">${bouts.join(" · ")}</span>`
      : `<span style="color:var(--dim)">63 Fouille · 6 départ · 2 Artefacts · 54 cartes d'Invasion</span>`;
    if(soucisDecks.length)
      lib.innerHTML += `<br><span style="color:#e0a060">`+
        (DECKS_LISTE.length ? `${soucisDecks.length} entrée(s) ignorée(s) : ` : "Fichier inutilisable — ")+
        soucisDecks.slice(0,2).join(" · ") +
        (soucisDecks.length>2 ? ` · et ${soucisDecks.length-2} autre(s)` : "") + `</span>`;
  };
  sel.onchange=()=>{
    deckChoisi = sel.value === "" ? null : DECKS_LISTE[+sel.value] || null;
    /* Les armes de départ proposées changent avec le deck : on oublie les choix
       devenus impossibles, puis on redessine les menus. */
    const dispo = starterList();
    Object.keys(GEAR).forEach(k=>{
      if(GEAR[k] && !dispo.some(st=>st.id===GEAR[k])) GEAR[k]="";
    });
    sauverGear();
    renderSetup();
  };
  decrire();
}

function renderSetup(){
  renderEffectif();
  renderDecks();
  const box=document.getElementById("setupList"); box.innerHTML="";
  /* Un Survivant ajouté dont une compétence est inconnue jouerait sans elle :
     mieux vaut le dire que de laisser une carte silencieusement affaiblie. */
  const av=document.getElementById("setupAvert");
  if(av){
    av.textContent = soucisSurvivants.length
      ? "Survivants ajoutés — "+soucisSurvivants.join(" · ") : "";
    av.style.display = soucisSurvivants.length ? "block" : "none";
  }
  SURVIVORS.forEach(v=>{
    const on=TEAM.includes(v.id);
    const d=document.createElement("div");
    d.className="pick"+(on?" on":"");
    d.style.setProperty("--pc", v.c);
    /* `bio` et `boite` viennent d'un fichier écrit à la main : on les échappe
       plutôt que de les injecter telles quelles dans le balisage. */
    /* Les trois niveaux, chaque compétence survolable : on choisit un
       Survivant sur son arbre, pas sur son seul talent de départ.
       `bio`, `boite` et les noms viennent d'un fichier écrit à la main : on les
       échappe plutôt que de les injecter telles quelles dans le balisage. */
    const rang = (cle, css, titre) => {
      const l = v[cle]||[];
      if(!l.length) return "";
      return `<div class="niv ${css}"><span class="lv">${titre}</span>`+
        l.map(k=>`<span class="cmp${compAppliquee(k)?"":" ko"}" data-c="${htm(k)}">${htm(k)}</span>`)
         .join("")+`</div>`;
    };
    d.innerHTML=`<div class="dot">${htm(v.n[0])}</div>`+
      `<div class="nfo"><div class="nm">${htm(v.n)}</div>`+
      `<div class="sk">Corps : ${EQ[v.bodyItem]?htm(EQ[v.bodyItem].n):"—"}</div>`+
      (v.boite ? `<div class="boite">${htm(v.boite)}</div>` : "")+
      rang("blue","b","BLEU")+rang("orange","o","ORANGE")+rang("red","r","ROUGE")+
      (v.bio ? `<div class="bio" title="${htm(v.bio)}">${htm(v.bio)}</div>` : "")+
      `</div>`+
      `<div class="ck">✓</div>`;
    d.onclick=()=>{
      if(on) TEAM=TEAM.filter(x=>x!==v.id); else TEAM=[...TEAM, v.id];
      document.getElementById("setupMsg").textContent="";
      renderSetup();
    };
    // portrait du Survivant, s'il existe dans ./sprites/
    if(SPRITE_OK[v.id]){
      const dot=d.querySelector(".dot");
      dot.classList.add("img");
      dot.style.setProperty("--portrait", `url(${SPRITE_DIR+SPRITES[v.id]})`);
    }
    /* Arme de départ, seulement pour les Survivants retenus. Le menu ne doit
       pas basculer la carte : d'où l'arrêt de propagation du clic. */
    if(on){
      const sel=document.createElement("select"); sel.className="gear";
      const o0=document.createElement("option");
      o0.value=""; o0.textContent="Arme : au hasard";
      if(!GEAR[v.id]) o0.selected=true;
      sel.appendChild(o0);
      starterList().forEach(st=>{
        const reste = st.nb - gearPris(st.id, v.id);
        const o=document.createElement("option");
        o.value=st.id;
        o.textContent = st.n + (st.nb>1 ? ` — ${reste} sur ${st.nb}` : "");
        o.disabled = reste<=0;
        if(GEAR[v.id]===st.id) o.selected=true;
        sel.appendChild(o);
      });
      sel.onclick=ev=>ev.stopPropagation();
      sel.onchange=ev=>{ ev.stopPropagation();
        GEAR[v.id]=ev.target.value; sauverGear();
        document.getElementById("setupMsg").textContent="";
        renderSetup(); };
      d.querySelector(".nfo").appendChild(sel);
    }
    box.appendChild(d);
  });
}

/* ---------- zoom & cadrage ----------
   Le zoom fait varier la taille d'une Zone (--zs) puis redessine : le calque SVG
   des murs est recalculé, donc le trait reste net à tous les niveaux (ce qu'un
   transform:scale() ne permet pas). */
const ZOOM_MIN=36, ZOOM_MAX=170, ZOOM_DEF=92;
let ZOOM = ZOOM_DEF;
function applyZoom(v, memoriser){
  ZOOM = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(v)));
  document.documentElement.style.setProperty("--zs", ZOOM+"px");
  document.getElementById("zLbl").textContent = Math.round(ZOOM/ZOOM_DEF*100)+" %";
  // les coordonnées de case deviennent illisibles en dessous d'une certaine
  // taille ; la classe est posée sur <body> pour survivre aux redessins
  document.body.classList.toggle("zsmall", ZOOM < 58);
  if(memoriser!==false){ try{ localStorage.setItem("zbp_zoom", ZOOM); }catch(e){} }
  if(G) renderBoard();
}
const zoomBy = f => applyZoom(ZOOM*f);
/* Ajuste la carte à la place disponible, marge et bandeau des cryptes compris. */
function zoomFit(){
  if(!G) return;
  const w = document.getElementById("boardWrap");
  const reserve = G.zones.some(z=>z.crypt) ? 130 : 0;   // bandeau des cryptes
  const calcul = () => Math.min((w.clientWidth  - 46) / G.q.W,
                                (w.clientHeight - 46 - reserve) / G.q.H);
  // Deux passes : si une barre de défilement était présente, elle disparaît
  // après la première et libère la place réellement disponible.
  applyZoom(calcul(), false);
  applyZoom(calcul());
}

/* ---------- règles ---------- */
/* Livret officiel, hébergé hors du dépôt. Un seul endroit à changer. */
const PDF_REGLES = "https://github.com/synelle/boite-a-outils/blob/main/outils/zombicide-regles.pdf";
const RULES_TXT = `
<h3>Règles appliquées — Zombicide : Black Plague</h3>
<p style="color:#8fa8c8">Conformes au livret de règles VF officiel ; les numéros de page y renvoient.</p>
<p><a class="lienpdf" href="${PDF_REGLES}" target="_blank" rel="noopener">📖 Ouvrir le livret de règles (PDF)</a></p>
<p><b>Tour de Survivant</b> (p.18) — 3 Actions, +1 au niveau Jaune. Déplacement d'1 Zone ;
quitter une Zone occupée coûte 1 Action supplémentaire <i>par Zombie</i>. Entrer dans une Zone
occupée termine le Déplacement.</p>
<p><b>Inventaire</b> (p.15) — 8 cartes : <b>2 Mains + 5 Sac à dos + 1 Corps</b>. L'emplacement Corps
reçoit une armure, <i>ou</i> la carte nommée sur la fiche du Survivant (Dague pour Ann et Nelly,
Épée pour Baldric et Silas, Bouclier pour Clovis et Samson) — elle compte alors comme tenue en main.
On peut défausser gratuitement à tout moment.</p>
<p><b>Blessures</b> (p.23) — elles avancent la barre de Blessures et n'occupent <i>aucun</i>
emplacement. Élimination à <b>3</b> Blessures ; la figurine et l'équipement quittent le jeu.
Les joueurs répartissent librement les Blessures entre les Survivants d'une Zone.</p>
<p><b>Armure</b> (p.23) — 1 dé par Blessure, chaque résultat ≥ à la valeur d'armure en évite une.
Le Bouclier donne un jet si aucune armure n'est portée, sinon une relance. Abomination et Feu du
Dragon ignorent l'armure.</p>
<p><b>Fouiller</b> (p.18) — bâtiment uniquement, aucun Zombie dans la Zone, 1×/Tour même avec une
Action gratuite ; réorganisation gratuite après. La pioche se reconstitue sans les Artefacts de crypte.</p>
<p><b>Ouvrir une porte</b> (p.19) — arme de <b>Mêlée</b> au symbole Porte, 1 Action, 1 porte.
Avec l'icône dé : lancez les dés de l'arme, la porte s'ouvre si un dé atteint la Précision, et un
jeton Bruit est posé. Sans icône dé (Hache) : aucun jet, aucun bruit. Ce n'est pas une Action de
Mêlée — ni Ambidextrie, ni compétences, ni dé de la Dague.</p>
<p><b>Invasion dans les bâtiments</b> (p.19) — ouvrir une porte sur un bâtiment encore clos
déclenche une Invasion dans <b>chacune de ses Zones</b>. Un bâtiment de 6 Zones tire donc 6 cartes :
les grands bâtiments sont mortels. Les bâtiments ouverts au départ ne sont jamais envahis.</p>
<p><b>Combat</b> (p.26-27) — un 6 réussit toujours, un 1 échoue toujours. Une paire d'armes
Ambidextres identiques cumule les dés, et les compétences « +1 dé » en donnent un <i>par arme</i>
(donc +2 avec une paire).</p>
<p><b>Ordre de priorité des cibles</b> (p.27) — 1 Walker, 2 Fatty ou Abomination (au choix du
tireur), 3 Runner, 4 Nécromancien. Chaque succès frappe la priorité la plus forte présente ; si les
Dégâts sont insuffisants, <b>le succès est perdu</b> — il ne se reporte pas sur une cible plus faible.</p>
<p><b>Tir ami</b> (p.27) — à Distance et en Magie seulement : ce sont les <b>échecs</b> du jet qui
blessent les Survivants de la Zone visée, chacun infligeant autant de Blessures que la valeur de
Dégâts. Le tireur ne peut se toucher ; les jets d'Armure s'appliquent ; tuer un Survivant ne rapporte
aucune expérience. « À bout portant » supprime le tir ami à Portée 0.</p>
<p><b>Ligne de Vue</b> (p.10) — en rue : lignes droites dans les 4 directions, et <b>une seule Zone</b>
à l'intérieur d'un bâtiment. Dans un bâtiment : les Zones partageant une ouverture, limité à une Zone ;
en regardant dehors, la rue en ligne droite.</p>
<p><b>Bruit</b> (p.13) — chaque Survivant vaut 1 bruit. Les sorts de combat, l'action « Faire du bruit »
et l'ouverture d'une porte avec jet posent un jeton. Les jetons sont retirés en Phase de Fin.</p>
<p><b>Phase des Zombies</b> (p.23-24) — toutes les attaques d'abord, puis tous les déplacements.
Destination : la Zone la plus bruyante <i>parmi celles contenant un Survivant visible</i> ; à défaut,
la Zone la plus bruyante du plateau, <b>quelle que soit la distance</b>. Puis un pas par le plus court
chemin. Les routes de même longueur font <b>scinder le groupe en parts égales, en ajoutant des
figurines</b> ; Abominations et Nécromanciens ne se scindent jamais. Les zombies tracent leur route
comme si les portes étaient ouvertes, mais une porte fermée les arrête. Les Runners rejouent après
tous les autres.</p>
<p><b>Invasion</b> (p.25-26) — 1 carte par <i>pion</i>, lue au niveau de danger du Survivant le plus
expérimenté. Une carte <b>Double Invasion</b> ne fait rien apparaître ici : c'est la Zone
<b>suivante</b> qui tire 2 cartes (4 si deux doubles), et elle déborde sur la première Zone si elle
sort en dernier. Les cartes d'Activation supplémentaire n'ont aucun effet au niveau Bleu. En panne de
figurines, on place ce qui reste puis tout le type concerné gagne une activation.</p>
<p><b>Nécromanciens</b> (p.28) — un seul sur le plateau à la fois ; une carte supplémentaire ne donne
alors qu'une activation. À son arrivée il pose un pion Invasion et déclenche une Invasion immédiate.
Il fuit vers le pion Invasion le plus proche (jamais sa Zone d'arrivée). Défaite si un Nécromancien
s'échappe alors qu'il y a 6 pions sur le plateau. Le tuer retire un pion.</p>
<p><b>Cryptes</b> (p.32-33) — une porte de crypte est une <b>trappe posée au centre d'une Zone</b>,
pas sur un mur. Toutes les trappes d'une même couleur mènent à la <b>même Zone de Crypte hors
plateau</b> : deux trappes créent un souterrain entre deux endroits.
Aucune ligne de vue entre la crypte et les Zones qui la relient. Les cryptes sont des bâtiments mais
ne peuvent pas être fouillées et ne provoquent aucune Invasion à leur découverte. Une trappe s'ouvre
avec l'action « Ouvrir une porte », et aussi depuis l'intérieur de la crypte. Les <b>Artefacts de crypte</b> (Enfer, Arbalète orque) y sont
stockés : 1 Action pour en prendre un, ce n'est pas une Fouille, répétable s'il en reste.</p>
<p><b>Expérience</b> (p.16) — 1 XP par Zombie (5 pour l'Abomination), 5 XP par Objectif.
Bleu 0-6 · Jaune 7-18 (4ᵉ Action) · Orange 19-42 (1 compétence parmi 2) · Rouge 43+ (1 parmi 3).</p>
<h3>Simplifications assumées</h3>
<ul>
<li>Lors d'une <i>activation supplémentaire</i>, les Blessures vont automatiquement au Survivant le
moins blessé (ailleurs, le joueur choisit).</li>
<li>À priorité égale entre Fatty et Abomination, la cible que l'arme peut réellement tuer est
choisie automatiquement.</li>
<li>Une Double Invasion tirée pendant l'Invasion immédiate d'un Nécromancien double les cartes de ce
même pion, faute de « Zone suivante » dans cette sous-séquence.</li>
<li>À la mort d'un Nécromancien, le pion Invasion retiré est choisi automatiquement.</li>
<li>Les portes de couleur à condition de quête et les règles spéciales de quête ne sont pas
modélisées.</li>
<li>La quête livrée « Q00 - Danse macabre » sert de carte de départ — utilise l'éditeur pour la
modifier ou transcrire une autre quête.</li>
</ul>
<p><b>Couleurs de quête</b> — les Zones d'Invasion de couleur ne déploient aucun Zombie tant qu'un
événement ne les active pas (p.26), et les portes de couleur ne peuvent pas être ouvertes avant que
leur condition soit remplie (p.19). Ces conditions sont décrites par <code>quest.locks</code> :
<code>locks.spawns</code> pour l'activation des Zones d'Invasion, <code>locks.doors</code> pour le
déverrouillage des portes, <code>locks.spawnsOff</code> pour une désactivation. Conditions
reconnues : <code>objective:&lt;couleur&gt;</code>, <code>objectives:all</code>, <code>never</code>.
Une couleur absente de la table n'est soumise à aucune condition.</p>
<p><b>Condition de victoire</b> — <code>quest.win</code> décrit ce qu'il faut accomplir :
<code>need</code> est la condition préalable (même vocabulaire que les verrous :
<code>objectives:all</code>, <code>objective:&lt;couleur&gt;</code>, ou rien), et <code>exit</code>
dit qui doit quitter le plateau : <code>all</code> (tous les Survivants vivants, défaut),
<code>any</code> (un seul suffit) ou <code>none</code> (aucune sortie requise). Tant que
<code>need</code> n'est pas remplie, la Zone de Sortie refuse les Survivants. On peut ainsi bâtir
une mission où seul l'Objectif vert compte, les autres n'étant que des bonus d'expérience.</p>
<p><b>Objectifs face cachée</b> — leur recto est toujours ROUGE ; le verso, tiré au sort dans
<code>hiddenBacks</code> en début de partie, n'est révélé qu'à la récupération. Un Objectif caché
peut donc déverrouiller une porte… ou pas.</p>
<h3>Sauvegarde</h3>
<p><b>Automatique</b> — la partie est enregistrée dans la mémoire locale du navigateur après chaque
action, et reprise telle quelle à la réouverture de la page. L'enregistrement n'a lieu que pendant
la Phase des Joueurs, seul point de reprise propre ; il est effacé en fin de partie et par
« Nouvelle partie ».</p>
<p><b>Fichier JSON</b> — « Sauvegarder » exporte l'état complet (plateau, Survivants, inventaires,
zombies, pioches, journal) dans un fichier ; « Charger… » le relit. Les cartes ne sont stockées que
par leur identifiant : corriger une carte d'Équipement corrige aussi les parties déjà sauvegardées.
Une sauvegarde portant sur une autre carte est chargée avec sa carte ; une sauvegarde illisible ou
d'une version inconnue est refusée avec un message, sans casser la partie en cours.</p>
<h3>Images</h3>
<p>Tout va dans <code>./sprites/</code>, en PNG. Chaque fichier est facultatif : en son absence, le
jeu dessine la pastille ou le jeton comme avant.</p>
<p><b>Survivants</b> : <code>surv_ann.png</code>, <code>surv_baldric.png</code>,
<code>surv_clovis.png</code>, <code>surv_nelly.png</code>, <code>surv_samson.png</code>,
<code>surv_silas.png</code>.</p>
<p><b>Zombies</b> : <code>z_walker.png</code>, <code>z_runner.png</code>, <code>z_fatty.png</code>,
<code>z_abomination.png</code>, <code>z_necromancer.png</code>.</p>
<p><b>Marqueurs de Zone</b> (60 % de la case, centrés, sous le reste) :
<code>tok_cercle_magique.png</code>, <code>tok_feu.png</code>, <code>tok_bile.png</code>.</p>
<p><b>Zones d'Invasion</b> : <code>tok_spawn_rouge.png</code>, <code>tok_spawn_bleu.png</code>,
<code>tok_spawn_vert.png</code>, <code>tok_spawn_violet.png</code>.</p>
<p><b>Jetons de Zone</b> : <code>tok_sortie.png</code>, <code>tok_objet.png</code>,
<code>tok_bile.png</code>, <code>tok_bruit.png</code>, <code>tok_objectif_rouge.png</code>,
<code>tok_objectif_vert.png</code>, <code>tok_objectif_bleu.png</code>,
<code>tok_objectif_cache.png</code>. Le nombre de Bruit reste écrit par-dessus l'image.</p>
<p><b>Zones de Crypte</b> : elles utilisent les jetons officiels déjà présents dans
<code>./zombicide_fichiers/tuiles_zombicide/</code> — <code>Vault_Purple.jpg</code> et
<code>Vault_Yellow.jpg</code>.</p>
`;

/* ---------- démarrage ---------- */
document.getElementById("zIn").onclick  = ()=>zoomBy(1.15);
document.getElementById("zOut").onclick = ()=>zoomBy(1/1.15);
document.getElementById("zFit").onclick = zoomFit;
document.getElementById("zTile").onclick = ()=>{
  tileBg = !tileBg;
  try{ localStorage.setItem("zbp_tilebg", tileBg?"1":"0"); }catch(e){}
  renderBoard();
  majBoutonTuiles();
};
/* Visibilité des tuiles. On agit directement sur les calques déjà affichés :
   un renderBoard() complet à chaque cran de curseur serait inutilement lourd. */
document.getElementById("zTileOp").oninput = e=>{
  tileBgOpacity = e.target.value/100;
  document.querySelectorAll(".tileLayer div").forEach(d=>d.style.opacity=tileBgOpacity);
  try{ localStorage.setItem("zbp_tileop", String(tileBgOpacity)); }catch(e){}
};
function majBoutonTuiles(){
  const b=document.getElementById("zTile");
  const sl=document.getElementById("zTileOp");
  // le bouton sert aussi aux jetons de Crypte, qui ont leur illustration
  const utile = questAvecTuiles() || (G && G.zones.some(z=>z.crypt));
  b.style.display = utile ? "" : "none";
  b.classList.toggle("on", tileBg);
  b.title = tileBg ? "Masquer les tuiles de terrain" : "Afficher les tuiles de terrain";
  // le curseur n'a de sens que sur une carte pavée de tuiles, et affichées
  sl.style.display = (questAvecTuiles() && tileBg) ? "" : "none";
  sl.value = Math.round(tileBgOpacity*100);
}
document.getElementById("boardWrap").addEventListener("wheel", e=>{
  if(!e.ctrlKey) return;                      // Ctrl + molette : zoom
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1);
}, {passive:false});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(e.key==="+" || e.key==="=") { zoomBy(1.15); e.preventDefault(); }
  else if(e.key==="-")           { zoomBy(1/1.15); e.preventDefault(); }
  else if(e.key==="0")           { zoomFit(); e.preventDefault(); }
});
document.getElementById("btnEnd").onclick = ()=>{ if(!G.over){ UI.mode=null; zombiePhase(); } };
document.getElementById("btnNew").onclick = ()=>showSetup();
document.getElementById("setupCancel").onclick =
  ()=>{ document.getElementById("setup").style.display="none"; };
document.getElementById("setupAll").onclick  = ()=>{ TEAM=SURVIVORS.map(v=>v.id); renderSetup(); };
document.getElementById("setupNone").onclick = ()=>{ TEAM=[]; renderSetup(); };
document.getElementById("missionLoad").onclick = async ()=>{
  const msg=document.getElementById("missionMsg");
  const i=+document.getElementById("missionSel").value;
  const entree=missionsDispo()[i];
  msg.style.color="#e0a060"; msg.textContent="Chargement…";
  try{
    const q=await chargerMission(entree);
    const source=q.__source; delete q.__source;   // repère d'origine, hors quête
    const err=validateQuest(q);
    if(err) throw new Error("quête invalide : "+err);
    QUEST=q;
    try{ localStorage.setItem("zbp_quest", JSON.stringify(q)); }catch(e){}
    afficherInfoMission(q, entree);
    renderEffectif();                 // la nouvelle mission peut exiger plus de monde
    msg.style.color="#6bbf3f";
    const nbT=Object.keys(q.tiles||{}).length;
    msg.textContent=`« ${q.name||entree.name} » chargée (${source}`+
      (nbT?`, ${nbT} tuile(s)`:", sans tuile")+`) — clique « Commencer ».`;
  }catch(e){
    msg.style.color="#e08080";
    msg.textContent="Impossible de charger : "+e.message;
  }
};
document.getElementById("setupStart").onclick = ()=>{
  if(!TEAM.length){ document.getElementById("setupMsg").textContent="Choisis au moins un Survivant."; return; }
  /* La fiche de quête recommande un effectif. En dessous, l'Invasion ne diminue
     pas et la partie devient très rude — on le dit, sans interdire : c'est au
     joueur de décider s'il tente le coup. L'avertissement suit dans le journal,
     pour qu'il reste lisible une fois la partie lancée. */
  const mn = minSurv(QUEST), sousEffectif = TEAM.length < mn ? {mn, n:TEAM.length} : null;
  // le stock d'armes de départ doit être respecté (menus déjà bridés, mais un
  // changement d'équipe peut rendre un choix caduc)
  const dispo = starterList();
  const trop = dispo.find(st=>TEAM.filter(id=>GEAR[id]===st.id).length > st.nb);
  if(trop){ document.getElementById("setupMsg").textContent =
    `Le deck ne contient que ${trop.nb} « ${trop.n} ».`; return; }
  /* Une arme choisie avant un changement de deck peut avoir disparu du stock. */
  const perdue = TEAM.find(id=>GEAR[id] && !dispo.some(st=>st.id===GEAR[id]));
  if(perdue){ document.getElementById("setupMsg").textContent =
    `« ${(EQ[GEAR[perdue]]||{}).n||GEAR[perdue]} » n'existe pas dans ce deck : `+
    `revois l'arme de départ de ${(SURVIVORS.find(v=>v.id===perdue)||{}).n||perdue}.`; return; }
  // on garde l'ordre de la boîte plutôt que l'ordre des clics
  const ordonne = SURVIVORS.map(v=>v.id).filter(id=>TEAM.includes(id));
  clearSave(); newGame(ordonne); zoomFit();
  if(sousEffectif) logLine(
    `⚠ Cette mission est prévue pour ${sousEffectif.mn} Survivants au minimum — `+
    `la partie commence à ${sousEffectif.n}. L'Invasion ne diminue pas pour autant.`, "l-bad");
};
document.getElementById("btnSave").onclick = downloadSave;
document.getElementById("btnLoad").onclick = ()=>document.getElementById("fileLoad").click();
document.getElementById("fileLoad").onchange = async e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value = "";                       // permet de recharger le même fichier
  if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    loadState(d);
    logLine(`↻ Sauvegarde « ${f.name} » chargée — Round ${G.round}.`,"l-sys");
  }catch(err){ toast("Chargement impossible : "+err.message); }
};
document.getElementById("btnEditor").onclick = ()=>{
  // on emmène la carte courante dans l'éditeur
  location.href = "zombicide-editor.html#q=" + encodeURIComponent(textToB64(JSON.stringify(QUEST)));
};
if(CUSTOM_QUEST){
  const b=document.getElementById("btnDefault");
  b.style.display="";
  b.onclick=()=>{
    try{ localStorage.removeItem("zbp_quest"); }catch(e){}
    clearSave();
    location.href = location.pathname;          // retire aussi le #q= de l'URL
  };
}
/* --------------------------------------------------------------------------
   JOURNAL : repliable et redimensionnable
   Le repli est un geste franc — on en profite pour réajuster le cadrage. Le
   glisser, lui, ne touche pas au zoom : on règle une hauteur, on ne demande pas
   un recadrage à chaque pixel.
   -------------------------------------------------------------------------- */
const LOG_H_DEF = 172, LOG_H_MIN = 56;
const logPane = document.getElementById("bas");
const logGrip = document.getElementById("logGrip");
const logToggle = document.getElementById("logToggle");

let hauteurBande = LOG_H_DEF;      // hauteur voulue quand la bande est dépliée
function appliquerLog(clos){
  document.body.classList.toggle("logclos", clos);
  logToggle.textContent = clos ? "▸" : "▾";
  /* Repliée, la bande doit se réduire à sa poignée : on retire la hauteur en
     ligne, qui l'emporterait sur la règle de repli. Elle est reposée au
     dépliage. */
  logPane.style.height = clos ? "" : hauteurBande + "px";
  try{ localStorage.setItem("zbp_logclos", clos ? "1" : "0"); }catch(e){}
}
/* Le plateau doit garder de quoi exister : on borne au passage, sinon une
   fenêtre rétrécie après coup laisserait un journal plus haut qu'elle. */
function hauteurLogMax(){
  return Math.max(LOG_H_MIN, document.getElementById("main").clientHeight - 150);
}
function appliquerHauteurLog(h, memoriser){
  const v = Math.min(hauteurLogMax(), Math.max(LOG_H_MIN, Math.round(h)));
  hauteurBande = v;
  if(!document.body.classList.contains("logclos")) logPane.style.height = v + "px";
  if(memoriser!==false){ try{ localStorage.setItem("zbp_logh", v); }catch(e){} }
  return v;
}
logToggle.onclick = ()=>{
  appliquerLog(!document.body.classList.contains("logclos"));
  zoomFit();                       // le plateau récupère ou rend de la hauteur
};

let glisse = null;
logGrip.addEventListener("pointerdown", e=>{
  if(document.body.classList.contains("logclos")) return;
  glisse = {y:e.clientY, h:logPane.getBoundingClientRect().height};
  logGrip.setPointerCapture(e.pointerId);
  document.body.classList.add("logdrag");
  e.preventDefault();
});
logGrip.addEventListener("pointermove", e=>{
  if(!glisse) return;
  appliquerHauteurLog(glisse.h + (glisse.y - e.clientY));   // vers le haut = plus grand
});
const finGlisse = e=>{
  if(!glisse) return;
  glisse = null;
  document.body.classList.remove("logdrag");
  try{ logGrip.releasePointerCapture(e.pointerId); }catch(err){}
};
logGrip.addEventListener("pointerup", finGlisse);
logGrip.addEventListener("pointercancel", finGlisse);
logGrip.addEventListener("dblclick", ()=>appliquerHauteurLog(LOG_H_DEF));
/* Une fenêtre rétrécie peut rendre la hauteur mémorisée intenable. */
addEventListener("resize", ()=>{
  if(!document.body.classList.contains("logclos"))
    appliquerHauteurLog(logPane.getBoundingClientRect().height, false);
});

try{
  appliquerLog(localStorage.getItem("zbp_logclos")==="1");
  const h = parseFloat(localStorage.getItem("zbp_logh"));
  if(h > 0) appliquerHauteurLog(h, false);
}catch(e){ appliquerLog(false); }

function appliquerTraces(v){
  voirTraces = !!v;
  const b=document.getElementById("zTrace");
  if(b) b.classList.toggle("on", voirTraces);
  try{ localStorage.setItem("zbp_traces", voirTraces?"1":"0"); }catch(e){}
  if(G) render();
}
document.getElementById("zTrace").onclick = ()=>appliquerTraces(!voirTraces);
try{ appliquerTraces(localStorage.getItem("zbp_traces") !== "0"); }
catch(e){ appliquerTraces(true); }

document.getElementById("btnAnim").onclick = ()=>appliquerAnim(!animZombies);
try{ appliquerAnim(localStorage.getItem("zbp_animz") !== "0"); }
catch(e){ appliquerAnim(true); }

document.getElementById("btnRules").onclick = ()=>{
  const m=document.getElementById("modal");
  document.getElementById("mTitle").textContent="Règles & notes";
  const b=document.getElementById("mBody"); b.innerHTML=RULES_TXT+
    '<button class="opt" id="mClose">Fermer</button>';
  document.getElementById("mClose").onclick=()=>m.style.display="none";
  m.style.display="grid";
};
document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal") e.currentTarget.style.display="none";
});
soucisSurvivants = chargerSurvivants();
chargerFichiersMissions(()=>preloadSprites(()=>{
  let memo = null;
  try{ memo = parseFloat(localStorage.getItem("zbp_zoom")); }catch(e){}
  try{ const t=localStorage.getItem("zbp_tilebg"); if(t!==null) tileBg = t==="1"; }catch(e){}
  try{ const o=parseFloat(localStorage.getItem("zbp_tileop"));
       if(o>=.15 && o<=1) tileBgOpacity=o; }catch(e){}
  applyZoom(memo > 0 ? memo : ZOOM_DEF, false);
  if(tryRestore()){ if(!(memo > 0)) zoomFit(); }
  else showSetup();                   // pas de partie en cours : on choisit l'équipe
}));
</script>
