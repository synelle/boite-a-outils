<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombicide : Black Plague</title>
<style>
:root{
  --zs: 92px;              /* taille d'une zone */
  --bg:#141210; --bg2:#1c1917; --panel:#221f1c; --line:#3a332c;
  --ink:#e8e0d2; --dim:#a2968a; --gold:#c9a227; --blood:#8e2b2b;
  --street:#2a2724; --room:#33291f; --fog:#181614;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.45 "Segoe UI",system-ui,sans-serif;
  display:flex; overflow:hidden;
}
button{font:inherit;color:var(--ink);background:#2e2925;border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;cursor:pointer}
button:hover:not(:disabled){background:#3c352e;border-color:var(--gold)}
button:disabled{opacity:.35;cursor:default}
button.prim{background:#4a3a1c;border-color:var(--gold)}
button.danger{background:#4a1f1f;border-color:#8e2b2b}
h1,h2,h3{margin:0;font-weight:600}
.hr{height:1px;background:var(--line);margin:8px 0}

/* ---------- plateau ---------- */
#boardPane{flex:1;min-width:0;position:relative;display:flex}
#boardWrap{flex:1;overflow:auto;padding:18px;display:flex}
/* `margin:auto` centre sur les deux axes ET, contrairement à justify-content,
   ne rogne pas le bord gauche/haut quand le plateau dépasse la fenêtre. */
#boardWrap .stage{margin:auto}
#zoomBar{position:absolute;left:10px;top:10px;z-index:20;display:flex;gap:4px;
  align-items:center;background:#1a1714dd;border:1px solid var(--line);
  border-radius:6px;padding:3px 6px;backdrop-filter:blur(2px)}
#zoomBar button{padding:2px 8px;font-size:13px;line-height:1.1}
#zLbl{font-size:11px;color:var(--dim);min-width:42px;text-align:center;
  font-variant-numeric:tabular-nums}
#board{display:grid;gap:0;position:relative;background:#0d0b0a;
  border:3px solid #4a4038;border-radius:4px}
.zone{position:relative;width:var(--zs);height:var(--zs);background:var(--street);
  overflow:visible}
.zone.room{background:var(--room)}
.zone.vault{background:#3b2a3a}
.zone.unexplored{background:var(--fog)}
.zone::after{content:"";position:absolute;inset:0;pointer-events:none}
.zone.legal{outline:2px solid #4f9d5a;outline-offset:-2px;cursor:pointer;
  background-image:radial-gradient(circle,rgba(79,157,90,.22),transparent 70%)}
.zone.legalAtk{outline:2px solid #c05050;outline-offset:-2px;cursor:pointer;
  background-image:radial-gradient(circle,rgba(192,80,80,.22),transparent 70%)}
.zone.selz{outline:2px solid var(--gold);outline-offset:-2px}
.zone .lbl{position:absolute;left:3px;top:2px;color:#6d6157;pointer-events:none;
  font-size:clamp(6px,calc(var(--zs)*.1),10px)}
/* classe portée par <body> : survit à tous les redessins du plateau */
body.zsmall .zone .lbl{display:none}

/* murs & portes : un calque SVG unique, un trait centré sur chaque arête */
.walls{position:absolute;left:0;top:0;pointer-events:none;z-index:6}
.walls .wall{stroke:#8a7458;stroke-width:7;stroke-linecap:square}
/* Porte fermée : barre pleine de sa couleur. Porte ouverte : barre coupée en
   deux (tirets larges) — l'icône change donc à l'ouverture. */
.walls .door{stroke-width:13;stroke-linecap:butt}
.walls .door.locked{stroke-dasharray:3 3}
.walls .door.crypt{stroke:#a06bd8;stroke-dasharray:6 4}
.walls .door.crypt.jaune,.walls .door.crypt.yellow{stroke:#c9a227}
.walls .door.crypt.open{stroke-dasharray:none;stroke:#5fb98a}

.cryptHatch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(var(--zs)*.35);height:calc(var(--zs)*.35);border-radius:6px;border:2px dashed var(--cc);
  background:#00000055;color:var(--cc);display:grid;place-items:center;
  font-size:15px;font-weight:700;z-index:1;pointer-events:none}
.cryptHatch.open{border-style:solid;background:var(--cc);color:#1a1714}

/* Zones de Crypte : hors plateau, sous le plateau */
#crypts{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.cryptZone{min-width:190px;min-height:96px;border:2px dashed var(--cc);border-radius:8px;
  background:#241d28;padding:6px 8px;position:relative;cursor:pointer}
.cryptZone.legal{outline:2px solid #4f9d5a;outline-offset:2px;background:#1f2c22}
.cryptZone .ch{font-size:11px;font-weight:700;color:var(--cc);letter-spacing:.5px}
.cryptZone .ci{font-size:10px;color:var(--dim);margin-bottom:4px}
.cryptZone .actors{position:static;display:flex;flex-wrap:wrap;gap:3px;inset:auto}

.toks{position:absolute;right:2px;top:2px;display:flex;flex-direction:column;gap:2px;z-index:3}
.tok{width:calc(var(--zs)*.22);height:calc(var(--zs)*.22);border-radius:50%;
  display:grid;place-items:center;border:1px solid #0008;font-weight:700;
  font-size:clamp(7px,calc(var(--zs)*.11),12px)}
.tok.exit{background:#2f6b4a;color:#fff}
.tok.bile{background:#6bbf3f;color:#123}
/* Objectif : pastille de la couleur de la quête ; un Objectif caché montre
   toujours sa face rouge, marquée d'un « ? ». */
.tok.obj{background:var(--oc);color:#fff;border-color:#0009}
.tok.obj.hidden{border:2px dashed #fff8}
/* Bruit : triangle, pas un rond */
.tok.noise{width:0;height:0;border:none;border-radius:0;background:none;
  border-left:calc(var(--zs)*.12) solid transparent;
  border-right:calc(var(--zs)*.12) solid transparent;
  border-bottom:calc(var(--zs)*.21) solid #d8d2c4;position:relative;color:transparent}
.tok.noise span{position:absolute;left:calc(var(--zs)*-.055);top:calc(var(--zs)*.08);
  width:calc(var(--zs)*.11);text-align:center;font-weight:700;color:#241c06;
  font-size:clamp(6px,calc(var(--zs)*.1),11px)}

/* Zone d'Invasion : rectangle plaqué sur un bord de la case */
.spw{position:absolute;background:var(--sc);border:1px solid #0009;z-index:3;
  display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;
  text-shadow:0 1px 1px #0008}
.spw.n{left:18%;top:2px;width:64%;height:calc(var(--zs)*.14)}
.spw.s{left:18%;bottom:2px;width:64%;height:calc(var(--zs)*.14)}
.spw.w{top:18%;left:2px;height:64%;width:calc(var(--zs)*.14)}
.spw.e{top:18%;right:2px;height:64%;width:calc(var(--zs)*.14)}
.spw.off{opacity:.32;border-style:dashed}
.spw.necro{outline:1px solid #fff6;outline-offset:1px}

.actors{position:absolute;inset:6px 24px 6px 6px;display:flex;flex-wrap:wrap;
  align-content:flex-end;gap:2px;z-index:2}
.pastille{width:calc(var(--zs)*.28);height:calc(var(--zs)*.28);border-radius:50%;
  border:2px solid #0009;display:grid;place-items:center;font-weight:700;
  font-size:clamp(7px,calc(var(--zs)*.12),13px);
  background-size:cover;background-position:center;position:relative;flex:0 0 auto}
.pastille.sv{border-color:#f0e2b8;width:calc(var(--zs)*.33);height:calc(var(--zs)*.33)}
.pastille.sv.act{box-shadow:0 0 0 2px var(--gold),0 0 10px #c9a22788}
.pastille.dead{filter:grayscale(1) brightness(.5)}
.pastille .wnd{position:absolute;bottom:-3px;right:-3px;background:var(--blood);
  color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:grid;place-items:center}

/* ---------- panneau ---------- */
#side{width:430px;min-width:430px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh}
#side header{padding:10px 12px;border-bottom:1px solid var(--line);background:#1a1714}
#side header h1{font-size:15px;letter-spacing:.5px;color:var(--gold)}
#side header .sub{font-size:11px;color:var(--dim)}
#scroll{flex:1;overflow-y:auto;padding:10px 12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.card{background:#2a2521;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{flex:1;min-width:66px;padding:4px 2px 6px;font-size:12px;position:relative}
.tabs button.on{background:#4a3a1c;border-color:var(--gold)}
.tabs .hp{position:absolute;right:3px;top:1px;font-size:9px;color:#e07070}
/* Code couleur du nom selon les Actions restantes. Une barre sous le nom
   reprend la même couleur, pour rester lisible en cas de daltonisme. */
.tabs .na{position:absolute;left:3px;top:1px;font-size:9px;font-weight:700;color:inherit}
.tabs button::after{content:"";position:absolute;left:4px;right:4px;bottom:2px;
  height:2px;border-radius:1px;background:currentColor;opacity:.55}
.act-full{color:#7fd48a}                 /* toutes ses Actions */
.act-some{color:var(--gold)}             /* tour entamé, il en reste */
.act-none{color:#7b7168}                 /* plus d'Action */
.act-none::after{opacity:.18}
.act-out {color:#5d534b;font-style:italic}   /* mort ou évacué */
.act-out::after{display:none}
h3 .act-full,h3 .act-some,h3 .act-none,h3 .act-out{font-weight:600}

.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;border:1px solid var(--line);margin:5px 0}
.bar div{flex:1;font-size:9px;display:grid;place-items:center;color:#0007;font-weight:700}
.bar .b{background:#2f5b8a}.bar .y{background:#b5a12d}.bar .o{background:#c07a34}.bar .r{background:#8e2b2b}
.bar div.dim{opacity:.22}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}
.slot{border:1px solid var(--line);border-radius:5px;padding:5px 6px;background:#221e1a;min-height:44px}
.slot.hand{border-color:#6b5c4a}
.slot.body{grid-column:1/-1;border-color:#4a5c6b}
.slot .nm{font-weight:600;font-size:12px}
.slot .st{font-size:10px;color:var(--dim);line-height:1.3}
.slot .acts{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.slot .acts button{padding:2px 6px;font-size:11px}
.slot .acts button.atk{border-color:var(--ac);color:var(--ac);font-weight:600}
.slot .acts button.atk:hover{background:var(--ac);color:#1a1714}
.slot .acts button.atk.melee {--ac:#c2703a}
.slot .acts button.atk.ranged{--ac:#4fb0a0}
.slot .acts button.atk.spell {--ac:#8a6bd8}
.slot.empty{opacity:.45;display:grid;place-items:center;font-size:11px;color:var(--dim)}
.slot.wound{border-color:var(--blood);background:#3a1f1f}
.slot.pick{cursor:pointer;outline:1px dashed var(--gold)}

#log{height:190px;overflow-y:auto;border-top:1px solid var(--line);background:#191614;
  padding:6px 10px;font-size:12px;line-height:1.4}
#log div{margin-bottom:2px}
.l-dice{color:#e8d48a}.l-kill{color:#8fd08f}.l-bad{color:#e08080}
.l-sys{color:#8fa8c8}.l-round{color:var(--gold);font-weight:700;margin-top:6px}
.l-obj{color:#d9a3e0}

#foot{padding:8px 12px;border-top:1px solid var(--line);background:#1a1714;display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;background:#332c25;border:1px solid var(--line);border-radius:10px;
  padding:1px 8px;font-size:11px;margin:1px}
.pill.free{background:#2d4030;border-color:#4f9d5a}
.skl{font-size:11px;color:#cbbf9e;margin:1px 0}
.skl.off{color:#6d6157}
#banner{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:60}
#banner .bx{background:var(--panel);border:2px solid var(--gold);border-radius:10px;
  padding:26px 34px;text-align:center;max-width:460px}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:70}
#modal .bx{background:var(--panel);border:1px solid var(--gold);border-radius:8px;
  padding:16px;min-width:340px;max-width:520px;max-height:80vh;overflow:auto}
#modal .opt{display:block;width:100%;text-align:left;margin-top:6px}
.hint{font-size:11px;color:var(--dim);margin-top:4px}
.zoneinfo{font-size:11px;color:var(--dim)}
</style>
</head>
<body>

<div id="boardPane">
  <div id="zoomBar">
    <button id="zOut" title="Dézoomer (Ctrl + molette, ou -)">−</button>
    <span id="zLbl">100 %</span>
    <button id="zIn" title="Zoomer (Ctrl + molette, ou +)">+</button>
    <button id="zFit" title="Ajuster la carte à la fenêtre (touche 0)">Ajuster</button>
  </div>
  <div id="boardWrap"><div class="stage"><div id="board"></div><div id="crypts"></div></div></div>
</div>

<div id="side">
  <header>
    <h1>ZOMBICIDE — BLACK PLAGUE</h1>
    <div class="sub" id="questLine"></div>
  </header>
  <div id="scroll"></div>
  <div id="log"></div>
  <div id="foot">
    <button id="btnEnd" class="prim">Fin de tour → Phase Zombie</button>
    <button id="btnRules">Règles</button>
    <button id="btnSave">Sauvegarder (JSON)</button>
    <button id="btnLoad">Charger…</button>
    <button id="btnNew">Nouvelle partie</button>
    <button id="btnEditor">Éditeur de carte</button>
    <button id="btnDefault" style="display:none">Revenir à la carte d'origine</button>
    <input type="file" id="fileLoad" accept="application/json,.json" style="display:none">
  </div>
</div>

<div id="banner"><div class="bx"><h2 id="bTitle"></h2><p id="bText"></p>
  <button class="prim" onclick="location.reload()">Rejouer</button></div></div>
<div id="modal"><div class="bx"><h3 id="mTitle"></h3><div id="mBody"></div></div></div>

<script>
"use strict";
/* ==========================================================================
   ZOMBICIDE : BLACK PLAGUE — moteur de règles
   Données de cartes / compétences / spawn extraites de zombicide.fandom.com
   (Black Plague, 2016). Voir le bouton « Règles » pour la liste des points
   d'interprétation et des simplifications assumées.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. SPRITES  —  pastilles PNG
   Dépose tes fichiers dans ./sprites/ . Si un PNG est absent, une pastille
   de couleur générée est utilisée à la place (le jeu reste fonctionnel).
   -------------------------------------------------------------------------- */
const SPRITE_DIR = "sprites/";
const SPRITES = {
  ann:"surv_ann.png", baldric:"surv_baldric.png", clovis:"surv_clovis.png",
  nelly:"surv_nelly.png", samson:"surv_samson.png", silas:"surv_silas.png",
  walker:"z_walker.png", runner:"z_runner.png", brute:"z_brute.png",
  abomination:"z_abomination.png", necromancer:"z_necromancer.png"
};
const SPRITE_OK = {};                         // rempli par le préchargement
function preloadSprites(cb){
  const keys = Object.keys(SPRITES); let left = keys.length;
  if(!left) return cb();
  keys.forEach(k=>{
    const im = new Image();
    im.onload  = ()=>{ SPRITE_OK[k]=true;  if(!--left) cb(); };
    im.onerror = ()=>{ SPRITE_OK[k]=false; if(!--left) cb(); };
    im.src = SPRITE_DIR + SPRITES[k];
  });
}

/* --------------------------------------------------------------------------
   2. PARAMÈTRES DE RÈGLES  (modifiables d'une ligne)
   -------------------------------------------------------------------------- */
const RULES = {
  actionsPerTurn: 3,            // +1 au niveau Jaune
  survivorWounds: 3,            // « éliminé dès que sa barre de blessure atteint 3 » (p.23)
  handSlots: 2, backSlots: 5,   // 8 cartes : 2 mains + 5 sac à dos + 1 corps (p.15)
  xpObjective: 5,
  xpVault: 5,
  // Sortir d'une zone occupée coûte 1 Action supplémentaire PAR zombie (p.18).
  extraActionPerZombie: true,
  // Défaite immédiate si un Nécromancien s'échappe alors qu'il y a 6 jetons
  // d'Invasion sur le plateau, le sien compris (p.28).
  necroEscapeLossTokens: 6
};
/* Ordre de priorité des cibles (p.27). Les touches vont d'abord à la priorité
   la plus forte ; si les Dégâts sont insuffisants, la touche est PERDUE — elle
   ne « saute » pas sur une cible de priorité inférieure. */
const TARGET_PRIORITY = { walker:1, brute:2, abomination:2, runner:3, necromancer:4 };
/* Couleurs de quête. Portes : bleue / verte / grise. Zones d'Invasion : bleue,
   verte, violette, rouge. Objectifs : rouge, vert, bleu. */
const COLORS = {
  red:    {f:"rouge",    m:"rouge",   css:"#b5462d"},
  blue:   {f:"bleue",    m:"bleu",    css:"#3d6fb5"},
  green:  {f:"verte",    m:"vert",    css:"#4f9d5a"},
  purple: {f:"violette", m:"violet",  css:"#a06bd8"},
  grey:   {f:"grise",    m:"gris",    css:"#8a8a8a"}
};
const colF   = c => (COLORS[c]||{}).f || c || "neutre";   // porte, Zone (féminin)
const colM   = c => (COLORS[c]||{}).m || c || "neutre";   // Objectif, pion (masculin)
const colCss = c => (COLORS[c]||{}).css || "#8a8a8a";

const DANGER = [
  {key:"blue",   name:"Bleu",   min:0,  max:6},
  {key:"yellow", name:"Jaune",  min:7,  max:18},
  {key:"orange", name:"Orange", min:19, max:42},
  {key:"red",    name:"Rouge",  min:43, max:Infinity}
];

/* --------------------------------------------------------------------------
   3. ZOMBIES  (profils officiels Black Plague)
   -------------------------------------------------------------------------- */
const ZT = {
  walker:      {n:"Marcheur",     actions:1, dmg:1, lethal:1, xp:1, c:"#6f8f4e", ini:"M", pool:35},
  runner:      {n:"Coureur",      actions:2, dmg:1, lethal:1, xp:1, c:"#c07a34", ini:"C", pool:14},
  brute:       {n:"Costaud",      actions:1, dmg:1, lethal:2, xp:1, c:"#8b5a3c", ini:"G", pool:14},
  abomination: {n:"Abomination",  actions:1, dmg:1, lethal:3, xp:5, c:"#8e2b2b", ini:"A", pool:1,
                noArmor:true},
  necromancer: {n:"Nécromancien", actions:1, dmg:1, lethal:1, xp:1, c:"#7a4bb5", ini:"N", pool:1,
                flees:true}
};

/* --------------------------------------------------------------------------
   4. ÉQUIPEMENT  (71 cartes : 6 départ + 63 fouille + 2 coffre)
   dice/acc/dmg/rmin/rmax d'après le wiki officiel.
   kind: melee | ranged | spell | ench | armor | shield | item | aaahh
   -------------------------------------------------------------------------- */
const EQUIP = [
/* --- cartes de départ (hors deck de Fouille) --------------------------- */
 {id:"shortbow",  n:"Arc court",         kind:"ranged", dice:1, acc:3, dmg:1, rmin:0, rmax:1, keyw:"FLÈCHES", start:1, deck:1},
 {id:"shortsword",n:"Épée courte",       kind:"melee",  dice:1, acc:4, dmg:1, rmin:0, rmax:0, door:1, dual:1, start:3, deck:1},
 {id:"manablast", n:"Décharge de mana",  kind:"spell",  dice:1, acc:4, dmg:1, rmin:0, rmax:1, noise:1, dual:1, start:1, deck:1},
 {id:"hammer",    n:"Marteau",           kind:"melee",  dice:1, acc:4, dmg:2, rmin:0, rmax:0, door:1, dual:1, start:1, deck:1},
/* --- deck de Fouille --------------------------------------------------- */
 {id:"aaahh",     n:"Aaahh !!",          kind:"aaahh",  deck:4,
    txt:"Placez un Marcheur dans la Zone que vous venez de Fouiller."},
 {id:"apples",    n:"Pommes",            kind:"item",   deck:2, xpItem:1, txt:"Défaussez : gagnez 1 XP."},
 {id:"meat",      n:"Viande salée",      kind:"item",   deck:2, xpItem:1, txt:"Défaussez : gagnez 1 XP."},
 {id:"water",     n:"Eau",               kind:"item",   deck:2, xpItem:1, txt:"Défaussez : gagnez 1 XP."},
 {id:"axe",       n:"Hache",             kind:"melee",  dice:1, acc:4, dmg:1, rmin:0, rmax:0, door:1, dual:1, doorNoRoll:1, deck:2,
    txt:"Ouvre les portes sans lancer de dé."},
 {id:"dagger",    n:"Dague",             kind:"melee",  dice:1, acc:4, dmg:1, rmin:0, rmax:0, door:1, dual:1, offhandDie:1, deck:4,
    txt:"+1 dé à l'autre arme de Mêlée équipée."},
 {id:"sword",     n:"Épée",              kind:"melee",  dice:2, acc:4, dmg:1, rmin:0, rmax:0, door:1, dual:1, deck:2},
 {id:"greatsword",n:"Épée à deux mains", kind:"melee",  dice:5, acc:5, dmg:1, rmin:0, rmax:0, door:1, deck:2},
 {id:"crossbow",  n:"Arbalète",          kind:"ranged", dice:2, acc:4, dmg:2, rmin:1, rmax:3, keyw:"CARREAUX", deck:2},
 {id:"handxbow",  n:"Arbalète de poing", kind:"ranged", dice:2, acc:3, dmg:1, rmin:0, rmax:3, dual:1, keyw:"CARREAUX", reload:1, deck:2,
    txt:"1 Action pour recharger. Gratuit en Phase de Fin."},
 {id:"repxbow",   n:"Arbalète à répétition",kind:"ranged",dice:3,acc:5,dmg:1,rmin:0,rmax:1, dual:1, keyw:"CARREAUX", deck:2},
 {id:"longbow",   n:"Arc long",          kind:"ranged", dice:1, acc:3, dmg:1, rmin:1, rmax:3, keyw:"FLÈCHES", deck:2},

/* Carte personnalisée produite par editor.html (stockée dans localStorage). */
function validateQuest(q){
  if(!q || typeof q!=="object") return "objet invalide";
  if(!(q.W>0 && q.H>0)) return "dimensions manquantes";
  if(!Array.isArray(q.map) || q.map.length!==q.H) return "carte de hauteur incorrecte";
  if(q.map.some(r=>typeof r!=="string" || r.length!==q.W)) return "carte de largeur incorrecte";
  const ok = p => p && p.x>=0 && p.y>=0 && p.x<q.W && p.y<q.H;
  if(!ok(q.start)) return "Zone de départ absente ou hors plateau";
  const sortieRequise = !q.win || q.win.exit !== "none";
  if(sortieRequise && !ok(q.exit)) return "Zone de sortie absente ou hors plateau";
  if(q.exit && !ok(q.exit))        return "Zone de sortie hors plateau";
  if(!Array.isArray(q.spawns) || !q.spawns.length) return "aucune Zone d'Apparition";
  if(q.spawns.some(p=>!ok(p))) return "Zone d'Apparition hors plateau";
  if(!Array.isArray(q.objectives) || !q.objectives.length) return "aucun Objectif";
  if(q.objectives.some(p=>!ok(p))) return "Objectif hors plateau";
  if(q.win){
    if(q.win.exit && !["all","any","none"].includes(q.win.exit))
      return "condition de sortie inconnue : "+q.win.exit;
    if(q.win.need && !/^(objectives:all|objective:\w+|never)$/.test(q.win.need))
      return "condition de victoire inconnue : "+q.win.need;
  }
  const dxy = {n:[0,-1], s:[0,1], e:[1,0], w:[-1,0]};   // DXY n'existe pas encore ici
  for(const d of (q.doors||[])){
    if(!ok(d) || !dxy[d.s]) return "porte invalide";
    if(d.crypt) continue;                    // ancien format : trappe de crypte
    const nx=d.x+dxy[d.s][0], ny=d.y+dxy[d.s][1];
    if(nx<0||ny<0||nx>=q.W||ny>=q.H) return "porte sur un bord de plateau";
  }
  for(const d of (q.cryptDoors||[])){
    if(!ok(d)) return "trappe de crypte hors plateau";
    if(!d.color) return "trappe de crypte sans couleur";
  }
  return null;
}
const b64ToText = s => new TextDecoder().decode(Uint8Array.from(atob(s), c=>c.charCodeAt(0)));
const textToB64 = t => btoa(String.fromCharCode(...new TextEncoder().encode(t)));
/* Deux transports depuis l'éditeur : l'URL (#q=…) d'abord — seule voie fiable
   quand les deux fichiers sont ouverts en file:// — puis localStorage. */
function loadCustomQuest(){
  const sources = [];
  const m = location.hash.match(/[#&]q=([^&]+)/);
  if(m){ try{ sources.push(["URL", b64ToText(decodeURIComponent(m[1]))]); }catch(e){} }
  try{ const raw = localStorage.getItem("zbp_quest"); if(raw) sources.push(["mémoire", raw]); }catch(e){}
  for(const [origin, raw] of sources){
    let q; try{ q = JSON.parse(raw); }catch(e){ console.warn(`Carte (${origin}) illisible`, e); continue; }
    const err = validateQuest(q);
    if(err){ console.warn(`Carte (${origin}) ignorée : ${err}`); continue; }
    try{ localStorage.setItem("zbp_quest", raw); }catch(e){}
    return q;
  }
  return null;
}

/* ==========================================================================
   CONDITIONS DE QUÊTE
   `quest.locks` décrit ce qui est verrouillé et jusqu'à quand :
     locks.spawns = {red:"objective:red"}   → les Zones d'Invasion rouges sont
        inactives tant qu'aucun Objectif rouge n'a été récupéré (p.26) ;
     locks.doors  = {blue:"objective:blue"} → les portes bleues ne s'ouvrent pas
        avant qu'un Objectif bleu ait été récupéré (p.19) ;
     locks.spawnsOff = {green:"objectives:all"} → désactivation conditionnelle.
   Conditions reconnues : "objective:<couleur>", "objectives:all", "never".
   Une couleur absente de la table n'est soumise à aucune condition.
   ========================================================================== */
function condMet(cond){
  if(!cond) return true;
  if(cond==="never") return false;
  if(cond==="objectives:all") return G.objectivesLeft===0;
  const m = /^objective:(\w+)$/.exec(cond);
  if(m) return !!G.taken[m[1]];
  console.warn("Condition de quête inconnue :", cond);
  return true;
}
function condText(cond){
  if(cond==="never") return "jamais";
  if(cond==="objectives:all") return "tous les Objectifs récupérés";
  const m = /^objective:(\w+)$/.exec(cond||"");
  return m ? `Objectif ${colM(m[1])} récupéré` : "—";
}
const locks = () => (G.q.locks||{});

/* Condition de victoire de la quête.
     win.need : condition à remplir avant de pouvoir sortir — même vocabulaire
                que les verrous ("objectives:all", "objective:green", …).
                Absente = aucune condition préalable.
     win.exit : "all"  → tous les Survivants vivants doivent sortir (défaut)
                "any"  → un seul suffit
                "none" → aucune sortie requise, la condition suffit.
   Par défaut : tous les Objectifs, puis tout le monde sort. */
const winCond = () => Object.assign({need:"objectives:all", exit:"all"}, G.q.win||{});
const EXIT_TXT = {all:"tous les Survivants vivants doivent sortir",
                  any:"au moins un Survivant doit sortir",
                  none:"aucune sortie requise"};
function missionText(){
  const w = winCond();
  if(w.exit==="none") return w.need ? condText(w.need) : "aucune condition";
  const bouts = [];
  if(w.need) bouts.push(condText(w.need));
  bouts.push(EXIT_TXT[w.exit] || EXIT_TXT.all);
  return bouts.join(", puis ");
}
/* Une Zone d'Invasion est active si sa couleur n'est pas verrouillée (ou l'est
   devenue) et n'a pas été désactivée. */
function spawnActive(tok){
  if(tok.necro) return true;                       // pion Nécromancien : toujours actif
  const L = locks();
  if(!condMet((L.spawns||{})[tok.color])) return false;
  const off = (L.spawnsOff||{})[tok.color];
  if(off && condMet(off)) return false;
  return true;
}
function doorLocked(color){
  const c = (locks().doors||{})[color];
  return c ? !condMet(c) : false;
}
